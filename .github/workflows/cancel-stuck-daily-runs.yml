name: Cancel Stuck Daily Runs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/daily-copilot-tool-growth.yml
      - .github/workflows/cancel-stuck-daily-runs.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-stuck-daily-runs
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale in-progress daily runs
        uses: actions/github-script@v7
        env:
          TARGET_WORKFLOW_NAME: Daily Copilot Tool Growth
          STALE_MINUTES: "20"
        with:
          script: |
            const workflowName = process.env.TARGET_WORKFLOW_NAME;
            const staleMinutes = Number(process.env.STALE_MINUTES || "20");
            const nowMs = Date.now();
            const staleCutoffMs = staleMinutes * 60 * 1000;
            const { owner, repo } = context.repo;

            const res = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              status: "in_progress",
              per_page: 100,
            });

            const staleRuns = res.data.workflow_runs.filter((run) => {
              if (run.name !== workflowName) return false;
              if (run.id === context.runId) return false;
              const ageMs = nowMs - new Date(run.created_at).getTime();
              return ageMs > staleCutoffMs;
            });

            if (staleRuns.length === 0) {
              core.info("No stale in-progress daily runs detected.");
              return;
            }

            core.info(`Found ${staleRuns.length} stale run(s) older than ${staleMinutes} minutes.`);

            for (const run of staleRuns) {
              const ageMinutes = Math.floor((nowMs - new Date(run.created_at).getTime()) / 60000);
              core.info(`Processing run ${run.id} (${run.html_url}), age=${ageMinutes}m`);

              let cancelled = false;
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                cancelled = true;
                core.info(`Requested cancel for run ${run.id}`);
              } catch (err) {
                core.warning(`Cancel failed for run ${run.id}: ${err.message}`);
              }

              if (!cancelled) {
                try {
                  await github.request("POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel", {
                    owner,
                    repo,
                    run_id: run.id,
                  });
                  core.info(`Requested force-cancel for run ${run.id}`);
                } catch (forceErr) {
                  core.warning(`Force-cancel failed for run ${run.id}: ${forceErr.message}`);
                }
              }
            }

<!-- SEO-optimized tool page template for Ultimate Tools Hub -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{TOOL_TITLE}}</title>
  <meta name="description" content="{{TOOL_DESCRIPTION}}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="{{TOOL_URL}}">
  <meta property="og:title" content="{{TOOL_TITLE}}">
  <meta property="og:description" content="{{TOOL_DESCRIPTION}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{TOOL_URL}}">
  <meta property="og:image" content="https://vincentrasskazov.github.io/tools/assets/og-default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TOOL_TITLE}}">
  <meta name="twitter:description" content="{{TOOL_DESCRIPTION}}">
  <meta name="twitter:image" content="https://vincentrasskazov.github.io/tools/assets/og-default.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/landing-polish.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "{{TOOL_NAME}}",
    "url": "{{TOOL_URL}}",
    "applicationCategory": "{{TOOL_CATEGORY}}",
    "description": "{{TOOL_DESCRIPTION}}"
  }
  </script>
  <style>
    .tool-container { max-width: 520px; margin: 40px auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px #1976d233; padding: 32px 28px; }
    .tool-title { font-size: 2rem; font-weight: 700; color: #1976d2; margin-bottom: 18px; }
    .tool-desc { color: #555; margin-bottom: 22px; }
    .result-label { font-weight: 600; color: #283593; margin-bottom: 6px; }
    .result-box { background: #f6f8fa; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 1.1rem; word-break: break-all; margin-bottom: 8px; }
    button { background: #1976d2; color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
    button:hover { background: #0d47a1; }
    .related-tools { margin-top: 36px; }
    .related-tools h2 { font-size: 1.1rem; color: #1976d2; margin-bottom: 10px; }
    .related-tools ul { list-style: none; padding: 0; }
    .related-tools li { margin-bottom: 6px; }
    .related-tools a { color: #283593; text-decoration: none; }
    .related-tools a:hover { text-decoration: underline; }
    .faq-section { margin-top: 36px; }
    .faq-section h2 { font-size: 1.1rem; color: #1976d2; margin-bottom: 10px; }
    .faq-section h3 { font-size: 1rem; color: #283593; margin-bottom: 4px; }
    .faq-section p { color: #444; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="tool-container">
    <h1 class="tool-title">{{TOOL_NAME}}</h1>
    <div class="tool-desc">{{TOOL_DESCRIPTION}}</div>
    <!-- TOOL LOGIC GOES HERE -->
    {{TOOL_HTML}}
    <div class="related-tools">
      <h2>Related Tools</h2>
      <ul>
        {{RELATED_TOOLS}}
      </ul>
    </div>
    <div class="faq-section">
      <h2>Frequently Asked Questions</h2>
      {{FAQ_HTML}}
    </div>
  </div>
</body>
</html>

layout: null
title: "Page Not Found"
permalink: /404.html
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 - Page Not Found</title>
  <style>
    :root {
      --bg-a: #f6efe6;
      --bg-b: #d6e7f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #0f766e;
      --primary-hover: #0b5f59;
      --border: #d1d5db;
      --accent: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 10% 10%, #fff7ed 0, transparent 45%),
                  radial-gradient(circle at 90% 15%, #e0f2fe 0, transparent 40%),
                  linear-gradient(135deg, var(--bg-a), var(--bg-b));
      padding: 24px;
      display: grid;
      place-items: center;
    }

    .card {
      width: min(920px, 100%);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 22px;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.15);
      overflow: hidden;
    }

    .hero {
      padding: 34px 28px 20px 28px;
      border-bottom: 1px solid #e5e7eb;
      background: linear-gradient(120deg, rgba(15, 118, 110, 0.08), rgba(245, 158, 11, 0.08));
    }

    .code {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 4.8rem);
      line-height: 1;
      letter-spacing: 0.05em;
      color: var(--primary);
      font-weight: 900;
    }

    h1 {
      margin: 8px 0 8px 0;
      font-size: clamp(1.3rem, 3vw, 2rem);
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .missing {
      margin-top: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.9rem;
      background: #f9fafb;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      color: #374151;
      word-break: break-all;
    }

    .content {
      padding: 24px 28px 28px 28px;
      display: grid;
      gap: 16px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      border-color: var(--border);
      background: white;
      color: #111827;
    }

    .btn-secondary:hover {
      background: #f3f4f6;
    }

    .search-wrap {
      margin-top: 4px;
    }

    .search-label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111827;
    }

    .search-input {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.16);
    }

    .results {
      margin-top: 6px;
      display: grid;
      gap: 10px;
    }

    .result-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }

    .result-title {
      display: inline-block;
      font-weight: 700;
      color: #0f172a;
      text-decoration: none;
      margin-bottom: 6px;
    }

    .result-title:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    .result-meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .result-desc {
      color: #374151;
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0;
    }

    .status {
      font-size: 0.92rem;
      color: #374151;
      margin-top: 2px;
    }

    .status.warn {
      color: #9a3412;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 8px;
      padding: 8px 10px;
    }

    @media (max-width: 640px) {
      body { padding: 14px; }
      .hero, .content { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="hero">
      <p class="code">404</p>
      <h1>This page is missing.</h1>
      <p>The link may be outdated, moved into a category, or typed incorrectly. Use the options below to jump back in quickly.</p>
      <div id="missing-path" class="missing" hidden></div>
    </section>

    <section class="content">
      <div class="actions">
        <a id="home-link" class="btn btn-primary" href="/tools/">Go to Home</a>
        <a id="timeline-link" class="btn btn-secondary" href="/tools/copilot-timeline.html">View Timeline</a>
      </div>

      <div class="search-wrap">
        <label class="search-label" for="tool-search">Search all tools</label>
        <input id="tool-search" class="search-input" type="text" placeholder="Try: matrix, json, password, calendar..." autocomplete="off">
        <p id="search-status" class="status">Loading searchable tool list...</p>
        <div id="search-results" class="results"></div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const missingPath = document.getElementById("missing-path");
      const homeLink = document.getElementById("home-link");
      const timelineLink = document.getElementById("timeline-link");
      const searchInput = document.getElementById("tool-search");
      const status = document.getElementById("search-status");
      const resultsContainer = document.getElementById("search-results");

      let allTools = [];
      let searchTimer = null;

      const pathname = window.location.pathname || "";
      const segments = pathname.split("/").filter(Boolean);
      const firstSegment = segments[0] || "";
      const projectBase = firstSegment && !firstSegment.includes(".") ? `/${firstSegment}` : "";
      const allToolsUrl = `${projectBase}/tools/category-manifests/all-tools.json`;

      homeLink.href = `${projectBase}/`;
      timelineLink.href = `${projectBase}/copilot-timeline.html`;

      if (pathname && !pathname.endsWith("/404.html")) {
        missingPath.hidden = false;
        missingPath.textContent = `Missing path: ${pathname}`;
      }

      function sanitizeText(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderResults(items, query) {
        resultsContainer.innerHTML = "";

        if (!items.length) {
          resultsContainer.innerHTML = '<p class="status warn">No matching tools found. Try a different keyword.</p>';
          return;
        }

        const heading = query
          ? `Showing ${items.length.toLocaleString()} result(s) for "${query}"`
          : `Showing ${items.length.toLocaleString()} quick links`;
        status.textContent = heading;

        const fragment = document.createDocumentFragment();
        items.forEach((tool) => {
          const card = document.createElement("article");
          card.className = "result-card";

          const safeName = sanitizeText(tool.name || "Untitled Tool");
          const safeCategory = sanitizeText(tool.category || "Utility");
          const safeDescription = sanitizeText(tool.description || "Free online tool for daily tasks.");
          const safeUrl = sanitizeText(tool.url || "./");

          card.innerHTML = `
            <a class="result-title" href="${safeUrl}">${safeName}</a>
            <div class="result-meta">Category: ${safeCategory}</div>
            <p class="result-desc">${safeDescription}</p>
          `;
          fragment.appendChild(card);
        });

        resultsContainer.appendChild(fragment);
      }

      function doSearch(rawQuery) {
        const query = String(rawQuery || "").trim().toLowerCase();

        if (!query) {
          renderResults(allTools.slice(0, 12), "");
          return;
        }

        const matches = allTools
          .filter((tool) => {
            const name = String(tool.name || "").toLowerCase();
            const description = String(tool.description || "").toLowerCase();
            const category = String(tool.category || "").toLowerCase();
            return name.includes(query) || description.includes(query) || category.includes(query);
          })
          .slice(0, 30);

        renderResults(matches, rawQuery.trim());
      }

      fetch(allToolsUrl)
        .then((response) => {
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.json();
        })
        .then((payload) => {
          if (!Array.isArray(payload)) {
            throw new Error("Invalid all-tools payload.");
          }

          allTools = payload;
          status.textContent = "Search by tool name, description, or category.";
          renderResults(allTools.slice(0, 12), "");
        })
        .catch((error) => {
          console.error("Failed to load tool search list:", error);
          status.classList.add("warn");
          status.textContent = "Could not load tool search data right now.";
        });

      searchInput.addEventListener("input", (event) => {
        clearTimeout(searchTimer);
        const query = event.target.value;
        searchTimer = setTimeout(() => doSearch(query), 160);
      });
    })();
  </script>
</body>
</html>

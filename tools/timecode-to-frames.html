<body>
  <div class="tool-container">
    <h1>Timecode to Frames</h1>
<div class="row">
  <div><label>Timecode (HH:MM:SS:FF)</label><input type="text" id="tc" placeholder="01:05:30:15" value="00:01:00:00" oninput="c()"></div>
  <div><label>Framerate (FPS)</label><select id="fps" onchange="c()"><option value="24">24 (Film)</option><option value="25">25 (PAL)</option><option value="30" selected>30 (NTSC)</option><option value="60">60</option></select></div>
</div>
<div id="res" class="res" style="font-size:3rem;font-family:monospace;">1800 Frames</div>
<script>function c(){ const tc=document.getElementById('tc').value.trim(); const fps=parseInt(document.getElementById('fps').value); const p=tc.split(':'); if(p.length===4){ const f = (parseInt(p[0])*3600*fps) + (parseInt(p[1])*60*fps) + (parseInt(p[2])*fps) + parseInt(p[3]); document.getElementById('res').innerText = (isNaN(f)?'Error':f) + ' Frames'; }else{ document.getElementById('res').innerText="Format: HH:MM:SS:FF"; } } c();</script>

  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #f9f9f9; }
    h1 { color: #333; }
    textarea { width: 100%; min-height: 80px; margin-bottom: 1rem; font-size: 1.1rem; }
    button { padding: 0.5rem 1.5rem; font-size: 1rem; cursor: pointer; }
    #output { background: #fff; border: 1px solid #ccc; padding: 1rem; min-height: 60px; font-size: 1.2rem; margin-top: 1rem; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Text to Mirror</h1>
  <p>Convert your normal text into mirrored Unicode text. Copy and paste it anywhere!</p>
  <textarea id="input" placeholder="Enter your text here..."></textarea>
  <br>
  <button onclick="toMirror()">Convert to Mirror</button>
  <button onclick="copyOutput()">Copy Output</button>
  <div id="output" aria-live="polite"></div>
  <script>
    function toMirror() {
      const map = {
        'a':'ɒ','b':'d','c':'ɔ','d':'b','e':'ǝ','f':'ɟ','g':'ƃ','h':'ɥ','i':'ı','j':'ɾ','k':'ʞ','l':'ן','m':'ɯ','n':'u','o':'o','p':'q','q':'p','r':'ɹ','s':'s','t':'ʇ','u':'n','v':'ʌ','w':'ʍ','x':'x','y':'ʎ','z':'z',
        'A':'∀','B':'𐐒','C':'Ɔ','D':'◖','E':'Ǝ','F':'Ⅎ','G':'פ','H':'H','I':'I','J':'ſ','K':'ʞ','L':'˥','M':'W','N':'N','O':'O','P':'Ԁ','Q':'Ό','R':'ᴚ','S':'S','T':'┴','U':'∩','V':'Λ','W':'M','X':'X','Y':'⅄','Z':'Z'
      };
      const input = document.getElementById('input').value;
      const mirror = input.split('').map(c => map[c] || c).join('');
      document.getElementById('output').innerText = mirror;
    }
    function copyOutput() {
      const output = document.getElementById('output').innerText;
      if (output) {
        navigator.clipboard.writeText(output);
        alert('Mirrored text copied to clipboard!');
      }
    }
  </script>
</body>

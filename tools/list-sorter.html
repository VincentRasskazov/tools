<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">List Sorter</h1><textarea id="in" placeholder="Banana\nApple\nWatermelon"></textarea><div class="grid"><button onclick="s('az')">Sort A-Z</button><button onclick="s('za')">Sort Z-A</button><button onclick="s('l')">Sort by Length</button><button onclick="s('r')">Reverse Order</button></div><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function s(t){ let a=document.getElementById('in').value.split('\n'); if(t==='az')a.sort(); if(t==='za')a.sort().reverse(); if(t==='l')a.sort((x,y)=>x.length-y.length); if(t==='r')a.reverse(); document.getElementById('out').value=a.join('\n'); }</script>

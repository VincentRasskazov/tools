  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Keycode Info</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} #main{font-size:6rem;font-weight:bold;color:#2563eb;margin:20px 0;} .grid{display:flex;gap:10px;justify-content:center;} .box{background:#f8fafc;padding:15px;border:1px solid #e2e8f0;border-radius:6px;flex:1;} .lbl{font-size:0.9rem;color:#64748b;font-weight:bold;} .val{font-family:monospace;font-size:1.2rem;}</style></head>
<body><div class="tool-container"><h1>Press any key</h1>
<div id="main">...</div>
<div class="grid">
  <div class="box"><div class="lbl">event.key</div><div class="val" id="k">-</div></div>
  <div class="box"><div class="lbl">event.code</div><div class="val" id="c">-</div></div>
  <div class="box"><div class="lbl">event.keyCode</div><div class="val" id="kc">-</div></div>
</div></div>
<script>
window.addEventListener('keydown', e => {
  e.preventDefault();
  document.getElementById('main').innerText = e.keyCode;
  document.getElementById('k').innerText = e.key === " " ? "Space" : e.key;
  document.getElementById('c').innerText = e.code;
  document.getElementById('kc').innerText = e.keyCode;
});
</script></body></html>

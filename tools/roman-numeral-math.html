<body>
  <div class="tool-container">
    <h1>Roman Numeral Math</h1>
<div class="row"><div><input type="text" id="a" placeholder="XIV" style="text-transform:uppercase;"></div><div><select id="op"><option value="+">+</option><option value="-">-</option><option value="*">×</option></select></div><div><input type="text" id="b" placeholder="V" style="text-transform:uppercase;"></div></div>
<button onclick="c()">Calculate</button>
<div id="res" class="res" style="font-size:3rem;font-family:serif;"></div>
<script>
const map={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
function p(s){ s=s.toUpperCase(); let r=0; for(let i=0;i<s.length;i++){ const c=map[s[i]], n=map[s[i+1]]; if(n>c){r+=n-c;i++}else{r+=c} } return r; }
function toR(n){if(n<1||n>3999)return'Out of range';const r=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(let[v,c]of r){while(n>=v){s+=c;n-=v;}}return s;}
function c(){ const a=p(document.getElementById('a').value), b=p(document.getElementById('b').value), op=document.getElementById('op').value; if(isNaN(a)||isNaN(b))return document.getElementById('res').innerText='Error'; let ans=0; if(op==='+')ans=a+b; if(op==='-')ans=a-b; if(op==='*')ans=a*b; document.getElementById('res').innerText=toR(ans); }
</script>

<body>
  <div class="tool-container">
    <h1>HTML Table to CSV</h1>
<div class="card"><label>📄 HTML Code</label><textarea id="in" rows="5" placeholder="<table>\n  <tr><th>ID</th><th>Name</th></tr>\n  <tr><td>1</td><td>John</td></tr>\n</table>"></textarea></div>
<button onclick="c()">Extract to CSV</button>
<div class="card"><label>✨ CSV Output</label><textarea id="out" rows="6" readonly style="font-family:monospace;white-space:pre;"></textarea></div>
<script>
function c(){
  const tmp=document.createElement('div'); tmp.innerHTML=document.getElementById('in').value;
  const t=tmp.querySelector('table'); if(!t)return document.getElementById('out').value="No <table> found in HTML.";
  let csv='';
  const rows=t.querySelectorAll('tr');
  rows.forEach(tr => {
    const cols=Array.from(tr.querySelectorAll('th, td')).map(td => {
      let txt=td.innerText.trim().replace(/"/g, '""');
      return txt.includes(',') || txt.includes('"') || txt.includes('\n') ? `"${txt}"` : txt;
    });
    csv+=cols.join(',') + '\n';
  });
  document.getElementById('out').value=csv.trim();
}
</script>
  </div>
</body>

<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">HTML Table to CSV</h1><textarea id="in" placeholder="<table><tr><td>Data</td></tr></table>"></textarea><button onclick="c()">Extract to CSV</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ const div=document.createElement('div'); div.innerHTML=document.getElementById('in').value; const rows=div.querySelectorAll('tr'); let csv=[]; rows.forEach(r=>{ const cols=r.querySelectorAll('td, th'); const rowData=[]; cols.forEach(c=>rowData.push(`"${c.innerText.trim()}"`)); csv.push(rowData.join(',')); }); document.getElementById('out').value=csv.join('\n'); }</script></body></html>

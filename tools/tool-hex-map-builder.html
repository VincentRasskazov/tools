<body>
  <div class="tool-container">
    <h1>Hexagon Map Builder</h1>
<div class="row" style="margin-bottom:10px;justify-content:center;">
  <div onclick="c='#16a34a'" style="width:40px;height:40px;background:#16a34a;border-radius:50%;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.2);"></div>
  <div onclick="c='#3b82f6'" style="width:40px;height:40px;background:#3b82f6;border-radius:50%;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.2);"></div>
  <div onclick="c='#facc15'" style="width:40px;height:40px;background:#facc15;border-radius:50%;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.2);"></div>
  <div onclick="c='#64748b'" style="width:40px;height:40px;background:#64748b;border-radius:50%;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.2);"></div>
</div>
<div class="card" style="padding:0;overflow:hidden;background:#f8fafc;cursor:crosshair;display:flex;justify-content:center;" onmousedown="dr=true;clk(event)" onmousemove="clk(event)" onmouseup="dr=false" onmouseleave="dr=false">
  <canvas id="cvs" width="400" height="300" style="display:block;"></canvas>
</div>
<button onclick="st()">Clear Map</button>
<script>
const cvs=document.getElementById('cvs'), ctx=cvs.getContext('2d');
let hexes=[], c='#16a34a', dr=false; const r=15, w=Math.sqrt(3)*r, h=2*r;
function st(){
  hexes=[]; for(let q=0;q<25;q++) for(let r_idx=0;r_idx<15;r_idx++){
    const x = w*q + (r_idx%2===1?w/2:0), y = h*0.75*r_idx;
    hexes.push({x, y, col:'#e2e8f0'});
  } drw();
}
function poly(x,y,col){
  ctx.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/180 * (60*i-30); ctx.lineTo(x+r*Math.cos(a), y+r*Math.sin(a)); }
  ctx.closePath(); ctx.fillStyle=col; ctx.fill(); ctx.strokeStyle='#cbd5e1'; ctx.stroke();
}
function drw(){ ctx.clearRect(0,0,400,300); hexes.forEach(h=>poly(h.x,h.y,h.col)); }
function clk(e){ if(!dr)return; const rect=cvs.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top; hexes.forEach(h=>{ if(Math.hypot(h.x-mx, h.y-my)<13){ h.col=c; drw(); } }); } st();
</script>

<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">CSV to XML</h1><textarea id="in" placeholder="id,name\n1,Alice\n2,Bob"></textarea><button onclick="c()">Convert to XML</button><textarea id="out" readonly style="margin-top:20px;height:250px;"></textarea></div>
<script>function c(){ const lines=document.getElementById('in').value.trim().split('\n'); if(lines.length<2)return; const headers=lines[0].split(','); let xml='<?xml version="1.0" encoding="UTF-8"?>\n<rows>\n'; for(let i=1;i<lines.length;i++){ let data=lines[i].split(','); xml+='  <row>\n'; headers.forEach((h,j)=>{ xml+=`    <${h.trim()}>${data[j]?data[j].trim():''}</${h.trim()}>\n`; }); xml+='  </row>\n'; } xml+='</rows>'; document.getElementById('out').value=xml; }</script>

<div class="tool-container"><h1 style="color:#2563eb;">Roman Date</h1><input type="date" id="d" oninput="c()"><div id="res"></div></div>
<script>function toR(n){if(!n)return'';const r=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(let[v,c]of r){while(n>=v){s+=c;n-=v;}}return s;} function c(){const d=document.getElementById('d').value.split('-'); if(d.length===3)document.getElementById('res').innerText=`${toR(d[1])} • ${toR(d[2])} • ${toR(d[0])}`;} </script>

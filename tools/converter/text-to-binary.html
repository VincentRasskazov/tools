<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Text to Binary</h1><textarea id="in" placeholder="Hello"></textarea><button onclick="c()">Convert to Binary</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ document.getElementById('out').value=document.getElementById('in').value.split('').map(x=>x.charCodeAt(0).toString(2).padStart(8,'0')).join(' '); }</script>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Energy Converter</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:10px;} label{font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Energy Converter</h1>
<label>Joules (J)</label><input type="number" id="j" oninput="c('j')">
<label>Kilojoules (kJ)</label><input type="number" id="kj" oninput="c('kj')">
<label>Calories (cal)</label><input type="number" id="cal" oninput="c('cal')">
<label>Kilowatt-hour (kWh)</label><input type="number" id="kwh" oninput="c('kwh')"></div>
<script>function c(id){ const v=parseFloat(document.getElementById(id).value); if(isNaN(v))return; const j = id==='j'?v : id==='kj'?v*1000 : id==='cal'?v*4.184 : v*3600000;
if(id!=='j')document.getElementById('j').value=j; if(id!=='kj')document.getElementById('kj').value=j/1000; if(id!=='cal')document.getElementById('cal').value=j/4.184; if(id!=='kwh')document.getElementById('kwh').value=j/3600000; }</script></body></html>

<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">nCr & nPr Calculator</h1><label>Total Items (n)</label><input type="number" id="n"><label>Items Selected (r)</label><input type="number" id="r"><button onclick="c()">Calculate</button><div id="res"></div></div>
<script>const f = n => n<=1 ? 1 : n*f(n-1); function c(){ const n=parseInt(document.getElementById('n').value), r=parseInt(document.getElementById('r').value); if(n>=r && r>=0){ const p = f(n)/f(n-r), c = p/f(r); document.getElementById('res').innerHTML = `Combinations (nCr): <strong>${c}</strong><br>Permutations (nPr): <strong>${p}</strong>`; } }</script></body></html>

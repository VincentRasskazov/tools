.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} textarea{width:100%;height:100px;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}

<body>
<div class="tool-container"><h1 style="color:#2563eb;">Morse Audio Player</h1><textarea id="in" placeholder="SOS"></textarea><button onclick="play()">Play Audio</button><div id="morse" style="margin-top:20px;font-family:monospace;font-size:1.5rem;">... --- ...</div></div>
<script>
const m={a:".-",b:"-...",c:"-.-.",d:"-..",e:".",f:"..-.",g:"--.",h:"....",i:"..",j:".---",k:"-.-",l:".-..",m:"--",n:"-.",o:"---",p:".--.",q:"--.-",r:".-.",s:"...",t:"-",u:"..-",v:"...-",w:".--",x:"-..-",y:"-.--",z:"--..", "1":".----","2":"..---","3":"...--","4":"....-","5":".....","6":"-....","7":"--...","8":"---..","9":"----.","0":"-----"," ":" "};
const ctx = new (window.AudioContext || window.webkitAudioContext)();
function play(){
  const txt = document.getElementById('in').value.toLowerCase();
  const code = txt.split('').map(c => m[c]||'').join(' ');
  document.getElementById('morse').innerText = code;
  let t = ctx.currentTime;
  const dot = 0.1;
  code.split('').forEach(c => {
    if(c==='.'){ tone(t, dot); t += dot*2; }
    else if(c==='-'){ tone(t, dot*3); t += dot*4; }
    else if(c===' '){ t += dot*4; }
  });
}
function tone(start, dur){
  const osc = ctx.createOscillator();
  osc.frequency.value = 600;
  osc.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + dur);
}
</script>

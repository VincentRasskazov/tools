<body>
  <div class="tool-container">
    <h1>Area of a Rectangle</h1>
<div class="row"><div><label>Width (w)</label><input type="number" id="w" value="10" step="0.1"></div><div><label>Length (l)</label><input type="number" id="l" value="5" step="0.1"></div></div>
<button onclick="c()">Calculate</button>
<div id="res" class="res"></div>
<script>function c(){ const w=parseFloat(document.getElementById('w').value), l=parseFloat(document.getElementById('l').value); if(w>0&&l>0){ document.getElementById('res').innerHTML=`Area: <strong style="color:var(--primary);font-size:2.5rem;">${(w*l).toFixed(4).replace(/\.?0+$/,'')}</strong><br><span style="font-size:1rem;color:#64748b;">Perimeter: ${(2*(w+l)).toFixed(4).replace(/\.?0+$/,'')}</span>`; } }</script>

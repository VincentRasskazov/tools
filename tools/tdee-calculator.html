<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">TDEE Calculator</h1><label>BMR (Basal Metabolic Rate)</label><input type="number" id="bmr" placeholder="1500"><label>Activity Level</label><select id="act"><option value="1.2">Sedentary (Office Job)</option><option value="1.375">Light Exercise (1-2 days)</option><option value="1.55">Moderate Exercise (3-5 days)</option><option value="1.725">Heavy Exercise (6-7 days)</option><option value="1.9">Athlete (2x per day)</option></select><button onclick="c()">Calculate TDEE</button><div id="res"></div></div>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>TDEE Calculator</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.5rem;text-align:center;font-weight:bold;color:#16a34a;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">TDEE Calculator</h1><label>BMR (Basal Metabolic Rate)</label><input type="number" id="bmr" placeholder="1500"><label>Activity Level</label><select id="act"><option value="1.2">Sedentary (Office Job)</option><option value="1.375">Light Exercise (1-2 days)</option><option value="1.55">Moderate Exercise (3-5 days)</option><option value="1.725">Heavy Exercise (6-7 days)</option><option value="1.9">Athlete (2x per day)</option></select><button onclick="c()">Calculate TDEE</button><div id="res"></div></div>
<script>function c(){ const bmr=parseFloat(document.getElementById('bmr').value), act=parseFloat(document.getElementById('act').value); if(bmr) document.getElementById('res').innerText = Math.round(bmr*act) + " kcal/day"; }</script></body></html>

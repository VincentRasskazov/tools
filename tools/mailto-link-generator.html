  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Mailto Generator</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #out{margin-top:20px;padding:15px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:6px;font-family:monospace;word-break:break-all;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Mailto Link Generator</h1>
<label>To Email</label><input type="email" id="e" placeholder="contact@example.com">
<label>Subject</label><input type="text" id="s" placeholder="Hello there">
<label>Body</label><textarea id="b" placeholder="Message content..." rows="3"></textarea>
<button onclick="c()">Generate Mailto</button>
<div id="out">Link will appear here...</div></div>
<script>function c(){ const e=document.getElementById('e').value, s=document.getElementById('s').value, b=document.getElementById('b').value; document.getElementById('out').innerText=`mailto:${e}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(b)}`; }</script></body></html>

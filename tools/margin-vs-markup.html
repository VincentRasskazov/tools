:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

<body>
  <div class="tool-container">
    <h1>Margin vs Markup</h1>
<div class="row"><div><label>Cost ($)</label><input type="number" id="c" value="50"></div><div><label>Price ($)</label><input type="number" id="p" value="80"></div></div>
<button onclick="calc()">Calculate Both</button>
<div id="res" class="res" style="font-size:1.2rem;line-height:1.8;"></div>
<script>function calc(){ const c=parseFloat(document.getElementById('c').value), p=parseFloat(document.getElementById('p').value); if(c&&p){ const prof=p-c; const mar=(prof/p)*100; const mark=(prof/c)*100; document.getElementById('res').innerHTML=`Profit: <strong>$${prof.toFixed(2)}</strong><br><br>Gross Margin: <span style="color:var(--primary);font-weight:bold;font-size:2rem;">${mar.toFixed(2)}%</span><br><span style="color:#64748b;font-size:0.9rem;">(Profit / Price)</span><br><br>Markup: <span style="color:var(--success);font-weight:bold;font-size:2rem;">${mark.toFixed(2)}%</span><br><span style="color:#64748b;font-size:0.9rem;">(Profit / Cost)</span>`; } }</script>
  </div>

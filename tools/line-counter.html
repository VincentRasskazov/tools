  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Line Counter</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} #out{font-size:2rem;font-weight:bold;color:#2563eb;text-align:center;margin-top:20px;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Line Counter</h1><textarea id="in" placeholder="Line 1\nLine 2..." oninput="c()"></textarea><div id="out">0 Lines</div></div>
<script>function c(){ const t=document.getElementById('in').value; if(!t){document.getElementById('out').innerText="0 Lines";return;} const lines=t.split('\n'); const empty=lines.filter(l=>l.trim()==='').length; document.getElementById('out').innerHTML=`Total Lines: ${lines.length}<br><span style="font-size:1.2rem;color:#64748b;">Empty Lines: ${empty}</span>`; }</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>note pad Tool</title>
  <meta name="description" content="note pad online tool.">
  <meta name="category" content="Utility Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">note pad Tool</h1>
  </div>

  <h1>note pad Tool</h1>

  <p>This is a starter tool page for <strong>note pad</strong>.</p>


  <textarea id="input" placeholder="Type your notes here..." rows="12" style="width:100%"></textarea>
  <div>
    <button onclick="save()">Save</button>
    <button onclick="clearNote()">Clear</button>
  </div>
  <div id="output" style="color:green;"></div>

  <script>
    const KEY = 'notepad-content';
    window.onload = function() {
      document.getElementById('input').value = localStorage.getItem(KEY) || '';
    };
    function save() {
      localStorage.setItem(KEY, document.getElementById('input').value);
      document.getElementById('output').innerText = 'Note saved!';
    }
    function clearNote() {
      document.getElementById('input').value = '';
      localStorage.removeItem(KEY);
      document.getElementById('output').innerText = 'Note cleared!';
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

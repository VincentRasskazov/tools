<body>
  <div class="tool-container">
    <h1>Open Graph Generator</h1>
<div class="card">
  <label>OG Title</label><input type="text" id="t" placeholder="Article Title" oninput="c()">
  <label>OG Description</label><textarea id="d" rows="2" placeholder="Summary of the article..." oninput="c()"></textarea>
  <label>OG URL</label><input type="url" id="u" placeholder="https://example.com/article" oninput="c()">
  <label>OG Image URL</label><input type="url" id="i" placeholder="https://example.com/image.jpg" oninput="c()">
  <label>Type</label><select id="ty" onchange="c()"><option value="website">Website</option><option value="article">Article</option></select>
</div>
<div class="card"><textarea id="out" rows="7" readonly style="font-family:monospace;white-space:pre;"></textarea></div>
<script>function c(){ const t=document.getElementById('t').value, d=document.getElementById('d').value, u=document.getElementById('u').value, i=document.getElementById('i').value, ty=document.getElementById('ty').value; let h=`<meta property="og:type" content="${ty}">\n`; if(t) h+=`<meta property="og:title" content="${t}">\n`; if(d) h+=`<meta property="og:description" content="${d}">\n`; if(u) h+=`<meta property="og:url" content="${u}">\n`; if(i) h+=`<meta property="og:image" content="${i}">`; document.getElementById('out').value=h; } c();</script>
  </div>

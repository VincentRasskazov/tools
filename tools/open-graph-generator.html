<!DOCTYPE html>
<html lang="en"><head>
  <meta name="description" content="Generate Facebook and Open Graph tags for better social media sharing.">
  <meta property="og:title" content="Open Graph Generator">
  <meta property="og:description" content="Generate Facebook and Open Graph tags for better social media sharing.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Open Graph Generator">
  <meta name="twitter:description" content="Generate Facebook and Open Graph tags for better social media sharing.">
  <meta charset="UTF-8"><title>Open Graph</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input,textarea{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;} #out{background:#1e293b;color:#a5b4fc;padding:15px;margin-top:20px;font-family:monospace;height:150px;}</style></head>
<body><div class="tool-container"><h1>Open Graph Generator</h1>
<input type="text" id="t" placeholder="og:title">
<input type="text" id="d" placeholder="og:description">
<input type="text" id="i" placeholder="og:image (URL)">
<input type="text" id="u" placeholder="og:url">
<button onclick="c()">Generate Tags</button>
<textarea id="out" readonly></textarea></div>
<script>function c(){ const t=document.getElementById('t').value, d=document.getElementById('d').value, i=document.getElementById('i').value, u=document.getElementById('u').value; document.getElementById('out').value = `<meta property="og:title" content="${t}">\n<meta property="og:description" content="${d}">\n<meta property="og:image" content="${i}">\n<meta property="og:url" content="${u}">\n<meta property="og:type" content="website">`; }</script></body></html>

.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} input{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;margin-bottom:20px;font-size:1.2rem;text-align:center;} button{width:100%;padding:15px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;} #out{font-size:2rem;font-weight:bold;margin-top:20px;}
  </style>

<body>
<div class="tool-container"><h1 style="color:#2563eb;">Leap Year Checker</h1><input type="number" id="yr" placeholder="e.g. 2024"><button onclick="c()">Check Year</button><div id="out"></div></div>
<script>function c(){ const y = parseInt(document.getElementById('yr').value); if(!y)return; const isLeap = (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0); const el = document.getElementById('out'); el.innerText = isLeap ? "✅ Yes, Leap Year!" : "❌ Not a Leap Year"; el.style.color = isLeap ? "#16a34a" : "#dc2626"; }</script>

<!DOCTYPE html>
<html lang="en"><head>
  <meta name="description" content="Decode Base64 strings back into viewable images.">
  <meta property="og:title" content="Base64 to Image Decoder">

  <meta charset="UTF-8"><title>Base64 to Image</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:6px;font-family:monospace;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin:15px 0;} img{max-width:100%;border-radius:6px;display:none;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Base64 to Image</h1>
<textarea id="input" placeholder="data:image/png;base64,iVBORw0KG..."></textarea>
<button onclick="decode()">View Image</button>
<div style="text-align:center;"><img id="img" src=""></div></div>
<script>
  function decode(){
    const val = document.getElementById('input').value.trim();
    if(!val) return;
    const img = document.getElementById('img');
    img.src = val.startsWith('data:image') ? val : 'data:image/png;base64,' + val;
    img.style.display = 'inline-block';
  }
</script></body></html>

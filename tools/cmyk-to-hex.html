  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>CMYK to Hex</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .row{display:flex;gap:10px;margin-bottom:15px;} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;text-align:center;} #box{height:100px;border-radius:6px;margin-top:20px;border:1px solid #ccc;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">CMYK to Hex</h1><div class="row"><div><label>C</label><input type="number" id="c" value="84" max="100" oninput="cv()"></div><div><label>M</label><input type="number" id="m" value="58" max="100" oninput="cv()"></div><div><label>Y</label><input type="number" id="y" value="0" max="100" oninput="cv()"></div><div><label>K</label><input type="number" id="k" value="8" max="100" oninput="cv()"></div></div><input type="text" id="out" readonly><div id="box"></div></div>
<script>function cv(){ let c=document.getElementById('c').value/100, m=document.getElementById('m').value/100, y=document.getElementById('y').value/100, k=document.getElementById('k').value/100; let r=255*(1-c)*(1-k), g=255*(1-m)*(1-k), b=255*(1-y)*(1-k); const hex = '#'+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join(''); document.getElementById('out').value=hex.toUpperCase(); document.getElementById('box').style.background=hex; } window.onload=cv;</script>

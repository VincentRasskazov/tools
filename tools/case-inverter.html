<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Case Inverter</h1><textarea id="in" placeholder="hELLO wORLD"></textarea><button onclick="c()">Invert Case</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ document.getElementById('out').value=document.getElementById('in').value.split('').map(c=>c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()).join(''); }</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>csv to json Tool</title>
  <meta name="description" content="csv to json online tool.">
  <meta name="category" content="Developer Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">csv to json Tool</h1>
  </div>

  <h1>csv to json Tool</h1>

  <p>This is a starter tool page for <strong>csv to json</strong>.</p>


  <label for="input">CSV:</label>
  <textarea id="input" placeholder="Paste CSV here"></textarea>
  <button onclick="run()">Convert to JSON</button>

  <p id="output"></p>

  <script>
    function run() {
      const csv = document.getElementById('input').value.trim();
      if (!csv) {
        document.getElementById('output').innerText = "Please enter CSV data.";
        return;
      }
      const lines = csv.split(/\r?\n/);
      const headers = lines[0].split(',');
      const result = lines.slice(1).filter(Boolean).map(line => {
        const obj = {};
        line.split(',').forEach((val, i) => {
          obj[headers[i]] = val;
        });
        return obj;
      });
      document.getElementById('output').innerText = JSON.stringify(result, null, 2);
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

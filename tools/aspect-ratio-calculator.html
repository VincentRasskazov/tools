<body>
  <div class="tool-container">
    <h1>Aspect Ratio Calculator</h1>
<div class="row">
  <div class="card"><label>Original Width</label><input type="number" id="w1" value="1920" oninput="c('w2')"></div>
  <div class="card"><label>Original Height</label><input type="number" id="h1" value="1080" oninput="c('h2')"></div>
</div>
<div class="row">
  <div class="card"><label>New Width</label><input type="number" id="w2" value="1280" oninput="c('h2')" style="border-color:var(--primary);"></div>
  <div class="card"><label>New Height</label><input type="number" id="h2" value="720" oninput="c('w2')" style="border-color:var(--success);"></div>
</div>
<script>
function c(target){
  const w1=parseFloat(document.getElementById('w1').value), h1=parseFloat(document.getElementById('h1').value);
  const w2=document.getElementById('w2'), h2=document.getElementById('h2');
  if(w1>0 && h1>0){
    const ratio = w1/h1;
    if(target==='h2'){ const nw=parseFloat(w2.value); if(!isNaN(nw)) h2.value = Math.round(nw/ratio); }
    if(target==='w2'){ const nh=parseFloat(h2.value); if(!isNaN(nh)) w2.value = Math.round(nh*ratio); }
  }
}
</script>

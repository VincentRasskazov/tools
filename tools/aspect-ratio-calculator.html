:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

<body>
  <div class="tool-container">
    <h1>Aspect Ratio Calculator</h1>
<div class="row">
  <div><label>Original Width (W1)</label><input type="number" id="w1" value="1920" oninput="c('w1')"></div>
  <div><label>Original Height (H1)</label><input type="number" id="h1" value="1080" oninput="c('h1')"></div>
</div>
<div class="row">
  <div><label>New Width (W2)</label><input type="number" id="w2" value="1280" oninput="c('w2')"></div>
  <div><label>New Height (H2)</label><input type="number" id="h2" oninput="c('h2')"></div>
</div>
<script>
function c(src){
  const w1=parseFloat(document.getElementById('w1').value), h1=parseFloat(document.getElementById('h1').value);
  const w2=document.getElementById('w2'), h2=document.getElementById('h2');
  if(!w1 || !h1) return;
  if(src==='w2' || src==='w1' || src==='h1'){
    if(w2.value) h2.value = (parseFloat(w2.value) * h1 / w1).toFixed(2).replace(/\.00$/,'');
  } else if(src==='h2') {
    if(h2.value) w2.value = (parseFloat(h2.value) * w1 / h1).toFixed(2).replace(/\.00$/,'');
  }
} c('w1');
</script>
  </div>
</body>

.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.5rem;font-weight:bold;color:#16a34a;text-align:center;}

<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">PPI Calculator</h1><label>Width (px)</label><input type="number" id="w" value="1920"><label>Height (px)</label><input type="number" id="h" value="1080"><label>Diagonal Size (inches)</label><input type="number" id="d" value="24"><button onclick="c()">Calculate PPI</button><div id="res"></div></div>
<script>function c(){ const w=parseFloat(document.getElementById('w').value), h=parseFloat(document.getElementById('h').value), d=parseFloat(document.getElementById('d').value); if(w&&h&&d){ const ppi = Math.sqrt(w*w + h*h) / d; document.getElementById('res').innerText = ppi.toFixed(2) + " PPI"; } }</script>
</body>

<body>
  <div class="tool-container">
    <h1>JWT Encoder Pro</h1>
<div class="row">
  <div class="card"><label>🏷️ Header (JSON)</label><textarea id="hdr" rows="3">{"alg":"HS256","typ":"JWT"}</textarea></div>
  <div class="card"><label>📦 Payload (JSON)</label><textarea id="pay" rows="3">{"sub":"1234567890","name":"John Doe"}</textarea></div>
</div>
<div class="card"><label>🔑 Secret Key</label><input type="text" id="sec" value="your-256-bit-secret"></div>
<button onclick="c()">Encode & Sign Token</button>
<div class="card"><textarea id="out" rows="4" readonly style="font-family:monospace;"></textarea></div>
<script>
function enc(o){ return btoa(JSON.stringify(o)).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_'); }
function c(){
  try {
    const h = JSON.parse(document.getElementById('hdr').value);
    const p = JSON.parse(document.getElementById('pay').value);
    const s = document.getElementById('sec').value;
    const tokenStr = enc(h) + "." + enc(p);
    const sig = CryptoJS.HmacSHA256(tokenStr, s);
    const sig64 = CryptoJS.enc.Base64.stringify(sig).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    document.getElementById('out').value = `${tokenStr}.${sig64}`;
  } catch(e) { document.getElementById('out').value = "Error: Invalid JSON in Header or Payload"; }
}
</script>

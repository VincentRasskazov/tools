<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">HTML to JSX</h1><textarea id="in" placeholder='<div class="box" for="input"><br></div>'></textarea><button onclick="c()">Convert to JSX</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ let t=document.getElementById('in').value; t=t.replace(/class=/g, 'className=').replace(/for=/g, 'htmlFor=').replace(/<br>/g, '<br />').replace(/<hr>/g, '<hr />').replace(/<img([^>]*[^\/])>/g, '<img$1 />').replace(/<input([^>]*[^\/])>/g, '<input$1 />'); document.getElementById('out').value=t; }</script>
</body>

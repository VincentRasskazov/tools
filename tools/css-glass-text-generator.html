  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #f4f7f9 0%, #e2e8f0 100%); min-height: 100vh; color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
.tool-container { max-width: 680px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1), 0 10px 15px -3px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.5); }
h1 { text-align: center; color: var(--primary); margin: 0 0 30px 0; font-size: 2.4rem; font-weight: 800; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(59,130,246,0.1); }
label { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 8px; color: #334155; font-size: 0.95rem; }
input, select, textarea { width: 100%; padding: 16px; border: 2px solid var(--border); border-radius: 12px; margin-bottom: 20px; font-size: 1rem; transition: all 0.2s ease; box-sizing: border-box; background: #fcfcfc; color: var(--text); box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), inset 0 2px 4px rgba(0,0,0,0.02); background: #fff; }
button { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); margin-bottom: 10px; letter-spacing: 0.5px; }

.res { margin-top: 25px; padding: 30px; background: linear-gradient(to right, #f8fafc, #f1f5f9); border-radius: 16px; text-align: center; font-size: 1.5rem; font-weight: 800; border: 2px dashed #cbd5e1; color: var(--primary); word-break: break-word; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
.row { display: flex; gap: 20px; } .row > div { flex: 1; }

<body>
  <div class="tool-container">
    <h1>CSS Glass Text</h1>
<div style="background:url('https://placehold.co/600x300/3b82f6/fff?text=Background') center/cover; padding:60px 20px; border-radius:16px; margin-bottom:20px; text-align:center;">
  <div id="txt" style="font-size:4rem; font-weight:900; color:rgba(255,255,255,0.4); text-shadow: 0 8px 16px rgba(0,0,0,0.2), 0 0 2px rgba(255,255,255,0.3); backdrop-filter: blur(4px);">GLASS</div>
</div>
<div class="row">
  <div class="card"><label>🌫️ Blur (px)</label><input type="range" id="b" min="0" max="10" value="4" oninput="u()"></div>
  <div class="card"><label>👻 Opacity</label><input type="range" id="o" min="0.1" max="1" step="0.1" value="0.4" oninput="u()"></div>
</div>
<textarea id="out" rows="4" readonly style="font-family:monospace;"></textarea>
<script>
function u(){
  const b=document.getElementById('b').value, o=document.getElementById('o').value;
  const css = `color: rgba(255, 255, 255, ${o});\ntext-shadow: 0 8px 16px rgba(0,0,0,0.2), 0 0 2px rgba(255,255,255,0.3);\nbackdrop-filter: blur(${b}px);`;
  document.getElementById('txt').style.cssText = `font-size:4rem; font-weight:900; ${css}`;
  document.getElementById('out').value = css;
} u();
</script>

<body>
  <h1>Text to Invisible</h1>
  <p>Convert your normal text into invisible Unicode text. Copy and paste it anywhere!</p>
  <textarea id="input" placeholder="Enter your text here..."></textarea>
  <br>
  <button onclick="toInvisible()">Convert to Invisible</button>
  <button onclick="copyOutput()">Copy Output</button>
  <div id="output" aria-live="polite"></div>
  <script>
    function toInvisible() {
      const input = document.getElementById('input').value;
      // Use U+2063 INVISIBLE SEPARATOR
      const invisible = input.split('').join('\u2063');
      document.getElementById('output').innerText = invisible;
    }
    function copyOutput() {
      const output = document.getElementById('output').innerText;
      if (output) {
        navigator.clipboard.writeText(output);
        alert('Invisible text copied to clipboard!');
      }
    }
  </script>
</body>

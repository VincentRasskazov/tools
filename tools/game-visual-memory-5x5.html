  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

.grid-game { display: grid; gap: 10px; margin: 0 auto 20px; }
.grid-cell { background: var(--surface); border: 2px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; cursor: pointer; transition: 0.1s; user-select: none; }
</style>

<body>
  <div class="tool-container">
    <h1>Visual Memory</h1>
<div id="sc" style="text-align:center;font-weight:bold;color:var(--success);margin-bottom:10px;">Level: 1</div>
<div id="grid" class="grid-game" style="grid-template-columns:repeat(5,1fr); width:300px; height:300px; background:var(--bg); border:none;"></div>
<button id="btn" onclick="st()">Start Game</button>
<script>
let lvl=1, pat=[], usr=[], run=false;
function drw(){ const g=document.getElementById('grid'); g.innerHTML=''; for(let i=0;i<25;i++){ g.innerHTML+=`<div id="c${i}" style="background:var(--border);border-radius:6px;cursor:pointer;transition:0.2s;" onclick="clk(${i})"></div>`; } }
function st(){ lvl=1; drw(); document.getElementById('btn').style.display='none'; nxt(); }
function nxt(){ usr=[]; pat=[]; document.getElementById('sc').innerText="Level: "+lvl; const count=Math.min(3+lvl, 20); while(pat.length<count){ const r=Math.floor(Math.random()*25); if(!pat.includes(r))pat.push(r); } run=false; pat.forEach(i=>document.getElementById('c'+i).style.background='#fff'); setTimeout(()=>{ pat.forEach(i=>document.getElementById('c'+i).style.background='var(--border)'); run=true; }, 1500); }
function clk(i){ if(!run)return; const el=document.getElementById('c'+i); if(pat.includes(i)){ el.style.background='#fff'; if(!usr.includes(i))usr.push(i); if(usr.length===pat.length){ run=false; lvl++; setTimeout(nxt, 1000); } } else { el.style.background='var(--danger)'; run=false; alert("Wrong! You reached Level: "+lvl); document.getElementById('btn').style.display='block'; drw(); } }
drw();
</script>
  </div>

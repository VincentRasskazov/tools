  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Cube Calc</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} #res{margin-top:20px;background:#f8fafc;padding:15px;border-radius:6px;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Cube Calculator</h1><label>Side Length (a)</label><input type="number" id="a" oninput="c()"><div id="res"></div></div>
<script>function c(){ const a=parseFloat(document.getElementById('a').value); if(a){ const v=Math.pow(a,3), s=6*Math.pow(a,2), d=a*Math.sqrt(3); document.getElementById('res').innerHTML=`Surface Area: <strong>${s.toFixed(2)}</strong><br>Volume: <strong>${v.toFixed(2)}</strong><br>Diagonal: <strong>${d.toFixed(2)}</strong>`; } }</script></body></html>

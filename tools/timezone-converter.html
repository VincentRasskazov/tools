<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>timezone converter Tool</title>
  <meta name="description" content="timezone converter online tool.">
  <meta name="category" content="Date Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">timezone converter Tool</h1>
  </div>

  <h1>timezone converter Tool</h1>

  <p>This is a starter tool page for <strong>timezone converter</strong>.</p>


  <input id="date" type="datetime-local" style="width:200px;">
  <select id="from">
    <option value="UTC">UTC</option>
    <option value="America/New_York">New York</option>
    <option value="Europe/London">London</option>
    <option value="Asia/Tokyo">Tokyo</option>
    <option value="Australia/Sydney">Sydney</option>
  </select>
  to
  <select id="to">
    <option value="UTC">UTC</option>
    <option value="America/New_York">New York</option>
    <option value="Europe/London">London</option>
    <option value="Asia/Tokyo">Tokyo</option>
    <option value="Australia/Sydney">Sydney</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    function run() {
      const dateStr = document.getElementById('date').value;
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (!dateStr) {
        document.getElementById('output').innerText = 'Enter a date and time.';
        return;
      }
      const date = new Date(dateStr + 'Z');
      const options = { timeZone: to, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' };
      const fmt = new Intl.DateTimeFormat('en-GB', options);
      document.getElementById('output').innerText = fmt.format(date) + ' (' + to + ')';
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Duplicate Remover</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Duplicate Remover</h1><textarea id="in" placeholder="apple banana apple orange banana"></textarea><button onclick="c()">Remove Duplicates</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ const w = document.getElementById('in').value.split(/\s+/); document.getElementById('out').value = [...new Set(w)].join(' '); }</script></body></html>

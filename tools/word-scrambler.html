<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Word Scrambler</h1><textarea id="in" placeholder="Type a sentence here..."></textarea><button onclick="c()">Scramble Words</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>

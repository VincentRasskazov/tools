  <meta charset="UTF-8"><title>Border Radius</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} #box{width:200px;height:200px;background:#2563eb;margin:40px auto;} .row{display:flex;justify-content:space-between;margin-bottom:10px;} input[type=range]{width:70%;} textarea{width:100%;padding:10px;font-family:monospace;border:1px solid #ccc;border-radius:6px;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Border Radius</h1>
<div id="box"></div>
<div class="row"><label>All Corners</label><input type="range" id="r" min="0" max="100" value="20" oninput="update()"></div>
<textarea id="css" readonly rows="2"></textarea></div>
<script>
  function update(){
    const r = document.getElementById('r').value + '%';
    document.getElementById('box').style.borderRadius = r;
    document.getElementById('css').value = `border-radius: ${r};`;
  }
  window.onload = update;
</script></body></html>

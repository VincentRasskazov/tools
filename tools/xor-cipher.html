<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">XOR Cipher</h1><textarea id="in" placeholder="Text to encrypt/decrypt"></textarea><input type="text" id="key" placeholder="Encryption Key (e.g. secret)"><button onclick="c()">Run XOR Cipher</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ const t=document.getElementById('in').value, k=document.getElementById('key').value; if(!k||!t)return; let r=''; for(let i=0;i<t.length;i++){ r+=String.fromCharCode(t.charCodeAt(i)^k.charCodeAt(i%k.length)); } document.getElementById('out').value=r; }</script>

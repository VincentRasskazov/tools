<body>
  <div class="tool-container">
    <h1>XML to YAML</h1>
<textarea id="in" rows="5" placeholder="<root>\n  <item>Hello</item>\n</root>"></textarea>
<button onclick="c()">Convert to YAML</button>
<textarea id="out" rows="6" readonly style="margin-top:20px;font-family:monospace;"></textarea>
<script>
function xmlToJson(xml) {
  let obj = {};
  if (xml.nodeType == 1) { if (xml.attributes.length > 0) { obj["@attributes"] = {}; for (let j = 0; j < xml.attributes.length; j++) { let attribute = xml.attributes.item(j); obj["@attributes"][attribute.nodeName] = attribute.nodeValue; } } } else if (xml.nodeType == 3) { obj = xml.nodeValue; }
  if (xml.hasChildNodes()) { for (let i = 0; i < xml.childNodes.length; i++) { let item = xml.childNodes.item(i); let nodeName = item.nodeName; if (typeof(obj[nodeName]) == "undefined") { if(nodeName === '#text'){ if(item.nodeValue.trim() !== '') obj = item.nodeValue.trim(); } else { obj[nodeName] = xmlToJson(item); } } else { if (typeof(obj[nodeName].push) == "undefined") { let old = obj[nodeName]; obj[nodeName] = []; obj[nodeName].push(old); } obj[nodeName].push(xmlToJson(item)); } } } return obj;
}
function c(){ try{ const p=new DOMParser(); const doc=p.parseFromString(document.getElementById('in').value, "text/xml"); if(doc.querySelector("parsererror"))throw "Invalid"; document.getElementById('out').value=jsyaml.dump(xmlToJson(doc)); }catch(e){ document.getElementById('out').value="Invalid XML Format"; } }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>word counter Tool</title>
  <meta name="description" content="word counter online tool.">
  <meta name="category" content="Text Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">word counter Tool</h1>
  </div>

  <h1>word counter Tool</h1>

  <p>This is a starter tool page for <strong>word counter</strong>.</p>


  <textarea id="input" placeholder="Enter text here..." rows="6" style="width:100%"></textarea>
  <button onclick="run()">Count</button>

  <p id="output"></p>

  <script>
    function run() {
      const v = document.getElementById('input').value;
      const words = v.trim().split(/\s+/).filter(Boolean).length;
      const chars = v.length;
      document.getElementById('output').innerText = `Words: ${words}\nCharacters: ${chars}`;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

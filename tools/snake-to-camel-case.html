<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Snake to Camel Case</h1><textarea id="in" placeholder="my_variable_name"></textarea><button onclick="c()">Convert to camelCase</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ document.getElementById('out').value=document.getElementById('in').value.replace(/_([a-z])/g, (g)=>g[1].toUpperCase()); }</script>
</body>

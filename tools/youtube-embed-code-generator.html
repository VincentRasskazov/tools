<body>
  <div class="tool-container">
    <h1>YouTube Embed Generator</h1>
<div class="card">
  <label>📺 YouTube URL</label><input type="text" id="url" placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ" oninput="c()">
</div>
<div style="display:flex;flex-wrap:wrap;gap:15px;margin-bottom:20px;">
  <label><input type="checkbox" id="ap" onchange="c()" style="width:auto;"> Autoplay</label>
  <label><input type="checkbox" id="lp" onchange="c()" style="width:auto;"> Loop</label>
  <label><input type="checkbox" id="nc" onchange="c()" style="width:auto;"> Hide Controls</label>
  <label><input type="checkbox" id="pm" onchange="c()" style="width:auto;" checked> Privacy Enhanced</label>
</div>
<textarea id="out" rows="4" readonly style="font-family:monospace;"></textarea>
<script>
function c(){
  const u=document.getElementById('url').value; const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
  if(!m || !m[1])return document.getElementById('out').value="Awaiting valid YouTube URL...";
  const id=m[1]; const dom=document.getElementById('pm').checked?'www.youtube-nocookie.com':'www.youtube.com';
  let q=[]; if(document.getElementById('ap').checked)q.push('autoplay=1'); if(document.getElementById('lp').checked)q.push(`loop=1&playlist=${id}`); if(document.getElementById('nc').checked)q.push('controls=0');
  const qs=q.length?'?'+q.join('&'):'';
  document.getElementById('out').value=`<iframe width="560" height="315" src="https://${dom}/embed/${id}${qs}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
} c();
</script>
  </div>
</body>

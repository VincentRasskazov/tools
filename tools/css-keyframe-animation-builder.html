<body>
  <div class="tool-container">
    <h1>CSS Animation Builder</h1>
<div style="height:150px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:12px;margin-bottom:20px;overflow:hidden;">
  <div id="box" style="width:80px;height:80px;background:var(--primary);border-radius:12px;"></div>
</div>
<div class="row">
  <div><label>Animation</label><select id="anim" onchange="u()"><option value="bounce">Bounce</option><option value="spin">Spin</option><option value="fade">Fade In</option><option value="pulse">Pulse</option></select></div>
  <div><label>Duration (s)</label><input type="number" id="dur" value="2" step="0.5" oninput="u()"></div>
</div>
<textarea id="out" rows="8" readonly style="font-family:monospace;font-size:0.85rem;"></textarea>
<script>
const anims = {
  bounce: `@keyframes customAnim { 0%, 100% {transform: translateY(0);} 50% {transform: translateY(-40px);} }`,
  spin: `@keyframes customAnim { from {transform: rotate(0deg);} to {transform: rotate(360deg);} }`,
  fade: `@keyframes customAnim { from {opacity: 0;} to {opacity: 1;} }`,
  pulse: `@keyframes customAnim { 0% {transform: scale(1);} 50% {transform: scale(1.2);} 100% {transform: scale(1);} }`
};
function u(){
  const a=document.getElementById('anim').value, d=document.getElementById('dur').value;
  const box=document.getElementById('box');
  const style = document.getElementById('dynStyle') || document.createElement('style');
  style.id = 'dynStyle'; style.innerHTML = anims[a]; document.head.appendChild(style);
  box.style.animation = 'none'; setTimeout(()=>{box.style.animation=`customAnim ${d}s ease-in-out infinite`;},10);
  document.getElementById('out').value = `.animated-element {\n  animation: customAnim ${d}s ease-in-out infinite;\n}\n\n${anims[a]}`;
} u();
</script>

<body>
  <div class="tool-container">
    <h1>Quadratic Formula</h1>
<p style="text-align:center;color:#64748b;">ax² + bx + c = 0</p>
<div class="row">
  <div><label>a</label><input type="number" id="a" value="1"></div>
  <div><label>b</label><input type="number" id="b" value="-3"></div>
  <div><label>c</label><input type="number" id="c" value="2"></div>
</div>
<button onclick="calc()">Find Roots (x)</button>
<div id="res" class="res"></div>
<script>function calc(){ const a=parseFloat(document.getElementById('a').value), b=parseFloat(document.getElementById('b').value), c=parseFloat(document.getElementById('c').value); if(a===0)return document.getElementById('res').innerText="'a' cannot be 0"; const d=b*b - 4*a*c; if(d>0){ const x1=(-b+Math.sqrt(d))/(2*a), x2=(-b-Math.sqrt(d))/(2*a); document.getElementById('res').innerHTML=`Two Real Roots:<br><span style="font-size:2rem;color:var(--success)">x₁ = ${x1.toFixed(4).replace(/\.?0+$/,'')}</span><br><span style="font-size:2rem;color:var(--primary)">x₂ = ${x2.toFixed(4).replace(/\.?0+$/,'')}</span>`; } else if(d===0){ const x=-b/(2*a); document.getElementById('res').innerHTML=`One Real Root:<br><span style="font-size:2rem;color:var(--warning)">x = ${x.toFixed(4).replace(/\.?0+$/,'')}</span>`; } else { document.getElementById('res').innerHTML=`<span style="color:var(--danger)">Complex Roots (No real solution)</span>`; } }</script>
  </div>

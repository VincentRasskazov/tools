<body>
  <div class="tool-container">
    <h1>Find the Odd Color</h1>
<div style="text-align:center;font-weight:bold;font-size:1.5rem;margin-bottom:10px;color:var(--primary);" id="lvl">Level: 1</div>
<div id="grid" style="display:grid;gap:5px;width:300px;height:300px;margin:0 auto 20px;"></div>
<script>let lvl=1; function st(){ const size=Math.min(10, Math.floor(lvl/3)+2); const total=size*size; const g=document.getElementById('grid'); g.style.gridTemplateColumns=`repeat(${size}, 1fr)`; g.innerHTML=''; const r=Math.floor(Math.random()*200), gr=Math.floor(Math.random()*200), b=Math.floor(Math.random()*200); const diff=Math.max(5, 50-(lvl*2)); const oddR=r+diff, oddG=gr+diff, oddB=b+diff; const target=Math.floor(Math.random()*total); for(let i=0;i<total;i++){ const d=document.createElement('div'); d.style.borderRadius='8px'; d.style.cursor='pointer'; if(i===target){ d.style.background=`rgb(${oddR},${oddG},${oddB})`; d.onclick=()=>{lvl++;st();}; } else { d.style.background=`rgb(${r},${gr},${b})`; d.onclick=()=>{alert('Game Over! Reached Level: '+lvl);lvl=1;st();}; } g.appendChild(d); } document.getElementById('lvl').innerText='Level: '+lvl; } st();</script>
  </div>

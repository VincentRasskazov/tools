<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="Format, validate, and beautify your JSON data. Readable output for developers.">
  <meta property="og:title" content="JSON Formatter - Beautify JSON Code">
  <meta property="og:description" content="Format, validate, and beautify your JSON data. Readable output for developers.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub">
  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="JSON Formatter - Beautify JSON Code">
  <meta name="twitter:description" content="Format, validate, and beautify your JSON data. Readable output for developers.">
  
  <meta charset="UTF-8">
  <title>JSON Formatter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .tool-container { max-width: 900px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #2563eb; }
    textarea { width: 100%; height: 300px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; font-family: monospace; font-size: 14px; margin-bottom: 20px; resize: vertical; background: #f9fafb; }
    .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
    button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    .clear { background: #ef4444; }
  </style>
</head>
<body>
  <div class="tool-container">
    <h1>JSON Formatter</h1>
    <div class="controls">
      <button onclick="format()">Format / Beautify</button>
      <button onclick="minify()">Minify</button>
      <button class="clear" onclick="document.getElementById('input').value=''">Clear</button>
    </div>
    <textarea id="input" placeholder='Paste your JSON here (e.g. {"name":"John", "age":30})'></textarea>
  </div>
  <script>
    function format() {
      const el = document.getElementById('input');
      try {
        const obj = JSON.parse(el.value);
        el.value = JSON.stringify(obj, null, 4);
      } catch(e) {
        alert("Invalid JSON: " + e.message);
      }
    }
    function minify() {
      const el = document.getElementById('input');
      try {
        const obj = JSON.parse(el.value);
        el.value = JSON.stringify(obj);
      } catch(e) {
        alert("Invalid JSON: " + e.message);
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>json formatter Tool</title>
  <meta name="description" content="json formatter online tool.">
  <meta name="category" content="Developer Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">json formatter Tool</h1>
  </div>

  <h1>json formatter Tool</h1>

  <p>This is a starter tool page for <strong>json formatter</strong>.</p>


  <textarea id="input" placeholder="Paste JSON here" rows="8" style="width:100%"></textarea>
  <button onclick="run()">Format</button>

  <pre id="output"></pre>

  <script>
    function run() {
      const v = document.getElementById('input').value;
      try {
        const obj = JSON.parse(v);
        document.getElementById('output').innerText = JSON.stringify(obj, null, 2);
      } catch (e) {
        document.getElementById('output').innerText = 'Invalid JSON.';
      }
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

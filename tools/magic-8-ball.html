<body><div class="tool-container"><h1 style="color:#2563eb;">Magic 8-Ball</h1><input type="text" id="q" placeholder="Ask a yes or no question..."><button onclick="ask()">Shake the Ball</button><div id="ball">8</div></div>
<script>const a=["It is certain.","Without a doubt.","Yes definitely.","You may rely on it.","As I see it, yes.","Most likely.","Outlook good.","Yes.","Signs point to yes.","Reply hazy, try again.","Ask again later.","Better not tell you now.","Cannot predict now.","Concentrate and ask again.","Don't count on it.","My reply is no.","My sources say no.","Outlook not so good.","Very doubtful."]; function ask(){if(!document.getElementById('q').value)return; const b=document.getElementById('ball'); b.innerText="Shaking..."; setTimeout(()=>{b.innerText=a[Math.floor(Math.random()*a.length)];}, 500);}</script></body></html>

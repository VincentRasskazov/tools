<body>
  <div class="tool-container">
    <h1>HSL to CMYK</h1>
<div class="row">
    <div><label>H (0-360)</label><input type="number" id="h" value="217" min="0" max="360" oninput="c()"></div>
    <div><label>S (%)</label><input type="number" id="s" value="91" min="0" max="100" oninput="c()"></div>
    <div><label>L (%)</label><input type="number" id="l" value="60" min="0" max="100" oninput="c()"></div>
</div>
<div id="box" style="height:100px;border-radius:12px;margin-bottom:20px;border:2px solid var(--border);"></div>
<div id="res" class="res" style="font-family:monospace;"></div>
<script>function c(){ let h=parseFloat(document.getElementById('h').value)||0, s=parseFloat(document.getElementById('s').value)||0, l=parseFloat(document.getElementById('l').value)||0; document.getElementById('box').style.background=`hsl(${h},${s}%,${l}%)`; s/=100; l/=100; const a=s*Math.min(l, 1-l); const f=(n,k=(n+h/30)%12)=>l-a*Math.max(Math.min(k-3, 9-k, 1), -1); let r=f(0), g=f(8), b=f(4); let k=1-Math.max(r,g,b); let cy=(1-r-k)/(1-k)||0, m=(1-g-k)/(1-k)||0, y=(1-b-k)/(1-k)||0; document.getElementById('res').innerText=`cmyk(${Math.round(cy*100)}%, ${Math.round(m*100)}%, ${Math.round(y*100)}%, ${Math.round(k*100)}%)`; } c();</script>

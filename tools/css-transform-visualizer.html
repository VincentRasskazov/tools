  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
.tool-container { max-width: 650px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); border: 1px solid var(--border); }

label { display: block; font-weight: 600; margin-bottom: 8px; color: #475569; font-size: 0.95rem; }

button:active { transform: translateY(0); box-shadow: none; }
.res { margin-top: 25px; padding: 25px; background: var(--bg); border-radius: 12px; text-align: center; font-size: 1.5rem; font-weight: 800; border: 2px dashed var(--border); color: var(--primary); word-break: break-word; }

<body>
  <div class="tool-container">
    <h1>CSS Transforms</h1>
<div style="height:200px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border-radius:12px;margin-bottom:20px;overflow:hidden;"><div id="box" style="width:100px;height:100px;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;border-radius:12px;transition:transform 0.1s;">BOX</div></div>
<div class="row"><div><label>Scale (<span id="vs">1</span>)</label><input type="range" id="sc" min="0.1" max="2" step="0.1" value="1" oninput="u()"></div><div><label>Rotate (<span id="vr">0</span>°)</label><input type="range" id="ro" min="0" max="360" value="0" oninput="u()"></div></div>
<div class="row"><div><label>Translate X</label><input type="range" id="tx" min="-100" max="100" value="0" oninput="u()"></div><div><label>Translate Y</label><input type="range" id="ty" min="-100" max="100" value="0" oninput="u()"></div></div>
<textarea id="out" rows="2" readonly></textarea>
<script>function u(){ const sc=document.getElementById('sc').value, ro=document.getElementById('ro').value, tx=document.getElementById('tx').value, ty=document.getElementById('ty').value; document.getElementById('vs').innerText=sc; document.getElementById('vr').innerText=ro; const css=`scale(${sc}) rotate(${ro}deg) translate(${tx}px, ${ty}px)`; document.getElementById('box').style.transform=css; document.getElementById('out').value=`transform: ${css};`; } u();</script>
  </div>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Word Frequency Counter | Ultimate Tools Hub</title>
  <meta name="description" content="Count word frequency in any text. Free, fast, and beautiful online word frequency counter.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/landing-polish.css">
  <style>
    .freq-container { max-width: 520px; margin: 40px auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px #1976d233; padding: 32px 28px; }
    .freq-title { font-size: 2rem; font-weight: 700; color: #1976d2; margin-bottom: 18px; }
    .freq-desc { color: #555; margin-bottom: 22px; }
    textarea { width: 100%; min-height: 80px; font-size: 1.1rem; border-radius: 8px; border: 1px solid #d1d5db; padding: 12px; margin-bottom: 18px; }
    .result-label { font-weight: 600; color: #283593; margin-bottom: 6px; }
    .result-box { background: #f6f8fa; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 1.1rem; word-break: break-all; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td { text-align: left; padding: 8px 6px; }
    th { color: #1976d2; font-weight: 700; }
    tr:nth-child(even) { background: #f6f8fa; }
    button { background: #1976d2; color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
    button:hover { background: #0d47a1; }
  </style>
</head>
<body>
  <div class="freq-container">
    <div class="freq-title">Word Frequency Counter</div>
    <div class="freq-desc">Paste or type text below to see the frequency of each word.</div>
    <textarea id="freqInput" placeholder="Paste or type text..."></textarea>
    <button onclick="countWords()">Count Words</button>
    <div id="freqResult"></div>
  </div>
  <script>
    function countWords() {
      const text = document.getElementById('freqInput').value;
      const words = text.toLowerCase().match(/\b\w+\b/g);
      if (!words) {
        document.getElementById('freqResult').innerHTML = '<div style="color:#d32f2f;">No words found.</div>';
        return;
      }
      const freq = {};
      words.forEach(w => freq[w] = (freq[w] || 0) + 1);
      let html = '<table><tr><th>Word</th><th>Count</th></tr>';
      Object.entries(freq).sort((a,b) => b[1]-a[1]).forEach(([w, c]) => {
        html += `<tr><td>${w}</td><td>${c}</td></tr>`;
      });
      html += '</table>';
      document.getElementById('freqResult').innerHTML = html;
    }
  </script>
</body>
</html>

<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Probability Calculator</h1>
<label>Probability of Event A (%)</label><input type="number" id="a" placeholder="50">
<label>Probability of Event B (%)</label><input type="number" id="b" placeholder="50">
<button onclick="c()">Calculate Probability</button><div id="res"></div></div>
<script>function c(){ const a=parseFloat(document.getElementById('a').value)/100, b=parseFloat(document.getElementById('b').value)/100; if(a>=0&&b>=0){ const both = a*b*100; const either = (a+b-(a*b))*100; document.getElementById('res').innerHTML = `Both A and B occurring: <strong>${both.toFixed(2)}%</strong><br>Either A or B occurring: <strong>${either.toFixed(2)}%</strong>`; } }</script>

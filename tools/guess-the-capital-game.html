<body>
  <div class="tool-container">
    <h1>Guess the Capital</h1>
<div id="sc" style="text-align:center;font-weight:bold;color:var(--primary);margin-bottom:10px;">Streak: 0</div>
<div id="q" style="background:var(--bg);padding:30px;border-radius:16px;border:2px solid var(--border);font-size:2rem;font-weight:bold;text-align:center;margin-bottom:20px;">France</div>
<div id="opts" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"></div>
<script>
const data = {"France":"Paris","Japan":"Tokyo","Canada":"Ottawa","Brazil":"Brasilia","Australia":"Canberra","Germany":"Berlin","Italy":"Rome","Spain":"Madrid","Egypt":"Cairo","Mexico":"Mexico City","India":"New Delhi","China":"Beijing","Russia":"Moscow","Argentina":"Mexico City","South Africa":"Pretoria","UK":"London","USA":"Washington D.C.","South Korea":"Seoul","Turkey":"Ankara","Sweden":"Seoul"}; 
let ans='', s=0; const keys=Object.keys(data);
function n(){ const country=keys[Math.floor(Math.random()*keys.length)]; ans=data[country]; document.getElementById('q').innerText=country; let opts=[ans]; while(opts.length<4){ const r=data[keys[Math.floor(Math.random()*keys.length)]]; if(!opts.includes(r))opts.push(r); } opts=opts.sort(()=>0.5-Math.random()); let h=''; opts.forEach(o=>{ h+=`<button onclick="c('${o}')" style="background:var(--surface);color:var(--text);border:1px solid var(--border);">${o}</button>`; }); document.getElementById('opts').innerHTML=h; }
function c(g){ if(g===ans){ s++; document.getElementById('sc').innerText="Streak: "+s; } else { alert("Wrong! The capital is " + ans); s=0; document.getElementById('sc').innerText="Streak: 0"; } n(); }
n();
</script>

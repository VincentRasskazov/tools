<body>
  <div class="tool-container">
    <h1>Hex Flashcards</h1>
<div id="sc" style="text-align:center;font-weight:bold;color:var(--success);margin-bottom:10px;">Streak: 0</div>
<div class="card"><div id="q" style="font-size:4rem;font-weight:900;text-align:center;font-family:monospace;letter-spacing:3px;">#FF0000</div></div>
<div class="row" style="flex-wrap:wrap;" id="opts"></div>
<script>
const cols=[{h:'#EF4444',n:'Red'},{h:'#3B82F6',n:'Blue'},{h:'#10B981',n:'Green'},{h:'#F59E0B',n:'Yellow'},{h:'#A855F7',n:'Purple'},{h:'#EC4899',n:'Pink'},{h:'#000000',n:'Black'},{h:'#FFFFFF',n:'White'}];
let ans='', s=0;
function n(){ const c=cols[Math.floor(Math.random()*cols.length)]; ans=c.n; document.getElementById('q').innerText=c.h; let o=[ans]; while(o.length<4){ const r=cols[Math.floor(Math.random()*cols.length)].n; if(!o.includes(r))o.push(r); } o=o.sort(()=>0.5-Math.random()); let h=''; o.forEach(x=>{ h+=`<button onclick="chk('${x}')" style="flex:1;min-width:120px;background:var(--surface);color:var(--text);border:2px solid var(--border);">${x}</button>`; }); document.getElementById('opts').innerHTML=h; }
function chk(g){ if(g===ans){ s++; document.getElementById('sc').innerText="Streak: "+s; } else { alert("Wrong! It was " + ans); s=0; document.getElementById('sc').innerText="Streak: 0"; } n(); }
n();
</script>

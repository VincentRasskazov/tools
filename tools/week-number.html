<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>week number Tool</title>
  <meta name="description" content="week number online tool.">
  <meta name="category" content="Date Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">week number Tool</h1>
  </div>

  <h1>week number Tool</h1>

  <p>This is a starter tool page for <strong>week number</strong>.</p>


  <input id="input" type="date">
  <button onclick="run()">Get Week Number</button>

  <p id="output"></p>

  <script>
    function getWeekNumber(dateStr) {
      const d = new Date(dateStr);
      d.setHours(0,0,0,0);
      d.setDate(d.getDate() + 4 - (d.getDay()||7));
      const yearStart = new Date(d.getFullYear(),0,1);
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
      return weekNo;
    }
    function run() {
      const v = document.getElementById('input').value;
      if (!v) {
        document.getElementById('output').innerText = 'Enter a date.';
        return;
      }
      document.getElementById('output').innerText = 'ISO Week Number: ' + getWeekNumber(v);
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

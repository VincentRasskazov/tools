<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Text Statistics</h1><textarea id="in" oninput="c()" placeholder="Type text here..."></textarea><div class="grid"><div class="box">Characters<div class="val" id="ch">0</div></div><div class="box">Words<div class="val" id="wo">0</div></div><div class="box">Sentences<div class="val" id="se">0</div></div><div class="box">Paragraphs<div class="val" id="pa">0</div></div></div></div>
<script>function c(){ const t=document.getElementById('in').value; document.getElementById('ch').innerText=t.length; document.getElementById('wo').innerText=t.trim()?t.trim().split(/\s+/).length:0; const m=t.match(/[^\.!\?]+[\.!\?]+/g); document.getElementById('se').innerText=m?m.length:(t.trim().length>0?1:0); document.getElementById('pa').innerText=t.trim()?t.replace(/\n$/gm, '').split(/\n/).length:0; }</script>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Percentage Change</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.5rem;text-align:center;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Percentage Change</h1>
<label>Original Value</label><input type="number" id="v1" placeholder="100">
<label>New Value</label><input type="number" id="v2" placeholder="120">
<button onclick="c()">Calculate</button><div id="res"></div></div>
<script>function c(){ const v1=parseFloat(document.getElementById('v1').value), v2=parseFloat(document.getElementById('v2').value); if(v1){ const p = ((v2-v1)/v1)*100; const el = document.getElementById('res'); el.innerText = Math.abs(p).toFixed(2) + "% " + (p>=0?"Increase":"Decrease"); el.style.color = p>=0?"#16a34a":"#dc2626"; } }</script></body></html>

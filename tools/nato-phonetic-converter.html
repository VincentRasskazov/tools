<body>
  <div class="tool-container">
    <h1>NATO Phonetic Converter</h1>
<textarea id="in" rows="4" placeholder="Hello" oninput="c()"></textarea>
<textarea id="out" rows="5" readonly style="margin-top:20px;font-family:monospace;" placeholder="HOTEL ECHO LIMA LIMA OSCAR"></textarea>
<script>const nato={A:"ALPHA",B:"BRAVO",C:"CHARLIE",D:"DELTA",E:"ECHO",F:"FOXTROT",G:"GOLF",H:"HOTEL",I:"INDIA",J:"JULIET",K:"KILO",L:"LIMA",M:"MIKE",N:"NOVEMBER",O:"OSCAR",P:"PAPA",Q:"QUEBEC",R:"ROMEO",S:"SIERRA",T:"TANGO",U:"UNIFORM",V:"VICTOR",W:"WHISKEY",X:"X-RAY",Y:"YANKEE",Z:"ZULU","0":"ZERO","1":"ONE","2":"TWO","3":"THREE","4":"FOUR","5":"FIVE","6":"SIX","7":"SEVEN","8":"EIGHT","9":"NINE"}; function c(){ document.getElementById('out').value=document.getElementById('in').value.toUpperCase().split('').map(c=>nato[c]||c).join(' ').replace(/\s+/g,' '); }</script>

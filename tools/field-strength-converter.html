  <h1>field strength converter Tool</h1>

  <p>This is a starter tool page for <strong>field strength converter</strong>.</p>


  <label for="input">Value:</label>
  <input id="input" type="number" placeholder="Enter value">
  <select id="from">
    <option value="V/m">V/m</option>
    <option value="mV/m">mV/m</option>
    <option value="kV/m">kV/m</option>
    <option value="dBμV/m">dBμV/m</option>
  </select>
  <span>to</span>
  <select id="to">
    <option value="V/m">V/m</option>
    <option value="mV/m">mV/m</option>
    <option value="kV/m">kV/m</option>
    <option value="dBμV/m">dBμV/m</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    function toVpm(value, from) {
      if (from === 'V/m') return value;
      if (from === 'mV/m') return value / 1000;
      if (from === 'kV/m') return value * 1000;
      if (from === 'dBμV/m') return Math.pow(10, (value - 120) / 20);
    }
    function fromVpm(value, to) {
      if (to === 'V/m') return value;
      if (to === 'mV/m') return value * 1000;
      if (to === 'kV/m') return value / 1000;
      if (to === 'dBμV/m') return 20 * Math.log10(value) + 120;
    }
    function run() {
      const value = parseFloat(document.getElementById('input').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (isNaN(value)) {
        document.getElementById('output').innerText = "Please enter a valid value.";
        return;
      }
      const vpm = toVpm(value, from);
      const result = fromVpm(vpm, to);
      document.getElementById('output').innerText = `${value} ${from} = ${result} ${to}`;
    }
  </script>

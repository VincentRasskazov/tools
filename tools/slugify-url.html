  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Slugify URL</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} #res{background:#f8fafc;padding:15px;border:1px solid #e2e8f0;border-radius:6px;color:#2563eb;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">URL Slugify</h1><input type="text" id="in" placeholder="My Awesome Post Title!" oninput="c()"><div id="res">my-awesome-post-title</div></div>
<script>function c(){ document.getElementById('res').innerText = document.getElementById('in').value.toLowerCase().replace(/[^a-z0-9 -]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-'); }</script></body></html>

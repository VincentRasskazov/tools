<body>
  <div class="tool-container">
    <h1>Pro Aim Trainer</h1>
<div class="row" style="margin-bottom:10px;text-align:center;">
  <div style="font-size:1.5rem;font-weight:bold;color:var(--success);">Hits: <span id="h">0</span></div>
  <div style="font-size:1.5rem;font-weight:bold;color:var(--danger);">Misses: <span id="m">0</span></div>
</div>
<div class="card" style="padding:0;overflow:hidden;background:#1e293b;cursor:crosshair;height:350px;" onmousedown="clk(event)">
  <canvas id="cvs" width="600" height="350" style="width:100%;display:block;"></canvas>
</div>
<button id="btn" onclick="st()">Start Training</button>
<script>
const cvs=document.getElementById('cvs'), ctx=cvs.getContext('2d');
let tgts=[], hits=0, miss=0, run=false, frms=0;
function st(){ tgts=[]; hits=0; miss=0; frms=0; run=true; document.getElementById('h').innerText=0; document.getElementById('m').innerText=0; document.getElementById('btn').disabled=true; loop(); }
function clk(e){
  if(!run)return; const r=cvs.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top; let hit=false;
  for(let i=tgts.length-1; i>=0; i--){ if(Math.hypot(x-tgts[i].x, y-tgts[i].y)<tgts[i].r){ hits++; document.getElementById('h').innerText=hits; tgts.splice(i,1); hit=true; break; } }
  if(!hit){ miss++; document.getElementById('m').innerText=miss; checkEnd(); }
}
function checkEnd(){ if(miss>=5){ run=false; document.getElementById('btn').disabled=false; document.getElementById('btn').innerText='Restart'; ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,600,350); ctx.fillStyle='#fff'; ctx.font='30px sans-serif'; ctx.textAlign='center'; ctx.fillText('Game Over! Final Score: '+hits, 300, 175); } }
function loop(){
  if(!run)return; ctx.clearRect(0,0,600,350); frms++;
  if(frms%(Math.max(30, 80-hits))===0) tgts.push({x:50+Math.random()*500, y:50+Math.random()*250, r:40});
  for(let i=tgts.length-1; i>=0; i--){
    tgts[i].r -= 0.3 + (hits*0.01);
    if(tgts[i].r<=0){ tgts.splice(i,1); miss++; document.getElementById('m').innerText=miss; checkEnd(); continue; }
    ctx.beginPath(); ctx.arc(tgts[i].x, tgts[i].y, tgts[i].r, 0, Math.PI*2); ctx.fillStyle='#facc15'; ctx.fill(); ctx.beginPath(); ctx.arc(tgts[i].x, tgts[i].y, tgts[i].r*0.6, 0, Math.PI*2); ctx.fillStyle='#ef4444'; ctx.fill();
  } if(run) requestAnimationFrame(loop);
} ctx.fillStyle='#1e293b'; ctx.fillRect(0,0,600,350);
</script>

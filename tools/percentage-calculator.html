<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>percentage calculator Tool</title>
  <meta name="description" content="percentage calculator online tool.">
  <meta name="category" content="Calculators">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">percentage calculator Tool</h1>
  </div>

  <h1>percentage calculator Tool</h1>

  <p>This is a starter tool page for <strong>percentage calculator</strong>.</p>


  <label for="part">Part:</label>
  <input id="part" type="number" placeholder="e.g. 25">
  <label for="whole">Whole:</label>
  <input id="whole" type="number" placeholder="e.g. 200">
  <button onclick="run()">Calculate Percentage</button>

  <p id="output"></p>

  <script>
    function run() {
      const part = parseFloat(document.getElementById('part').value);
      const whole = parseFloat(document.getElementById('whole').value);
      if (isNaN(part) || isNaN(whole) || whole === 0) {
        document.getElementById('output').innerText = "Please enter valid numbers (whole cannot be zero).";
        return;
      }
      const percent = (part / whole) * 100;
      document.getElementById('output').innerText = `${part} is ${percent.toFixed(2)}% of ${whole}.`;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

  <meta charset="UTF-8"><title>JSON Validator</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:200px;padding:10px;border:1px solid #ccc;border-radius:6px;font-family:monospace;} button{padding:12px 24px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;width:100%;margin-top:10px;} #res{margin-top:20px;padding:15px;border-radius:6px;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">JSON Validator</h1>
<textarea id="in" placeholder='{"key":"value"}'></textarea>
<button onclick="val()">Validate JSON</button>
<div id="res"></div></div>
<script>
  function val(){ 
    const t = document.getElementById('in').value;
    const res = document.getElementById('res');
    if(!t){ res.innerText=""; return; }
    try{ JSON.parse(t); res.innerText="✅ Valid JSON!"; res.style.background="#d1fae5"; res.style.color="#065f46"; }
    catch(e){ res.innerText="❌ Invalid JSON: " + e.message; res.style.background="#fee2e2"; res.style.color="#991b1b"; }
  }
</script></body></html>

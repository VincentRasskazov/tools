  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

.tool-container { max-width: 680px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1), 0 10px 15px -3px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.5); }
h1 { text-align: center; color: var(--primary); margin: 0 0 30px 0; font-size: 2.4rem; font-weight: 800; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(59,130,246,0.1); }

.res { margin-top: 25px; padding: 30px; background: linear-gradient(to right, #f8fafc, #f1f5f9); border-radius: 16px; text-align: center; font-size: 1.5rem; font-weight: 800; border: 2px dashed #cbd5e1; color: var(--primary); word-break: break-word; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }

<body>
  <div class="tool-container">
    <h1>RGB to CMYK</h1>
<div class="row">
  <div class="card"><label>R (0-255)</label><input type="number" id="r" value="59" min="0" max="255" oninput="u()"></div>
  <div class="card"><label>G (0-255)</label><input type="number" id="g" value="130" min="0" max="255" oninput="u()"></div>
  <div class="card"><label>B (0-255)</label><input type="number" id="b" value="246" min="0" max="255" oninput="u()"></div>
</div>
<div class="card" style="text-align:center;">
  <div id="pv" style="width:100px;height:40px;border-radius:8px;background:rgb(59,130,246);border:1px solid var(--border);margin:0 auto 10px;"></div>
  <div id="res" style="font-family:monospace;font-size:1.8rem;font-weight:bold;color:var(--success);">cmyk(76%, 47%, 0%, 4%)</div>
</div>
<script>
function u(){
  let r=parseInt(document.getElementById('r').value)||0, g=parseInt(document.getElementById('g').value)||0, b=parseInt(document.getElementById('b').value)||0;
  document.getElementById('pv').style.background = `rgb(${r}, ${g}, ${b})`;
  let c=1-(r/255), m=1-(g/255), y=1-(b/255);
  let k=Math.min(c,Math.min(m,y));
  if(k===1){ c=0; m=0; y=0; } else { c=(c-k)/(1-k); m=(m-k)/(1-k); y=(y-k)/(1-k); }
  document.getElementById('res').innerText = `cmyk(${Math.round(c*100)}%, ${Math.round(m*100)}%, ${Math.round(y*100)}%, ${Math.round(k*100)}%)`;
}
</script>
  </div>
</body>

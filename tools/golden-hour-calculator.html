  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Golden Hour</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} input{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;} button{width:100%;padding:12px;background:#f59e0b;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-weight:bold;color:#1e293b;}</style></head>
<body><div class="tool-container"><h1 style="color:#f59e0b;">Golden Hour</h1><label>Sunrise Time</label><input type="time" id="sr"><label>Sunset Time</label><input type="time" id="ss"><button onclick="c()">Calculate</button><div id="res"></div></div>
<script>function c(){ const sr=document.getElementById('sr').value, ss=document.getElementById('ss').value; if(sr&&ss) document.getElementById('res').innerHTML=`Morning Golden Hour:<br>${sr} - ${addM(sr,60)}<br><br>Evening Golden Hour:<br>${subM(ss,60)} - ${ss}`; } function addM(t,m){const d=new Date('1/1/2000 '+t); d.setMinutes(d.getMinutes()+m); return d.toTimeString().slice(0,5);} function subM(t,m){const d=new Date('1/1/2000 '+t); d.setMinutes(d.getMinutes()-m); return d.toTimeString().slice(0,5);}</script></body></html>

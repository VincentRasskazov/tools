  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>CAGR Calculator</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:2rem;text-align:center;color:#16a34a;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">CAGR Calculator</h1>
<label>Beginning Value</label><input type="number" id="bv" placeholder="1000">
<label>Ending Value</label><input type="number" id="ev" placeholder="1500">
<label>Number of Years</label><input type="number" id="t" placeholder="5">
<button onclick="c()">Calculate CAGR</button><div id="res"></div></div>
<script>function c(){ const bv=parseFloat(document.getElementById('bv').value), ev=parseFloat(document.getElementById('ev').value), t=parseFloat(document.getElementById('t').value); if(bv&&ev&&t){ const cagr = (Math.pow(ev/bv, 1/t) - 1) * 100; document.getElementById('res').innerText = cagr.toFixed(2) + "%"; } }</script></body></html>

<body>
  <div class="tool-container">
    <h1>CAGR Calculator</h1>
<div class="row">
  <div class="card"><label>Beginning Value ($)</label><input type="number" id="b" value="1000" oninput="c()"></div>
  <div class="card"><label>Ending Value ($)</label><input type="number" id="e" value="2000" oninput="c()"></div>
</div>
<div class="card"><label>Time Period (Years)</label><input type="number" id="t" value="5" oninput="c()"></div>
<div id="res" class="res" style="font-size:4rem;color:var(--primary);">14.87%</div>
<script>
function c(){
  const b=parseFloat(document.getElementById('b').value), e=parseFloat(document.getElementById('e').value), t=parseFloat(document.getElementById('t').value);
  if(b>0 && e>0 && t>0){
    const cagr = (Math.pow(e/b, 1/t) - 1) * 100;
    document.getElementById('res').innerText = cagr.toFixed(2) + '%';
  } else { document.getElementById('res').innerText="?"; }
} c();
</script>

<body>
  <div class="tool-container">
    <h1>Particle Sandbox</h1>
<div class="card" style="padding:0;overflow:hidden;background:#0f172a;cursor:crosshair;height:350px;">
  <canvas id="cvs" width="600" height="350" style="width:100%;display:block;"></canvas>
</div>
<div class="row">
  <div class="card"><label>Particle Count</label><input type="range" id="c" min="20" max="150" value="70" onchange="init()"></div>
  <div class="card"><label>Connection Distance</label><input type="range" id="d" min="50" max="150" value="100"></div>
</div>
<script>
const cvs=document.getElementById('cvs'), ctx=cvs.getContext('2d');
let pts=[], mx=-1000, my=-1000;
function init(){
  pts=[]; const cnt=document.getElementById('c').value;
  for(let i=0;i<cnt;i++) pts.push({x:Math.random()*600, y:Math.random()*350, vx:(Math.random()-0.5)*1.5, vy:(Math.random()-0.5)*1.5, s:Math.random()*2+1});
}
cvs.onmousemove=e=>{const r=cvs.getBoundingClientRect(); mx=e.clientX-r.left; my=e.clientY-r.top;};
cvs.onmouseleave=()=>{mx=-1000;my=-1000;};
function loop(){
  ctx.clearRect(0,0,600,350); const dist=document.getElementById('d').value;
  pts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>600)p.vx*=-1; if(p.y<0||p.y>350)p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,Math.PI*2); ctx.fillStyle='#3b82f6'; ctx.fill();
    pts.forEach(p2=>{
      const d=Math.hypot(p.x-p2.x, p.y-p2.y);
      if(d<dist){ ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p2.x,p2.y); ctx.strokeStyle=`rgba(59,130,246,${1-d/dist})`; ctx.lineWidth=1; ctx.stroke(); }
    });
    const md=Math.hypot(p.x-mx, p.y-my);
    if(md<120){ ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(mx,my); ctx.strokeStyle=`rgba(239,68,68,${1-md/120})`; ctx.lineWidth=1.5; ctx.stroke(); }
  }); requestAnimationFrame(loop);
} init(); loop();
</script>

  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

.tool-container { max-width: 650px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); border: 1px solid var(--border); }

<body>
  <div class="tool-container">
    <h1>Contrast Ratio</h1>
<div class="row"><div><label>Color 1</label><input type="color" id="c1" value="#ffffff" oninput="c()"></div><div><label>Color 2</label><input type="color" id="c2" value="#3b82f6" oninput="c()"></div></div>
<div id="res" class="res" style="font-size:3rem;">1:1</div>
<script>function lum(hex){ let rgb=hex.replace('#','').match(/.{2}/g).map(x=>parseInt(x,16)/255); rgb=rgb.map(c=>c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4)); return 0.2126*rgb[0] + 0.7152*rgb[1] + 0.0722*rgb[2]; } function c(){ const l1=lum(document.getElementById('c1').value), l2=lum(document.getElementById('c2').value); const r=(Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05); document.getElementById('res').innerHTML=`<span style="color:${r>=4.5?'var(--success)':'var(--danger)'}">${r.toFixed(2)} : 1</span>`; } c();</script>
  </div>

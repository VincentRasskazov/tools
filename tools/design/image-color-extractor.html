<body>
  <div class="tool-container">
    <h1>Image Color Extractor</h1>
<input type="file" id="f" accept="image/*" style="margin-bottom:20px;padding:10px;background:var(--surface);">
<div class="row" style="align-items:center;margin-bottom:20px;">
  <div id="pv" class="card" style="height:60px;width:60px;margin:0;padding:0;background:#e2e8f0;"></div>
  <div id="res" style="font-size:2rem;font-family:monospace;font-weight:bold;color:var(--text);">#FFFFFF</div>
</div>
<div class="card" style="padding:0;overflow:hidden;background:#f8fafc;cursor:crosshair;">
  <canvas id="cvs" style="width:100%;display:none;"></canvas>
</div>
<script>
const cvs=document.getElementById('cvs'), ctx=cvs.getContext('2d'); let img=new Image();
document.getElementById('f').onchange=e=>{
  const file=e.target.files[0]; if(!file)return;
  const r=new FileReader(); r.onload=ev=>{ img.src=ev.target.result; img.onload=()=>{ cvs.width=img.width; cvs.height=img.height; ctx.drawImage(img,0,0); cvs.style.display='block'; }; }; r.readAsDataURL(file);
};
cvs.onmousemove=e=>{
  const rect=cvs.getBoundingClientRect(); const x=Math.floor((e.clientX-rect.left)*(cvs.width/rect.width)), y=Math.floor((e.clientY-rect.top)*(cvs.height/rect.height));
  const p=ctx.getImageData(x,y,1,1).data;
  const hex='#'+[p[0],p[1],p[2]].map(x=>x.toString(16).padStart(2,'0').toUpperCase()).join('');
  document.getElementById('pv').style.background=hex; document.getElementById('res').innerText=hex;
};
</script>

<body>
  <div class="tool-container">
    <h1>Isometric Grid Pattern</h1>
<div id="box" style="height:250px;border-radius:16px;margin-bottom:20px;border:1px solid var(--border);background-color:#ffffff;background-image:linear-gradient(30deg, #cbd5e1 1px, transparent 1px), linear-gradient(150deg, #cbd5e1 1px, transparent 1px);background-size:40px 23px;"></div>
<div class="row">
  <div class="card"><label>Grid Color</label><input type="color" id="c" value="#cbd5e1" oninput="u()"></div>
  <div class="card"><label>Size (px)</label><input type="range" id="s" min="20" max="80" value="40" oninput="u()"></div>
</div>
<textarea id="out" rows="4" readonly style="font-family:monospace;font-size:0.85rem;"></textarea>
<script>
function u(){
  const c=document.getElementById('c').value, s=parseInt(document.getElementById('s').value); const h=Math.round(s*0.577);
  const css=`background-color: #ffffff;\nbackground-image: linear-gradient(30deg, ${c} 1px, transparent 1px), linear-gradient(150deg, ${c} 1px, transparent 1px);\nbackground-size: ${s}px ${h}px;`;
  document.getElementById('box').style.cssText=`height:250px;border-radius:16px;margin-bottom:20px;border:1px solid var(--border); ${css.replace(/\n/g,' ')}`;
  document.getElementById('out').value=css;
} u();
</script>

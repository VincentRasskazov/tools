<body>
  <div class="tool-container">

  <h1>color picker Tool</h1>

  <p>This is a starter tool page for <strong>color picker</strong>.</p>


  <label for="input">Pick a color:</label>
  <input id="input" type="color" value="#ff0000" onchange="run()">
  <span id="output">#ff0000</span>

  <script>
    function run() {
      const v = document.getElementById('input').value;
      document.getElementById('output').innerText = v;
    }
    // Initialize output
    run();
  </script>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">clipboard viewer Tool</h1>
  </div>

  <h1>clipboard viewer Tool</h1>

  <p>This is a starter tool page for <strong>clipboard viewer</strong>.</p>


  <button onclick="run()">Show Clipboard Text</button>

  <p id="output"></p>

  <script>
    async function run() {
      if (navigator.clipboard && navigator.clipboard.readText) {
        try {
          const text = await navigator.clipboard.readText();
          document.getElementById('output').innerText = text ? text : '(Clipboard is empty)';
        } catch (e) {
          document.getElementById('output').innerText = 'Clipboard access denied.';
        }
      } else {
        document.getElementById('output').innerText = 'Clipboard API not supported.';
      }
    }
  </script>

  </div>
</body>

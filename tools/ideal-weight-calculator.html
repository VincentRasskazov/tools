<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>ideal weight calculator Tool</title>
  <meta name="description" content="ideal weight calculator online tool.">
  <meta name="category" content="Health Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">ideal weight calculator Tool</h1>
  </div>

  <h1>ideal weight calculator Tool</h1>

  <p>This is a starter tool page for <strong>ideal weight calculator</strong>.</p>


  <label for="height">Height (cm):</label>
  <input id="height" type="number" placeholder="e.g. 170">
  <label for="gender">Gender:</label>
  <select id="gender">
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>
  <button onclick="run()">Calculate Ideal Weight</button>

  <p id="output"></p>

  <script>
    function run() {
      const height = parseFloat(document.getElementById('height').value);
      const gender = document.getElementById('gender').value;
      if (isNaN(height) || height <= 0) {
        document.getElementById('output').innerText = "Please enter a valid height.";
        return;
      }
      let ideal;
      if (gender === 'male') {
        ideal = 50 + 2.3 * ((height / 2.54) - 60);
      } else {
        ideal = 45.5 + 2.3 * ((height / 2.54) - 60);
      }
      document.getElementById('output').innerText = `Ideal weight: ${ideal.toFixed(2)} kg`;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

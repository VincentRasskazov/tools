<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>age in minutes Tool</title>
  <meta name="description" content="age in minutes online tool.">
  <meta name="category" content="Date Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">age in minutes Tool</h1>
  </div>

  <h1>age in minutes Tool</h1>

  <p>This is a starter tool page for <strong>age in minutes</strong>.</p>


  <label for="dob">Enter your date of birth:</label>
  <input id="dob" type="date" placeholder="YYYY-MM-DD">
  <button onclick="run()">Calculate Minutes</button>

  <p id="output"></p>

  <script>
    function run() {
      const dob = document.getElementById('dob').value;
      if (!dob) {
        document.getElementById('output').innerText = "Please enter your date of birth.";
        return;
      }
      const birthDate = new Date(dob);
      const now = new Date();
      const diffMs = now - birthDate;
      if (diffMs < 0) {
        document.getElementById('output').innerText = "Date of birth cannot be in the future.";
        return;
      }
      const diffMinutes = Math.floor(diffMs / 60000);
      document.getElementById('output').innerText = `You are ${diffMinutes.toLocaleString()} minutes old.`;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

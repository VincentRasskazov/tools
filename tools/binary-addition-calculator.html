  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Binary Addition</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;font-family:monospace;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.5rem;font-weight:bold;color:#16a34a;text-align:center;font-family:monospace;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Binary Addition</h1><input type="text" id="a" placeholder="1010"> + <input type="text" id="b" placeholder="0101"><button onclick="c()">Calculate</button><div id="res"></div></div>

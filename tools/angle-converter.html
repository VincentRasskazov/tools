<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>angle converter Tool</title>
  <meta name="description" content="angle converter online tool.">
  <meta name="category" content="Converters">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">angle converter Tool</h1>
  </div>

  <h1>angle converter Tool</h1>

  <p>This is a starter tool page for <strong>angle converter</strong>.</p>


  <label for="angle">Angle:</label>
  <input id="angle" type="number" placeholder="Enter value">
  <select id="direction">
    <option value="deg2rad">Degrees to Radians</option>
    <option value="rad2deg">Radians to Degrees</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    function run() {
      const angle = parseFloat(document.getElementById('angle').value);
      const dir = document.getElementById('direction').value;
      if (isNaN(angle)) {
        document.getElementById('output').innerText = "Please enter a valid angle.";
        return;
      }
      let result;
      if (dir === 'deg2rad') {
        result = (angle * Math.PI / 180).toFixed(6) + ' radians';
      } else {
        result = (angle * 180 / Math.PI).toFixed(6) + ' degrees';
      }
      document.getElementById('output').innerText = result;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

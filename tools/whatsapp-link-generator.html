  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>WhatsApp Link Generator</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#16a34a;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #out{margin-top:20px;padding:15px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;font-family:monospace;word-break:break-all;color:#166534;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#16a34a;">WhatsApp Link Generator</h1>
<label>Phone Number (with Country Code, no +)</label><input type="text" id="p" placeholder="1234567890">
<label>Pre-filled Message</label><textarea id="m" placeholder="I am interested in your product!" rows="3"></textarea>
<button onclick="c()">Generate Link</button>
<div id="out">Link will appear here...</div></div>
<script>function c(){ const p=document.getElementById('p').value.replace(/[^0-9]/g,''), m=document.getElementById('m').value; if(p) document.getElementById('out').innerText=`https://wa.me/${p}?text=${encodeURIComponent(m)}`; }</script></body></html>

  <style>

<body>
  <div class="tool-container">
    <h1>Stopwatch Timer</h1>
<div class="card" style="text-align:center;padding:40px;">
  <div id="tm" style="font-size:5rem;font-weight:900;color:var(--text);font-family:monospace;line-height:1;">00:00.00</div>
</div>
<div class="row">
  <button id="bS" onclick="st()" style="background:var(--success);">Start</button>
  <button id="bL" onclick="lap()" style="background:var(--primary);" disabled>Lap</button>
  <button onclick="rs()" style="background:var(--danger);">Reset</button>
</div>
<div id="laps" class="card" style="display:none;max-height:200px;overflow-y:auto;text-align:left;font-family:monospace;font-size:1.2rem;line-height:1.8;"></div>
<script>
let t0, t=0, int, run=false, lapCnt=0;
function fmt(ms){ const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), cs=Math.floor((ms%1000)/10); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`; }
function u(){ document.getElementById('tm').innerText=fmt(t + (run ? Date.now()-t0 : 0)); }
function st(){ if(run){run=false; clearInterval(int); t+=Date.now()-t0; document.getElementById('bS').innerText='Resume'; document.getElementById('bS').style.background='var(--success)'; document.getElementById('bL').disabled=true;} else {run=true; t0=Date.now(); int=setInterval(u,10); document.getElementById('bS').innerText='Stop'; document.getElementById('bS').style.background='var(--warning)'; document.getElementById('bL').disabled=false;} }
function rs(){ run=false; clearInterval(int); t=0; u(); document.getElementById('bS').innerText='Start'; document.getElementById('bS').style.background='var(--success)'; document.getElementById('bL').disabled=true; lapCnt=0; document.getElementById('laps').innerHTML=''; document.getElementById('laps').style.display='none'; }
function lap(){ lapCnt++; const l=document.getElementById('laps'); l.style.display='block'; l.innerHTML=`<strong>Lap ${lapCnt}:</strong> ${fmt(t + (Date.now()-t0))}<br>` + l.innerHTML; }
</script>
  </div>

  </a>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>XML Validator</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:200px;padding:10px;border:1px solid #ccc;border-radius:6px;font-family:monospace;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin-top:15px;} #res{margin-top:20px;padding:15px;border-radius:6px;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">XML Validator</h1><textarea id="in" placeholder="<root><item>Data</item></root>"></textarea><button onclick="c()">Validate XML</button><div id="res"></div></div>
<script>function c(){ const r=document.getElementById('res'); const parser = new DOMParser(); const doc = parser.parseFromString(document.getElementById('in').value, "text/xml"); const err = doc.getElementsByTagName("parsererror"); if(err.length > 0){ r.innerText="❌ Invalid XML: " + err[0].textContent; r.style.background="#fee2e2"; r.style.color="#991b1b"; }else{ r.innerText="✅ Valid XML!"; r.style.background="#d1fae5"; r.style.color="#065f46"; } }</script></body></html>

<body>
  <h1>Text to Fullwidth</h1>
  <p>Convert your normal text into stylish fullwidth Unicode text. Copy and paste it anywhere!</p>
  <textarea id="input" placeholder="Enter your text here..."></textarea>
  <br>
  <button onclick="toFullwidth()">Convert to Fullwidth</button>
  <button onclick="copyOutput()">Copy Output</button>
  <div id="output" aria-live="polite"></div>
  <script>
    function toFullwidth() {
      const input = document.getElementById('input').value;
      let fullwidth = '';
      for (let i = 0; i < input.length; i++) {
        const c = input.charCodeAt(i);
        if (c >= 33 && c <= 126) {
          fullwidth += String.fromCharCode(c + 0xFF00 - 0x20);
        } else if (c === 32) {
          fullwidth += '\u3000';
        } else {
          fullwidth += input[i];
        }
      }
      document.getElementById('output').innerText = fullwidth;
    }
    function copyOutput() {
      const output = document.getElementById('output').innerText;
      if (output) {
        navigator.clipboard.writeText(output);
        alert('Fullwidth text copied to clipboard!');
      }
    }
  </script>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>AES Decryption</title><script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea,input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">AES Decryption</h1><textarea id="msg" placeholder="U2FsdGVkX1..."></textarea><input type="password" id="key" placeholder="Secret Passphrase"><button onclick="c()">Decrypt Text</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ try { const m=document.getElementById('msg').value, k=document.getElementById('key').value; const bytes = CryptoJS.AES.decrypt(m, k); const raw = bytes.toString(CryptoJS.enc.Utf8); document.getElementById('out').value = raw || "Incorrect Passphrase"; } catch(e){ document.getElementById('out').value = "Decryption Failed"; } }</script></body></html>

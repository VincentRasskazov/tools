<body>
  <div class="tool-container">
    <div class="tool-header">
      <a class="tool-back" href="../index.html">← Back</a>
      <h1 class="tool-title">Text to Upside Down</h1>
    </div>
    <p>Flip any text upside down for fun, social media, or creative uses!</p>
    <textarea id="input" placeholder="Type or paste text..."></textarea>
    <button onclick="toUpsideDown()">Flip</button>
    <pre id="output"></pre>
    <script>
      function toUpsideDown() {
        const map = {
          a:'ɐ',b:'q',c:'ɔ',d:'p',e:'ǝ',f:'ɟ',g:'ƃ',h:'ɥ',i:'ᴉ',j:'ɾ',k:'ʞ',l:'ʃ',m:'ɯ',n:'u',o:'o',p:'d',q:'b',r:'ɹ',s:'s',t:'ʇ',u:'n',v:'ʌ',w:'ʍ',x:'x',y:'ʎ',z:'z',
          A:'∀',B:'𐐒',C:'Ɔ',D:'p',E:'Ǝ',F:'Ⅎ',G:'פ',H:'H',I:'I',J:'ſ',K:'ʞ',L:'˥',M:'W',N:'N',O:'O',P:'Ԁ',Q:'Q',R:'ɹ',S:'S',T:'┴',U:'∩',V:'Λ',W:'M',X:'X',Y:'⅄',Z:'Z',
          '0':'0','1':'Ɩ','2':'ᄅ','3':'Ɛ','4':'ㄣ','5':'ϛ','6':'9','7':'ㄥ','8':'8','9':'6',
          '.':'˙',',':'‘','!':'¡','?':'¿','"':'„','\\':'/','/':'\\','_':'‾','(':' )',')':'(','[':']',']':'[','{':'}','}':'{','<':'>','>':'<','&':'⅋',' ':' '
        };
        const input = document.getElementById('input').value;
        const flipped = input.split('').map(c => map[c] || c).reverse().join('');
        document.getElementById('output').innerText = flipped;
      }
    </script>

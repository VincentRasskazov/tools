<body>
  <div class="tool-container">
    <h1>Logic Picture Puzzle</h1>
<div style="display:flex;justify-content:center;margin-bottom:20px;">
  <div style="display:flex;flex-direction:column;">
    <div style="display:flex;">
      <div style="width:60px;height:60px;"></div>
      <div id="topH" style="display:flex;"></div>
    </div>
    <div style="display:flex;">
      <div id="leftH" style="display:flex;flex-direction:column;text-align:right;padding-right:10px;justify-content:space-around;font-weight:bold;color:#64748b;"></div>
      <div id="grid" style="display:grid;grid-template-columns:repeat(5, 40px);gap:2px;background:var(--border);padding:2px;border-radius:4px;"></div>
    </div>
  </div>
</div>
<button onclick="st()">Generate New Puzzle</button>
<script>
let tgt=[], b=[], run=true;
function genH(arr){ let res=[], c=0; arr.forEach(v=>{if(v){c++;}else if(c>0){res.push(c);c=0;}}); if(c>0)res.push(c); return res.length?res.join('<br>'):'0'; }
function st(){
  tgt=Array(25).fill(0).map(()=>Math.random()>0.4?1:0); b=Array(25).fill(0); run=true;
  const th=document.getElementById('topH'); th.innerHTML='';
  for(let x=0;x<5;x++){ const col=[tgt[x],tgt[x+5],tgt[x+10],tgt[x+15],tgt[x+20]]; th.innerHTML+=`<div style="width:40px;text-align:center;font-weight:bold;color:#64748b;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:5px;">${genH(col)}</div>`; }
  const lh=document.getElementById('leftH'); lh.innerHTML='';
  for(let y=0;y<5;y++){ const row=tgt.slice(y*5, y*5+5); lh.innerHTML+=`<div style="height:40px;display:flex;align-items:center;justify-content:flex-end;">${genH(row).replace(/<br>/g,' ')}</div>`; }
  drw();
}
function drw(){
  const g=document.getElementById('grid'); g.innerHTML='';
  b.forEach((v,i)=>g.innerHTML+=`<div style="width:40px;height:40px;background:${v?'var(--primary)':'#fff'};cursor:pointer;transition:0.1s;" onclick="clk(${i})"></div>`);
  if(run && b.every((v,i)=>v===tgt[i])){ run=false; setTimeout(()=>alert("Puzzle Solved! You revealed the picture."), 100); }
}
function clk(i){ if(run){ b[i]=b[i]?0:1; drw(); } } st();
</script>

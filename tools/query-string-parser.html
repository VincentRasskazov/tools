<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Query String Parser</h1><input type="text" id="in" placeholder="?utm_source=google&utm_medium=cpc&campaign=spring"><button onclick="c()">Parse Query Parameters</button><textarea id="out" readonly style="margin-top:20px;height:200px;"></textarea></div>
<script>function c(){ try { let q = document.getElementById('in').value; if(q.includes('?')) q = q.split('?')[1]; const p = new URLSearchParams(q); let res = {}; for(const [k, v] of p.entries()) { res[k] = v; } document.getElementById('out').value = JSON.stringify(res, null, 2); } catch(e) { document.getElementById('out').value = "Error parsing string."; } }</script></body></html>

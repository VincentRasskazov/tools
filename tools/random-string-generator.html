<body>
  <div class="tool-container">
    <div class="tool-header">
      <a class="tool-back" href="../index.html">← Back</a>
      <h1 class="tool-title">Random String Generator</h1>
    </div>
    <p>Generate a secure random string for passwords, tokens, or any use case.</p>
    <label for="length">Length:</label>
    <input id="length" type="number" min="1" max="256" value="16">
    <button onclick="generate()">Generate</button>
    <p id="output"></p>
    <script>
      function generate() {
        const len = parseInt(document.getElementById('length').value, 10);
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?';
        let result = '';
        for (let i = 0; i < len; i++) {
          result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        document.getElementById('output').innerText = result;
      }
    </script>

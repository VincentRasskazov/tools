<body>
<div class="tool-container"><h1 style="color:#2563eb;">Password Entropy</h1><input type="text" id="in" placeholder="Type password..." oninput="c()"><div id="res">0 bits</div></div>
<script>function c(){ const p=document.getElementById('in').value; let pool=0; if(/[a-z]/.test(p))pool+=26; if(/[A-Z]/.test(p))pool+=26; if(/[0-9]/.test(p))pool+=10; if(/[^a-zA-Z0-9]/.test(p))pool+=32; const e = Math.log2(Math.pow(pool, p.length)); document.getElementById('res').innerText = Math.round(e) + " bits"; }</script>
</body>

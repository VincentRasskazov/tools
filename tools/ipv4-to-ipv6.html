  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>IPv4 to IPv6</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} input{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;margin-bottom:20px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;} #res{margin-top:20px;font-size:1.5rem;font-family:monospace;background:#f8fafc;padding:20px;border-radius:6px;word-break:break-all;border:1px solid #ccc;}</style></head>
<body><div class="tool-container"><h1 style="color:#2563eb;">IPv4 to IPv6 Mapped</h1><input type="text" id="in" placeholder="192.168.1.1"><button onclick="c()">Convert</button><div id="res">...</div></div>
<script>function c(){ const v = document.getElementById('in').value.trim().split('.'); if(v.length!==4) return document.getElementById('res').innerText="Invalid IPv4"; const hex = v.map(n => parseInt(n).toString(16).padStart(2,'0')); document.getElementById('res').innerText = `::ffff:${hex[0]}${hex[1]}:${hex[2]}${hex[3]}`; }</script></body></html>

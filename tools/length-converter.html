<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>length converter Tool</title>
  <meta name="description" content="length converter online tool.">
  <meta name="category" content="Converters">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">length converter Tool</h1>
  </div>

  <h1>length converter Tool</h1>

  <p>This is a starter tool page for <strong>length converter</strong>.</p>


  <input id="value" type="number" placeholder="Enter value" style="width:120px;">
  <select id="from">
    <option value="m">Meters</option>
    <option value="cm">Centimeters</option>
    <option value="mm">Millimeters</option>
    <option value="km">Kilometers</option>
    <option value="in">Inches</option>
    <option value="ft">Feet</option>
    <option value="yd">Yards</option>
    <option value="mi">Miles</option>
  </select>
  to
  <select id="to">
    <option value="m">Meters</option>
    <option value="cm">Centimeters</option>
    <option value="mm">Millimeters</option>
    <option value="km">Kilometers</option>
    <option value="in">Inches</option>
    <option value="ft">Feet</option>
    <option value="yd">Yards</option>
    <option value="mi">Miles</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    const factors = {
      m: 1,
      cm: 0.01,
      mm: 0.001,
      km: 1000,
      in: 0.0254,
      ft: 0.3048,
      yd: 0.9144,
      mi: 1609.344
    };
    function run() {
      const value = parseFloat(document.getElementById('value').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (isNaN(value)) {
        document.getElementById('output').innerText = 'Enter a valid number.';
        return;
      }
      const meters = value * factors[from];
      const result = meters / factors[to];
      document.getElementById('output').innerText = value + ' ' + from + ' = ' + result + ' ' + to;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

  <style>
.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .row{display:flex;gap:10px;align-items:center;margin-bottom:15px;} input{width:60px;padding:10px;border:1px solid #ccc;border-radius:6px;text-align:center;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-weight:bold;color:#16a34a;text-align:center;}
  </style>

<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Quadratic Solver</h1><div class="row"><input type="number" id="a" placeholder="a"> x² + <input type="number" id="b" placeholder="b"> x + <input type="number" id="c" placeholder="c"> = 0</div><button onclick="c()">Solve</button><div id="res"></div></div>
<script>function c(){ const a=parseFloat(document.getElementById('a').value), b=parseFloat(document.getElementById('b').value), c=parseFloat(document.getElementById('c').value); const d=b*b - 4*a*c; if(d>0){ const r1=(-b+Math.sqrt(d))/(2*a); const r2=(-b-Math.sqrt(d))/(2*a); document.getElementById('res').innerHTML=`Roots: ${r1.toFixed(2)}, ${r2.toFixed(2)}`; } else if(d===0){ document.getElementById('res').innerText=`Root: ${(-b/(2*a)).toFixed(2)}`; } else { document.getElementById('res').innerText="No real roots (Complex)"; } }</script>
</body>

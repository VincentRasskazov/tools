<body>
  <div class="tool-container">
    <h1>Length Converter</h1>
<div class="row"><div><input type="number" id="m" oninput="u('m')"><label>Meters</label></div><div><input type="number" id="km" oninput="u('km')"><label>Kilometers</label></div></div>
<div class="row"><div><input type="number" id="mi" oninput="u('mi')"><label>Miles</label></div><div><input type="number" id="ft" oninput="u('ft')"><label>Feet</label></div></div>
<script>function u(id){ const v=parseFloat(document.getElementById(id).value); if(isNaN(v))return; const m = id==='m'?v : id==='km'?v*1000 : id==='mi'?v*1609.34 : v*0.3048; document.getElementById('m').value=id==='m'?v:(m).toFixed(4); document.getElementById('km').value=id==='km'?v:(m/1000).toFixed(4); document.getElementById('mi').value=id==='mi'?v:(m/1609.34).toFixed(4); document.getElementById('ft').value=id==='ft'?v:(m/0.3048).toFixed(4); }</script>

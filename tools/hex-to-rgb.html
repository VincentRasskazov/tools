<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>hex to rgb Tool</title>
  <meta name="description" content="hex to rgb online tool.">
  <meta name="category" content="Color Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">hex to rgb Tool</h1>
  </div>

  <h1>hex to rgb Tool</h1>

  <p>This is a starter tool page for <strong>hex to rgb</strong>.</p>


  <label for="input">Hex:</label>
  <input id="input" placeholder="#RRGGBB or RRGGBB">
  <button onclick="run()">Convert to RGB</button>

  <p id="output"></p>

  <script>
    function run() {
      let v = document.getElementById('input').value.trim().replace(/^#/, '');
      if (!/^[0-9a-fA-F]{6}$/.test(v)) {
        document.getElementById('output').innerText = "Please enter a valid 6-digit hex color.";
        return;
      }
      const r = parseInt(v.substr(0,2),16);
      const g = parseInt(v.substr(2,2),16);
      const b = parseInt(v.substr(4,2),16);
      document.getElementById('output').innerText = `rgb(${r}, ${g}, ${b})`;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

<body>
  <div class="tool-container">
    <h1>Hexagon Simon</h1>
<div id="sc" style="text-align:center;font-weight:bold;color:var(--primary);margin-bottom:10px;">Score: 0</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:15px;max-width:350px;margin:0 auto 20px;">
  <div id="b0" class="grid-cell" style="height:80px;background:#ef4444;opacity:0.4;" onclick="clk(0)"></div>
  <div id="b1" class="grid-cell" style="height:80px;background:#3b82f6;opacity:0.4;" onclick="clk(1)"></div>
  <div id="b2" class="grid-cell" style="height:80px;background:#10b981;opacity:0.4;" onclick="clk(2)"></div>
  <div id="b3" class="grid-cell" style="height:80px;background:#f59e0b;opacity:0.4;" onclick="clk(3)"></div>
  <div id="b4" class="grid-cell" style="height:80px;background:#8b5cf6;opacity:0.4;" onclick="clk(4)"></div>
  <div id="b5" class="grid-cell" style="height:80px;background:#ec4899;opacity:0.4;" onclick="clk(5)"></div>
</div>
<button onclick="st()" id="btn">Start Sequence</button>
<script>
let seq=[], usr=[], run=false;
function st(){ seq=[]; usr=[]; document.getElementById('sc').innerText="Score: 0"; document.getElementById('btn').style.display='none'; nxt(); }
function nxt(){ usr=[]; seq.push(Math.floor(Math.random()*6)); run=false; let i=0; const int=setInterval(()=>{ if(i>=seq.length){clearInterval(int);run=true;return;} flash(seq[i]); i++; }, 700); }
function flash(i){ const b=document.getElementById('b'+i); b.style.opacity=1; setTimeout(()=>{b.style.opacity=0.4;}, 300); }
function clk(i){ if(!run)return; flash(i); usr.push(i); if(usr[usr.length-1]!==seq[usr.length-1]){ run=false; alert("Wrong! Final Score: "+(seq.length-1)); document.getElementById('btn').style.display='block'; return; } if(usr.length===seq.length){ run=false; document.getElementById('sc').innerText="Score: "+seq.length; setTimeout(nxt, 1000); } }
</script>
  </div>
</body>

<body>
  <h1>Text to Strike Double</h1>
  <p>Convert your normal text into double strikethrough Unicode text. Copy and paste it anywhere!</p>
  <textarea id="input" placeholder="Enter your text here..."></textarea>
  <br>
  <button onclick="toStrikeDouble()">Convert to Double Strikethrough</button>
  <button onclick="copyOutput()">Copy Output</button>
  <div id="output" aria-live="polite"></div>
  <script>
    function toStrikeDouble() {
      const input = document.getElementById('input').value;
      // Unicode double strikethrough: U+033F (combining double overline)
      const doubleStrike = input.split('').map(c => c + '\u033F').join('');
      document.getElementById('output').innerText = doubleStrike;
    }
    function copyOutput() {
      const output = document.getElementById('output').innerText;
      if (output) {
        navigator.clipboard.writeText(output);
        alert('Double strikethrough text copied to clipboard!');
      }
    }
  </script>

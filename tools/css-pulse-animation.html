<body>
  <div class="tool-container">
    <h1>CSS Pulse Animation</h1>
<div style="height:200px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:12px;margin-bottom:20px;">
  <div id="box" style="width:60px;height:60px;background:var(--danger);border-radius:50%;box-shadow:0 0 0 0 rgba(239,68,68,0.7);"></div>
</div>
<div class="row">
  <div><label>Duration (s)</label><input type="number" id="dur" value="1.5" step="0.1" oninput="u()"></div>
  <div><label>Scale Factor</label><input type="number" id="sc" value="1.2" step="0.1" oninput="u()"></div>
</div>
<textarea id="out" rows="8" readonly style="font-family:monospace;font-size:0.85rem;"></textarea>
<script>function u(){ const dur=document.getElementById('dur').value, sc=document.getElementById('sc').value; const kf=`@keyframes pulse {\n  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0.7); }\n  70% { transform: scale(${sc}); box-shadow: 0 0 0 20px rgba(239,68,68,0); }\n  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0); }\n}`; document.getElementById('out').value=`.pulse-element {\n  animation: pulse ${dur}s infinite;\n}\n\n${kf}`; const style=document.getElementById('dynP')||document.createElement('style'); style.id='dynP'; style.innerHTML=kf; document.head.appendChild(style); document.getElementById('box').style.animation='none'; setTimeout(()=>{document.getElementById('box').style.animation=`pulse ${dur}s infinite`;},10); } u();</script>
  </div>

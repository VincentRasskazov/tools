<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Array to HTML List</h1><textarea id="in" placeholder='["Apple", "Banana", "Cherry"]'></textarea><button onclick="c()">Convert to HTML &lt;ul&gt;</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ try{ const a = JSON.parse(document.getElementById('in').value); if(!Array.isArray(a)) throw new Error(); let h="<ul>\n"; a.forEach(i=>h+=`  <li>${i}</li>\n`); h+="</ul>"; document.getElementById('out').value=h; }catch(e){document.getElementById('out').value="Invalid JSON Array";} }</script>

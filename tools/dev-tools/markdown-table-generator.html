<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">MD Table Generator</h1>
<div class="row"><div><label>Columns</label><input type="number" id="c" value="3"></div><div><label>Rows</label><input type="number" id="r" value="3"></div></div><button onclick="gen()">Generate Code</button><textarea id="out" readonly></textarea></div>
<script>function gen(){ const c=parseInt(document.getElementById('c').value), r=parseInt(document.getElementById('r').value); let t="|"; for(let i=1;i<=c;i++)t+=` Header ${i} |`; t+="\n|"; for(let i=1;i<=c;i++)t+="---|"; t+="\n"; for(let i=1;i<=r;i++){ t+="|"; for(let j=1;j<=c;j++)t+=` Row ${i} Col ${j} |`; t+="\n"; } document.getElementById('out').value = t; } window.onload=gen;</script>

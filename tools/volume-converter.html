<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>volume converter Tool</title>
  <meta name="description" content="volume converter online tool.">
  <meta name="category" content="Converters">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">volume converter Tool</h1>
  </div>

  <h1>volume converter Tool</h1>

  <p>This is a starter tool page for <strong>volume converter</strong>.</p>


  <input id="value" type="number" placeholder="Enter value" style="width:120px;">
  <select id="from">
    <option value="l">Liter (L)</option>
    <option value="ml">Milliliter (mL)</option>
    <option value="m3">Cubic Meter (m³)</option>
    <option value="gal">Gallon (US)</option>
  </select>
  to
  <select id="to">
    <option value="l">Liter (L)</option>
    <option value="ml">Milliliter (mL)</option>
    <option value="m3">Cubic Meter (m³)</option>
    <option value="gal">Gallon (US)</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    const factors = {
      l: 1,
      ml: 0.001,
      m3: 1000,
      gal: 3.78541
    };
    function run() {
      const value = parseFloat(document.getElementById('value').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (isNaN(value)) {
        document.getElementById('output').innerText = 'Enter a valid number.';
        return;
      }
      const liters = value * factors[from];
      const result = liters / factors[to];
      document.getElementById('output').innerText = value + ' ' + from + ' = ' + result + ' ' + to;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

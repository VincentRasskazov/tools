<body>
  <div class="tool-container">
    <h1>Random Date Generator</h1>
<div class="row"><div><label>Start Date</label><input type="date" id="d1"></div><div><label>End Date</label><input type="date" id="d2"></div></div>
<button onclick="c()">Generate Random Date</button>
<div id="res" class="res" style="font-size:1.5rem;"></div>
<script>
// Set default dates
document.getElementById('d1').value = "2000-01-01"; document.getElementById('d2').value = new Date().toISOString().split('T')[0];
function c(){ const s=new Date(document.getElementById('d1').value).getTime(), e=new Date(document.getElementById('d2').value).getTime(); if(s&&e&&s<=e){ const r=new Date(s + Math.random()*(e-s)); document.getElementById('res').innerHTML=r.toLocaleDateString() + "<br><span style='font-size:1rem;color:#64748b;'>"+r.toLocaleTimeString()+"</span>"; } } c();
</script>
  </div>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>YAML to CSV</title><script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script><style>.tool-container{max-width:900px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;} textarea{width:100%;height:200px;padding:10px;border:1px solid #ccc;border-radius:6px;font-family:monospace;margin-bottom:15px;} button{grid-column:1/-1;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">YAML to CSV</h1><div class="grid"><div><label>YAML</label><textarea id="in" placeholder="- id: 1\n  name: Alice"></textarea></div><div><label>CSV</label><textarea id="out" readonly></textarea></div><button onclick="c()">Convert to CSV</button></div></div>
<script>function c(){ try{ const obj=jsyaml.load(document.getElementById('in').value); document.getElementById('out').value=Papa.unparse(obj); }catch(e){document.getElementById('out').value="Invalid YAML";} }</script></body></html>

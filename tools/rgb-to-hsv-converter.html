  <div class="tool-container">
    <h1>RGB to HSV</h1>
<div class="row">
  <div><label>R</label><input type="number" id="r" value="59" min="0" max="255" oninput="c()"></div>
  <div><label>G</label><input type="number" id="g" value="130" min="0" max="255" oninput="c()"></div>
  <div><label>B</label><input type="number" id="b" value="246" min="0" max="255" oninput="c()"></div>

<div id="box" style="height:100px;border-radius:12px;margin-bottom:20px;border:2px solid var(--border);"></div>
<div id="res" class="res" style="font-family:monospace;"></div>
<script>function c(){ const r=parseInt(document.getElementById('r').value)||0, g=parseInt(document.getElementById('g').value)||0, b=parseInt(document.getElementById('b').value)||0; document.getElementById('box').style.background=`rgb(${r},${g},${b})`; let rp=r/255, gp=g/255, bp=b/255; let max=Math.max(rp,gp,bp), min=Math.min(rp,gp,bp); let h, s, v=max; let d=max-min; s=max===0?0:d/max; if(max===min){h=0;}else{switch(max){case rp:h=(gp-bp)/d+(gp<bp?6:0);break;case gp:h=(bp-rp)/d+2;break;case bp:h=(rp-gp)/d+4;break;}h/=6;} document.getElementById('res').innerText=`hsv(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(v*100)}%)`; } c();</script>

<body>
  <div class="tool-container">
    <h1>Cron Expression Builder</h1>
<div class="card" style="display:flex;gap:10px;text-align:center;">
  <div style="flex:1;"><label style="justify-content:center;">Minute</label><input type="text" id="m" value="*" oninput="c()"></div>
  <div style="flex:1;"><label style="justify-content:center;">Hour</label><input type="text" id="h" value="*" oninput="c()"></div>
  <div style="flex:1;"><label style="justify-content:center;">Day (Mo)</label><input type="text" id="dm" value="*" oninput="c()"></div>
  <div style="flex:1;"><label style="justify-content:center;">Month</label><input type="text" id="mo" value="*" oninput="c()"></div>
  <div style="flex:1;"><label style="justify-content:center;">Day (Wk)</label><input type="text" id="dw" value="*" oninput="c()"></div>
</div>
<div class="row">
  <button onclick="s('*/5','*','*','*','*')" style="background:var(--success)">Every 5 Mins</button>
  <button onclick="s('0','0','*','*','*')" style="background:var(--warning)">Daily at Midnight</button>
</div>
<div id="res" class="res" style="font-size:4rem;font-family:monospace;letter-spacing:10px;">* * * * *</div>
<script>function s(m,h,dm,mo,dw){document.getElementById('m').value=m; document.getElementById('h').value=h; document.getElementById('dm').value=dm; document.getElementById('mo').value=mo; document.getElementById('dw').value=dw; c();} function c(){ const expr = `${document.getElementById('m').value} ${document.getElementById('h').value} ${document.getElementById('dm').value} ${document.getElementById('mo').value} ${document.getElementById('dw').value}`; document.getElementById('res').innerText=expr; }</script>
  </div>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Color Inverter</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} input{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;font-size:1.2rem;} .boxes{display:flex;gap:10px;height:100px;margin-top:20px;} .box{flex:1;border-radius:6px;border:1px solid #ccc;}</style></head>
<body><div class="tool-container"><h1 style="color:#2563eb;">Color Inverter</h1><input type="text" id="in" placeholder="#FFFFFF" value="#FFFFFF" oninput="c()"><input type="text" id="out" readonly><div class="boxes"><div id="b1"></div><div id="b2"></div></div></div>
<script>function c(){ let h = document.getElementById('in').value.replace('#',''); if(h.length!==6)return; let r=255-parseInt(h.slice(0,2),16), g=255-parseInt(h.slice(2,4),16), b=255-parseInt(h.slice(4,6),16); let ih = '#' + [r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); document.getElementById('out').value = ih.toUpperCase(); document.getElementById('b1').style.background='#'+h; document.getElementById('b2').style.background=ih; } window.onload=c;</script></body></html>

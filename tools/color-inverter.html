<body>
  <div class="tool-container">
    <h1>Color Inverter</h1>
<input type="color" id="c" value="#3b82f6" oninput="u()" style="height:60px;padding:0;border:none;">
<div class="row" style="margin-top:20px;">
    <div id="b1" style="height:120px;border-radius:12px;background:#3b82f6;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;text-shadow:1px 1px 2px #000;">Original</div>
    <div id="b2" style="height:120px;border-radius:12px;background:#c47d09;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;text-shadow:1px 1px 2px #000;">Inverted (#C47D09)</div>
</div>
<script>function u(){ const hex=document.getElementById('c').value; const r=255-parseInt(hex.slice(1,3),16), g=255-parseInt(hex.slice(3,5),16), b=255-parseInt(hex.slice(5,7),16); const inv='#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase(); document.getElementById('b1').style.background=hex; document.getElementById('b2').style.background=inv; document.getElementById('b2').innerText=`Inverted (${inv})`; } u();</script>
  </div>

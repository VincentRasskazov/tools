  <meta charset="UTF-8"><title>Octal to Decimal</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;margin-bottom:20px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Octal to Decimal</h1>
<input type="text" id="in" placeholder="e.g. 17">
<button onclick="conv()">Convert</button>
<label style="margin-top:20px; display:block;">Decimal Result</label>
<input type="text" id="out" readonly></div>
<script>
  function conv(){ 
    const v = document.getElementById('in').value;
    if(!/^[0-7]+$/.test(v)) return alert("Invalid Octal number");
    document.getElementById('out').value = parseInt(v, 8); 
  }
</script></body></html>

  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

<body>
  <div class="tool-container">
    <h1>Skewed Button Generator</h1>
<div style="background:var(--bg);padding:60px;border-radius:16px;margin-bottom:20px;display:flex;justify-content:center;">
  <button id="btn" style="background:var(--danger);color:#fff;border:none;padding:15px 40px;font-size:1.5rem;font-weight:900;text-transform:uppercase;transform:skewX(-15deg);cursor:pointer;width:auto;margin:0;box-shadow:none;"><span style="display:inline-block;transform:skewX(15deg);" id="btx">ACTION</span></button>
</div>
<div class="row">
  <div class="card"><label>Skew Angle (°)</label><input type="range" id="a" min="-45" max="45" value="-15" oninput="u()"></div>
  <div class="card"><label>Color</label><input type="color" id="c" value="#ef4444" oninput="u()"></div>
</div>
<textarea id="out" rows="9" readonly style="font-family:monospace;font-size:0.85rem;"></textarea>
<script>
function u(){
  const a=document.getElementById('a').value, c=document.getElementById('c').value;
  document.getElementById('btn').style.transform = `skewX(${a}deg)`;
  document.getElementById('btn').style.background = c;
  document.getElementById('btx').style.transform = `skewX(${-a}deg)`;
  document.getElementById('out').value = `.skew-btn {\n  background: ${c};\n  color: #fff;\n  padding: 15px 40px;\n  font-weight: 900;\n  text-transform: uppercase;\n  transform: skewX(${a}deg);\n  border: none;\n  cursor: pointer;\n}\n.skew-btn span {\n  display: inline-block;\n  transform: skewX(${-a}deg);\n}`;
} u();
</script>

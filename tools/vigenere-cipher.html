  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Vigenère Cipher</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea,input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;} button{padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Vigenère Cipher</h1><textarea id="in" placeholder="Message..."></textarea><input type="text" id="k" placeholder="Keyword (e.g. SECRET)"><div class="grid"><button onclick="c(1)">Encrypt</button><button onclick="c(-1)" style="background:#4b5563;">Decrypt</button></div><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(dir){ const t=document.getElementById('in').value, k=document.getElementById('k').value.toUpperCase(); if(!k||!t)return; let r='', j=0; for(let i=0;i<t.length;i++){ let c=t.charCodeAt(i); if(c>=65&&c<=90){ r+=String.fromCharCode((c-65 + dir*(k.charCodeAt(j%k.length)-65) + 26)%26 + 65); j++; }else if(c>=97&&c<=122){ r+=String.fromCharCode((c-97 + dir*(k.charCodeAt(j%k.length)-65) + 26)%26 + 97); j++; }else{ r+=t[i]; } } document.getElementById('out').value=r; }</script></body></html>

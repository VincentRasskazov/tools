<body>
<div class="tool-container">
    <h1>Box Shadow Generator</h1>
<div id="box" style="width:150px;height:150px;background:#fff;border-radius:16px;margin:0 auto 40px;border:1px solid #e2e8f0;box-shadow:0px 0px 0px rgba(0,0,0,0);"></div>
<div class="row"><div><label>X Offset</label><input type="range" id="x" min="-50" max="50" value="10" oninput="u()"></div><div><label>Y Offset</label><input type="range" id="y" min="-50" max="50" value="10" oninput="u()"></div></div>
<div class="row"><div><label>Blur</label><input type="range" id="b" min="0" max="100" value="25" oninput="u()"></div><div><label>Spread</label><input type="range" id="s" min="-50" max="50" value="-5" oninput="u()"></div></div>
<label>Shadow Color</label><input type="color" id="c" value="#000000" oninput="u()">
<label>Opacity</label><input type="range" id="o" min="0" max="1" step="0.05" value="0.2" oninput="u()">
<div id="res" class="res" style="font-size:1rem;font-family:monospace;">box-shadow: 10px 10px 25px -5px rgba(0, 0, 0, 0.2);</div>
<script>function u(){ const x=document.getElementById('x').value, y=document.getElementById('y').value, b=document.getElementById('b').value, s=document.getElementById('s').value, c=document.getElementById('c').value, o=document.getElementById('o').value;
const hex2rgb = (hex) => { const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), bl=parseInt(hex.slice(5,7),16); return `${r}, ${g}, ${bl}`; };
const css = `${x}px ${y}px ${b}px ${s}px rgba(${hex2rgb(c)}, ${o})`; document.getElementById('box').style.boxShadow=css; document.getElementById('res').innerText=`box-shadow: ${css};`; } u();</script>

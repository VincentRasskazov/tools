<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Password Generator | Ultimate Tools Hub</title>
  <meta name="description" content="Generate strong, random passwords instantly. Free, secure, and beautiful online password generator.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/landing-polish.css">
  <style>
    .pw-container { max-width: 420px; margin: 40px auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px #1976d233; padding: 32px 28px; }
    .pw-title { font-size: 2rem; font-weight: 700; color: #1976d2; margin-bottom: 18px; }
    .pw-desc { color: #555; margin-bottom: 22px; }
    .result-label { font-weight: 600; color: #283593; margin-bottom: 6px; }
    .result-box { background: #f6f8fa; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 1.1rem; word-break: break-all; margin-bottom: 8px; }
    button { background: #1976d2; color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
    button:hover { background: #0d47a1; }
    .pw-options { margin-bottom: 18px; }
    label { margin-right: 12px; }
  </style>
</head>
<body>
  <div class="pw-container">
    <div class="pw-title">Random Password Generator</div>
    <div class="pw-desc">Generate a strong, random password for your accounts and apps.</div>
    <div class="pw-options">
      <label>Length: <input type="number" id="pwLength" value="16" min="4" max="64" style="width:50px;"></label>
      <label><input type="checkbox" id="pwUpper" checked> Uppercase</label>
      <label><input type="checkbox" id="pwLower" checked> Lowercase</label>
      <label><input type="checkbox" id="pwNum" checked> Numbers</label>
      <label><input type="checkbox" id="pwSym" checked> Symbols</label>
    </div>
    <button onclick="generatePassword()">Generate Password</button>
    <div class="result-label" style="margin-top:18px;">Password:</div>
    <div class="result-box" id="pwResult"></div>
  </div>
  <script>
    function generatePassword() {
      const len = Math.max(4, Math.min(64, +document.getElementById('pwLength').value));
      const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const lower = 'abcdefghijklmnopqrstuvwxyz';
      const num = '0123456789';
      const sym = '!@#$%^&*()_+-=[]{}|;:,.<>?';
      let chars = '';
      if (document.getElementById('pwUpper').checked) chars += upper;
      if (document.getElementById('pwLower').checked) chars += lower;
      if (document.getElementById('pwNum').checked) chars += num;
      if (document.getElementById('pwSym').checked) chars += sym;
      if (!chars) {
        document.getElementById('pwResult').textContent = 'Select at least one character set!';
        return;
      }
      let pw = '';
      for (let i = 0; i < len; i++) {
        pw += chars[Math.floor(Math.random() * chars.length)];
      }
      document.getElementById('pwResult').textContent = pw;
    }
  </script>
</body>
</html>

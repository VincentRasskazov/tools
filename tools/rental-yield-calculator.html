<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Rental Yield Calculator</h1><label>Annual Rental Income ($)</label><input type="number" id="i"><label>Property Value ($)</label><input type="number" id="v"><label>Annual Expenses ($) (Optional)</label><input type="number" id="e" value="0"><button onclick="c()">Calculate Yield</button><div id="res"></div></div>
<script>function c(){ const i=parseFloat(document.getElementById('i').value), v=parseFloat(document.getElementById('v').value), e=parseFloat(document.getElementById('e').value)||0; if(v){ const gross=(i/v)*100; const net=((i-e)/v)*100; document.getElementById('res').innerHTML=`Gross Yield: <strong>${gross.toFixed(2)}%</strong><br>Net Yield: <strong>${net.toFixed(2)}%</strong>`; } }</script>

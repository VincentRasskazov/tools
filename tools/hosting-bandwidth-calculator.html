<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Bandwidth Calculator</h1><label>Avg Page Size (KB)</label><input type="number" id="s" value="2000"><label>Monthly Visitors</label><input type="number" id="v" value="5000"><label>Avg Pages per Visit</label><input type="number" id="p" value="3"><button onclick="c()">Calculate</button><div id="res"></div></div>
<script>function c(){ const s=parseFloat(document.getElementById('s').value), v=parseFloat(document.getElementById('v').value), p=parseFloat(document.getElementById('p').value); if(s&&v&&p){ const gb = (s*v*p)/1000000; document.getElementById('res').innerText = gb.toFixed(2) + " GB / Month"; } }</script>

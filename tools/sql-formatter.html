<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">SQL Formatter</h1><textarea id="in" placeholder="select * from users where id=1"></textarea><button onclick="c()">Format SQL</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ let sql = document.getElementById('in').value; const keywords = ['SELECT', 'FROM', 'WHERE', 'AND', 'OR', 'ORDER BY', 'GROUP BY', 'LIMIT', 'INSERT INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE', 'INNER JOIN', 'LEFT JOIN', 'RIGHT JOIN', 'ON']; keywords.forEach(kw => { const re = new RegExp('\\b' + kw + '\\b', 'gi'); sql = sql.replace(re, '\n' + kw.toUpperCase() + ' '); }); document.getElementById('out').value = sql.trim(); }</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculate compound interest and future investment value with this free online Compound Interest Calculator tool.">
  <title>Compound Interest Calculator - Free Online Tool</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="tool-container">
    <h1>Compound Interest Calculator</h1>
    <form id="compound-form">
      <input type="number" id="principal" placeholder="Principal ($)" required>
      <input type="number" id="rate" placeholder="Annual Rate (%)" required>
      <input type="number" id="years" placeholder="Years" required>
      <input type="number" id="times" placeholder="Compounds/Year" value="1" required>
      <button type="submit">Calculate</button>
    </form>
    <div id="compound-result"></div>
  </div>
  <script src="../assets/js/compound-interest-calculator.js"></script>
</body>
</html>

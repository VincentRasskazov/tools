  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

<body>
  <div class="tool-container">
    <h1>Random Hex Palette</h1>
<div id="pal" style="display:flex;height:150px;border-radius:12px;overflow:hidden;margin-bottom:20px;box-shadow:0 10px 20px rgba(0,0,0,0.1);"></div>
<button onclick="c()">Generate Random Palette</button>
<script>const r=()=>'#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0').toUpperCase(); function c(){ let h=''; for(let i=0;i<5;i++){ const hex=r(); h+=`<div style="flex:1;background:${hex};display:flex;align-items:flex-end;justify-content:center;padding-bottom:15px;color:#fff;text-shadow:1px 1px 3px rgba(0,0,0,0.5);font-weight:bold;font-family:monospace;cursor:pointer;" onclick="navigator.clipboard.writeText('${hex}');alert('${hex} copied!')">${hex}</div>`; } document.getElementById('pal').innerHTML=h; } c();</script>
  </div>

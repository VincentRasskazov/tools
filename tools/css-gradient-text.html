<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">CSS Gradient Text</h1>
<div class="grid"><input type="color" id="c1" value="#ff0000" oninput="u()"><input type="color" id="c2" value="#0000ff" oninput="u()"><input type="number" id="deg" value="90" oninput="u()"></div>
<input type="text" id="txt" value="Beautiful Gradient Text" oninput="u()">
<div id="preview">Beautiful Gradient Text</div>
<textarea id="out" readonly></textarea></div>
<script>function u(){ const c1=document.getElementById('c1').value, c2=document.getElementById('c2').value, d=document.getElementById('deg').value, t=document.getElementById('txt').value; document.getElementById('preview').innerText=t; const css=`background: linear-gradient(${d}deg, ${c1}, ${c2});\n-webkit-background-clip: text;\n-webkit-text-fill-color: transparent;`; document.getElementById('preview').style.cssText=css; document.getElementById('out').value=css; } window.onload=u;</script>

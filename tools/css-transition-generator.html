  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
.tool-container { max-width: 650px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); border: 1px solid var(--border); }
h1 { text-align: center; color: var(--primary); margin: 0 0 25px 0; font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; }

button:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 12px -2px rgba(59, 130, 246, 0.3); }
button:active { transform: translateY(0); box-shadow: none; }
.res { margin-top: 25px; padding: 25px; background: var(--bg); border-radius: 12px; text-align: center; font-size: 1.5rem; font-weight: 800; border: 2px dashed var(--border); color: var(--primary); word-break: break-word; }

<body>
  <div class="tool-container">
    <h1>CSS Transition Generator</h1>
<div style="height:150px;background:var(--bg);border-radius:12px;margin-bottom:20px;display:flex;align-items:center;padding:20px;">
  <div id="box" style="width:100px;height:100px;background:var(--primary);border-radius:8px;transition:all 0.5s ease 0s;"></div>
</div>
<button onclick="document.getElementById('box').style.width=document.getElementById('box').style.width==='100px'?'100%':'100px'" style="margin-bottom:20px;">Hover / Trigger Transition</button>
<div class="row">
  <div><label>Duration (s)</label><input type="number" id="dur" value="0.5" step="0.1" oninput="u()"></div>
  <div><label>Delay (s)</label><input type="number" id="del" value="0" step="0.1" oninput="u()"></div>
  <div><label>Timing Function</label><select id="tf" onchange="u()"><option value="ease">ease</option><option value="linear">linear</option><option value="ease-in">ease-in</option><option value="ease-out">ease-out</option><option value="ease-in-out">ease-in-out</option></select></div>
</div>
<textarea id="out" rows="2" readonly style="font-family:monospace;"></textarea>
<script>function u(){ const dur=document.getElementById('dur').value, del=document.getElementById('del').value, tf=document.getElementById('tf').value; const css=`transition: all ${dur}s ${tf} ${del}s;`; document.getElementById('box').style.transition=`all ${dur}s ${tf} ${del}s`; document.getElementById('out').value=css; } u();</script>
  </div>

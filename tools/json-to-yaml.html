<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>json to yaml Tool</title>
  <meta name="description" content="json to yaml online tool.">
  <meta name="category" content="Developer Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">json to yaml Tool</h1>
  </div>

  <h1>json to yaml Tool</h1>

  <p>This is a starter tool page for <strong>json to yaml</strong>.</p>


  <textarea id="input" placeholder="Paste JSON here" rows="8" style="width:100%"></textarea>
  <button onclick="run()">Convert</button>

  <pre id="output"></pre>

  <script>
    // Simple JSON to YAML converter (limited, for demo)
    function jsonToYaml(obj, indent = 0) {
      if (typeof obj !== 'object' || obj === null) return String(obj);
      if (Array.isArray(obj)) {
        return obj.map(item => ' '.repeat(indent) + '- ' + jsonToYaml(item, indent + 2)).join('\n');
      }
      return Object.entries(obj).map(([k, v]) => {
        if (typeof v === 'object' && v !== null) {
          return ' '.repeat(indent) + k + ':\n' + jsonToYaml(v, indent + 2);
        } else {
          return ' '.repeat(indent) + k + ': ' + jsonToYaml(v, 0);
        }
      }).join('\n');
    }
    function run() {
      const v = document.getElementById('input').value;
      try {
        const obj = JSON.parse(v);
        document.getElementById('output').innerText = jsonToYaml(obj);
      } catch (e) {
        document.getElementById('output').innerText = 'Invalid JSON.';
      }
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

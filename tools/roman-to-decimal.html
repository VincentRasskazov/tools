<body>
<div class="tool-container"><h1 style="color:#2563eb;">Roman to Decimal</h1><input type="text" id="in" placeholder="XIV" oninput="c()"><div id="res"></div></div>
<script>const m={I:1,V:5,X:10,L:50,C:100,D:500,M:1000}; function c(){ const s=document.getElementById('in').value.toUpperCase(); let r=0; for(let i=0;i<s.length;i++){ const c=m[s[i]], n=m[s[i+1]]; if(n>c){r+=n-c;i++}else{r+=c} } document.getElementById('res').innerText = isNaN(r)?'Invalid':r; }</script>
</body>

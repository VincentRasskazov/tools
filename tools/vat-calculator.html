  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>VAT Calculator</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.2rem;background:#f8fafc;padding:15px;border-radius:6px;border:1px solid #cbd5e1;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">VAT Calculator</h1><label>Price</label><input type="number" id="p"><label>VAT Rate (%)</label><input type="number" id="r" value="20"><label>Calculation Type</label><select id="t"><option value="add">Add VAT to Price (Find Gross)</option><option value="sub">Remove VAT from Price (Find Net)</option></select><button onclick="c()">Calculate</button><div id="res"></div></div>
<script>function c(){ const p=parseFloat(document.getElementById('p').value), r=parseFloat(document.getElementById('r').value), t=document.getElementById('t').value; if(!p||!r)return; let net, gross, vat; if(t==='add'){ net=p; vat=p*(r/100); gross=net+vat; }else{ gross=p; net=p/(1+(r/100)); vat=gross-net; } document.getElementById('res').innerHTML=`Net Price: <strong>${net.toFixed(2)}</strong><br>VAT Amount: <strong>${vat.toFixed(2)}</strong><br>Gross Price: <strong>${gross.toFixed(2)}</strong>`; }</script></body></html>

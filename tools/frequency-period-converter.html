<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Frequency & Period</h1><label>Frequency (Hz)</label><input type="number" id="f" oninput="c('f')"><label>Period (ms)</label><input type="number" id="p" oninput="c('p')"></div>
<script>function c(id){ const val=parseFloat(document.getElementById(id).value); if(!val)return; if(id==='f') document.getElementById('p').value=(1000/val).toFixed(4); else document.getElementById('f').value=(1000/val).toFixed(4); }</script></body></html>

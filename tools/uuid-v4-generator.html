<body>
<div class="uuid-container">
    <div class="uuid-title">UUID v4 Generator</div>
    <div class="uuid-desc">Generate a random UUID v4 value for use in databases, software, and more.</div>
    <button onclick="generateUUID()">Generate UUID v4</button>
    <div class="result-label" style="margin-top:18px;">UUID v4:</div>
    <div class="result-box" id="uuidResult"></div>
  </div>
  <script>
    function generateUUID() {
      let dt = new Date().getTime();
      if (window.performance && typeof window.performance.now === "function") {
        dt += performance.now();
      }
      const uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = (dt + Math.random()*16)%16 | 0;
        dt = Math.floor(dt/16);
        return (c==='x' ? r : (r&0x3|0x8)).toString(16);
      });
      document.getElementById('uuidResult').textContent = uuid;
    }
  </script>

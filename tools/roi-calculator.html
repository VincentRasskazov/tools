  <meta charset="UTF-8"><title>ROI Calculator</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.5rem;text-align:center;color:#16a34a;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">ROI Calculator</h1>
<label>Amount Invested ($)</label><input type="number" id="inv">
<label>Amount Returned ($)</label><input type="number" id="ret">
<button onclick="calc()">Calculate ROI</button><div id="res"></div></div>
<script>function calc(){ const i=parseFloat(document.getElementById('inv').value), r=parseFloat(document.getElementById('ret').value); if(i && r){ const roi = ((r-i)/i)*100; document.getElementById('res').innerText = `${roi.toFixed(2)}% ROI`; } }</script></body></html>

<body>
  <div class="tool-container">
    <h1>Hex Guesser</h1>
<div id="sc" style="text-align:center;font-weight:bold;color:var(--primary);margin-bottom:10px;">Streak: 0</div>
<div id="box" style="height:200px;border-radius:12px;margin-bottom:20px;background:#000;box-shadow:0 10px 15px rgba(0,0,0,0.1);"></div>
<div id="opts" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"></div>
<script>
let ans='', s=0; const rHex=()=>'#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0').toUpperCase();
function n(){ ans=rHex(); document.getElementById('box').style.background=ans; const opts=[ans, rHex(), rHex(), rHex()].sort(()=>0.5-Math.random()); let h=''; opts.forEach(o=>{ h+=`<button onclick="c('${o}')" style="background:var(--surface);color:var(--text);border:2px solid var(--border);font-family:monospace;font-size:1.2rem;">${o}</button>`; }); document.getElementById('opts').innerHTML=h; }
function c(g){ if(g===ans){ s++; document.getElementById('sc').innerText="Streak: "+s; } else { alert("Wrong! It was " + ans); s=0; document.getElementById('sc').innerText="Streak: 0"; } n(); }
n();
</script>

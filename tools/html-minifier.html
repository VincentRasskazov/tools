<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>html minifier Tool</title>
  <meta name="description" content="html minifier online tool.">

  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">html minifier Tool</h1>
  </div>

  <h1>html minifier Tool</h1>

  <p>This is a starter tool page for <strong>html minifier</strong>.</p>


  <label for="input">HTML:</label>
  <textarea id="input" placeholder="Paste HTML here"></textarea>
  <button onclick="run()">Minify</button>

  <p id="output"></p>

  <script>
    function run() {
      let html = document.getElementById('input').value;
      if (!html) {
        document.getElementById('output').innerText = "Please enter HTML.";
        return;
      }
      // Remove comments
      html = html.replace(/<!--([\s\S]*?)-->/g, '');
      // Remove whitespace between tags
      html = html.replace(/>\s+</g, '><');
      // Remove leading/trailing whitespace
      html = html.trim();
      document.getElementById('output').innerText = html;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

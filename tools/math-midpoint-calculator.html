<body>
  <div class="tool-container">
    <h1>Midpoint Calculator</h1>
<div class="row"><div><label>X1</label><input type="number" id="x1" value="2"></div><div><label>Y1</label><input type="number" id="y1" value="4"></div></div>
<div class="row"><div><label>X2</label><input type="number" id="x2" value="6"></div><div><label>Y2</label><input type="number" id="y2" value="8"></div></div>
<button onclick="c()">Calculate Midpoint</button>
<div id="res" class="res"></div>
<script>function c(){ const x1=parseFloat(document.getElementById('x1').value), y1=parseFloat(document.getElementById('y1').value), x2=parseFloat(document.getElementById('x2').value), y2=parseFloat(document.getElementById('y2').value); if(!isNaN(x1)&&!isNaN(y1)&&!isNaN(x2)&&!isNaN(y2)){ const mx=(x1+x2)/2, my=(y1+y2)/2; document.getElementById('res').innerHTML=`Midpoint (X, Y):<br><span style="font-size:3rem;color:var(--primary)">(${mx}, ${my})</span>`; } }</script>

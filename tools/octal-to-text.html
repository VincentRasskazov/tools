  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Octal to Text</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:120px;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;font-family:monospace;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Octal to Text</h1>
<textarea id="in" placeholder="110 145 154 154 157" oninput="c()"></textarea>
<label>Text Output</label>
<textarea id="out" readonly style="background:#f8fafc;"></textarea></div>
<script>function c(){ try{ document.getElementById('out').value = document.getElementById('in').value.trim().split(/\s+/).map(o=>String.fromCharCode(parseInt(o,8))).join(''); }catch(e){} }</script></body></html>

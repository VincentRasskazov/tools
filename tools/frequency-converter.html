<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>frequency converter Tool</title>
  <meta name="description" content="frequency converter online tool.">
  <meta name="category" content="Converters">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">frequency converter Tool</h1>
  </div>

  <h1>frequency converter Tool</h1>

  <p>This is a starter tool page for <strong>frequency converter</strong>.</p>


  <label for="input">Value:</label>
  <input id="input" type="number" placeholder="Enter value">
  <select id="from">
    <option value="Hz">Hz</option>
    <option value="kHz">kHz</option>
    <option value="MHz">MHz</option>
    <option value="GHz">GHz</option>
  </select>
  <span>to</span>
  <select id="to">
    <option value="Hz">Hz</option>
    <option value="kHz">kHz</option>
    <option value="MHz">MHz</option>
    <option value="GHz">GHz</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    const factors = { Hz: 1, kHz: 1e3, MHz: 1e6, GHz: 1e9 };
    function run() {
      const value = parseFloat(document.getElementById('input').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (isNaN(value)) {
        document.getElementById('output').innerText = "Please enter a valid value.";
        return;
      }
      const hz = value * factors[from];
      const result = hz / factors[to];
      document.getElementById('output').innerText = `${value} ${from} = ${result} ${to}`;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

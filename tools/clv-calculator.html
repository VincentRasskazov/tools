  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>CLV Calculator</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.5rem;text-align:center;font-weight:bold;color:#16a34a;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">CLV Calculator</h1><label>Avg Purchase Value ($)</label><input type="number" id="apv"><label>Avg Purchase Frequency (per year)</label><input type="number" id="apf"><label>Avg Customer Lifespan (years)</label><input type="number" id="acl"><button onclick="c()">Calculate CLV</button><div id="res"></div></div>
<script>function c(){ const v=parseFloat(document.getElementById('apv').value), f=parseFloat(document.getElementById('apf').value), l=parseFloat(document.getElementById('acl').value); if(v&&f&&l) document.getElementById('res').innerText = "$" + (v*f*l).toFixed(2); }</script></body></html>

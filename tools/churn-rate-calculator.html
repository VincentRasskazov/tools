  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Churn Rate</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.5rem;text-align:center;font-weight:bold;color:#ef4444;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Churn Rate</h1><label>Customers at Start of Period</label><input type="number" id="s"><label>Customers Lost during Period</label><input type="number" id="l"><button onclick="c()">Calculate Churn</button><div id="res"></div></div>

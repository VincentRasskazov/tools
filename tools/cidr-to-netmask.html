<body>
  <div class="tool-container">
    <h1>CIDR to Netmask</h1>
<label>CIDR Prefix (e.g., 24)</label>
<div class="row"><input type="number" id="c" value="24" min="0" max="32"><button onclick="calc()">Convert</button></div>
<div id="res" class="res" style="font-family:monospace;">255.255.255.0</div>
<script>function calc(){ const c=parseInt(document.getElementById('c').value); if(c<0||c>32)return; const m=(0xffffffff<<(32-c))>>>0; document.getElementById('res').innerText=`${(m>>>24)&255}.${(m>>>16)&255}.${(m>>>8)&255}.${m&255}`; }</script>

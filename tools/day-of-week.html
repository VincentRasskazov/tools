<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>day of week Tool</title>
  <meta name="description" content="day of week online tool.">
  <meta name="category" content="Date Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">day of week Tool</h1>
  </div>

  <h1>day of week Tool</h1>

  <p>This is a starter tool page for <strong>day of week</strong>.</p>


  <label for="input">Date:</label>
  <input id="input" type="date">
  <button onclick="run()">Get Day</button>

  <p id="output"></p>

  <script>
    function run() {
      const v = document.getElementById('input').value;
      if (!v) {
        document.getElementById('output').innerText = "Please select a date.";
        return;
      }
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const d = new Date(v);
      document.getElementById('output').innerText = days[d.getDay()];
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

  <h1>password generator Tool</h1>

  <p>This is a starter tool page for <strong>password generator</strong>.</p>


  <input id="length" type="number" min="4" max="64" value="12" placeholder="Length" style="width:80px;">
  <label><input type="checkbox" id="upper" checked>Uppercase</label>
  <label><input type="checkbox" id="lower" checked>Lowercase</label>
  <label><input type="checkbox" id="digits" checked>Digits</label>
  <label><input type="checkbox" id="symbols">Symbols</label>
  <button onclick="run()">Generate</button>

  <p id="output"></p>

  <script>
    function run() {
      const len = parseInt(document.getElementById('length').value, 10);
      let chars = '';
      if (document.getElementById('upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (document.getElementById('lower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
      if (document.getElementById('digits').checked) chars += '0123456789';
      if (document.getElementById('symbols').checked) chars += '!@#$%^&*()_+-={}[]|:;<>,.?/~';
      if (!chars) {
        document.getElementById('output').innerText = 'Select at least one character set.';
        return;
      }
      let pwd = '';
      for (let i = 0; i < len; i++) {
        pwd += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('output').innerText = pwd;
    }
  </script>

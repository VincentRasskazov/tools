<body>
  <h1>Text to Gothic</h1>
  <p>Convert your normal text into gothic Unicode text. Copy and paste it anywhere!</p>
  <textarea id="input" placeholder="Enter your text here..."></textarea>
  <br>
  <button onclick="toGothic()">Convert to Gothic</button>
  <button onclick="copyOutput()">Copy Output</button>
  <div id="output" aria-live="polite"></div>
  <script>
    function toGothic() {
      const map = {
        'A':'𝔄','B':'𝔅','C':'ℭ','D':'𝔇','E':'𝔈','F':'𝔉','G':'𝔊','H':'ℌ','I':'ℑ','J':'𝔍','K':'𝔎','L':'𝔏','M':'𝔐','N':'𝔑','O':'𝔒','P':'𝔓','Q':'𝔔','R':'ℜ','S':'𝔖','T':'𝔗','U':'𝔘','V':'𝔙','W':'𝔚','X':'𝔛','Y':'𝔜','Z':'ℨ',
        'a':'𝔞','b':'𝔟','c':'𝔠','d':'𝔡','e':'𝔢','f':'𝔣','g':'𝔤','h':'𝔥','i':'𝔦','j':'𝔧','k':'𝔨','l':'𝔩','m':'𝔪','n':'𝔫','o':'𝔬','p':'𝔭','q':'𝔮','r':'𝔯','s':'𝔰','t':'𝔱','u':'𝔲','v':'𝔳','w':'𝔴','x':'𝔵','y':'𝔶','z':'𝔷'
      };
      const input = document.getElementById('input').value;
      const gothic = input.split('').map(c => map[c] || c).join('');
      document.getElementById('output').innerText = gothic;
    }
    function copyOutput() {
      const output = document.getElementById('output').innerText;
      if (output) {
        navigator.clipboard.writeText(output);
        alert('Gothic text copied to clipboard!');
      }
    }
  </script>

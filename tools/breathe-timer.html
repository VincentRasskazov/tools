  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Breathe</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} .box-wrap{width:200px;height:200px;margin:30px auto;position:relative;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border-radius:50%;} #anim{width:50px;height:50px;background:#0ea5e9;border-radius:50%;transition:all 4s linear;} #msg{font-size:1.5rem;font-weight:bold;color:#334155;} button{padding:10px 20px;background:#0ea5e9;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:20px;}</style></head>
<body><div class="tool-container"><h1 style="color:#0ea5e9;">Box Breathing</h1><div class="box-wrap"><div id="anim"></div></div><div id="msg">Press Start</div><button onclick="st()" id="btn">Start Breathing</button></div>
<script>let run=false, int; function st(){if(run)return; run=true; document.getElementById('btn').style.display='none'; cycle(); int=setInterval(cycle, 16000);} function cycle(){ const a=document.getElementById('anim'), m=document.getElementById('msg'); m.innerText="Inhale..."; a.style.width="180px"; a.style.height="180px"; setTimeout(()=>{m.innerText="Hold...";},4000); setTimeout(()=>{m.innerText="Exhale..."; a.style.width="50px"; a.style.height="50px";},8000); setTimeout(()=>{m.innerText="Hold...";},12000); }</script></body></html>

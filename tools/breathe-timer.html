<body>
<div class="tool-container"><h1 style="color:#0ea5e9;">Box Breathing</h1><div class="box-wrap"><div id="anim"></div></div><div id="msg">Press Start</div><button onclick="st()" id="btn">Start Breathing</button></div>
<script>let run=false, int; function st(){if(run)return; run=true; document.getElementById('btn').style.display='none'; cycle(); int=setInterval(cycle, 16000);} function cycle(){ const a=document.getElementById('anim'), m=document.getElementById('msg'); m.innerText="Inhale..."; a.style.width="180px"; a.style.height="180px"; setTimeout(()=>{m.innerText="Hold...";},4000); setTimeout(()=>{m.innerText="Exhale..."; a.style.width="50px"; a.style.height="50px";},8000); setTimeout(()=>{m.innerText="Hold...";},12000); }</script>

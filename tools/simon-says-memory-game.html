  <style>

<body>
  <div class="tool-container">
    <h1>Simon Sequence</h1>
<div id="sc" style="text-align:center;font-weight:bold;color:var(--primary);margin-bottom:10px;">Score: 0</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;max-width:300px;margin:0 auto 20px;">
  <div id="b0" style="height:100px;border-radius:12px;background:#ef4444;opacity:0.4;cursor:pointer;transition:0.1s;" onclick="clk(0)"></div>
  <div id="b1" style="height:100px;border-radius:12px;background:#3b82f6;opacity:0.4;cursor:pointer;transition:0.1s;" onclick="clk(1)"></div>
  <div id="b2" style="height:100px;border-radius:12px;background:#10b981;opacity:0.4;cursor:pointer;transition:0.1s;" onclick="clk(2)"></div>
  <div id="b3" style="height:100px;border-radius:12px;background:#f59e0b;opacity:0.4;cursor:pointer;transition:0.1s;" onclick="clk(3)"></div>
</div>
<button onclick="st()" id="btn">Start Sequence</button>
<script>
let seq=[], usr=[], run=false;
function st(){ seq=[]; usr=[]; document.getElementById('sc').innerText="Score: 0"; document.getElementById('btn').style.display='none'; nxt(); }
function nxt(){ usr=[]; seq.push(Math.floor(Math.random()*4)); run=false; let i=0; const int=setInterval(()=>{ if(i>=seq.length){clearInterval(int);run=true;return;} flash(seq[i]); i++; }, 800); }
function flash(i){ const b=document.getElementById('b'+i); b.style.opacity=1; b.style.boxShadow='0 0 20px currentColor'; setTimeout(()=>{b.style.opacity=0.4; b.style.boxShadow='none';}, 400); }
function clk(i){ if(!run)return; flash(i); usr.push(i); if(usr[usr.length-1]!==seq[usr.length-1]){ run=false; alert("Wrong! Final Score: "+(seq.length-1)); document.getElementById('btn').style.display='block'; return; } if(usr.length===seq.length){ run=false; document.getElementById('sc').innerText="Score: "+seq.length; setTimeout(nxt, 1000); } }
</script>

<body>
  <div class="tool-container">
    <h1>MIME Type Lookup</h1>
<input type="text" id="s" placeholder="Search extension (e.g. json, png)..." oninput="c()">
<div id="res" style="display:flex;flex-direction:column;gap:10px;margin-top:20px;"></div>
<script>
const mimes = {".html":"text/html",".css":"text/css",".js":"application/javascript",".json":"application/json",".xml":"application/xml",".csv":"text/csv",".txt":"text/plain",".png":"image/png",".jpg":"image/jpeg",".jpeg":"image/jpeg",".svg":"image/svg+xml",".gif":"image/gif",".webp":"image/webp",".mp4":"video/mp4",".mp3":"audio/mpeg",".wav":"audio/wav",".pdf":"application/pdf",".zip":"application/zip"};
function c(){
  const q=document.getElementById('s').value.toLowerCase().replace('.',''); let h='';
  for(let k in mimes){
    if(k.includes(q) || mimes[k].toLowerCase().includes(q)){
      h+=`<div class="card" style="margin:0;padding:15px;display:flex;justify-content:space-between;align-items:center;"><strong style="font-size:1.5rem;color:var(--primary);">${k}</strong><span style="font-family:monospace;font-size:1rem;">${mimes[k]}</span></div>`;
    }
  } document.getElementById('res').innerHTML=h||"<div style='text-align:center;color:#64748b;'>No results found.</div>";
} c();
</script>

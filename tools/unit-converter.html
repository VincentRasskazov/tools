<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>unit converter Tool</title>
  <meta name="description" content="unit converter online tool.">
  <meta name="category" content="Converters">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">unit converter Tool</h1>
  </div>

  <h1>unit converter Tool</h1>

  <p>This is a starter tool page for <strong>unit converter</strong>.</p>


  <input id="value" type="number" placeholder="Enter value" style="width:120px;">
  <select id="from">
    <option value="m">Meter</option>
    <option value="cm">Centimeter</option>
    <option value="mm">Millimeter</option>
    <option value="km">Kilometer</option>
    <option value="g">Gram</option>
    <option value="kg">Kilogram</option>
    <option value="mg">Milligram</option>
    <option value="l">Liter</option>
    <option value="ml">Milliliter</option>
  </select>
  to
  <select id="to">
    <option value="m">Meter</option>
    <option value="cm">Centimeter</option>
    <option value="mm">Millimeter</option>
    <option value="km">Kilometer</option>
    <option value="g">Gram</option>
    <option value="kg">Kilogram</option>
    <option value="mg">Milligram</option>
    <option value="l">Liter</option>
    <option value="ml">Milliliter</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    const factors = {
      m: 1, cm: 0.01, mm: 0.001, km: 1000,
      g: 1, kg: 1000, mg: 0.001,
      l: 1, ml: 0.001
    };
    function run() {
      const value = parseFloat(document.getElementById('value').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (isNaN(value)) {
        document.getElementById('output').innerText = 'Enter a valid number.';
        return;
      }
      let base;
      if (from in factors && to in factors) {
        if ((from === 'm' || from === 'cm' || from === 'mm' || from === 'km') && (to === 'm' || to === 'cm' || to === 'mm' || to === 'km')) {
          base = value * factors[from];
          document.getElementById('output').innerText = value + ' ' + from + ' = ' + (base / factors[to]) + ' ' + to;
        } else if ((from === 'g' || from === 'kg' || from === 'mg') && (to === 'g' || to === 'kg' || to === 'mg')) {
          base = value * factors[from];
          document.getElementById('output').innerText = value + ' ' + from + ' = ' + (base / factors[to]) + ' ' + to;
        } else if ((from === 'l' || from === 'ml') && (to === 'l' || to === 'ml')) {
          base = value * factors[from];
          document.getElementById('output').innerText = value + ' ' + from + ' = ' + (base / factors[to]) + ' ' + to;
        } else {
          document.getElementById('output').innerText = 'Incompatible units.';
        }
      } else {
        document.getElementById('output').innerText = 'Unknown unit.';
      }
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

  <h1>uuid generator Tool</h1>

  <p>This is a starter tool page for <strong>uuid generator</strong>.</p>


  <button onclick="run()">Generate UUID</button>

  <p id="output"></p>

  <script>
    function uuidv4() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }
    function run() {
      document.getElementById('output').innerText = uuidv4();
    }
  </script>

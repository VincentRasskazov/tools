<body>
  <div class="tool-container">
    <h1>Weight Converter</h1>
<div class="row"><div><input type="number" id="kg" oninput="u('kg')"><label>Kilograms</label></div><div><input type="number" id="g" oninput="u('g')"><label>Grams</label></div></div>
<div class="row"><div><input type="number" id="lb" oninput="u('lb')"><label>Pounds</label></div><div><input type="number" id="oz" oninput="u('oz')"><label>Ounces</label></div></div>
<script>function u(id){ const v=parseFloat(document.getElementById(id).value); if(isNaN(v))return; const kg = id==='kg'?v : id==='g'?v/1000 : id==='lb'?v/2.20462 : v/35.274; document.getElementById('kg').value=id==='kg'?v:(kg).toFixed(4); document.getElementById('g').value=id==='g'?v:(kg*1000).toFixed(4); document.getElementById('lb').value=id==='lb'?v:(kg*2.20462).toFixed(4); document.getElementById('oz').value=id==='oz'?v:(kg*35.274).toFixed(4); }</script>

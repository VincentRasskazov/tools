<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Ohm's Law</h1><p>Enter any two values to calculate the others.</p><label>Voltage (V)</label><input type="number" id="v"><label>Current (I) Amps</label><input type="number" id="i"><label>Resistance (R) Ohms</label><input type="number" id="r"><label>Power (P) Watts</label><input type="number" id="p"><button onclick="c()">Calculate</button><div id="res"></div></div>
<script>function c(){ let v=parseFloat(document.getElementById('v').value), i=parseFloat(document.getElementById('i').value), r=parseFloat(document.getElementById('r').value), p=parseFloat(document.getElementById('p').value); 
if(v&&i){r=v/i;p=v*i;} else if(v&&r){i=v/r;p=(v*v)/r;} else if(v&&p){i=p/v;r=(v*v)/p;} else if(i&&r){v=i*r;p=i*i*r;} else if(i&&p){v=p/i;r=p/(i*i);} else if(r&&p){v=Math.sqrt(p*r);i=Math.sqrt(p/r);}
document.getElementById('res').innerHTML=`Voltage: ${v?v.toFixed(2):'-'}V | Current: ${i?i.toFixed(2):'-'}A | Resistance: ${r?r.toFixed(2):'-'}Ω | Power: ${p?p.toFixed(2):'-'}W`; }</script>

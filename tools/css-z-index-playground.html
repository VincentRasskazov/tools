    <h1>CSS Z-Index Playground</h1>
<div style="height:250px;position:relative;background:var(--bg);border-radius:12px;margin-bottom:20px;border:1px solid var(--border);">
  <div id="b1" style="position:absolute;width:100px;height:100px;background:var(--primary);top:20px;left:20px;z-index:1;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;border-radius:8px;box-shadow:0 5px 15px rgba(0,0,0,0.2);">1</div>

</div>
<div class="row">
  <div><label>Blue Z-Index</label><input type="number" id="z1" value="1" oninput="u()"></div>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>qr code generator Tool</title>
  <meta name="description" content="qr code generator online tool.">
  <meta name="category" content="Generators">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">qr code generator Tool</h1>
  </div>

  <h1>qr code generator Tool</h1>

  <p>This is a starter tool page for <strong>qr code generator</strong>.</p>


  <input id="input" placeholder="Enter text or URL" style="width:100%">
  <button onclick="run()">Generate</button>

  <div id="output"></div>

  <script>
    function run() {
      const v = document.getElementById('input').value.trim();
      if (!v) {
        document.getElementById('output').innerText = 'Enter text or URL.';
        return;
      }
      const url = 'https://chart.googleapis.com/chart?cht=qr&chs=200x200&chl=' + encodeURIComponent(v);
      document.getElementById('output').innerHTML = `<img src="${url}" alt="QR Code">`;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="Generate free, high-quality QR codes instantly. Perfect for URLs, text, Wi-Fi passwords, and more.">
  <meta property="og:title" content="QR Code Generator - Free Online QR Creator">
  <meta property="og:description" content="Generate free, high-quality QR codes instantly. Perfect for URLs, text, Wi-Fi passwords, and more.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="QR Code Generator - Free Online QR Creator">
  <meta name="twitter:description" content="Generate free, high-quality QR codes instantly. Perfect for URLs, text, Wi-Fi passwords, and more.">
  
  <meta charset="UTF-8">
  <title>QR Code Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .tool-container { max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 20px; font-size: 16px; }
    button { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    #qrcode { margin-top: 30px; display: flex; justify-content: center; }
  </style>
</head>
<body>
  <div class="tool-container">
    <h1>QR Code Generator</h1>
    <input type="text" id="text" placeholder="Enter URL or text here (e.g., https://google.com)">
    <button onclick="generateQR()">Generate QR Code</button>
    <div id="qrcode"></div>
  </div>
  <script>
    function generateQR() {
      const text = document.getElementById("text").value;
      const container = document.getElementById("qrcode");
      container.innerHTML = ""; // Clear previous
      if (text) {
        new QRCode(container, {
          text: text,
          width: 200,
          height: 200
        });
      } else {
        alert("Please enter some text or a URL!");
      }
    }
  </script>
</body>
</html>

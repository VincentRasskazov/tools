    <h1>CSS Triangle Pro</h1>
<div style="height:200px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:16px;margin-bottom:20px;">
  <div id="tri" style="width:0;height:0;border-left:50px solid transparent;border-right:50px solid transparent;border-bottom:100px solid var(--primary);"></div>
</div>
<div class="row">
  <div class="card"><label>Color</label><input type="color" id="c" value="#3b82f6" oninput="u()"></div>
  <div class="card"><label>Rotation (°)</label><input type="range" id="r" min="0" max="360" value="0" oninput="u()"></div>
</div>
<textarea id="out" rows="6" readonly style="font-family:monospace;"></textarea>
<script>
function u(){
  const c=document.getElementById('c').value, r=document.getElementById('r').value;
  const css = `width: 0;\nheight: 0;\nborder-left: 50px solid transparent;\nborder-right: 50px solid transparent;\nborder-bottom: 100px solid ${c};\ntransform: rotate(${r}deg);`;
  document.getElementById('tri').style.borderBottomColor = c;
  document.getElementById('tri').style.transform = `rotate(${r}deg)`;
  document.getElementById('out').value = css;
} u();
</script>

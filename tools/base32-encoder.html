<body>
  <div class="tool-container">
    <div class="tool-header">
      <a class="tool-back" href="../index.html">← Back</a>
      <h1 class="tool-title">Base32 Encoder</h1>
    </div>
    <p>Encode any text to Base32 for safe transmission and storage.</p>
    <textarea id="input" placeholder="Type or paste text..."></textarea>
    <button onclick="encodeBase32()">Encode</button>
    <pre id="output"></pre>
    <script>
      function encodeBase32() {
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        let input = document.getElementById('input').value;
        let bits = '';
        let output = '';
        for (let i = 0; i < input.length; i++) {
          bits += input[i].charCodeAt(0).toString(2).padStart(8, '0');
        }
        for (let i = 0; i < bits.length; i += 5) {
          const chunk = bits.substr(i, 5);
          if (chunk.length < 5) {
            output += alphabet[parseInt(chunk.padEnd(5, '0'), 2)];
          } else {
            output += alphabet[parseInt(chunk, 2)];
          }
        }
        while (output.length % 8 !== 0) output += '=';
        document.getElementById('output').innerText = output;
      }
    </script>

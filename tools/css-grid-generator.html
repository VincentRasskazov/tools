  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Grid Generator</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .row{display:flex;gap:15px;margin-bottom:20px;} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;} #box{display:grid;height:200px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:6px;} .item{background:#2563eb;color:white;display:flex;align-items:center;justify-content:center;border:1px solid #1e40af;} textarea{width:100%;height:80px;padding:10px;border-radius:6px;border:1px solid #ccc;font-family:monospace;margin-top:20px;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">CSS Grid Generator</h1>
<div class="row"><div><label>Columns</label><input type="number" id="c" value="3" oninput="u()"></div><div><label>Rows</label><input type="number" id="r" value="2" oninput="u()"></div><div><label>Gap (px)</label><input type="number" id="g" value="10" oninput="u()"></div></div>
<div id="box"></div>
<textarea id="out" readonly></textarea></div>
<script>function u(){ const c=document.getElementById('c').value, r=document.getElementById('r').value, g=document.getElementById('g').value, b=document.getElementById('box'); b.style.gridTemplateColumns=`repeat(${c}, 1fr)`; b.style.gridTemplateRows=`repeat(${r}, 1fr)`; b.style.gap=`${g}px`; b.innerHTML=''; for(let i=0;i<c*r;i++) b.innerHTML+=`<div class="item">${i+1}</div>`; document.getElementById('out').value=`display: grid;\ngrid-template-columns: repeat(${c}, 1fr);\ngrid-template-rows: repeat(${r}, 1fr);\ngap: ${g}px;`; } window.onload=u;</script></body></html>

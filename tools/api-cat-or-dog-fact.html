  <div class="tool-container">
    <h1>Cat or Dog Fact?</h1>
<div id="sc" style="text-align:center;font-weight:bold;color:var(--success);margin-bottom:10px;">Streak: 0</div>
<div class="card"><div id="q" style="font-size:1.2rem;line-height:1.6;font-weight:bold;text-align:center;">Loading fact...</div></div>
<div class="row">
  <button onclick="c('cat')" style="background:var(--primary);font-size:1.5rem;">🐱 CAT</button>
  <button onclick="c('dog')" style="background:var(--warning);color:#000;font-size:1.5rem;">🐶 DOG</button>
</div>
<script>
let ans='', s=0;
async function n(){ document.getElementById('q').innerText="Loading..."; try{ const isCat=Math.random()>0.5; if(isCat){ const r=await fetch('https://catfact.ninja/fact'); const j=await r.json(); document.getElementById('q').innerText=j.fact; ans='cat'; }else{ const r=await fetch('https://dogapi.dog/api/v2/facts'); const j=await r.json(); document.getElementById('q').innerText=j.data[0].attributes.body; ans='dog'; } }catch(e){document.getElementById('q').innerText="API Error! Retrying..."; setTimeout(n,2000);} }
function c(g){ if(!ans)return; if(g===ans){ s++; document.getElementById('sc').innerText="Streak: "+s; } else { alert("Wrong! It was a " + ans); s=0; document.getElementById('sc').innerText="Streak: 0"; } ans=''; n(); }
n();
</script>

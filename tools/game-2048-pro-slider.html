<body>
  <div class="tool-container">
    <h1>2048 Slider</h1>
<div class="row" style="margin-bottom:10px;text-align:center;"><div style="font-size:1.5rem;font-weight:bold;color:var(--primary);">Score: <span id="sc">0</span></div></div>
<div id="grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:#cbd5e1;padding:5px;border-radius:8px;width:300px;height:300px;margin:0 auto 20px;"></div>
<button onclick="st()">New Game</button>
<script>
let b, sc;
function st(){ b=Array(16).fill(0); sc=0; sp(); sp(); drw(); }
function sp(){ let e=b.map((v,i)=>v===0?i:null).filter(v=>v!==null); if(e.length)b[e[Math.floor(Math.random()*e.length)]]=Math.random()>0.1?2:4; }
function drw(){
  const g=document.getElementById('grid'); g.innerHTML=''; document.getElementById('sc').innerText=sc;
  b.forEach(v=>{ const bg=v===0?'#e2e8f0':v===2?'#f8fafc':v===4?'#f1f5f9':v===8?'#fed7aa':v===16?'#fb923c':'#ef4444'; g.innerHTML+=`<div style="background:${bg};color:${v>4?'#fff':'#000'};display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:bold;border-radius:4px;">${v||''}</div>`; });
}
function sl(r){ let a=r.filter(v=>v), res=[]; for(let i=0;i<a.length;i++){ if(a[i]===a[i+1]){res.push(a[i]*2); sc+=a[i]*2; i++;} else res.push(a[i]); } while(res.length<4)res.push(0); return res; }
window.onkeydown=e=>{
  let o=[...b];
  if(e.key==='ArrowLeft'){ for(let i=0;i<16;i+=4){ const r=sl(b.slice(i,i+4)); for(let j=0;j<4;j++)b[i+j]=r[j]; } }
  if(e.key==='ArrowRight'){ for(let i=0;i<16;i+=4){ const r=sl(b.slice(i,i+4).reverse()).reverse(); for(let j=0;j<4;j++)b[i+j]=r[j]; } }
  if(e.key==='ArrowUp'){ for(let i=0;i<4;i++){ const r=sl([b[i],b[i+4],b[i+8],b[i+12]]); for(let j=0;j<4;j++)b[i+j*4]=r[j]; } }
  if(e.key==='ArrowDown'){ for(let i=0;i<4;i++){ const r=sl([b[i],b[i+4],b[i+8],b[i+12]].reverse()).reverse(); for(let j=0;j<4;j++)b[i+j*4]=r[j]; } }
  if(b.some((v,i)=>v!==o[i])){ sp(); drw(); } if(e.key.includes('Arrow'))e.preventDefault();
}; st();
</script>

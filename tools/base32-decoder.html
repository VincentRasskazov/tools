<body>
  <div class="tool-container">
    <div class="tool-header">
      <a class="tool-back" href="../index.html">← Back</a>
      <h1 class="tool-title">Base32 Decoder</h1>
    </div>
    <p>Decode Base32-encoded text to its original form.</p>
    <textarea id="input" placeholder="Paste Base32 here..."></textarea>
    <button onclick="decodeBase32()">Decode</button>
    <pre id="output"></pre>
    <script>
      function decodeBase32() {
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        let input = document.getElementById('input').value.replace(/=+$/, '');
        let bits = '';
        for (let i = 0; i < input.length; i++) {
          const idx = alphabet.indexOf(input[i].toUpperCase());
          if (idx === -1) continue;
          bits += idx.toString(2).padStart(5, '0');
        }
        let output = '';
        for (let i = 0; i < bits.length; i += 8) {
          const byte = bits.substr(i, 8);
          if (byte.length === 8) {
            output += String.fromCharCode(parseInt(byte, 2));
          }
        }
        document.getElementById('output').innerText = output;
      }
    </script>

<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">BMR Calculator</h1><select id="g"><option value="m">Male</option><option value="f">Female</option></select><input type="number" id="age" placeholder="Age"><input type="number" id="w" placeholder="Weight (kg)"><input type="number" id="h" placeholder="Height (cm)"><button onclick="c()">Calculate BMR</button><div id="res"></div></div>
<script>function c(){ const g=document.getElementById('g').value, age=parseFloat(document.getElementById('age').value), w=parseFloat(document.getElementById('w').value), h=parseFloat(document.getElementById('h').value); if(w&&h&&age){ let bmr = (10*w) + (6.25*h) - (5*age) + (g==='m'?5:-161); document.getElementById('res').innerText = Math.round(bmr) + " kcal/day"; } }</script>

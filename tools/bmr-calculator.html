  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>BMR Calculator</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.5rem;text-align:center;font-weight:bold;color:#16a34a;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">BMR Calculator</h1><select id="g"><option value="m">Male</option><option value="f">Female</option></select><input type="number" id="age" placeholder="Age"><input type="number" id="w" placeholder="Weight (kg)"><input type="number" id="h" placeholder="Height (cm)"><button onclick="c()">Calculate BMR</button><div id="res"></div></div>
<script>function c(){ const g=document.getElementById('g').value, age=parseFloat(document.getElementById('age').value), w=parseFloat(document.getElementById('w').value), h=parseFloat(document.getElementById('h').value); if(w&&h&&age){ let bmr = (10*w) + (6.25*h) - (5*age) + (g==='m'?5:-161); document.getElementById('res').innerText = Math.round(bmr) + " kcal/day"; } }</script></body></html>

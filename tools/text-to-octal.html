<body>
  <div class="tool-container">
    <div class="tool-header">
      <a class="tool-back" href="../index.html">← Back</a>
      <h1 class="tool-title">Text to Octal Converter</h1>
    </div>
    <p>Convert any text to octal code for encoding, debugging, or fun.</p>
    <textarea id="input" placeholder="Type or paste text..."></textarea>
    <button onclick="toOctal()">Convert</button>
    <pre id="output"></pre>
    <script>
      function toOctal() {
        const input = document.getElementById('input').value;
        const octal = input.split('').map(c => c.charCodeAt(0).toString(8)).join(' ');
        document.getElementById('output').innerText = octal;
      }
    </script>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>CSS Filter</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;} input[type=range]{width:100%;} #preview{width:100%;height:200px;background:url('https://placehold.co/800x400/2563eb/white?text=Preview+Image') center/cover;border-radius:6px;margin-bottom:20px;} textarea{width:100%;padding:10px;font-family:monospace;border:1px solid #ccc;border-radius:6px;margin-top:20px;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">CSS Filter Generator</h1><div id="preview"></div><div class="grid">
<div><label>Blur (<span id="vb">0</span>px)</label><input type="range" id="b" min="0" max="20" value="0" oninput="u()"></div>
<div><label>Brightness (<span id="vbr">100</span>%)</label><input type="range" id="br" min="0" max="200" value="100" oninput="u()"></div>
<div><label>Contrast (<span id="vc">100</span>%)</label><input type="range" id="c" min="0" max="200" value="100" oninput="u()"></div>
<div><label>Grayscale (<span id="vg">0</span>%)</label><input type="range" id="g" min="0" max="100" value="0" oninput="u()"></div>
<div><label>Hue-Rotate (<span id="vh">0</span>deg)</label><input type="range" id="h" min="0" max="360" value="0" oninput="u()"></div>
<div><label>Invert (<span id="vi">0</span>%)</label><input type="range" id="i" min="0" max="100" value="0" oninput="u()"></div>
<div><label>Saturate (<span id="vs">100</span>%)</label><input type="range" id="s" min="0" max="300" value="100" oninput="u()"></div>
<div><label>Sepia (<span id="vse">0</span>%)</label><input type="range" id="se" min="0" max="100" value="0" oninput="u()"></div>
</div><textarea id="out" readonly></textarea></div>
<script>function u(){ const b=document.getElementById('b').value, br=document.getElementById('br').value, c=document.getElementById('c').value, g=document.getElementById('g').value, h=document.getElementById('h').value, i=document.getElementById('i').value, s=document.getElementById('s').value, se=document.getElementById('se').value; document.getElementById('vb').innerText=b; document.getElementById('vbr').innerText=br; document.getElementById('vc').innerText=c; document.getElementById('vg').innerText=g; document.getElementById('vh').innerText=h; document.getElementById('vi').innerText=i; document.getElementById('vs').innerText=s; document.getElementById('vse').innerText=se; const f = `blur(${b}px) brightness(${br}%) contrast(${c}%) grayscale(${g}%) hue-rotate(${h}deg) invert(${i}%) saturate(${s}%) sepia(${se}%)`; document.getElementById('preview').style.filter = f; document.getElementById('out').value = `filter: ${f};`; } window.onload=u;</script></body></html>

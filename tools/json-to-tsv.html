  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>JSON to TSV</title><script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;} textarea{width:100%;height:200px;padding:10px;border:1px solid #ccc;border-radius:6px;font-family:monospace;margin-bottom:15px;} button{grid-column:1/-1;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">JSON to TSV</h1><div class="grid"><div><label>JSON Input</label><textarea id="in" placeholder='[{"id":1, "name":"Alice"}]'></textarea></div><div><label>TSV Output</label><textarea id="out" readonly></textarea></div><button onclick="c()">Convert to TSV</button></div></div>
<script>function c(){ try{ const j=JSON.parse(document.getElementById('in').value); document.getElementById('out').value=Papa.unparse(j, {delimiter:"\t"}); }catch(e){document.getElementById('out').value="Invalid JSON";} }</script></body></html>

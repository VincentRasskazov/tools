<body>
  <div class="tool-container">
    <h1>JWT Decoder Pro</h1>
<div class="card">
  <label>🔒 JWT String</label>
  <textarea id="in" rows="4" placeholder="eyJhbGci..."></textarea>
</div>
<button onclick="c()">Decode Token</button>
<div class="row">
  <div class="card"><label>🏷️ Header</label><textarea id="hOut" rows="6" readonly style="font-family:monospace;"></textarea></div>
  <div class="card"><label>📦 Payload</label><textarea id="pOut" rows="6" readonly style="font-family:monospace;"></textarea></div>
</div>
<script>
function dec(s){ return decodeURIComponent(atob(s.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')); }
function c(){
  try{
    const parts = document.getElementById('in').value.trim().split('.');
    if(parts.length!==3) throw "Invalid JWT format";
    document.getElementById('hOut').value = JSON.stringify(JSON.parse(dec(parts[0])), null, 2);
    document.getElementById('pOut').value = JSON.stringify(JSON.parse(dec(parts[1])), null, 2);
  }catch(e){ document.getElementById('hOut').value="Error"; document.getElementById('pOut').value="Error decoding token."; }
}
</script>
  </div>
</body>

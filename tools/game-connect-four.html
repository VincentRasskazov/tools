  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

<body>
  <div class="tool-container">
    <h1>Connect Four</h1>
<div id="msg" style="text-align:center;font-weight:bold;font-size:1.5rem;color:var(--danger);margin-bottom:15px;">Red's Turn</div>
<div id="brd" style="background:var(--primary);padding:10px;border-radius:12px;display:grid;grid-template-columns:repeat(7, 1fr);gap:10px;width:350px;margin:0 auto 20px;"></div>
<button onclick="st()">Restart Game</button>
<script>
const cols=7, rows=6; let bd=[], cur=1, run=true; const grid=document.getElementById('brd'), msg=document.getElementById('msg');
function st(){ bd=Array(rows).fill(null).map(()=>Array(cols).fill(0)); cur=1; run=true; msg.innerText="Red's Turn"; msg.style.color="var(--danger)"; drw(); }
function drw(){ grid.innerHTML=''; for(let r=0;r<rows;r++){ for(let c=0;c<cols;c++){ let col='#fff'; if(bd[r][c]===1)col='var(--danger)'; else if(bd[r][c]===2)col='var(--warning)'; grid.innerHTML+=`<div style="height:40px;width:40px;background:${col};border-radius:50%;cursor:pointer;" onclick="drop(${c})"></div>`; } } }
function drop(c){ if(!run)return; for(let r=rows-1;r>=0;r--){ if(bd[r][c]===0){ bd[r][c]=cur; if(chk(r,c)){ drw(); run=false; msg.innerText=(cur===1?'Red':'Yellow')+" Wins!"; msg.style.color=cur===1?'var(--danger)':'var(--warning)'; return; } cur=cur===1?2:1; msg.innerText=(cur===1?'Red':'Yellow')+"'s Turn"; msg.style.color=cur===1?'var(--danger)':'var(--warning)'; drw(); return; } } }
function chk(r,c){ const v=bd[r][c]; let count=0;
  for(let i=Math.max(0,c-3);i<=Math.min(cols-1,c+3);i++) { count=(bd[r][i]===v)?count+1:0; if(count>=4)return true; } count=0;
  for(let i=Math.max(0,r-3);i<=Math.min(rows-1,r+3);i++) { count=(bd[i][c]===v)?count+1:0; if(count>=4)return true; } count=0;
  for(let i=-3;i<=3;i++){ if(r+i>=0 && r+i<rows && c+i>=0 && c+i<cols){ count=(bd[r+i][c+i]===v)?count+1:0; if(count>=4)return true; } } count=0;
  for(let i=-3;i<=3;i++){ if(r-i>=0 && r-i<rows && c+i>=0 && c+i<cols){ count=(bd[r-i][c+i]===v)?count+1:0; if(count>=4)return true; } } return false;
} st();
</script>

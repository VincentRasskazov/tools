<!DOCTYPE html>
<html lang="en"><head>
  <meta name="description" content="Convert binary code into readable text characters.">
  <meta property="og:title" content="Binary to Text Converter">
  <meta property="og:description" content="Convert binary code into readable text characters.">

  <meta name="twitter:card" content="summary">

  <meta name="twitter:description" content="Convert binary code into readable text characters.">
  <meta charset="UTF-8"><title>Binary to Text</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:6px;font-family:monospace;}</style></head>
<body><div class="tool-container"><h1>Binary to Text</h1>
<textarea id="i" placeholder="01001000 01100101 01101100 01101100 01101111" oninput="conv()"></textarea>
<textarea id="o" readonly style="margin-top:20px;background:#f9fafb;"></textarea></div>
<script>
function conv(){
  const b = document.getElementById('i').value.trim().split(/\s+/);
  document.getElementById('o').value = b.map(bin => String.fromCharCode(parseInt(bin, 2))).join('');
}
</script></body></html>

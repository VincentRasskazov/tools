<body>
  <div class="tool-container">
    <h1>Markdown Table Builder</h1>
<div class="row">
  <div class="card"><label>📏 Columns</label><input type="number" id="c" value="3" min="1" max="10" oninput="g()"></div>
  <div class="card"><label>📐 Rows</label><input type="number" id="r" value="3" min="1" max="20" oninput="g()"></div>
</div>
<div class="card"><textarea id="out" rows="8" readonly style="font-family:monospace;white-space:pre;"></textarea></div>
<script>
function g(){
  const c=parseInt(document.getElementById('c').value)||3, r=parseInt(document.getElementById('r').value)||3;
  let md = '| ' + Array(c).fill('Header').join(' | ') + ' |\n';
  md += '|' + Array(c).fill('---').join('|') + '|\n';
  for(let i=0;i<r;i++) md += '| ' + Array(c).fill('Data').join(' | ') + ' |\n';
  document.getElementById('out').value = md;
} g();
</script>
  </div>
</body>

  <style>

<body>
  <div class="tool-container">
    <h1>SVG Placeholder Generator</h1>
<div class="row">
  <div class="card"><label>Width (px)</label><input type="number" id="w" value="600" oninput="u()"></div>
  <div class="card"><label>Height (px)</label><input type="number" id="h" value="300" oninput="u()"></div>
</div>
<div class="row">
  <div class="card"><label>Background Color</label><input type="color" id="bg" value="#e2e8f0" oninput="u()"></div>
  <div class="card"><label>Text Color</label><input type="color" id="tc" value="#64748b" oninput="u()"></div>
</div>
<div class="card" style="text-align:center;overflow:hidden;"><img id="pv" style="max-width:100%;"></div>
<div class="card"><label>✨ Data URI</label><textarea id="out" rows="3" readonly style="font-family:monospace;font-size:0.85rem;"></textarea></div>
<script>
function u(){
  const w=document.getElementById('w').value, h=document.getElementById('h').value, bg=document.getElementById('bg').value.replace('#','%23'), tc=document.getElementById('tc').value.replace('#','%23');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${bg}"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="${Math.floor(h/5)}px" fill="${tc}">${w}x${h}</text></svg>`;
  const uri=`data:image/svg+xml;charset=UTF-8,${svg.replace(/"/g,"'")}`;
  document.getElementById('pv').src=uri; document.getElementById('out').value=uri;
} u();
</script>
  </div>
</body>

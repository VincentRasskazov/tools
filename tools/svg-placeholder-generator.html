  <style>

<body>
  <div class="tool-container">
    <h1>SVG Placeholder Generator</h1>
<div class="row"><div><label>Width</label><input type="number" id="w" value="800" oninput="c()"></div><div><label>Height</label><input type="number" id="h" value="600" oninput="c()"></div></div>
<div class="row"><div><label>Background</label><input type="color" id="bg" value="#e2e8f0" oninput="c()"></div><div><label>Text Color</label><input type="color" id="tc" value="#475569" oninput="c()"></div></div>
<div id="pv" style="width:100%;height:150px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#475569;margin-bottom:20px;border-radius:12px;">800 x 600</div>
<textarea id="out" rows="4" readonly placeholder="Data URI..."></textarea>
<script>function c(){ const w=document.getElementById('w').value, h=document.getElementById('h').value, bg=document.getElementById('bg').value, tc=document.getElementById('tc').value; document.getElementById('pv').style.background=bg; document.getElementById('pv').style.color=tc; document.getElementById('pv').innerText=`${w} x ${h}`; const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect fill="${bg}" width="${w}" height="${h}"/><text fill="${tc}" font-family="sans-serif" font-size="30" dy="10.5" font-weight="bold" x="50%" y="50%" text-anchor="middle">${w} x ${h}</text></svg>`; document.getElementById('out').value = 'data:image/svg+xml;base64,'+btoa(svg); } c();</script>
  </div>

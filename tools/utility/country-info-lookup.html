<body>
  <div class="tool-container">
    <h1>Country Info Lookup</h1>
<div class="row">
  <div class="card" style="flex:3;"><label>Country Name</label><input type="text" id="in" placeholder="Brazil" onkeypress="if(event.key==='Enter') g()"></div>
  <button onclick="g()" id="btn" style="flex:1;">Search</button>
</div>
<div class="card" id="box" style="text-align:center;display:none;">
  <div id="flag" style="font-size:6rem;margin-bottom:10px;"></div>
  <div id="name" style="font-size:2.5rem;font-weight:900;color:var(--text);margin-bottom:15px;"></div>
  <div id="info" style="font-size:1.2rem;color:#334155;line-height:1.8;"></div>
</div>
<script>
async function g(){
  const c=document.getElementById('in').value.trim(); if(!c)return;
  const b=document.getElementById('btn'); b.innerText="...";
  try{
    const req=await fetch(`https://restcountries.com/v3.1/name/${encodeURIComponent(c)}`);
    if(!req.ok) throw "Not Found"; const data=await req.json(); const info=data[0];
    document.getElementById('box').style.display='block';
    document.getElementById('flag').innerText=info.flag||'🌍';
    document.getElementById('name').innerText=info.name.common;
    document.getElementById('info').innerHTML=`<strong>Capital:</strong> ${info.capital?info.capital[0]:'N/A'}<br><strong>Region:</strong> ${info.region}<br><strong>Population:</strong> ${info.population.toLocaleString()}`;
    b.innerText="Search";
  }catch(e){ b.innerText="Not Found"; document.getElementById('box').style.display='none'; }
}
</script>

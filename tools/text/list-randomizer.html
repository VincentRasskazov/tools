.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}
  </style>

<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">List Randomizer</h1><textarea id="in" placeholder="A\nB\nC"></textarea><button onclick="c()">Shuffle List</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ let a=document.getElementById('in').value.split('\n').filter(x=>x.trim()!==''); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} document.getElementById('out').value=a.join('\n'); }</script>

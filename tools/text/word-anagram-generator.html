<body>
  <div class="tool-container">
    <h1>Anagram Generator</h1>
<div class="row">
  <div class="card" style="flex:3;"><input type="text" id="in" placeholder="Enter a word (e.g. listen)" value="listen" oninput="c()"></div>
  <button onclick="c()" style="flex:1;">Shuffle</button>
</div>
<div class="card"><textarea id="out" rows="6" readonly style="font-size:1.5rem;text-align:center;letter-spacing:3px;"></textarea></div>
<script>
function c(){
  const t=document.getElementById('in').value.trim(); if(!t)return document.getElementById('out').value='';
  let res=new Set(); let attempts=0;
  while(res.size<Math.min(10, Math.pow(2, t.length)) && attempts<100){
    res.add(t.split('').sort(()=>0.5-Math.random()).join('')); attempts++;
  }
  document.getElementById('out').value = Array.from(res).join('\n');
} c();
</script>

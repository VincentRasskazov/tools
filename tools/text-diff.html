<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>text diff Tool</title>
  <meta name="description" content="text diff online tool.">
  <meta name="category" content="Utility Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">text diff Tool</h1>
  </div>

  <h1>text diff Tool</h1>

  <p>This is a starter tool page for <strong>text diff</strong>.</p>


  <textarea id="a" placeholder="Text A..." rows="6" style="width:100%"></textarea>
  <textarea id="b" placeholder="Text B..." rows="6" style="width:100%"></textarea>
  <button onclick="run()">Diff</button>

  <pre id="output"></pre>

  <script>
    function diffLines(a, b) {
      const aLines = a.split('\n');
      const bLines = b.split('\n');
      let out = '';
      const max = Math.max(aLines.length, bLines.length);
      for (let i = 0; i < max; i++) {
        if (aLines[i] === bLines[i]) out += '  ' + (aLines[i] || '') + '\n';
        else {
          if (aLines[i] !== undefined) out += '- ' + aLines[i] + '\n';
          if (bLines[i] !== undefined) out += '+ ' + bLines[i] + '\n';
        }
      }
      return out;
    }
    function run() {
      const a = document.getElementById('a').value;
      const b = document.getElementById('b').value;
      document.getElementById('output').innerText = diffLines(a, b);
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

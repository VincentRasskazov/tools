  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Markup Calculator</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.2rem;background:#f8fafc;padding:15px;border:1px solid #ccc;border-radius:6px;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Markup Calculator</h1>
<label>Cost ($)</label><input type="number" id="c" placeholder="50">
<label>Markup (%)</label><input type="number" id="m" placeholder="30">
<button onclick="c()">Calculate Sale Price</button><div id="res"></div></div>
<script>function c(){ const cost=parseFloat(document.getElementById('c').value), mkp=parseFloat(document.getElementById('m').value); if(cost&&mkp){ const p = cost + (cost*(mkp/100)); const mgn = ((p-cost)/p)*100; document.getElementById('res').innerHTML = `Sale Price: <strong>$${p.toFixed(2)}</strong><br>Profit: <strong>$${(p-cost).toFixed(2)}</strong><br>Gross Margin: <strong>${mgn.toFixed(2)}%</strong>`; } }</script></body></html>

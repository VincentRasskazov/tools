  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Hex to IP</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} input{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="color:#2563eb;">Hex to IP</h1><input type="text" id="in" placeholder="C0A80101"><button onclick="c()">Convert</button><input type="text" id="out" readonly style="margin-top:20px;font-family:monospace;background:#f8fafc;"></div>
<script>function c(){ const h = document.getElementById('in').value.trim(); if(h.length!==8)return; const p = h.match(/.{1,2}/g); document.getElementById('out').value = p.map(x=>parseInt(x,16)).join('.'); }</script>

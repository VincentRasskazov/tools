  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Letter Counter</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:6px;} #out{font-size:4rem;font-weight:bold;color:#2563eb;margin-top:20px;}</style></head>
<body><div class="tool-container"><h1>Letter Counter</h1><textarea id="in" oninput="c()" placeholder="Type here..."></textarea><div id="out">0</div><p>Letters (A-Z)</p></div>
<script>function c(){ const m = document.getElementById('in').value.match(/[a-zA-Z]/g); document.getElementById('out').innerText = m ? m.length : 0; }</script></body></html>

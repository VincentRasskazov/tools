<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>hex to ascii Tool</title>
  <meta name="description" content="hex to ascii online tool.">
  <meta name="category" content="Encoding Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">hex to ascii Tool</h1>
  </div>

  <h1>hex to ascii Tool</h1>

  <p>This is a starter tool page for <strong>hex to ascii</strong>.</p>


  <label for="input">Hex:</label>
  <input id="input" placeholder="Enter hex (e.g. 68656c6c6f)">
  <button onclick="run()">Convert to ASCII</button>

  <p id="output"></p>

  <script>
    function run() {
      let v = document.getElementById('input').value.replace(/\s+/g, '');
      if (!/^[0-9a-fA-F]*$/.test(v) || v.length % 2 !== 0) {
        document.getElementById('output').innerText = "Please enter a valid hex string.";
        return;
      }
      let out = '';
      for (let i = 0; i < v.length; i += 2) {
        out += String.fromCharCode(parseInt(v.substr(i, 2), 16));
      }
      document.getElementById('output').innerText = out;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

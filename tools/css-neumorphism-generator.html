  <style>
.tool-container{max-width:800px;margin:40px auto;background:#e0e5ec;padding:40px;border-radius:30px;box-shadow:20px 20px 60px #bebebe, -20px -20px 60px #ffffff;color:#4a4a4a;} .preview-box{width:150px;height:150px;border-radius:30px;background:#e0e5ec;margin:0 auto 30px;display:flex;align-items:center;justify-content:center;} .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;} input[type=range]{width:100%;} textarea{width:100%;padding:10px;font-family:monospace;border-radius:6px;border:1px solid #ccc;margin-top:20px;}
  </style>

<body>
<div class="tool-container"><h1 style="text-align:center;">Neumorphism Generator</h1>
<div id="box" class="preview-box">Soft UI</div>
<div class="grid">
<div><label>Size (<span id="vs">300</span>px)</label><input type="range" id="s" min="50" max="400" value="150" oninput="u()"></div>
<div><label>Radius (<span id="vr">30</span>px)</label><input type="range" id="r" min="0" max="200" value="30" oninput="u()"></div>
<div><label>Distance (<span id="vd">20</span>px)</label><input type="range" id="d" min="5" max="50" value="20" oninput="u()"></div>
<div><label>Intensity (<span id="vi">0.15</span>)</label><input type="range" id="i" min="0.01" max="0.6" step="0.01" value="0.15" oninput="u()"></div>
<div><label>Blur (<span id="vb">60</span>px)</label><input type="range" id="b" min="0" max="100" value="60" oninput="u()"></div>
</div>
<textarea id="out" readonly></textarea></div>
<script>function u(){ const s=document.getElementById('s').value, r=document.getElementById('r').value, d=document.getElementById('d').value, i=document.getElementById('i').value, b=document.getElementById('b').value; const box=document.getElementById('box'); box.style.width=s+'px'; box.style.height=s+'px'; box.style.borderRadius=r+'px'; const light=`rgba(255,255,255,${parseFloat(i)+0.1})`; const dark=`rgba(163,177,198,${i})`; const shadow=`${d}px ${d}px ${b}px ${dark}, -${d}px -${d}px ${b}px ${light}`; box.style.boxShadow=shadow; document.getElementById('out').value=`border-radius: ${r}px;\nbackground: #e0e5ec;\nbox-shadow: ${shadow};`; } window.onload=u;</script>
</body>

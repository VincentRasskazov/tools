  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Fraction Calculator</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} .frac{display:inline-block;vertical-align:middle;} .frac input{width:50px;text-align:center;padding:5px;border:1px solid #ccc;} .frac hr{margin:5px 0;border-top:2px solid #000;} select{padding:5px;font-size:1.2rem;margin:0 10px;vertical-align:middle;} button{padding:12px 24px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin-top:20px;width:100%;} #res{margin-top:20px;font-size:2rem;font-weight:bold;color:#16a34a;}</style></head>
<body><div class="tool-container"><h1 style="color:#2563eb;">Fraction Calculator</h1>
<div class="frac"><input type="number" id="n1" value="1"><hr><input type="number" id="d1" value="2"></div>
<select id="op"><option value="+">+</option><option value="-">-</option><option value="*">×</option><option value="/">÷</option></select>
<div class="frac"><input type="number" id="n2" value="1"><hr><input type="number" id="d2" value="4"></div>
<button onclick="c()">Calculate</button><div id="res"></div></div>
<script>
function gcd(a,b){ return b ? gcd(b, a%b) : a; }
function c(){
  const n1=parseInt(document.getElementById('n1').value), d1=parseInt(document.getElementById('d1').value);
  const n2=parseInt(document.getElementById('n2').value), d2=parseInt(document.getElementById('d2').value);
  const op=document.getElementById('op').value; if(!d1||!d2)return;
  let rn, rd;
  if(op==='+'){ rn=(n1*d2)+(n2*d1); rd=d1*d2; }
  else if(op==='-'){ rn=(n1*d2)-(n2*d1); rd=d1*d2; }
  else if(op==='*'){ rn=n1*n2; rd=d1*d2; }
  else if(op==='/'){ rn=n1*d2; rd=d1*n2; }
  const g=Math.abs(gcd(rn,rd)); document.getElementById('res').innerText = (rn/g) + " / " + (rd/g);
}
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>slug generator Tool</title>
  <meta name="description" content="slug generator online tool.">
  <meta name="category" content="Text Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">slug generator Tool</h1>
  </div>

  <h1>slug generator Tool</h1>

  <p>This is a starter tool page for <strong>slug generator</strong>.</p>


  <input id="input" placeholder="Enter text" style="width:100%">
  <button onclick="run()">Generate</button>

  <p id="output"></p>

  <script>
    function slugify(str) {
      return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }
    function run() {
      const v = document.getElementById('input').value;
      document.getElementById('output').innerText = slugify(v);
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

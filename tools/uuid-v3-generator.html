<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">UUID v3 Generator</h1><input type="text" id="ns" placeholder="Namespace (UUID)"><input type="text" id="name" placeholder="Name"><button onclick="c()">Generate</button><div id="res"></div></div>

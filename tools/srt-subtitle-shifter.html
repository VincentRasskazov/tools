<body>
  <div class="tool-container">
    <h1>SRT Time Shifter</h1>
<div class="card">
  <label>⏱️ Shift By (Milliseconds)</label>
  <input type="number" id="ms" value="1000" placeholder="e.g. 1000 for 1s, -500 for -0.5s">
  <textarea id="in" rows="5" placeholder="1\n00:00:01,000 --> 00:00:04,000\nSubtitle text..."></textarea>
</div>
<button onclick="c()">Shift Subtitles</button>
<div class="card"><textarea id="out" rows="6" readonly style="font-family:monospace;white-space:pre;"></textarea></div>
<script>
function pT(t){ const p=t.split(/[:,]/); return parseInt(p[0])*3600000 + parseInt(p[1])*60000 + parseInt(p[2])*1000 + parseInt(p[3]); }
function fT(ms){ if(ms<0)ms=0; const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000), s=Math.floor((ms%60000)/1000), ml=ms%1000; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(ml).padStart(3,'0')}`; }
function c(){
  const offset=parseInt(document.getElementById('ms').value)||0;
  document.getElementById('out').value = document.getElementById('in').value.replace(/(\d{2}:\d{2}:\d{2},\d{3}) --> (\d{2}:\d{2}:\d{2},\d{3})/g, (match, p1, p2) => {
    return fT(pT(p1)+offset) + ' --> ' + fT(pT(p2)+offset);
  });
}
</script>
  </div>

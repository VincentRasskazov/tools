<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Macro Calculator</h1><label>Daily Calories</label><input type="number" id="cal" value="2000"><label>Protein %</label><input type="number" id="p" value="30"><label>Carbs %</label><input type="number" id="c" value="40"><label>Fats %</label><input type="number" id="f" value="30"><button onclick="calc()">Calculate Macros</button><div id="res"></div></div>
<script>function calc(){ const cal=document.getElementById('cal').value, p=document.getElementById('p').value, c=document.getElementById('c').value, f=document.getElementById('f').value; if(parseFloat(p)+parseFloat(c)+parseFloat(f)!==100) return alert("Percentages must equal 100"); const pg=(cal*(p/100))/4, cg=(cal*(c/100))/4, fg=(cal*(f/100))/9; document.getElementById('res').innerHTML=`Protein: <strong>${Math.round(pg)}g</strong><br>Carbs: <strong>${Math.round(cg)}g</strong><br>Fats: <strong>${Math.round(fg)}g</strong>`; }</script>

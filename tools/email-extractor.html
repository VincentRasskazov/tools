  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Email Extractor</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Email Extractor</h1><textarea id="in" placeholder="Paste text containing emails here..."></textarea><button onclick="c()">Extract Emails</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ const m = document.getElementById('in').value.match(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/gi); document.getElementById('out').value = m ? [...new Set(m)].join('\n') : 'No emails found.'; }</script></body></html>

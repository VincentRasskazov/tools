<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>binary to ip Tool</title>
  <meta name="description" content="binary to ip online tool.">
  <meta name="category" content="Networking Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">binary to ip Tool</h1>
  </div>

  <h1>binary to ip Tool</h1>

  <p>This is a starter tool page for <strong>binary to ip</strong>.</p>


  <label for="input">Binary (32 bits):</label>
  <input id="input" placeholder="e.g. 11000000101010000000000100000001">
  <button onclick="run()">Convert to IP</button>

  <p id="output"></p>

  <script>
    function run() {
      const v = document.getElementById('input').value.trim();
      if (!/^[01]{32}$/.test(v)) {
        document.getElementById('output').innerText = "Please enter a 32-bit binary string.";
        return;
      }
      const ip = [0,1,2,3].map(i => parseInt(v.slice(i*8, (i+1)*8), 2)).join('.');
      document.getElementById('output').innerText = ip;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">NATO Translator</h1><textarea id="in" placeholder="Type here..." oninput="c()"></textarea><textarea id="out" readonly style="background:#f8fafc;"></textarea></div>
<script>const n = {A:"Alpha",B:"Bravo",C:"Charlie",D:"Delta",E:"Echo",F:"Foxtrot",G:"Golf",H:"Hotel",I:"India",J:"Juliett",K:"Kilo",L:"Lima",M:"Mike",N:"November",O:"Oscar",P:"Papa",Q:"Quebec",R:"Romeo",S:"Sierra",T:"Tango",U:"Uniform",V:"Victor",W:"Whiskey",X:"X-ray",Y:"Yankee",Z:"Zulu", "0":"Zero","1":"One","2":"Two","3":"Three","4":"Four","5":"Five","6":"Six","7":"Seven","8":"Eight","9":"Nine"}; function c(){ document.getElementById('out').value = document.getElementById('in').value.toUpperCase().split('').map(char => n[char] || char).join(' '); }</script></body></html>

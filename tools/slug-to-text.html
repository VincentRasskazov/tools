<!DOCTYPE html>
<html lang="en"><head>
  <meta name="description" content="Convert a URL slug with dashes back into normal readable text.">
  <meta property="og:title" content="URL Slug to Text">
  <meta property="og:description" content="Convert a URL slug with dashes back into normal readable text.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="URL Slug to Text">

  <meta charset="UTF-8"><title>Slug to Text</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;margin-bottom:20px;font-size:16px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Slug to Text</h1><input type="text" id="in" placeholder="my-awesome-blog-post"><button onclick="c()">Convert</button><input type="text" id="out" readonly style="margin-top:20px;background:#f8fafc;"></div>
<script>function c(){ document.getElementById('out').value = document.getElementById('in').value.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase()); }</script></body></html>

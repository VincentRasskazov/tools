<body>
  <div class="tool-container">
    <h1>SVG Polygon Generator</h1>
<div class="card" style="display:flex;justify-content:center;padding:40px;">
  <svg id="svg" width="150" height="150" viewBox="0 0 100 100">
    <polygon id="poly" points="" fill="#3b82f6" />
  </svg>
</div>
<div class="row">
  <div class="card"><label>Number of Sides</label><input type="range" id="n" min="3" max="12" value="5" oninput="u()"></div>
  <div class="card"><label>Color</label><input type="color" id="c" value="#3b82f6" oninput="u()"></div>
</div>
<textarea id="out" rows="3" readonly style="font-family:monospace;font-size:0.85rem;"></textarea>
<script>
function u(){
  const n=document.getElementById('n').value, c=document.getElementById('c').value;
  let pts=[]; const r=50, cx=50, cy=50;
  for(let i=0;i<n;i++){ const a=(Math.PI*2*i)/n - Math.PI/2; pts.push(`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`); }
  const pStr = pts.join(' ');
  document.getElementById('poly').setAttribute('points', pStr); document.getElementById('poly').setAttribute('fill', c);
  document.getElementById('out').value = `<svg width="100" height="100" viewBox="0 0 100 100">\n  <polygon points="${pStr}" fill="${c}" />\n</svg>`;
} u();
</script>

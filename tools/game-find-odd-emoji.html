  <div class="tool-container">
    <h1>Odd Emoji Out</h1>
<div id="sc" style="text-align:center;font-weight:bold;color:var(--success);margin-bottom:10px;">Level: 1</div>
<div id="grid" class="grid-game" style="grid-template-columns:repeat(6,1fr);gap:5px;font-size:2rem;width:100%;max-width:350px;"></div>
<script>
const pairs=[['😀','😁'],['🍎','🍅'],['🏀','🏐'],['🚗','🚙'],['🌞','🌝'],['O','0']]; let lvl=1;
function n(){ document.getElementById('sc').innerText="Level: "+lvl; const g=document.getElementById('grid'); g.innerHTML=''; const p=pairs[Math.floor(Math.random()*pairs.length)]; const isRev=Math.random()>0.5; const base=isRev?p[1]:p[0], odd=isRev?p[0]:p[1]; const ans=Math.floor(Math.random()*36); for(let i=0;i<36;i++){ g.innerHTML+=`<div style="cursor:pointer;text-align:center;" onclick="c(${i===ans})">${i===ans?odd:base}</div>`; } }
function c(isOdd){ if(isOdd){ lvl++; n(); } else { alert("Wrong! You reached Level: "+lvl); lvl=1; n(); } }
n();
</script>

<body>
  <div class="tool-container">
    <h1>CSS Scale Generator</h1>
<div style="height:200px; display:flex; align-items:center; justify-content:center; background:var(--bg); border-radius:12px; margin-bottom:20px; overflow:hidden;">
  <div id="box" style="width:80px; height:80px; background:var(--primary); border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:bold; transition:0.2s;">BOX</div>
</div>
<div class="row">
  <div><label>Scale X (<span id="vx">1.5</span>)</label><input type="range" id="x" min="0.1" max="3" step="0.1" value="1.5" oninput="u()"></div>
  <div><label>Scale Y (<span id="vy">1.5</span>)</label><input type="range" id="y" min="0.1" max="3" step="0.1" value="1.5" oninput="u()"></div>
</div>
<textarea id="out" rows="2" readonly style="font-family:monospace; text-align:center;"></textarea>
<script>
function u(){
  const x=document.getElementById('x').value, y=document.getElementById('y').value;
  document.getElementById('vx').innerText=x; document.getElementById('vy').innerText=y;
  const css = `transform: scale(${x}, ${y});`;
  document.getElementById('box').style.transform = `scale(${x}, ${y})`;
  document.getElementById('out').value = css;
} u();
</script>
  </div>

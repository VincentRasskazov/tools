<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Word Wrap Formatter</h1><textarea id="in" placeholder="Very long single line of text..."></textarea><div><label>Wrap at length:</label> <input type="number" id="len" value="80"><button onclick="c()">Format Text</button></div><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ const t=document.getElementById('in').value; const l=parseInt(document.getElementById('len').value); const re=new RegExp(`(?![^\\n]{1,${l}}$)([^\\n]{1,${l}})\\s`, 'g'); document.getElementById('out').value=t.replace(re, '$1\n'); }</script></body></html>

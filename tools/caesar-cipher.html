<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>caesar cipher Tool</title>
  <meta name="description" content="caesar cipher online tool.">
  <meta name="category" content="Cipher Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">caesar cipher Tool</h1>
  </div>

  <h1>caesar cipher Tool</h1>

  <p>This is a starter tool page for <strong>caesar cipher</strong>.</p>


  <label for="input">Text:</label>
  <input id="input" placeholder="Enter text">
  <label for="shift">Shift:</label>
  <input id="shift" type="number" value="3">
  <button onclick="run()">Encode</button>

  <p id="output"></p>

  <script>
    function run() {
      const text = document.getElementById('input').value;
      const shift = parseInt(document.getElementById('shift').value, 10);
      if (!text || isNaN(shift)) {
        document.getElementById('output').innerText = "Please enter text and shift.";
        return;
      }
      let result = '';
      for (let c of text) {
        if (c >= 'a' && c <= 'z') {
          result += String.fromCharCode((c.charCodeAt(0) - 97 + shift + 26) % 26 + 97);
        } else if (c >= 'A' && c <= 'Z') {
          result += String.fromCharCode((c.charCodeAt(0) - 65 + shift + 26) % 26 + 65);
        } else {
          result += c;
        }
      }
      document.getElementById('output').innerText = result;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

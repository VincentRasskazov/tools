<body>
  <div class="tool-container">
    <h1>Drum Beat Maker</h1>
<div id="grid" style="display:grid;grid-template-columns:repeat(8, 1fr);gap:4px;background:var(--bg);padding:10px;border-radius:12px;margin-bottom:20px;overflow-x:auto;"></div>
<button id="btn" onclick="t()" style="background:var(--success);font-size:1.5rem;padding:20px;">Play Beat</button>
<script>
let grid=Array(4).fill().map(()=>Array(8).fill(false)); let ctx, run=false, col=0, int;
const inst=['Kick','Snare','Hat','Clap']; const cols=['#ef4444','#3b82f6','#10b981','#f59e0b'];
const gEl=document.getElementById('grid');
for(let y=0;y<4;y++){ for(let x=0;x<8;x++){
  const c=document.createElement('div'); c.style.height='40px'; c.style.background='var(--surface)'; c.style.border=`2px solid ${cols[y]}`; c.style.borderRadius='4px'; c.style.cursor='pointer'; c.innerText=x===0?inst[y]:''; c.style.color=cols[y]; c.style.fontWeight='bold'; c.style.fontSize='0.7rem'; c.style.padding='2px';
  c.onclick=()=>{ grid[y][x]=!grid[y][x]; c.style.background=grid[y][x]?cols[y]:'var(--surface)'; c.style.color=grid[y][x]?'#fff':cols[y]; };
  c.id=`c_${x}_${y}`; gEl.appendChild(c);
}}
function play(y){
  const o=ctx.createOscillator(), g=ctx.createGain();
  if(y===0){ o.frequency.setValueAtTime(150, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.5); } // Kick
  else if(y===1){ o.type='triangle'; o.frequency.setValueAtTime(250, ctx.currentTime); } // Snare
  else if(y===2){ o.type='square'; o.frequency.setValueAtTime(1000, ctx.currentTime); } // Hat
  else { o.type='sawtooth'; o.frequency.setValueAtTime(400, ctx.currentTime); } // Clap
  g.gain.setValueAtTime(1, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+(y===0?0.5:0.1));
  o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.5);
}
function t(){
  if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
  run=!run; document.getElementById('btn').innerText=run?'Stop Beat':'Play Beat'; document.getElementById('btn').style.background=run?'var(--danger)':'var(--success)';
  if(run){ int=setInterval(()=>{
    for(let y=0;y<4;y++){ document.getElementById(`c_${col}_${y}`).style.opacity='1'; } col=(col+1)%8;
    for(let y=0;y<4;y++){ document.getElementById(`c_${col}_${y}`).style.opacity='0.5'; if(grid[y][col]) play(y); }
  }, 250); } else { clearInterval(int); for(let y=0;y<4;y++) document.getElementById(`c_${col}_${y}`).style.opacity='1'; }
}
</script>

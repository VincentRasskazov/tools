<body>
  <div class="tool-container">
    <h1>Pixel Art Maker</h1>
<div class="row">
  <div class="card" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;">
    <input type="color" id="c" value="#ef4444" style="width:100%;height:60px;margin:0;">
    <button onclick="sel='#000'" style="background:#000;">Black</button>
    <button onclick="sel='#fff'" style="background:#fff;color:#000;border:1px solid #ccc;">Eraser</button>
    <button onclick="clr()" style="background:var(--danger);">Clear</button>
  </div>
  <div style="flex:2;display:flex;justify-content:center;">
    <div id="grid" style="display:grid;grid-template-columns:repeat(16, 1fr);width:320px;height:320px;border:2px solid var(--border);background:#fff;cursor:crosshair;" onmousedown="dr=true" onmouseup="dr=false" onmouseleave="dr=false"></div>
  </div>
</div>
<script>
let dr=false, sel='#ef4444';
document.getElementById('c').onchange=e=>sel=e.target.value;
function clr(){ document.getElementById('grid').innerHTML=''; for(let i=0;i<256;i++) document.getElementById('grid').innerHTML+=`<div style="border:1px solid #f1f5f9;" onmousedown="this.style.background=sel;this.style.borderColor=sel" onmouseenter="if(dr){this.style.background=sel;this.style.borderColor=sel}"></div>`; }
clr();
</script>
  </div>

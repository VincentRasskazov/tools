<body>
  <div class="hash-container">
    <div class="hash-title">SHA256 Hash Generator</div>
    <div class="hash-desc">Enter any text below to instantly generate its SHA256 hash. Useful for security, verification, and cryptography.</div>
    <textarea id="inputText" placeholder="Type or paste text..."></textarea>
    <button onclick="generateHash()">Generate SHA256 Hash</button>
    <div class="result-label" style="margin-top:18px;">SHA256 Hash:</div>
    <div class="result-box" id="hashResult"></div>
  </div>
  <script>
    async function generateHash() {
      const text = document.getElementById('inputText').value;
      const encoder = new TextEncoder();
      const data = encoder.encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      document.getElementById('hashResult').textContent = hashHex;
    }
  </script>

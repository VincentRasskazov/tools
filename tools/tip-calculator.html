<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>tip calculator Tool</title>
  <meta name="description" content="tip calculator online tool.">
  <meta name="category" content="Calculators">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">tip calculator Tool</h1>
  </div>

  <h1>tip calculator Tool</h1>

  <p>This is a starter tool page for <strong>tip calculator</strong>.</p>


  <input id="amount" type="number" placeholder="Bill Amount" style="width:120px;">
  <input id="tip" type="number" placeholder="Tip %" style="width:80px;">
  <input id="people" type="number" placeholder="People" value="1" style="width:60px;">
  <button onclick="run()">Calculate</button>

  <p id="output"></p>

  <script>
    function run() {
      const amount = parseFloat(document.getElementById('amount').value);
      const tip = parseFloat(document.getElementById('tip').value);
      const people = parseInt(document.getElementById('people').value, 10);
      if (isNaN(amount) || isNaN(tip) || isNaN(people) || amount <= 0 || tip < 0 || people < 1) {
        document.getElementById('output').innerText = 'Enter valid values.';
        return;
      }
      const tipAmt = amount * tip / 100;
      const total = amount + tipAmt;
      document.getElementById('output').innerText =
        'Tip: $' + (tipAmt/people).toFixed(2) + ' per person\n' +
        'Total: $' + (total/people).toFixed(2) + ' per person';
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

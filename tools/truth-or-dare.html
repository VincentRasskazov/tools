  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Truth or Dare</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;} button{padding:15px;font-size:1.2rem;font-weight:bold;border:none;border-radius:6px;cursor:pointer;color:white;} .t{background:#3b82f6;} .d{background:#ef4444;} #out{margin-top:30px;font-size:1.5rem;font-weight:bold;min-height:80px;padding:20px;background:#f8fafc;border-radius:6px;border:1px solid #e2e8f0;}</style></head>
<body><div class="tool-container"><h1>Truth or Dare</h1><div class="grid"><button class="t" onclick="g('t')">TRUTH</button><button class="d" onclick="g('d')">DARE</button></div><div id="out">Select an option!</div></div>
<script>const t=["What is your biggest fear?","What is the most embarrassing thing you've done?","Who is your secret crush?","Have you ever lied to get out of trouble?","What is a secret you've never told anyone?"]; const d=["Do 10 pushups right now.","Let someone draw on your face with a pen.","Speak in an accent for the next 3 rounds.","Eat a spoonful of hot sauce or mustard.","Do your best dance move for 30 seconds."]; function g(type){ const arr = type==='t'?t:d; document.getElementById('out').innerText=arr[Math.floor(Math.random()*arr.length)]; }</script></body></html>

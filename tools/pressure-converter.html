  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Pressure Converter</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:10px;} label{font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Pressure Converter</h1>
<label>Pascal (Pa)</label><input type="number" id="pa" oninput="c('pa')">
<label>Bar</label><input type="number" id="bar" oninput="c('bar')">
<label>PSI (Pound/sq inch)</label><input type="number" id="psi" oninput="c('psi')">
<label>Standard Atmosphere (atm)</label><input type="number" id="atm" oninput="c('atm')"></div>
<script>function c(id){ const v=parseFloat(document.getElementById(id).value); if(isNaN(v))return; const pa = id==='pa'?v : id==='bar'?v*100000 : id==='psi'?v*6894.76 : v*101325; 
if(id!=='pa')document.getElementById('pa').value=pa; if(id!=='bar')document.getElementById('bar').value=pa/100000; if(id!=='psi')document.getElementById('psi').value=pa/6894.76; if(id!=='atm')document.getElementById('atm').value=pa/101325; }</script></body></html>

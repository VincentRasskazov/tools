<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>pressure converter Tool</title>
  <meta name="description" content="pressure converter online tool.">
  <meta name="category" content="Converters">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">pressure converter Tool</h1>
  </div>

  <h1>pressure converter Tool</h1>

  <p>This is a starter tool page for <strong>pressure converter</strong>.</p>


  <input id="value" type="number" placeholder="Enter value" style="width:120px;">
  <select id="from">
    <option value="Pa">Pascal (Pa)</option>
    <option value="bar">Bar</option>
    <option value="psi">PSI</option>
    <option value="atm">Atmosphere (atm)</option>
  </select>
  to
  <select id="to">
    <option value="Pa">Pascal (Pa)</option>
    <option value="bar">Bar</option>
    <option value="psi">PSI</option>
    <option value="atm">Atmosphere (atm)</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    const factors = {
      Pa: 1,
      bar: 100000,
      psi: 6894.757,
      atm: 101325
    };
    function run() {
      const value = parseFloat(document.getElementById('value').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (isNaN(value)) {
        document.getElementById('output').innerText = 'Enter a valid number.';
        return;
      }
      const pascals = value * factors[from];
      const result = pascals / factors[to];
      document.getElementById('output').innerText = value + ' ' + from + ' = ' + result + ' ' + to;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

<body>
  <div class="tool-container">
    <h1>Pressure Converter</h1>
<div class="row"><div><label>Pascal (Pa)</label><input type="number" id="pa" oninput="u('pa')"></div><div><label>Bar</label><input type="number" id="bar" oninput="u('bar')"></div></div>
<div class="row"><div><label>PSI</label><input type="number" id="psi" oninput="u('psi')"></div><div><label>Atmospheres (atm)</label><input type="number" id="atm" oninput="u('atm')"></div></div>
<script>
function u(id){
  const v=parseFloat(document.getElementById(id).value); if(isNaN(v))return;
  const pa = id==='pa'?v : id==='bar'?v*100000 : id==='psi'?v*6894.76 : v*101325;
  document.getElementById('pa').value=id==='pa'?v:pa.toFixed(2);
  document.getElementById('bar').value=id==='bar'?v:(pa/100000).toFixed(6);
  document.getElementById('psi').value=id==='psi'?v:(pa/6894.76).toFixed(6);
  document.getElementById('atm').value=id==='atm'?v:(pa/101325).toFixed(6);
}
</script>

  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #f4f7f9 0%, #e2e8f0 100%); min-height: 100vh; color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
.tool-container { max-width: 680px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1), 0 10px 15px -3px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.5); }

.res { margin-top: 25px; padding: 30px; background: linear-gradient(to right, #f8fafc, #f1f5f9); border-radius: 16px; text-align: center; font-size: 1.5rem; font-weight: 800; border: 2px dashed #cbd5e1; color: var(--primary); word-break: break-word; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }

<body>
  <div class="tool-container">
    <h1>Keyword Density Analyzer</h1>
<div class="card"><textarea id="in" rows="6" placeholder="Paste your article or text here..."></textarea></div>
<button onclick="c()">Analyze Keywords</button>
<div id="res" class="card" style="display:none;text-align:left;"></div>
<script>
function c(){
  const text=document.getElementById('in').value.toLowerCase().replace(/[^a-z0-9\s]/g,'');
  if(!text)return;
  const words=text.split(/\s+/).filter(w=>w.length>2);
  const total=words.length; if(total===0)return;
  const counts={}; words.forEach(w=>counts[w]=(counts[w]||0)+1);
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  let h=`<h3 style="margin-top:0;">Top 10 Keywords (Total Words: ${total})</h3><table style="width:100%;text-align:left;border-collapse:collapse;"><tr><th style="border-bottom:2px solid var(--border);padding:8px;">Keyword</th><th style="border-bottom:2px solid var(--border);padding:8px;">Count</th><th style="border-bottom:2px solid var(--border);padding:8px;">Density</th></tr>`;
  sorted.forEach(s=>{ h+=`<tr><td style="padding:8px;border-bottom:1px solid var(--border);">${s[0]}</td><td style="padding:8px;border-bottom:1px solid var(--border);">${s[1]}</td><td style="padding:8px;border-bottom:1px solid var(--border);color:var(--primary);font-weight:bold;">${((s[1]/total)*100).toFixed(2)}%</td></tr>`; });
  h+='</table>'; document.getElementById('res').innerHTML=h; document.getElementById('res').style.display='block';
}
</script>
  </div>
</body>

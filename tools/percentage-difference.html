<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Percentage Difference</h1>
<label>Value 1</label><input type="number" id="v1" placeholder="10">
<label>Value 2</label><input type="number" id="v2" placeholder="15">
<button onclick="c()">Calculate</button><div id="res"></div></div>

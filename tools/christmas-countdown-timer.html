<body>
  <div class="tool-container">
    <h1>Christmas Countdown</h1>
<div class="card" style="text-align:center;padding:50px;background:#fef2f2;border-color:#fca5a5;">
  <div style="font-size:5rem;margin-bottom:20px;">🎄🎅</div>
  <div id="res" style="font-size:3.5rem;font-weight:900;color:var(--danger);line-height:1.2;">Loading...</div>
</div>
<script>
function c(){
  const now=new Date(); let y=now.getFullYear(); let xmas=new Date(y, 11, 25);
  if(now.getMonth()===11 && now.getDate()>25) xmas.setFullYear(y+1);
  const diff=xmas-now; const d=Math.floor(diff/86400000), h=Math.floor((diff%86400000)/3600000), m=Math.floor((diff%3600000)/60000);
  document.getElementById('res').innerHTML=`${d} Days<br>${h} Hours<br>${m} Mins`;
} c(); setInterval(c, 60000);
</script>

  <div class="tool-container">
    <h1>Prime Number Sequence</h1>
<div class="card">
  <label>🔢 How many primes to generate? (Max 1000)</label>
  <input type="number" id="n" value="50" min="1" max="1000">
</div>
<button onclick="c()">Generate Primes</button>
<textarea id="out" rows="6" readonly style="font-family:monospace;font-size:1.1rem;word-break:break-all;"></textarea>
<script>
function isP(num){ for(let i=2,s=Math.sqrt(num);i<=s;i++)if(num%i===0)return false; return num>1; }
function c(){
  const n=parseInt(document.getElementById('n').value); if(!n||n<1||n>1000)return;
  let p=[], c=2; while(p.length<n){ if(isP(c))p.push(c); c++; }
  document.getElementById('out').value=p.join(', ');
} c();
</script>

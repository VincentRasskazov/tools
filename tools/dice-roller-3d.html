  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Dice Roller</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} #die{width:100px;height:100px;background:#2563eb;color:white;display:flex;align-items:center;justify-content:center;font-size:4rem;font-weight:bold;border-radius:16px;margin:20px auto;box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2);} button{padding:12px 24px;background:#1e293b;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:1.2rem;}</style></head>
<body><div class="tool-container"><h1>Roll the Dice</h1><div id="die">⚅</div><button onclick="roll()">Roll 1d6</button></div>
<script>const d=['⚀','⚁','⚂','⚃','⚄','⚅']; function roll(){ let i=0; const el=document.getElementById('die'); const int=setInterval(()=>{el.innerText=d[Math.floor(Math.random()*6)]; i++; if(i>10){clearInterval(int); el.innerText=d[Math.floor(Math.random()*6)];}}, 50); }</script></body></html>

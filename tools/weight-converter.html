<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>weight converter Tool</title>
  <meta name="description" content="weight converter online tool.">
  <meta name="category" content="Converters">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">weight converter Tool</h1>
  </div>

  <h1>weight converter Tool</h1>

  <p>This is a starter tool page for <strong>weight converter</strong>.</p>


  <input id="value" type="number" placeholder="Enter value" style="width:120px;">
  <select id="from">
    <option value="kg">Kilogram (kg)</option>
    <option value="g">Gram (g)</option>
    <option value="mg">Milligram (mg)</option>
    <option value="lb">Pound (lb)</option>
  </select>
  to
  <select id="to">
    <option value="kg">Kilogram (kg)</option>
    <option value="g">Gram (g)</option>
    <option value="mg">Milligram (mg)</option>
    <option value="lb">Pound (lb)</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    const factors = {
      kg: 1,
      g: 0.001,
      mg: 0.000001,
      lb: 0.45359237
    };
    function run() {
      const value = parseFloat(document.getElementById('value').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (isNaN(value)) {
        document.getElementById('output').innerText = 'Enter a valid number.';
        return;
      }
      const kg = value * factors[from];
      const result = kg / factors[to];
      document.getElementById('output').innerText = value + ' ' + from + ' = ' + result + ' ' + to;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

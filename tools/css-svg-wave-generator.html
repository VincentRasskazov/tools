<body>
  <div class="tool-container">
    <h1>SVG Wave Generator</h1>
<div id="box" style="height:150px;background:var(--bg);border-radius:12px;margin-bottom:20px;overflow:hidden;position:relative;border:1px solid var(--border);">
  <svg id="svg" viewBox="0 0 1440 320" style="position:absolute;bottom:0;width:100%;height:auto;display:block;"><path id="pth" fill="#3b82f6" fill-opacity="1" d="M0,160L48,170.7C96,181,192,203,288,197.3C384,192,480,160,576,149.3C672,139,768,149,864,176C960,203,1056,245,1152,240C1248,235,1344,181,1392,154.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>
</div>
<div class="row">
  <div class="card"><label>🎨 Color</label><input type="color" id="c" value="#3b82f6" oninput="u()"></div>
  <button onclick="r()" style="margin:25px 0;">🎲 Randomize Wave</button>
</div>
<textarea id="out" rows="6" readonly style="font-family:monospace;font-size:0.8rem;"></textarea>
<script>
function u(){ document.getElementById('pth').setAttribute('fill', document.getElementById('c').value); document.getElementById('out').value=document.getElementById('box').innerHTML.trim(); }
function r(){
  let d="M0,160"; let py=160;
  for(let x=100; x<=1440; x+=150){ const cy=Math.random()*200+50; d+=`C${x-75},${py},${x-75},${cy},${x},${cy}`; py=cy; }
  d+="L1440,320L0,320Z"; document.getElementById('pth').setAttribute('d', d); u();
} u();
</script>

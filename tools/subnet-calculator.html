<body>
  <div class="tool-container">
    <h1>Subnet Calculator</h1>
<label>IP Address</label><input type="text" id="ip" value="192.168.1.1">
<label>CIDR Prefix (/)</label><input type="number" id="c" value="24" min="0" max="32">
<button onclick="calc()">Calculate</button>
<div id="res" class="res" style="font-size:1.1rem;text-align:left;"></div>
<script>function calc(){ const ipStr=document.getElementById('ip').value, c=parseInt(document.getElementById('c').value); const parts=ipStr.split('.').map(Number); if(parts.length!==4||c<0||c>32)return; const ip=(parts[0]<<24)|(parts[1]<<16)|(parts[2]<<8)|parts[3]; const mask=(0xffffffff<<(32-c))>>>0; const net=(ip&mask)>>>0; const bc=(net|~mask)>>>0; const u=c>=31?0:(bc-net-1); const ipStrFn=n=>`${(n>>>24)&255}.${(n>>>16)&255}.${(n>>>8)&255}.${n&255}`; document.getElementById('res').innerHTML=`Network: <strong>${ipStrFn(net)}</strong><br>Broadcast: <strong>${ipStrFn(bc)}</strong><br>Netmask: <strong>${ipStrFn(mask)}</strong><br>Usable Hosts: <strong>${u}</strong>`; }</script>
  </div>

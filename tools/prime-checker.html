<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>prime checker Tool</title>
  <meta name="description" content="prime checker online tool.">
  <meta name="category" content="Math Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">prime checker Tool</h1>
  </div>

  <h1>prime checker Tool</h1>

  <p>This is a starter tool page for <strong>prime checker</strong>.</p>


  <label for="input">Enter a number:</label>
  <input id="input" type="number" placeholder="e.g. 17">
  <button onclick="run()">Check Prime</button>

  <p id="output"></p>

  <script>
    function isPrime(n) {
      if (n <= 1) return false;
      if (n <= 3) return true;
      if (n % 2 === 0 || n % 3 === 0) return false;
      for (let i = 5; i * i <= n; i += 6) {
        if (n % i === 0 || n % (i + 2) === 0) return false;
      }
      return true;
    }
    function run() {
      const v = parseInt(document.getElementById('input').value, 10);
      if (isNaN(v)) {
        document.getElementById('output').innerText = "Please enter a valid number.";
        return;
      }
      document.getElementById('output').innerText = isPrime(v) ? `${v} is a prime number.` : `${v} is not a prime number.`;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Pace Calculator</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} .row{display:flex;gap:10px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.5rem;font-weight:bold;text-align:center;color:#16a34a;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Running Pace Calculator</h1><label>Distance</label><div class="row"><input type="number" id="d" placeholder="5"><select id="u"><option value="km">Kilometers</option><option value="mi">Miles</option></select></div><label>Time (Hours : Minutes : Seconds)</label><div class="row"><input type="number" id="h" placeholder="0"><input type="number" id="m" placeholder="30"><input type="number" id="s" placeholder="0"></div><button onclick="c()">Calculate Pace</button><div id="res"></div></div>
<script>function c(){ const d=parseFloat(document.getElementById('d').value), u=document.getElementById('u').value, h=parseInt(document.getElementById('h').value||0), m=parseInt(document.getElementById('m').value||0), s=parseInt(document.getElementById('s').value||0); if(!d)return; const tMins = (h*60)+m+(s/60); const p = tMins/d; const ph = Math.floor(p); const ps = Math.round((p-ph)*60); document.getElementById('res').innerText=`${ph}:${ps.toString().padStart(2,'0')} per ${u}`; }</script></body></html>

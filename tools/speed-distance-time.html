<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Speed Distance Time</h1><p>Leave one blank to calculate.</p><label>Speed (km/h)</label><input type="number" id="s"><label>Distance (km)</label><input type="number" id="d"><label>Time (hours)</label><input type="number" id="t"><button onclick="c()">Calculate</button></div>
<script>function c(){ const s=document.getElementById('s'), d=document.getElementById('d'), t=document.getElementById('t'); const sv=parseFloat(s.value), dv=parseFloat(d.value), tv=parseFloat(t.value); if(!sv && dv && tv) s.value=(dv/tv).toFixed(2); else if(!dv && sv && tv) d.value=(sv*tv).toFixed(2); else if(!tv && sv && dv) t.value=(dv/sv).toFixed(2); }</script>

  <h1>bmi calculator Tool</h1>

  <p>This is a starter tool page for <strong>bmi calculator</strong>.</p>


  <label for="weight">Weight (kg):</label>
  <input id="weight" type="number" placeholder="e.g. 70">
  <label for="height">Height (cm):</label>
  <input id="height" type="number" placeholder="e.g. 170">
  <button onclick="run()">Calculate BMI</button>

  <p id="output"></p>

  <script>
    function run() {
      const weight = parseFloat(document.getElementById('weight').value);
      const height = parseFloat(document.getElementById('height').value);
      if (isNaN(weight) || isNaN(height) || weight <= 0 || height <= 0) {
        document.getElementById('output').innerText = "Please enter valid weight and height.";
        return;
      }
      const heightM = height / 100;
      const bmi = weight / (heightM * heightM);
      let category = '';
      if (bmi < 18.5) category = 'Underweight';
      else if (bmi < 25) category = 'Normal weight';
      else if (bmi < 30) category = 'Overweight';
      else category = 'Obesity';
      document.getElementById('output').innerText = `Your BMI is ${bmi.toFixed(2)} (${category}).`;
    }
  </script>

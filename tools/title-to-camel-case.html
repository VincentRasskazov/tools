<body>
  <div class="tool-container">
    <h1>Title to Camel Case</h1>
<textarea id="in" rows="3" placeholder="My Example Variable" oninput="c()"></textarea>
<textarea id="out" rows="3" readonly placeholder="myExampleVariable"></textarea>
<script>function c(){ const t=document.getElementById('in').value.trim(); if(!t){document.getElementById('out').value='';return;} const w=t.split(/\s+/); document.getElementById('out').value = w[0].toLowerCase() + w.slice(1).map(x=>x.charAt(0).toUpperCase()+x.slice(1).toLowerCase()).join(''); }</script>
  </div>
</body>

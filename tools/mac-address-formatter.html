  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>MAC Formatter</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;font-family:monospace;font-size:16px;} .res{background:#f8fafc;padding:10px;border:1px solid #e2e8f0;border-radius:6px;font-family:monospace;margin-bottom:10px;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">MAC Formatter</h1>
<input type="text" id="in" placeholder="001A2B3C4D5E" oninput="c()">
<div class="res" id="r1">00:1A:2B:3C:4D:5E</div><div class="res" id="r2">00-1A-2B-3C-4D-5E</div><div class="res" id="r3">001A.2B3C.4D5E</div></div>
<script>function c(){ const v = document.getElementById('in').value.toUpperCase().replace(/[^A-F0-9]/g, ''); if(v.length !== 12) return; const p = v.match(/.{1,2}/g); document.getElementById('r1').innerText = p.join(':'); document.getElementById('r2').innerText = p.join('-'); document.getElementById('r3').innerText = v.match(/.{1,4}/g).join('.'); }</script></body></html>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>RGBA to Hex</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .row{display:flex;gap:10px;} input{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;text-align:center;} #box{height:100px;border-radius:6px;margin-top:20px;border:1px solid #ccc;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">RGBA to Hex</h1>
<div class="row"><div><label>R</label><input type="number" id="r" value="37" min="0" max="255" oninput="c()"></div><div><label>G</label><input type="number" id="g" value="99" min="0" max="255" oninput="c()"></div><div><label>B</label><input type="number" id="b" value="235" min="0" max="255" oninput="c()"></div><div><label>A</label><input type="number" id="a" value="0.5" min="0" max="1" step="0.1" oninput="c()"></div></div>
<label>Hex Result</label><input type="text" id="out" readonly>
<div id="box"></div></div>
<script>function c(){ const r=document.getElementById('r').value, g=document.getElementById('g').value, b=document.getElementById('b').value, a=document.getElementById('a').value; document.getElementById('box').style.background = `rgba(${r},${g},${b},${a})`; const hex = '#'+[r,g,b,Math.round(a*255)].map(x=>parseInt(x).toString(16).padStart(2,'0')).join(''); document.getElementById('out').value=hex.toUpperCase(); } window.onload=c;</script></body></html>

<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Right Triangle Calc</h1><p>Leave one blank to solve.</p><label>Side A</label><input type="number" id="a"><label>Side B</label><input type="number" id="b"><label>Hypotenuse C</label><input type="number" id="c"><button onclick="c()">Calculate</button><div id="res"></div></div>
<script>function c(){ const a=document.getElementById('a').value, b=document.getElementById('b').value, c=document.getElementById('c').value; if(a&&b&&!c) document.getElementById('res').innerText = "c = " + Math.sqrt(a*a + b*b).toFixed(2); else if(a&&c&&!b) document.getElementById('res').innerText = "b = " + Math.sqrt(c*c - a*a).toFixed(2); else if(b&&c&&!a) document.getElementById('res').innerText = "a = " + Math.sqrt(c*c - b*b).toFixed(2); }</script>
</body>

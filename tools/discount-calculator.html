<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>discount calculator Tool</title>
  <meta name="description" content="discount calculator online tool.">
  <meta name="category" content="Calculators">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">discount calculator Tool</h1>
  </div>

  <h1>discount calculator Tool</h1>

  <p>This is a starter tool page for <strong>discount calculator</strong>.</p>


  <label for="price">Original Price:</label>
  <input id="price" type="number" placeholder="e.g. 100">
  <label for="discount">Discount (%):</label>
  <input id="discount" type="number" placeholder="e.g. 20">
  <button onclick="run()">Calculate Discount</button>

  <p id="output"></p>

  <script>
    function run() {
      const price = parseFloat(document.getElementById('price').value);
      const discount = parseFloat(document.getElementById('discount').value);
      if (isNaN(price) || isNaN(discount) || price < 0 || discount < 0) {
        document.getElementById('output').innerText = "Please enter valid price and discount.";
        return;
      }
      const final = price * (1 - discount / 100);
      document.getElementById('output').innerText = `Final price: $${final.toFixed(2)}`;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

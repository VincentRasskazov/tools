  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>HTML to Markdown</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;font-family:monospace;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">HTML to Markdown</h1><textarea id="in" placeholder="<strong>Bold</strong> and <em>Italic</em>"></textarea><button onclick="c()">Convert to Markdown</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ let t = document.getElementById('in').value; t = t.replace(/<strong>(.*?)<\/strong>/gi, '**$1**').replace(/<b>(.*?)<\/b>/gi, '**$1**').replace(/<em>(.*?)<\/em>/gi, '*$1*').replace(/<i>(.*?)<\/i>/gi, '*$1*').replace(/<a href="(.*?)">(.*?)<\/a>/gi, '[$2]($1)').replace(/<br\s*[\/]?>/gi, '\n').replace(/<p>(.*?)<\/p>/gi, '$1\n\n'); document.getElementById('out').value = t.replace(/<[^>]*>?/gm, ''); }</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>date difference Tool</title>
  <meta name="description" content="date difference online tool.">
  <meta name="category" content="Date Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">date difference Tool</h1>
  </div>

  <h1>date difference Tool</h1>

  <p>This is a starter tool page for <strong>date difference</strong>.</p>


  <label for="date1">Start Date:</label>
  <input id="date1" type="date">
  <label for="date2">End Date:</label>
  <input id="date2" type="date">
  <button onclick="run()">Calculate Difference</button>

  <p id="output"></p>

  <script>
    function run() {
      const d1 = document.getElementById('date1').value;
      const d2 = document.getElementById('date2').value;
      if (!d1 || !d2) {
        document.getElementById('output').innerText = "Please select both dates.";
        return;
      }
      const diff = Math.abs(new Date(d2) - new Date(d1));
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      document.getElementById('output').innerText = `Difference: ${days} day(s)`;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

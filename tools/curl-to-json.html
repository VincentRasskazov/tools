<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">cURL to JSON</h1><textarea id="in" placeholder="curl -X POST https://api.com -d 'foo=bar'"></textarea><button onclick="c()">Convert</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ const t=document.getElementById('in').value; let o={method:'GET', url:'', headers:{}, data:''}; const u=t.match(/['"](https?:\/\/[^'"]+)['"]/); if(u)o.url=u[1]; if(t.includes('-X POST')||t.includes('--data'))o.method='POST'; const d=t.match(/--data ['"]([^'"]+)['"]/); if(d)o.data=d[1]; document.getElementById('out').value=JSON.stringify(o,null,2); }</script>

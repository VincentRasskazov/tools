<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>ascii to hex Tool</title>
  <meta name="description" content="ascii to hex online tool.">
  <meta name="category" content="Encoding Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">ascii to hex Tool</h1>
  </div>

  <h1>ascii to hex Tool</h1>

  <p>This is a starter tool page for <strong>ascii to hex</strong>.</p>


  <label for="input">ASCII Text:</label>
  <input id="input" placeholder="Enter ASCII text">
  <button onclick="run()">Convert to Hex</button>

  <p id="output"></p>

  <script>
    function run() {
      const v = document.getElementById('input').value;
      if (!v) {
        document.getElementById('output').innerText = "Please enter ASCII text.";
        return;
      }
      const hex = Array.from(v).map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join(' ');
      document.getElementById('output').innerText = hex;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

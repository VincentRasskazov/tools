<!DOCTYPE html>
<html lang="en"><head>
  <meta name="description" content="Generate SEO meta tags for your website header.">
  <meta property="og:title" content="Meta Tag Generator">
  <meta property="og:description" content="Generate SEO meta tags for your website header.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Meta Tag Generator">
  <meta name="twitter:description" content="Generate SEO meta tags for your website header.">
  <meta charset="UTF-8"><title>Meta Tags</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input,textarea{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;} #out{background:#1e293b;color:#a5b4fc;padding:15px;margin-top:20px;font-family:monospace;height:150px;}</style></head>
<body><div class="tool-container"><h1>Meta Tag Generator</h1>
<input type="text" id="t" placeholder="Page Title (Max 60 chars)">
<textarea id="d" placeholder="Page Description (Max 160 chars)"></textarea>
<input type="text" id="k" placeholder="Keywords (comma separated)">
<input type="text" id="a" placeholder="Author">
<button onclick="c()">Generate HTML</button>
<textarea id="out" readonly></textarea></div>
<script>function c(){ const t=document.getElementById('t').value, d=document.getElementById('d').value, k=document.getElementById('k').value, a=document.getElementById('a').value; document.getElementById('out').value = `<title>${t}</title>\n<meta name="description" content="${d}">\n<meta name="keywords" content="${k}">\n<meta name="author" content="${a}">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">`; }</script></body></html>

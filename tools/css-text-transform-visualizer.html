.tool-container { max-width: 650px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); border: 1px solid var(--border); }

<body>
  <div class="tool-container">
    <h1>CSS Text Transform</h1>
<div style="background:var(--bg);border:1px solid var(--border);padding:40px 20px;border-radius:12px;margin-bottom:20px;text-align:center;">
  <div id="pv" style="font-size:2rem;font-weight:bold;">the quick brown fox</div>
</div>
<div class="row" style="flex-wrap:wrap;margin-bottom:20px;">
  <button onclick="u('uppercase')">uppercase</button>
  <button onclick="u('lowercase')" style="background:var(--success)">lowercase</button>
  <button onclick="u('capitalize')" style="background:var(--warning)">capitalize</button>
  <button onclick="u('none')" style="background:var(--danger)">none</button>
</div>
<textarea id="out" rows="2" readonly style="font-family:monospace;text-align:center;"></textarea>
<script>function u(v){ document.getElementById('pv').style.textTransform=v; document.getElementById('out').value=`text-transform: ${v};`; } u('uppercase');</script>

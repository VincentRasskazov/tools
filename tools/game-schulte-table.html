  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

.tool-container { max-width: 680px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1), 0 10px 15px -3px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.5); }

.card:hover { border-color: #cbd5e1; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
.grid-game { display: grid; gap: 10px; margin: 0 auto 20px; }
.grid-cell { background: var(--surface); border: 2px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; cursor: pointer; transition: 0.1s; user-select: none; }

<body>
  <div class="tool-container">
    <h1>Schulte Table</h1>
<div class="row" style="margin-bottom:15px;text-align:center;">
  <div id="tgt" style="font-size:1.5rem;font-weight:bold;color:var(--primary);">Find: 1</div>
  <div id="tm" style="font-size:1.5rem;font-weight:bold;color:var(--danger);">0.00s</div>
</div>
<div id="grid" class="grid-game" style="grid-template-columns:repeat(4,1fr); width:300px; height:300px;"></div>
<button id="btn" onclick="st()">Start Challenge</button>
<script>
let n=1, t0, int, run=false;
function st(){ n=1; run=true; document.getElementById('btn').style.display='none'; document.getElementById('tgt').innerText='Find: '+n; t0=Date.now(); clearInterval(int); int=setInterval(()=>{document.getElementById('tm').innerText=((Date.now()-t0)/1000).toFixed(2)+'s';},10); drw(); }
function drw(){ let nums=Array.from({length:16},(_,i)=>i+1).sort(()=>0.5-Math.random()); const g=document.getElementById('grid'); g.innerHTML=''; nums.forEach(num=>{ g.innerHTML+=`<div class="grid-cell" onclick="clk(${num}, this)">${num}</div>`; }); }
function clk(num, el){ if(!run)return; if(num===n){ el.style.background='var(--success)'; el.style.color='#fff'; n++; if(n>16){ clearInterval(int); run=false; document.getElementById('tgt').innerText='FINISHED!'; document.getElementById('btn').style.display='block'; document.getElementById('btn').innerText='Play Again'; } else { document.getElementById('tgt').innerText='Find: '+n; } } else { el.style.background='var(--danger)'; setTimeout(()=>{el.style.background='var(--surface)';}, 200); } }
</script>

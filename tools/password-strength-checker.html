  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #f4f7f9 0%, #e2e8f0 100%); min-height: 100vh; color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
.tool-container { max-width: 680px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1), 0 10px 15px -3px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.5); }
h1 { text-align: center; color: var(--primary); margin: 0 0 30px 0; font-size: 2.4rem; font-weight: 800; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(59,130,246,0.1); }
label { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 8px; color: #334155; font-size: 0.95rem; }
input[type="text"], input[type="number"], input[type="url"], input[type="email"], input[type="date"], select, textarea { width: 100%; padding: 16px; border: 2px solid var(--border); border-radius: 12px; margin-bottom: 20px; font-size: 1rem; transition: all 0.2s ease; box-sizing: border-box; background: #fcfcfc; color: var(--text); box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), inset 0 2px 4px rgba(0,0,0,0.02); background: #fff; }
button { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); margin-bottom: 10px; letter-spacing: 0.5px; }
button:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 8px 15px -3px rgba(59, 130, 246, 0.4); }
button:active { transform: translateY(0); box-shadow: 0 2px 4px -1px rgba(59, 130, 246, 0.3); }
button:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; }
.res { margin-top: 25px; padding: 30px; background: linear-gradient(to right, #f8fafc, #f1f5f9); border-radius: 16px; text-align: center; font-size: 1.5rem; font-weight: 800; border: 2px dashed #cbd5e1; color: var(--primary); word-break: break-word; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
.row { display: flex; gap: 20px; } .row > div { flex: 1; }
.card { background: #fff; padding: 25px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; transition: 0.2s; }
.card:hover { border-color: #cbd5e1; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
</style>

<body>
  <div class="tool-container">
    <h1>Password Strength</h1>
<div class="card">
  <label>🔒 Type a password to test</label>
  <input type="text" id="p" placeholder="SuperSecret123!" oninput="c()">
  <div style="height:10px;width:100%;background:var(--border);border-radius:5px;overflow:hidden;margin-top:10px;">
    <div id="bar" style="height:100%;width:0%;background:var(--danger);transition:0.3s;"></div>
  </div>
  <div id="msg" style="text-align:right;font-weight:bold;margin-top:5px;color:#64748b;">Too Short</div>
</div>
<script>
function c(){
  const p=document.getElementById('p').value; let s=0;
  if(p.length>7)s+=25; if(p.length>11)s+=25;
  if(/[A-Z]/.test(p))s+=15; if(/[a-z]/.test(p))s+=15;
  if(/[0-9]/.test(p))s+=10; if(/[^A-Za-z0-9]/.test(p))s+=10;
  const b=document.getElementById('bar'), m=document.getElementById('msg');
  b.style.width=s+'%';
  if(s<30){b.style.background='var(--danger)';m.innerText='Weak';m.style.color='var(--danger)';}
  else if(s<70){b.style.background='var(--warning)';m.innerText='Moderate';m.style.color='var(--warning)';}
  else {b.style.background='var(--success)';m.innerText='Strong!';m.style.color='var(--success)';}
}
</script>
  </div>
</body>

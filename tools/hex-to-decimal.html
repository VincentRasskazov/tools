<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>hex to decimal Tool</title>
  <meta name="description" content="hex to decimal online tool.">
  <meta name="category" content="Math Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">hex to decimal Tool</h1>
  </div>

  <h1>hex to decimal Tool</h1>

  <p>This is a starter tool page for <strong>hex to decimal</strong>.</p>


  <label for="input">Hex:</label>
  <input id="input" placeholder="Enter hex (e.g. 1A3F)">
  <button onclick="run()">Convert to Decimal</button>

  <p id="output"></p>

  <script>
    function run() {
      const v = document.getElementById('input').value.trim();
      if (!/^[0-9a-fA-F]+$/.test(v)) {
        document.getElementById('output').innerText = "Please enter a valid hex string.";
        return;
      }
      document.getElementById('output').innerText = parseInt(v, 16).toString(10);
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

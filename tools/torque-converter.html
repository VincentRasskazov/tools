<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Torque Converter</h1>
<label>Newton-meter (Nm)</label><input type="number" id="nm" oninput="c('nm')">
<label>Pound-foot (lb-ft)</label><input type="number" id="lbft" oninput="c('lbft')"></div>
<script>function c(id){ const val=parseFloat(document.getElementById(id).value); if(isNaN(val))return; if(id==='nm') document.getElementById('lbft').value=(val*0.73756).toFixed(4); else document.getElementById('nm').value=(val/0.73756).toFixed(4); }</script></body></html>

<body>
  <div class="tool-container">
    <h1>Transform-Origin</h1>
<div class="card" style="height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden;">
  <div id="box" style="width:100px;height:100px;background:var(--primary);border-radius:8px;transform-origin:center center;animation:spin 3s linear infinite;position:relative;">
    <div style="position:absolute;width:6px;height:6px;background:var(--danger);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);" id="dot"></div>
  </div>
</div>
<div class="row">
  <div class="card"><label>📍 Transform Origin</label>
    <select id="to" onchange="u()">
      <option value="center center">center center</option><option value="top left">top left</option><option value="top right">top right</option>
      <option value="bottom left">bottom left</option><option value="bottom right">bottom right</option><option value="50% 100%">50% 100% (bottom center)</option>
    </select>
  </div>
</div>
<textarea id="out" rows="2" readonly style="font-family:monospace;text-align:center;"></textarea>
<style>@keyframes spin{to{transform:rotate(360deg);}}</style>
<script>function u(){ const v=document.getElementById('to').value; document.getElementById('box').style.transformOrigin=v; const pts=v.split(' '); document.getElementById('dot').style.top=pts[0]==='top'?'0%':pts[0]==='bottom'?'100%':pts[0]==='center'?'50%':pts[0]; document.getElementById('dot').style.left=pts[1]==='left'?'0%':pts[1]==='right'?'100%':pts[1]==='center'?'50%':pts[1]||'50%'; document.getElementById('out').value=`transform-origin: ${v};`; } u();</script>
  </div>
</body>

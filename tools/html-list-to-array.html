:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

<body>
  <div class="tool-container">
    <h1>HTML List to JSON Array</h1>
<textarea id="in" rows="5" placeholder="<ul>\n  <li>Apple</li>\n  <li>Banana</li>\n</ul>"></textarea>
<button onclick="c()">Extract Array</button>
<textarea id="out" rows="5" readonly style="margin-top:20px;font-family:monospace;"></textarea>
<script>
function c(){
  try{
    const parser = new DOMParser();
    const doc = parser.parseFromString(document.getElementById('in').value, 'text/html');
    const items = [...doc.querySelectorAll('li')].map(li => li.textContent.trim());
    document.getElementById('out').value = JSON.stringify(items, null, 2);
  } catch(e) { document.getElementById('out').value = "Invalid HTML List"; }
}
</script>
  </div>
</body>

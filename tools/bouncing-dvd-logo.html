<body>
  <div class="tool-container">
    <h1>Bouncing Logo</h1>
<canvas id="c" width="400" height="300" style="background:#000;"></canvas>
<div id="sc" style="text-align:center;font-weight:bold;margin-top:10px;color:var(--primary);">Corner Hits: 0</div>
<script>
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
let x=50, y=50, dx=2, dy=2, w=80, h=40, col='#3b82f6', hits=0;
function rCol(){ return '#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'); }
function anim(){
  ctx.clearRect(0,0,400,300);
  ctx.fillStyle=col; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='white'; ctx.font='20px sans-serif'; ctx.textAlign='center'; ctx.fillText('DVD', x+w/2, y+28);
  x+=dx; y+=dy; let hitX=false, hitY=false;
  if(x<=0 || x+w>=400){ dx*=-1; hitX=true; }
  if(y<=0 || y+h>=300){ dy*=-1; hitY=true; }
  if(hitX||hitY) col=rCol();
  if(hitX&&hitY){ hits++; document.getElementById('sc').innerText="Corner Hits: "+hits; }
  requestAnimationFrame(anim);
} anim();
</script>

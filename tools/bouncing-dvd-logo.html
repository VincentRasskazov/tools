layout: null
title: "DVD Logo Universe: Optimized"
category: "Games"
description: "A high-performance idle tycoon. Harvest data packets, unlock satellites, and prestige for eternal growth."
permalink: /tools/bouncing-dvd-logo.html
---
<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <title>DVD Universe: Ultra</title>
    <style>
        :root { --primary: #a855f7; --bg: #030712; --surface: #111827; --text: #f9fafb; --border: #374151; --accent: #10b981; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; overflow-y: scroll; }
        .tool-container { max-width: 950px; width: 100%; background: var(--surface); padding: 25px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 0 60px rgba(0,0,0,0.5); }
        
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat { background: #000; padding: 12px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .stat-val { display: block; font-size: 1.4rem; font-weight: 900; color: var(--accent); }
        .stat-label { font-size: 0.6rem; text-transform: uppercase; color: #9ca3af; letter-spacing: 1px; }

        canvas { background: #000; display: block; width: 100%; border-radius: 12px; border: 2px solid #1f2937; cursor: crosshair; }

        .upgrades-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 20px; }
        .upgrade-card { background: #1f2937; padding: 14px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; transition: 0.15s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
        .upgrade-card:hover:not(.disabled) { border-color: var(--primary); transform: scale(1.02); background: #374151; }
        .upgrade-card.disabled { opacity: 0.4; cursor: not-allowed; }
        
        .up-lvl { position: absolute; top: 10px; right: 10px; font-size: 0.65rem; background: var(--primary); padding: 2px 6px; border-radius: 4px; }
        .up-title { font-weight: 700; display: block; font-size: 0.85rem; margin-bottom: 2px; }
        .up-cost { color: #fbbf24; font-weight: 800; font-size: 0.8rem; }
        .up-desc { font-size: 0.7rem; color: #9ca3af; margin-top: 4px; display: block; }
        
        .prestige-btn { grid-column: 1 / -1; background: linear-gradient(90deg, #4f46e5, #9333ea); color: white; padding: 15px; border-radius: 12px; text-align: center; font-weight: 900; cursor: pointer; border: none; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="tool-container">
        <div class="stats-bar">
            <div class="stat"><span class="stat-label">Packets</span><span id="currency" class="stat-val">0</span></div>
            <div class="stat"><span class="stat-label">Satellites</span><span id="sats" class="stat-val">0</span></div>
            <div class="stat"><span class="stat-label">Multi</span><span id="multi" class="stat-val">1.0x</span></div>
            <div class="stat"><span class="stat-label">Prestige</span><span id="prestige" class="stat-val">0</span></div>
        </div>

        <canvas id="c" width="800" height="400"></canvas>

        <div class="upgrades-container" id="upgrades-grid"></div>
        <button id="prestige-btn" class="prestige-btn" onclick="prestige()">ASCEND FOR PERMANENT 2X MULTIPLIER (Cost: 1M Packets)</button>
    </div>

<script>
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
const grid = document.getElementById('upgrades-grid');

let game = {
    packets: 0,
    totalBounces: 0,
    prestigeLevel: 0,
    satellites: [],
    upgrades: {
        speed: { lvl: 1, base: 15, growth: 1.3, title: "⚡ Engine Clock", desc: "Boosts logo velocity.", unlock: 0 },
        value: { lvl: 1, base: 10, growth: 1.4, title: "💎 Data Density", desc: "More packets per bounce.", unlock: 0 },
        size:  { lvl: 0, base: 100, growth: 1.6, title: "📏 Scale Factor", desc: "Increases hit surface area.", unlock: 10 },
        sat:   { lvl: 0, base: 500, growth: 2.1, title: "🛰️ Data Satellite", desc: "Adds a smaller, faster logo.", unlock: 50 },
        magnet:{ lvl: 0, base: 1000, growth: 2.5, title: "🎯 Corner Aim", desc: "Subtly guides toward corners.", unlock: 100 },
        quantum:{lvl: 0, base: 10000, growth: 1.8, title: "⚛️ Quantum Luck", desc: "Increases critical hit chance.", unlock: 500 },
        auto:  { lvl: 0, base: 50000, growth: 3, title: "🤖 Autopilot", desc: "Generates packets every second.", unlock: 1000 }
    }
};

let mainLogo = { x:100, y:100, dx:3, dy:3, w:80, h:40, col:'#a855f7' };

function rCol(){ return `hsl(${Math.random()*360}, 80%, 60%)`; }

function buy(id) {
    let up = game.upgrades[id];
    let cost = Math.floor(up.base * Math.pow(up.growth, up.lvl));

    if (game.packets >= cost) {
        game.packets -= cost;
        up.lvl++;
        if(id === 'sat') {
            game.satellites.push({ x: 400, y: 200, dx: 5, dy: 5, w: 40, h: 20, col: rCol() });
        }
        if(id === 'size') { mainLogo.w += 8; mainLogo.h += 4; }
        renderUpgrades();
        updateUI();
    }
}

function prestige() {
    if(game.packets >= 1000000) {
        game.packets = 0;
        game.prestigeLevel++;
        // Reset non-permanent upgrades
        for(let id in game.upgrades) {
            if(id !== 'prestige') game.upgrades[id].lvl = (id === 'speed' || id === 'value') ? 1 : 0;
        }
        game.satellites = [];
        mainLogo = { x:100, y:100, dx:3, dy:3, w:80, h:40, col:'#a855f7' };
        renderUpgrades();
        updateUI();
    }
}

function updatePhysics(obj, isMain) {
    let speedMult = 1 + (game.upgrades.speed.lvl * 0.1);
    
    // Magnetism Logic (Reduced force to prevent corner-locking)
    if(game.upgrades.magnet.lvl > 0) {
        let pull = game.upgrades.magnet.lvl * 0.005;
        obj.dx += (obj.x < cvs.width/2) ? -pull : pull;
        obj.dy += (obj.y < cvs.height/2) ? -pull : pull;
    }

    // Clamp speed
    let maxS = 10 * speedMult;
    obj.dx = Math.max(-maxS, Math.min(maxS, obj.dx));
    obj.dy = Math.max(-maxS, Math.min(maxS, obj.dy));

    obj.x += obj.dx;
    obj.y += obj.dy;

    let hit = false;
    let hitX = false;
    let hitY = false;

    if(obj.x <= 0) { obj.x = 0; obj.dx *= -1; hit = hitX = true; }
    else if(obj.x + obj.w >= cvs.width) { obj.x = cvs.width - obj.w; obj.dx *= -1; hit = hitX = true; }
    
    if(obj.y <= 0) { obj.y = 0; obj.dy *= -1; hit = hitY = true; }
    else if(obj.y + obj.h >= cvs.height) { obj.y = cvs.height - obj.h; obj.dy *= -1; hit = hitY = true; }

    if(hit) {
        obj.col = rCol();
        if(isMain) game.totalBounces++;
        
        let pBase = game.upgrades.value.lvl * Math.pow(2, game.prestigeLevel);
        if(Math.random() < game.upgrades.quantum.lvl * 0.02) pBase *= 10;
        
        game.packets += (hitX && hitY) ? pBase * 50 : pBase;
        updateUI();
    }
}

function renderUpgrades() {
    let html = '';
    for (let id in game.upgrades) {
        let up = game.upgrades[id];
        if (game.totalBounces < up.unlock && up.lvl === 0) continue;
        let cost = Math.floor(up.base * Math.pow(up.growth, up.lvl));
        let disabled = game.packets < cost ? 'disabled' : '';
        html += `
            <div class="upgrade-card ${disabled}" onclick="buy('${id}')">
                <span class="up-lvl">Lvl ${up.lvl}</span>
                <span class="up-title">${up.title}</span>
                <span class="up-cost">Cost: ${cost.toLocaleString()}</span>
                <span class="up-desc">${up.desc}</span>
            </div>`;
    }
    grid.innerHTML = html;
}

function updateUI() {
    document.getElementById('currency').innerText = Math.floor(game.packets).toLocaleString();
    document.getElementById('sats').innerText = game.satellites.length;
    document.getElementById('multi').innerText = Math.pow(2, game.prestigeLevel).toFixed(1) + 'x';
    document.getElementById('prestige').innerText = game.prestigeLevel;
    document.getElementById('prestige-btn').style.display = game.packets >= 1000000 ? 'block' : 'none';
}

function loop() {
    ctx.fillStyle = 'rgba(3, 7, 18, 0.25)';
    ctx.fillRect(0, 0, cvs.width, cvs.height);

    // Draw Main
    updatePhysics(mainLogo, true);
    ctx.fillStyle = mainLogo.col;
    ctx.fillRect(mainLogo.x, mainLogo.y, mainLogo.w, mainLogo.h);
    ctx.fillStyle = 'white';
    ctx.font = `bold ${mainLogo.h * 0.5}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText('DVD', mainLogo.x + mainLogo.w/2, mainLogo.y + mainLogo.h * 0.65);

    // Draw Satellites
    game.satellites.forEach(s => {
        updatePhysics(s, false);
        ctx.fillStyle = s.col;
        ctx.fillRect(s.x, s.y, s.w, s.h);
    });

    // Auto-Packets
    if(game.upgrades.auto.lvl > 0) {
        game.packets += (game.upgrades.auto.lvl * 0.1);
    }

    requestAnimationFrame(loop);
}

// Initial UI check every 500ms to keep costs updated without lag
setInterval(renderUpgrades, 500);
updateUI();
loop();
</script>
</body>
</html>

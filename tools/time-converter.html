<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>time converter Tool</title>
  <meta name="description" content="time converter online tool.">
  <meta name="category" content="Date Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">time converter Tool</h1>
  </div>

  <h1>time converter Tool</h1>

  <p>This is a starter tool page for <strong>time converter</strong>.</p>


  <input id="value" type="number" placeholder="Enter value" style="width:120px;">
  <select id="from">
    <option value="h">Hours</option>
    <option value="min">Minutes</option>
    <option value="s">Seconds</option>
  </select>
  to
  <select id="to">
    <option value="h">Hours</option>
    <option value="min">Minutes</option>
    <option value="s">Seconds</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    const factors = { h: 3600, min: 60, s: 1 };
    function run() {
      const value = parseFloat(document.getElementById('value').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (isNaN(value)) {
        document.getElementById('output').innerText = 'Enter a valid number.';
        return;
      }
      const seconds = value * factors[from];
      const result = seconds / factors[to];
      document.getElementById('output').innerText = value + ' ' + from + ' = ' + result + ' ' + to;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

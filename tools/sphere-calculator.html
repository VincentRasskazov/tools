  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Sphere Calc</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} #res{margin-top:20px;background:#f8fafc;padding:15px;border-radius:6px;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Sphere Calculator</h1><label>Radius (r)</label><input type="number" id="r" oninput="c()"><div id="res"></div></div>
<script>function c(){ const r=parseFloat(document.getElementById('r').value); if(r){ const v=(4/3)*Math.PI*Math.pow(r,3), a=4*Math.PI*Math.pow(r,2); document.getElementById('res').innerHTML=`Surface Area: <strong>${a.toFixed(2)}</strong><br>Volume: <strong>${v.toFixed(2)}</strong>`; } }</script></body></html>

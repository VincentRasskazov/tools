<body>
  <div class="tool-container">
    <h1>Falling Sand Sandbox</h1>
<div class="row" style="margin-bottom:10px;">
  <button onclick="c=1;this.style.opacity=1;" style="background:#fde047;color:#000;">Sand</button>
  <button onclick="c=2;this.style.opacity=1;" style="background:#94a3b8;">Wall</button>
  <button onclick="grid=Array(60).fill().map(()=>Array(60).fill(0));" style="background:var(--danger);">Clear</button>
</div>
<div class="card" style="padding:0;overflow:hidden;background:#0f172a;cursor:crosshair;height:350px;">
  <canvas id="cvs" width="300" height="300" style="width:100%;height:100%;display:block;"></canvas>
</div>
<script>
const cvs=document.getElementById('cvs'), ctx=cvs.getContext('2d');
let grid=Array(60).fill().map(()=>Array(60).fill(0)), drw=false, c=1, mx=0, my=0;
cvs.onmousedown=()=>{drw=true}; cvs.onmouseup=()=>{drw=false}; cvs.onmouseleave=()=>{drw=false};
cvs.onmousemove=e=>{ const r=cvs.getBoundingClientRect(); mx=Math.floor((e.clientX-r.left)*(60/r.width)); my=Math.floor((e.clientY-r.top)*(60/r.height)); };
function loop(){
  if(drw && mx>=0 && mx<60 && my>=0 && my<60){ grid[mx][my]=c; if(mx>0)grid[mx-1][my]=c; if(mx<59)grid[mx+1][my]=c; }
  for(let y=58; y>=0; y--){
    for(let x=0; x<60; x++){
      if(grid[x][y]===1){ // sand physics
        if(grid[x][y+1]===0){ grid[x][y+1]=1; grid[x][y]=0; }
        else {
          const l=x>0&&grid[x-1][y+1]===0, r=x<59&&grid[x+1][y+1]===0;
          if(l&&r){ if(Math.random()>0.5){grid[x-1][y+1]=1; grid[x][y]=0;} else {grid[x+1][y+1]=1; grid[x][y]=0;} }
          else if(l){ grid[x-1][y+1]=1; grid[x][y]=0; }
          else if(r){ grid[x+1][y+1]=1; grid[x][y]=0; }
        }
      }
    }
  }
  ctx.clearRect(0,0,300,300);
  for(let x=0;x<60;x++){ for(let y=0;y<60;y++){
    if(grid[x][y]===1){ ctx.fillStyle='#fde047'; ctx.fillRect(x*5,y*5,5,5); }
    else if(grid[x][y]===2){ ctx.fillStyle='#94a3b8'; ctx.fillRect(x*5,y*5,5,5); }
  } } requestAnimationFrame(loop);
} loop();
</script>

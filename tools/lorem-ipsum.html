<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>lorem ipsum Tool</title>
  <meta name="description" content="lorem ipsum online tool.">
  <meta name="category" content="Text Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">lorem ipsum Tool</h1>
  </div>

  <h1>lorem ipsum Tool</h1>

  <p>This is a starter tool page for <strong>lorem ipsum</strong>.</p>


  <input id="input" type="number" min="1" max="10" value="1" placeholder="Paragraphs (1-10)">
  <button onclick="run()">Generate</button>

  <div id="output"></div>

  <script>
    const LOREM = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed non risus. Suspendisse lectus tortor, dignissim sit amet, adipiscing nec, ultricies sed, dolor.";
    function run() {
      let n = parseInt(document.getElementById('input').value, 10);
      if (isNaN(n) || n < 1) n = 1;
      if (n > 10) n = 10;
      let html = '';
      for (let i = 0; i < n; i++) html += `<p>${LOREM}</p>`;
      document.getElementById('output').innerHTML = html;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

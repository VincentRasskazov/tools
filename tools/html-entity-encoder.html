<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">html entity encoder Tool</h1>
  </div>

  <h1>html entity encoder Tool</h1>

  <p>This is a starter tool page for <strong>html entity encoder</strong>.</p>


  <label for="input">Text:</label>
  <input id="input" placeholder="e.g. <>&">
  <button onclick="run()">Encode</button>

  <p id="output"></p>

  <script>
    function run() {
      const v = document.getElementById('input').value;
      const txt = document.createElement('textarea');
      txt.textContent = v;
      document.getElementById('output').innerText = txt.innerHTML;
    }
  </script>

  </div>
</body>

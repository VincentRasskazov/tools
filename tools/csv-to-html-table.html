  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>CSV to HTML Table</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;font-family:monospace;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">CSV to HTML Table</h1><textarea id="in" placeholder="Name,Age&#10;Alice,25&#10;Bob,30"></textarea><button onclick="c()">Convert to HTML</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ const lines = document.getElementById('in').value.trim().split('\n'); if(lines.length===0) return; let t = "<table>\n  <thead>\n    <tr>\n"; lines[0].split(',').forEach(h => t+=`      <th>${h.trim()}</th>\n`); t+="    </tr>\n  </thead>\n  <tbody>\n"; for(let i=1;i<lines.length;i++){ t+="    <tr>\n"; lines[i].split(',').forEach(d => t+=`      <td>${d.trim()}</td>\n`); t+="    </tr>\n"; } t+="  </tbody>\n</table>"; document.getElementById('out').value = t; }</script></body></html>

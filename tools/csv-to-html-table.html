:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

<body>
  <div class="tool-container">
    <h1>CSV to HTML Table</h1>
<textarea id="in" rows="5" placeholder="Name,Age,City&#10;John,30,New York&#10;Jane,25,London"></textarea>
<button onclick="c()">Convert to HTML</button>
<textarea id="out" rows="6" readonly style="margin-top:20px;font-family:monospace;"></textarea>
<script>function c(){ const lines=document.getElementById('in').value.trim().split('\n'); if(!lines.length || lines[0]==='') return; let h="<table>\n  <thead>\n    <tr>\n"; lines[0].split(',').forEach(cell => h+=`      <th>${cell.trim()}</th>\n`); h+="    </tr>\n  </thead>\n  <tbody>\n"; for(let i=1; i<lines.length; i++){ h+="    <tr>\n"; lines[i].split(',').forEach(cell => h+=`      <td>${cell.trim()}</td>\n`); h+="    </tr>\n"; } h+="  </tbody>\n</table>"; document.getElementById('out').value=h; }</script>
  </div>
</body>

  <div class="tool-container">
    <h1>3D Lissajous Web</h1>
<div class="card" style="padding:0;overflow:hidden;background:#000;display:flex;justify-content:center;">
  <canvas id="cvs" width="400" height="400" style="display:block;"></canvas>
</div>
<script>
const cvs=document.getElementById('cvs'), ctx=cvs.getContext('2d');
let a=0;
function loop(){
  ctx.clearRect(0,0,400,400); ctx.strokeStyle='rgba(168, 85, 247, 0.4)'; ctx.lineWidth=2; ctx.beginPath();
  for(let t=0;t<Math.PI*2;t+=0.05){
    let x=150*Math.sin(3*t), y=150*Math.sin(4*t), z=150*Math.sin(5*t);
    let nx=x*Math.cos(a)-z*Math.sin(a), nz=x*Math.sin(a)+z*Math.cos(a); x=nx; z=nz;
    let ny=y*Math.cos(a*0.5)-z*Math.sin(a*0.5); nz=y*Math.sin(a*0.5)+z*Math.cos(a*0.5); y=ny; z=nz;
    if(t===0) ctx.moveTo(200+x, 200+y); else ctx.lineTo(200+x, 200+y);
  } ctx.stroke(); a+=0.02; requestAnimationFrame(loop);
} loop();
</script>

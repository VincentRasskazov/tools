<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>temperature converter Tool</title>
  <meta name="description" content="temperature converter online tool.">
  <meta name="category" content="Converters">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">temperature converter Tool</h1>
  </div>

  <h1>temperature converter Tool</h1>

  <p>This is a starter tool page for <strong>temperature converter</strong>.</p>


  <input id="value" type="number" placeholder="Enter value" style="width:120px;">
  <select id="from">
    <option value="C">Celsius (°C)</option>
    <option value="F">Fahrenheit (°F)</option>
    <option value="K">Kelvin (K)</option>
  </select>
  to
  <select id="to">
    <option value="C">Celsius (°C)</option>
    <option value="F">Fahrenheit (°F)</option>
    <option value="K">Kelvin (K)</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    function convertTemp(value, from, to) {
      let c;
      if (from === 'C') c = value;
      else if (from === 'F') c = (value - 32) * 5/9;
      else if (from === 'K') c = value - 273.15;
      let result;
      if (to === 'C') result = c;
      else if (to === 'F') result = c * 9/5 + 32;
      else if (to === 'K') result = c + 273.15;
      return result;
    }
    function run() {
      const value = parseFloat(document.getElementById('value').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (isNaN(value)) {
        document.getElementById('output').innerText = 'Enter a valid number.';
        return;
      }
      const result = convertTemp(value, from, to);
      document.getElementById('output').innerText = value + ' ' + from + ' = ' + result + ' ' + to;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

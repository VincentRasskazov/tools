<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="Convert temperatures between Celsius, Fahrenheit, and Kelvin instantly.">
  <meta property="og:title" content="Temperature Converter - Celsius to Fahrenheit">
  <meta property="og:description" content="Convert temperatures between Celsius, Fahrenheit, and Kelvin instantly.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub">
  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Temperature Converter - Celsius to Fahrenheit">
  <meta name="twitter:description" content="Convert temperatures between Celsius, Fahrenheit, and Kelvin instantly.">
  
  <meta charset="UTF-8">
  <title>Temperature Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .tool-container { max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .input-row { display: flex; gap: 20px; margin-bottom: 20px; }
    .input-group { flex: 1; }
    label { display: block; font-weight: 600; margin-bottom: 5px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="tool-container">
    <h1 style="text-align: center; color: #2563eb;">Temperature Converter</h1>
    
    <div class="input-row">
      <div class="input-group">
        <label>Celsius (°C)</label>
        <input type="number" id="celsius" oninput="convert('C')">
      </div>
      <div class="input-group">
        <label>Fahrenheit (°F)</label>
        <input type="number" id="fahrenheit" oninput="convert('F')">
      </div>
    </div>
    
    <div class="input-group">
      <label>Kelvin (K)</label>
      <input type="number" id="kelvin" oninput="convert('K')">
    </div>
  </div>
  <script>
    function convert(type) {
      const c = document.getElementById('celsius');
      const f = document.getElementById('fahrenheit');
      const k = document.getElementById('kelvin');
      
      let val;
      
      if(type === 'C') {
        val = parseFloat(c.value);
        f.value = (val * 9/5) + 32;
        k.value = val + 273.15;
      } else if(type === 'F') {
        val = parseFloat(f.value);
        c.value = (val - 32) * 5/9;
        k.value = (val - 32) * 5/9 + 273.15;
      } else if(type === 'K') {
        val = parseFloat(k.value);
        c.value = val - 273.15;
        f.value = (val - 273.15) * 9/5 + 32;
      }
    }
  </script>
</body>
</html>

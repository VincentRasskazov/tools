<body>
  <div class="tool-container">
    <h1>Tic-Tac-Toe</h1>
<div id="msg" style="text-align:center;font-size:2rem;font-weight:bold;color:var(--primary);margin-bottom:20px;">Player X's Turn</div>
<div id="grid" class="grid-game" style="grid-template-columns:repeat(3,1fr); width:300px; height:300px; gap:5px; background:var(--border); padding:5px; border-radius:12px;"></div>
<button onclick="st()" style="margin-top:20px;">Restart Game</button>
<script>
let brd=['','','','','','','','',''], turn='X', run=true;
const win=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function st(){ brd=['','','','','','','','','']; turn='X'; run=true; document.getElementById('msg').innerText="Player X's Turn"; drw(); }
function drw(){
  const g=document.getElementById('grid'); g.innerHTML='';
  brd.forEach((c,i)=>{ g.innerHTML+=`<div style="background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:4rem;font-weight:bold;cursor:pointer;color:${c==='X'?'var(--danger)':'var(--primary)'};" onclick="clk(${i})">${c}</div>`; });
}
function clk(i){
  if(!run || brd[i]!=='')return; brd[i]=turn;
  let won=false; win.forEach(w=>{ if(brd[w[0]]&&brd[w[0]]===brd[w[1]]&&brd[w[0]]===brd[w[2]]) won=true; });
  if(won){ document.getElementById('msg').innerText=`Player ${turn} WINS!`; run=false; }
  else if(!brd.includes('')){ document.getElementById('msg').innerText=`It's a DRAW!`; run=false; }
  else { turn = turn==='X'?'O':'X'; document.getElementById('msg').innerText=`Player ${turn}'s Turn`; } drw();
} st();
</script>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>1RM Calculator</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:2rem;text-align:center;color:#16a34a;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">1RM Calculator</h1><label>Weight Lifted</label><input type="number" id="w" placeholder="225"><label>Reps Performed</label><input type="number" id="r" placeholder="5" max="30"><button onclick="c()">Calculate 1RM</button><div id="res"></div></div>
<script>function c(){ const w=parseFloat(document.getElementById('w').value), r=parseFloat(document.getElementById('r').value); if(w&&r){ const orm = w * (1 + (r/30)); document.getElementById('res').innerText = Math.round(orm) + " Max"; } }</script></body></html>

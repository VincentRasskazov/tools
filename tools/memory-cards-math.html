<body>
  <div class="tool-container">
    <h1>Math Memory</h1>
<div id="grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;"></div>
<button onclick="st()">Restart Game</button>
<script>
let deck=[], f1=null, lock=false, m=0;
function st(){ m=0; f1=null; lock=false; const pairs=[{q:'2+2',a:'4'},{q:'3x3',a:'9'},{q:'10/2',a:'5'},{q:'7-1',a:'6'}]; let arr=[]; pairs.forEach(p=>{arr.push({v:p.q, id:p.a},{v:p.a, id:p.a});}); deck=arr.sort(()=>0.5-Math.random()).map(x=>({...x, flip:false, match:false})); rnd(); }
function rnd(){ document.getElementById('grid').innerHTML=deck.map((c,i)=>`<div style="height:80px;background:${c.flip||c.match?'#fff':'var(--primary)'};border:2px solid ${c.match?'var(--success)':'var(--border)'};border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:bold;cursor:pointer;color:var(--text);" onclick="clk(${i})">${c.flip||c.match?c.v:''}</div>`).join(''); }
function clk(i){ if(lock||deck[i].flip||deck[i].match)return; deck[i].flip=true; rnd(); if(!f1) f1={i,id:deck[i].id}; else { lock=true; if(f1.id===deck[i].id){ deck[f1.i].match=deck[i].match=true; m++; lock=false; f1=null; rnd(); if(m===4)setTimeout(()=>alert("You Win!"),200); } else { setTimeout(()=>{ deck[f1.i].flip=deck[i].flip=false; f1=null; lock=false; rnd(); }, 1000); } } } st();
</script>

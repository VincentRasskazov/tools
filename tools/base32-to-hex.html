<body>
  <div class="tool-container">
    <h1>Base32 to Hex</h1>
<div class="card"><label>🔢 Base32 Input</label><textarea id="in" rows="3" placeholder="JBSWY3DPEB3W64TMMQ======"></textarea></div>
<button onclick="c()">Convert to Hex</button>
<div class="card"><label>✨ Hex Output</label><textarea id="out" rows="3" readonly></textarea></div>
<script>const b32="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"; function c(){ try{ let s=document.getElementById('in').value.replace(/=+$/,'').toUpperCase(); let bits=''; for(let i=0;i<s.length;i++){ let v=b32.indexOf(s[i]); if(v===-1)throw "Err"; bits+=v.toString(2).padStart(5,'0'); } let hex=''; for(let i=0;i<bits.length-3;i+=4) hex+=parseInt(bits.substr(i,4),2).toString(16).toUpperCase(); document.getElementById('out').value=hex; }catch(e){document.getElementById('out').value="Invalid Base32";} }</script>
  </div>

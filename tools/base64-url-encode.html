<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Base64 URL Encode</h1><textarea id="in" placeholder="Type here..." oninput="c()"></textarea><textarea id="out" readonly></textarea></div>
<script>function c(){ try{ const b=btoa(document.getElementById('in').value); document.getElementById('out').value = b.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }catch(e){} }</script></body></html>

<body>
  <div class="tool-container">
    <h1>Circular Gradient Maker</h1>
<div style="display:flex;justify-content:center;margin-bottom:20px;">
  <div id="box" style="width:250px;height:250px;border-radius:50%;background:conic-gradient(#ef4444, #3b82f6, #10b981, #ef4444);box-shadow:0 10px 20px rgba(0,0,0,0.1);"></div>
</div>
<div class="row">
  <div class="card"><label>Color 1</label><input type="color" id="c1" value="#ef4444" oninput="u()"></div>
  <div class="card"><label>Color 2</label><input type="color" id="c2" value="#3b82f6" oninput="u()"></div>
  <div class="card"><label>Color 3</label><input type="color" id="c3" value="#10b981" oninput="u()"></div>
</div>
<textarea id="out" rows="2" readonly style="font-family:monospace;"></textarea>
<script>
function u(){
  const c1=document.getElementById('c1').value, c2=document.getElementById('c2').value, c3=document.getElementById('c3').value;
  const css=`background: conic-gradient(${c1}, ${c2}, ${c3}, ${c1});`;
  document.getElementById('box').style.cssText=`width:250px;height:250px;border-radius:50%;box-shadow:0 10px 20px rgba(0,0,0,0.1); ${css}`;
  document.getElementById('out').value=css;
} u();
</script>

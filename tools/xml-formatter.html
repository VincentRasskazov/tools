<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>xml formatter Tool</title>
  <meta name="description" content="xml formatter online tool.">
  <meta name="category" content="Developer Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">xml formatter Tool</h1>
  </div>

  <h1>xml formatter Tool</h1>

  <p>This is a starter tool page for <strong>xml formatter</strong>.</p>


  <textarea id="input" placeholder="Paste XML here" rows="8" style="width:100%"></textarea>
  <button onclick="run()">Format</button>

  <pre id="output"></pre>

  <script>
    function formatXml(xml) {
      let formatted = '', reg = /(>)(<)(\/*)/g;
      xml = xml.replace(reg, '$1\n$2$3');
      let pad = 0;
      xml.split('\n').forEach(node => {
        let indent = 0;
        if (node.match(/^<\//)) pad--;
        for (let i = 0; i < pad; i++) formatted += '  ';
        formatted += node + '\n';
        if (node.match(/^<[^!?/][^>]*[^/]>/)) pad++;
      });
      return formatted.trim();
    }
    function run() {
      const v = document.getElementById('input').value;
      try {
        document.getElementById('output').innerText = formatXml(v);
      } catch (e) {
        document.getElementById('output').innerText = 'Invalid XML.';
      }
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>HTML Table Generator</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .row{display:flex;gap:10px;margin-bottom:15px;} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;} button{padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;width:100%;} textarea{width:100%;height:150px;padding:10px;border-radius:6px;border:1px solid #ccc;font-family:monospace;margin-top:20px;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">HTML Table Generator</h1>
<div class="row"><div><label>Columns</label><input type="number" id="c" value="3"></div><div><label>Rows</label><input type="number" id="r" value="3"></div></div><button onclick="gen()">Generate HTML</button><textarea id="out" readonly></textarea></div>
<script>function gen(){ const c=parseInt(document.getElementById('c').value), r=parseInt(document.getElementById('r').value); let t="<table>\n  <thead>\n    <tr>\n"; for(let i=1;i<=c;i++)t+=`      <th>Header ${i}</th>\n`; t+="    </tr>\n  </thead>\n  <tbody>\n"; for(let i=1;i<=r;i++){ t+="    <tr>\n"; for(let j=1;j<=c;j++)t+=`      <td>Row ${i} Col ${j}</td>\n`; t+="    </tr>\n"; } t+="  </tbody>\n</table>"; document.getElementById('out').value = t; } window.onload=gen;</script></body></html>

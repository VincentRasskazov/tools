<body>
  <div class="tool-container">
    <div class="tool-header">
      <a class="tool-back" href="../index.html">← Back</a>
      <h1 class="tool-title">Text to Hex Converter</h1>
    </div>
    <p>Convert any text to hexadecimal code for encoding, debugging, or fun.</p>
    <textarea id="input" placeholder="Type or paste text..."></textarea>
    <button onclick="toHex()">Convert</button>
    <pre id="output"></pre>
    <script>
      function toHex() {
        const input = document.getElementById('input').value;
        const hex = input.split('').map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join(' ');
        document.getElementById('output').innerText = hex;
      }
    </script>

  </div>

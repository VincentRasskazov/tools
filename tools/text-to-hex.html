.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;font-family:monospace;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}
  </style>

<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Text to Hex</h1><textarea id="in" placeholder="Hello"></textarea><button onclick="c()">Convert to Hex</button><textarea id="out" readonly style="margin-top:20px;background:#f8fafc;"></textarea></div>
<script>function c(){ document.getElementById('out').value=document.getElementById('in').value.split('').map(x=>x.charCodeAt(0).toString(16).padStart(2,'0').toUpperCase()).join(' '); }</script>
</body>

<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Cylinder Calculator</h1><label>Radius (r)</label><input type="number" id="r" oninput="c()"><label>Height (h)</label><input type="number" id="h" oninput="c()"><div id="res"></div></div>
<script>function c(){ const r=parseFloat(document.getElementById('r').value), h=parseFloat(document.getElementById('h').value); if(r&&h){ const v=Math.PI*r*r*h, a=(2*Math.PI*r*h)+(2*Math.PI*r*r); document.getElementById('res').innerHTML=`Surface Area: <strong>${a.toFixed(2)}</strong><br>Volume: <strong>${v.toFixed(2)}</strong>`; } }</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>power converter Tool</title>
  <meta name="description" content="power converter online tool.">
  <meta name="category" content="Converters">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">power converter Tool</h1>
  </div>

  <h1>power converter Tool</h1>

  <p>This is a starter tool page for <strong>power converter</strong>.</p>


  <input id="value" type="number" placeholder="Enter value" style="width:120px;">
  <select id="from">
    <option value="W">Watts (W)</option>
    <option value="kW">Kilowatts (kW)</option>
    <option value="hp">Horsepower (hp)</option>
    <option value="BTU">BTU/hr</option>
  </select>
  to
  <select id="to">
    <option value="W">Watts (W)</option>
    <option value="kW">Kilowatts (kW)</option>
    <option value="hp">Horsepower (hp)</option>
    <option value="BTU">BTU/hr</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    const factors = {
      W: 1,
      kW: 1000,
      hp: 745.699872,
      BTU: 0.29307107
    };
    function run() {
      const value = parseFloat(document.getElementById('value').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (isNaN(value)) {
        document.getElementById('output').innerText = 'Enter a valid number.';
        return;
      }
      let watts;
      if (from === 'BTU') watts = value / factors.BTU;
      else watts = value * factors[from];
      let result;
      if (to === 'BTU') result = watts * factors.BTU;
      else result = watts / factors[to];
      document.getElementById('output').innerText = value + ' ' + from + ' = ' + result + ' ' + to;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

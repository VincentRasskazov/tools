<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Power Converter</h1>
<label>Watts (W)</label><input type="number" id="w" oninput="c('w')">
<label>Kilowatts (kW)</label><input type="number" id="kw" oninput="c('kw')">
<label>Horsepower (hp)</label><input type="number" id="hp" oninput="c('hp')"></div>
<script>function c(id){ const v=parseFloat(document.getElementById(id).value); if(isNaN(v))return; const w = id==='w'?v : id==='kw'?v*1000 : v*745.7;
if(id!=='w')document.getElementById('w').value=w; if(id!=='kw')document.getElementById('kw').value=w/1000; if(id!=='hp')document.getElementById('hp').value=w/745.7; }</script>
</body>

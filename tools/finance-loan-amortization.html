<body>
  <div class="tool-container">
    <h1>Loan Amortization</h1>
<div class="row">
  <div><label>Loan Amount ($)</label><input type="number" id="p" value="10000"></div>
  <div><label>Interest Rate (%)</label><input type="number" id="r" value="5"></div>
</div>
<label>Term (Years)</label><input type="number" id="y" value="5">
<button onclick="c()">Calculate Loan</button>
<div id="res" class="res"></div>
<script>function c(){ const p=parseFloat(document.getElementById('p').value), r=parseFloat(document.getElementById('r').value)/100/12, n=parseFloat(document.getElementById('y').value)*12; if(p&&r&&n){ const pmt=p*(r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1); const tot=(pmt*n)-p; document.getElementById('res').innerHTML=`Monthly Payment: <strong style="font-size:2rem;color:var(--primary)">$${pmt.toFixed(2)}</strong><br>Total Interest Paid: <strong style="color:var(--danger)">$${tot.toFixed(2)}</strong>`; } }</script>
  </div>

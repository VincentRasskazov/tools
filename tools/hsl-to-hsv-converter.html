<body>
  <div class="tool-container">
    <h1>HSL to HSV</h1>
<div class="row">
    <div class="card"><label>H (0-360)</label><input type="number" id="h" value="217" min="0" max="360" oninput="c()"></div>
    <div class="card"><label>S (%)</label><input type="number" id="s" value="91" min="0" max="100" oninput="c()"></div>
    <div class="card"><label>L (%)</label><input type="number" id="l" value="60" min="0" max="100" oninput="c()"></div>
</div>
<div id="res" class="res" style="font-family:monospace;"></div>
<script>
function c(){
  let h=parseFloat(document.getElementById('h').value)||0, s=parseFloat(document.getElementById('s').value)||0, l=parseFloat(document.getElementById('l').value)||0;
  s/=100; l/=100;
  const v = l + s * Math.min(l, 1-l);
  const sv = v === 0 ? 0 : 2 * (1 - l/v);
  document.getElementById('res').innerHTML = `HSV:<br><span style="font-size:3rem;color:var(--primary)">${h}°, ${Math.round(sv*100)}%, ${Math.round(v*100)}%</span>`;
} c();
</script>
  </div>
</body>

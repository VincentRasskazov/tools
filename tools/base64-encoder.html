<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>base64 encoder Tool</title>
  <meta name="description" content="base64 encoder online tool.">
  <meta name="category" content="Encoding Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">base64 encoder Tool</h1>
  </div>

  <h1>base64 encoder Tool</h1>

  <p>This is a starter tool page for <strong>base64 encoder</strong>.</p>


  <label for="input">Text:</label>
  <input id="input" placeholder="Enter text">
  <button onclick="run()">Encode</button>

  <p id="output"></p>

  <script>
    function run() {
      const v = document.getElementById('input').value;
      if (!v) {
        document.getElementById('output').innerText = "Please enter text.";
        return;
      }
      try {
        const encoded = btoa(v);
        document.getElementById('output').innerText = encoded;
      } catch {
        document.getElementById('output').innerText = "Invalid input for Base64 encoding.";
      }
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

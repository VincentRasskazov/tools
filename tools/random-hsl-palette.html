<body>
  <div class="tool-container">
    <h1>Harmonious HSL Palette</h1>
<div id="pal" style="display:flex;height:150px;border-radius:16px;overflow:hidden;margin-bottom:20px;box-shadow:0 10px 15px rgba(0,0,0,0.1);"></div>
<button onclick="c()">Generate Palette</button>
<script>
function c(){
  const h=Math.floor(Math.random()*360), s=70+Math.floor(Math.random()*30), l=50; let html='';
  for(let i=0;i<5;i++){
    const hue=(h+(i*30))%360; const hsl=`hsl(${hue}, ${s}%, ${l}%)`;
    html+=`<div style="flex:1;background:${hsl};display:flex;align-items:flex-end;justify-content:center;padding-bottom:15px;color:#fff;font-weight:bold;text-shadow:1px 1px 2px #000;cursor:pointer;" onclick="navigator.clipboard.writeText('${hsl}');alert('Copied!')">${hue}°</div>`;
  } document.getElementById('pal').innerHTML=html;
} c();
</script>
  </div>
</body>

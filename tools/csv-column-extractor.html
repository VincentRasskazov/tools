  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>CSV Column Extractor</title><script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;font-family:monospace;} input{width:100px;padding:10px;border:1px solid #ccc;border-radius:6px;margin:0 10px;} button{padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">CSV Column Extractor</h1><textarea id="in" placeholder="A,B,C\n1,2,3\n4,5,6"></textarea><div style="text-align:center;"><label>Column Index (0 = first)</label><input type="number" id="col" value="0"><button onclick="c()">Extract</button></div><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ const p=Papa.parse(document.getElementById('in').value); const ci=parseInt(document.getElementById('col').value); let res=[]; p.data.forEach(r=>{if(r[ci])res.push(r[ci]);}); document.getElementById('out').value=res.join('\n'); }</script></body></html>

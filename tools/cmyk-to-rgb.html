  <style>

.tool-container { max-width: 680px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1), 0 10px 15px -3px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.5); }

.res { margin-top: 25px; padding: 30px; background: linear-gradient(to right, #f8fafc, #f1f5f9); border-radius: 16px; text-align: center; font-size: 1.5rem; font-weight: 800; border: 2px dashed #cbd5e1; color: var(--primary); word-break: break-word; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }

<body>
  <div class="tool-container">
    <h1>CMYK to RGB</h1>
<div class="row">
  <div class="card"><label>C (%)</label><input type="number" id="c" value="76" min="0" max="100" oninput="u()"></div>
  <div class="card"><label>M (%)</label><input type="number" id="m" value="47" min="0" max="100" oninput="u()"></div>
  <div class="card"><label>Y (%)</label><input type="number" id="y" value="0" min="0" max="100" oninput="u()"></div>
  <div class="card"><label>K (%)</label><input type="number" id="k" value="4" min="0" max="100" oninput="u()"></div>
</div>
<div class="card" style="display:flex;align-items:center;justify-content:center;gap:20px;">
  <div id="pv" style="width:60px;height:60px;border-radius:8px;background:rgb(59,130,246);border:1px solid var(--border);"></div>
  <div id="res" style="font-family:monospace;font-size:2rem;font-weight:bold;color:var(--primary);">rgb(59, 130, 246)</div>
</div>
<script>
function u(){
  let c=parseFloat(document.getElementById('c').value)||0, m=parseFloat(document.getElementById('m').value)||0, y=parseFloat(document.getElementById('y').value)||0, k=parseFloat(document.getElementById('k').value)||0;
  c/=100; m/=100; y/=100; k/=100;
  const r=Math.round(255 * (1-c) * (1-k)), g=Math.round(255 * (1-m) * (1-k)), b=Math.round(255 * (1-y) * (1-k));
  const rgb=`rgb(${r}, ${g}, ${b})`;
  document.getElementById('res').innerText = rgb;
  document.getElementById('pv').style.background = rgb;
}
</script>
  </div>
</body>

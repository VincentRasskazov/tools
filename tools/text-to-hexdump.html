<body>
  <div class="tool-container">
    <h1>Text to Hexdump</h1>
<div class="card"><label>📝 Input Text</label><textarea id="in" rows="4" placeholder="Hello World!" oninput="c()"></textarea></div>
<div class="card"><label>🛠️ Hexdump Output</label><textarea id="out" rows="8" readonly style="font-family:monospace;white-space:pre;font-size:0.85rem;line-height:1.4;"></textarea></div>
<script>
function c(){
  const t=document.getElementById('in').value; if(!t)return document.getElementById('out').value='';
  let res='';
  for(let i=0;i<t.length;i+=16){
    const chunk=t.substr(i,16); let hex='', ascii='';
    for(let j=0;j<16;j++){
      if(j<chunk.length){
        const code=chunk.charCodeAt(j); hex+=code.toString(16).padStart(2,'0')+' ';
        ascii+= (code>=32&&code<=126) ? chunk[j] : '.';
      } else { hex+='   '; }
    }
    res+= i.toString(16).padStart(8,'0') + '  ' + hex + ' |' + ascii + '|\n';
  } document.getElementById('out').value=res;
}
</script>
  </div>
</body>

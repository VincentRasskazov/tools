<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Text Shadow Generator</h1>
<div id="box">Preview</div>
<div class="row"><label>X Offset</label><input type="range" id="x" min="-20" max="20" value="2" oninput="u()"></div>
<div class="row"><label>Y Offset</label><input type="range" id="y" min="-20" max="20" value="2" oninput="u()"></div>
<div class="row"><label>Blur</label><input type="range" id="b" min="0" max="20" value="4" oninput="u()"></div>
<div class="row"><label>Color</label><input type="color" id="c" value="#000000" style="width:70%;" oninput="u()"></div>
<textarea id="out" readonly></textarea></div>
<script>function u(){ const s=`${document.getElementById('x').value}px ${document.getElementById('y').value}px ${document.getElementById('b').value}px ${document.getElementById('c').value}`; document.getElementById('box').style.textShadow=s; document.getElementById('out').value=`text-shadow: ${s};`; } window.onload=u;</script></body></html>

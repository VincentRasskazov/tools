<body>
  <div class="tool-container">
    <h1>Random Hex String</h1>
<label>String Length (Characters)</label><input type="number" id="l" value="64" min="1" max="1000">
<button onclick="c()">Generate Hex</button>
<textarea id="out" rows="4" readonly style="margin-top:20px;font-family:monospace;font-size:1.2rem;word-break:break-all;"></textarea>
<script>function c(){ const l=parseInt(document.getElementById('l').value); let r=''; const a=new Uint8Array(Math.ceil(l/2)); crypto.getRandomValues(a); for(let i=0;i<a.length;i++) r+=a[i].toString(16).padStart(2,'0'); document.getElementById('out').value=r.substring(0,l).toUpperCase(); } c();</script>
  </div>

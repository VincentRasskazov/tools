<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>trip time estimator Tool</title>
  <meta name="description" content="trip time estimator online tool.">
  <meta name="category" content="Travel Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">trip time estimator Tool</h1>
  </div>

  <h1>trip time estimator Tool</h1>

  <p>This is a starter tool page for <strong>trip time estimator</strong>.</p>


  <input id="distance" type="number" placeholder="Distance (km)" style="width:120px;">
  <input id="speed" type="number" placeholder="Speed (km/h)" style="width:120px;">
  <button onclick="run()">Estimate</button>

  <p id="output"></p>

  <script>
    function run() {
      const distance = parseFloat(document.getElementById('distance').value);
      const speed = parseFloat(document.getElementById('speed').value);
      if (isNaN(distance) || isNaN(speed) || distance <= 0 || speed <= 0) {
        document.getElementById('output').innerText = 'Enter valid distance and speed.';
        return;
      }
      const hours = distance / speed;
      const h = Math.floor(hours);
      const m = Math.round((hours - h) * 60);
      document.getElementById('output').innerText = `Estimated time: ${h}h ${m}m`;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

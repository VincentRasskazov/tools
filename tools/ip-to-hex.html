<body><div class="tool-container"><h1 style="color:#2563eb;">IP to Hex</h1><input type="text" id="in" placeholder="192.168.1.1"><button onclick="c()">Convert</button><input type="text" id="out" readonly style="margin-top:20px;font-family:monospace;background:#f8fafc;"></div>
<script>function c(){ const parts = document.getElementById('in').value.split('.'); if(parts.length!==4)return; document.getElementById('out').value = parts.map(p=>parseInt(p).toString(16).padStart(2,'0').toUpperCase()).join(''); }</script>

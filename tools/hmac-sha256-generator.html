<body>
  <div class="tool-container">
    <h1>HMAC-SHA256 Generator</h1>
<label>Message</label><textarea id="msg" rows="3" placeholder="Message to hash..." oninput="c()"></textarea>
<label>Secret Key</label><input type="text" id="key" placeholder="Your secret key..." oninput="c()">
<div id="res" class="res" style="font-size:1rem;font-family:monospace;word-break:break-all;">Hash will appear here...</div>
<script>function c(){ const m=document.getElementById('msg').value, k=document.getElementById('key').value; if(m&&k){ document.getElementById('res').innerText=CryptoJS.HmacSHA256(m, k).toString(); } else { document.getElementById('res').innerText='Provide message and key.'; } }</script>

<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Random Date Generator</h1><div class="grid"><div><label>Start Date</label><input type="date" id="start" value="2000-01-01"></div><div><label>End Date</label><input type="date" id="end" value="2025-12-31"></div></div><button onclick="c()">Generate Date</button><div id="res">YYYY-MM-DD</div></div>
<script>function c(){ const s=new Date(document.getElementById('start').value).getTime(); const e=new Date(document.getElementById('end').value).getTime(); if(s && e && s <= e){ const rand = new Date(s + Math.random() * (e - s)); document.getElementById('res').innerText = rand.toISOString().split('T')[0]; } }</script>

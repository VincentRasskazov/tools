<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">

  <meta name="description" content="water intake calculator online tool.">

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">water intake calculator Tool</h1>
  </div>

  <h1>water intake calculator Tool</h1>

  <p>This is a starter tool page for <strong>water intake calculator</strong>.</p>


  <input id="weight" type="number" placeholder="Weight (kg)" style="width:120px;">
  <button onclick="run()">Calculate</button>

  <p id="output"></p>

  <script>
    function run() {
      const weight = parseFloat(document.getElementById('weight').value);
      if (isNaN(weight) || weight <= 0) {
        document.getElementById('output').innerText = 'Enter a valid weight.';
        return;
      }
      const intake = weight * 35; // 35 ml per kg
      document.getElementById('output').innerText = 'Recommended: ' + (intake/1000).toFixed(2) + ' liters/day';
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

<body>
  <div class="tool-container">
    <h1>Number to Words</h1>
<input type="number" id="in" placeholder="105" oninput="c()">
<div id="res" class="res" style="font-size:1.5rem;text-transform:capitalize;">One Hundred Five</div>
<script>
const ones=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen']; const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety']; const scales=['','thousand','million','billion','trillion'];
function numToWords(n){ if(n===0)return'zero'; let w=''; for(let i=0;i<scales.length;i++){ let chunk=n%1000; if(chunk){ let cw=''; if(chunk>99){cw+=ones[Math.floor(chunk/100)]+' hundred '; chunk%=100;} if(chunk>19){cw+=tens[Math.floor(chunk/10)]+' '; chunk%=10;} if(chunk>0){cw+=ones[chunk]+' ';} w=cw+scales[i]+' '+w; } n=Math.floor(n/1000); } return w.trim(); }
function c(){ const v=parseInt(document.getElementById('in').value,10); if(!isNaN(v))document.getElementById('res').innerText=numToWords(v); else document.getElementById('res').innerText='Waiting...'; }
</script>
  </div>

  <div class="tool-container">

    <p>Convert any text to subscript for math, science, or stylish posts!</p>
    <textarea id="input" placeholder="Type or paste text..."></textarea>
    <button onclick="toSubscript()">Convert</button>
    <pre id="output"></pre>
    <script>
      function toSubscript() {
        const map = {
          0:'₀',1:'₁',2:'₂',3:'₃',4:'₄',5:'₅',6:'₆',7:'₇',8:'₈',9:'₉',
          a:'ₐ',e:'ₑ',h:'ₕ',i:'ᵢ',j:'ⱼ',k:'ₖ',l:'ₗ',m:'ₘ',n:'ₙ',o:'ₒ',p:'ₚ',r:'ᵣ',s:'ₛ',t:'ₜ',u:'ᵤ',v:'ᵥ',x:'ₓ',
          A:'ₐ',E:'ₑ',H:'ₕ',I:'ᵢ',J:'ⱼ',K:'ₖ',L:'ₗ',M:'ₘ',N:'ₙ',O:'ₒ',P:'ₚ',R:'ᵣ',S:'ₛ',T:'ₜ',U:'ᵤ',V:'ᵥ',X:'ₓ'
        };
        const input = document.getElementById('input').value;
        const subscript = input.split('').map(c => map[c] || c).join('');
        document.getElementById('output').innerText = subscript;
      }
    </script>

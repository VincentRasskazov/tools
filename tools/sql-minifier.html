<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">SQL Minifier</h1><textarea id="in" placeholder="SELECT * \nFROM users \nWHERE id = 1;"></textarea><button onclick="c()">Minify SQL</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ let sql=document.getElementById('in').value; sql=sql.replace(/--.*$/gm,'').replace(/\/\*[\s\S]*?\*\//g,'').replace(/\s+/g,' ').trim(); document.getElementById('out').value=sql; }</script>
</body>

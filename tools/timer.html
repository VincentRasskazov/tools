<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>timer Tool</title>
  <meta name="description" content="timer online tool.">
  <meta name="category" content="Utility Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">timer Tool</h1>
  </div>

  <h1>timer Tool</h1>

  <p>This is a starter tool page for <strong>timer</strong>.</p>


  <input id="seconds" type="number" placeholder="Seconds" style="width:120px;">
  <button onclick="start()">Start</button>
  <button onclick="stop()">Stop</button>
  <button onclick="reset()">Reset</button>
  <div id="display" style="font-size:2em; margin:10px 0;">00:00</div>

  <script>
    let interval, remaining = 0;
    function updateDisplay() {
      let min = Math.floor(remaining / 60);
      let sec = remaining % 60;
      document.getElementById('display').innerText =
        String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    }
    function start() {
      if (interval) return;
      remaining = parseInt(document.getElementById('seconds').value, 10);
      if (isNaN(remaining) || remaining < 1) {
        document.getElementById('display').innerText = 'Enter seconds > 0';
        return;
      }
      updateDisplay();
      interval = setInterval(() => {
        if (remaining > 0) {
          remaining--;
          updateDisplay();
        } else {
          stop();
          document.getElementById('display').innerText = 'Time\'s up!';
        }
      }, 1000);
    }
    function stop() {
      clearInterval(interval);
      interval = null;
    }
    function reset() {
      stop();
      remaining = 0;
      updateDisplay();
    }
    updateDisplay();
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

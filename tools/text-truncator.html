  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Text Truncator</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea,input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Text Truncator</h1><textarea id="in" placeholder="Paste long text here..." style="height:100px;"></textarea><label>Max Characters</label><input type="number" id="n" value="100"><button onclick="c()">Truncate Text</button><textarea id="out" readonly style="margin-top:20px;height:100px;"></textarea></div>
<script>function c(){ const t=document.getElementById('in').value, n=document.getElementById('n').value; document.getElementById('out').value = t.length > n ? t.substring(0, n) + '...' : t; }</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>speed converter Tool</title>
  <meta name="description" content="speed converter online tool.">
  <meta name="category" content="Converters">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">speed converter Tool</h1>
  </div>

  <h1>speed converter Tool</h1>

  <p>This is a starter tool page for <strong>speed converter</strong>.</p>


  <input id="value" type="number" placeholder="Enter value" style="width:120px;">
  <select id="from">
    <option value="ms">Meters/sec</option>
    <option value="kmh">Km/h</option>
    <option value="mph">Miles/h</option>
    <option value="kn">Knots</option>
  </select>
  to
  <select id="to">
    <option value="ms">Meters/sec</option>
    <option value="kmh">Km/h</option>
    <option value="mph">Miles/h</option>
    <option value="kn">Knots</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    const factors = {
      ms: 1,
      kmh: 1/3.6,
      mph: 0.44704,
      kn: 0.514444
    };
    function run() {
      const value = parseFloat(document.getElementById('value').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (isNaN(value)) {
        document.getElementById('output').innerText = 'Enter a valid number.';
        return;
      }
      const ms = value * factors[from];
      const result = ms / factors[to];
      document.getElementById('output').innerText = value + ' ' + from + ' = ' + result + ' ' + to;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">

  <meta name="description" content="decimal to binary online tool.">

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">decimal to binary Tool</h1>
  </div>

  <h1>decimal to binary Tool</h1>

  <p>This is a starter tool page for <strong>decimal to binary</strong>.</p>


  <label for="input">Decimal:</label>
  <input id="input" type="number" placeholder="Enter decimal number">
  <button onclick="run()">Convert to Binary</button>

  <p id="output"></p>

  <script>
    function run() {
      const v = parseInt(document.getElementById('input').value, 10);
      if (isNaN(v)) {
        document.getElementById('output').innerText = "Please enter a valid decimal number.";
        return;
      }
      document.getElementById('output').innerText = v.toString(2);
    }
  </script>

  </div>
</body>
</html>

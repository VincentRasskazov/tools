<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="Convert decimal numbers to binary format instantly.">
  <meta property="og:title" content="Decimal to Binary Converter">
  <meta property="og:description" content="Convert decimal numbers to binary format instantly.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub">
  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Decimal to Binary Converter">
  <meta name="twitter:description" content="Convert decimal numbers to binary format instantly.">
  
  <meta charset="UTF-8">
  <title>Decimal to Binary</title>
  <style>
    .tool-container { max-width: 500px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { color: #2563eb; text-align: center; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 20px; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="tool-container">
    <h1>Decimal to Binary</h1>
    <input type="number" id="dec" placeholder="e.g., 42">
    <button onclick="convert()">Convert</button>
    <label style="margin-top:20px; display:block;">Binary Result</label>
    <input type="text" id="bin" readonly>
  </div>
  <script>
    function convert() {
      const val = parseInt(document.getElementById('dec').value, 10);
      if(!isNaN(val)) document.getElementById('bin').value = val.toString(2);
    }
  </script>
</body>
</html>

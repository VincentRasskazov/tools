<body>
  <div class="tool-container">
    <h1>CRT Scanline Effect</h1>
<div id="box" style="height:200px;border-radius:16px;margin-bottom:20px;background:url('https://placehold.co/600x300/3b82f6/fff?text=Cyberpunk') center/cover;position:relative;overflow:hidden;">
  <div id="overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);pointer-events:none;"></div>
</div>
<div class="row">
  <div class="card"><label>Scanline Size (px)</label><input type="range" id="s" min="1" max="10" value="2" oninput="u()"></div>
  <div class="card"><label>Opacity</label><input type="range" id="o" min="0.1" max="0.8" step="0.1" value="0.15" oninput="u()"></div>
</div>
<textarea id="out" rows="3" readonly style="font-family:monospace;font-size:0.85rem;"></textarea>
<script>
function u(){
  const s=document.getElementById('s').value, o=document.getElementById('o').value; const h=s/2;
  const css = `background: repeating-linear-gradient(0deg, rgba(0,0,0,${o}), rgba(0,0,0,${o}) ${h}px, transparent ${h}px, transparent ${s}px);\npointer-events: none;`;
  document.getElementById('overlay').style.cssText = `position:absolute;top:0;left:0;width:100%;height:100%;${css.replace(/\n/g,' ')}`;
  document.getElementById('out').value = css;
} u();
</script>

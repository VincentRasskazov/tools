  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Flow Rate</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Flow Rate Converter</h1>
<label>Cubic meters/sec (m³/s)</label><input type="number" id="m3" oninput="c('m3')">
<label>Liters/min (L/min)</label><input type="number" id="lm" oninput="c('lm')">
<label>Gallons/min (GPM)</label><input type="number" id="gpm" oninput="c('gpm')"></div>
<script>function c(id){ const v=parseFloat(document.getElementById(id).value); if(isNaN(v))return; const m=id==='m3'?v:id==='lm'?v/60000:v/15850.32; if(id!=='m3')document.getElementById('m3').value=m.toExponential(4); if(id!=='lm')document.getElementById('lm').value=(m*60000).toFixed(4); if(id!=='gpm')document.getElementById('gpm').value=(m*15850.32).toFixed(4); }</script></body></html>

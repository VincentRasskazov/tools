  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
.tool-container { max-width: 650px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); border: 1px solid var(--border); }
h1 { text-align: center; color: var(--primary); margin: 0 0 25px 0; font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; }
label { display: block; font-weight: 600; margin-bottom: 8px; color: #475569; font-size: 0.95rem; }
input, select, textarea { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 10px; margin-bottom: 20px; font-size: 1rem; transition: all 0.2s ease; box-sizing: border-box; background: #fcfcfc; color: var(--text); }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); background: #fff; }
button { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.2); margin-bottom: 10px; }
button:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 12px -2px rgba(59, 130, 246, 0.3); }
button:active { transform: translateY(0); box-shadow: none; }
button:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; }
.res { margin-top: 25px; padding: 25px; background: var(--bg); border-radius: 12px; text-align: center; font-size: 1.5rem; font-weight: 800; border: 2px dashed var(--border); color: var(--primary); word-break: break-word; }
.row { display: flex; gap: 15px; } .row > div { flex: 1; }
.grid-4x4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; }
.grid-4x4 div { aspect-ratio: 1; background: var(--border); border-radius: 8px; cursor: pointer; transition: 0.2s; }
</style>

<body>
  <div class="tool-container">
    <h1>100 Click Sprint</h1>
<div class="row" style="margin-bottom:15px;text-align:center;">
  <div id="sc" style="font-size:1.5rem;font-weight:bold;color:var(--primary);">Clicks: 0 / 100</div>
  <div id="tm" style="font-size:1.5rem;font-weight:bold;color:var(--danger);">0.00s</div>
</div>
<div id="box" style="height:250px;background:var(--bg);border:2px dashed var(--primary);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:bold;color:var(--text);cursor:pointer;user-select:none;margin-bottom:20px;" onmousedown="clk()">Click to Start</div>
<script>
let c=0, t0, int, run=false;
function clk(){
  if(!run && c===0){ run=true; t0=Date.now(); int=setInterval(()=>{ document.getElementById('tm').innerText=((Date.now()-t0)/1000).toFixed(2)+'s'; }, 10); }
  if(run){
    c++; document.getElementById('sc').innerText=`Clicks: ${c} / 100`; document.getElementById('box').innerText="KEEP CLICKING!";
    if(c>=100){ clearInterval(int); run=false; document.getElementById('box').innerHTML=`<span style="color:var(--success)">FINISHED!</span><br>Click to restart`; c=0; }
  }
}
</script>
  </div>
</body>

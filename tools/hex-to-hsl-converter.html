  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Hex to HSL</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} input{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;font-size:1.2rem;} #box{height:100px;border-radius:6px;margin-top:20px;border:1px solid #ccc;}</style></head>
<body><div class="tool-container"><h1 style="color:#2563eb;">Hex to HSL</h1><input type="text" id="in" placeholder="#2563EB" value="#2563EB" oninput="c()"><input type="text" id="out" readonly><div id="box"></div></div>
<script>function c(){ let h = document.getElementById('in').value.replace('#',''); if(h.length!==6)return; let r=parseInt(h.slice(0,2),16)/255, g=parseInt(h.slice(2,4),16)/255, b=parseInt(h.slice(4,6),16)/255; let max=Math.max(r,g,b), min=Math.min(r,g,b), hu, s, l=(max+min)/2; if(max===min){hu=s=0;}else{let d=max-min; s=l>0.5?d/(2-max-min):d/(max+min); switch(max){case r:hu=(g-b)/d+(g<b?6:0);break; case g:hu=(b-r)/d+2;break; case b:hu=(r-g)/d+4;break;} hu/=6;} const res = `hsl(${Math.round(hu*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`; document.getElementById('out').value = res; document.getElementById('box').style.background = res; } window.onload=c;</script></body></html>

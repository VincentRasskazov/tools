<html lang="en"><head>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>CSV to MD Table</title><script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;} textarea{width:100%;height:200px;padding:10px;border:1px solid #ccc;border-radius:6px;font-family:monospace;margin-bottom:15px;} button{grid-column:1/-1;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">CSV to Markdown Table</h1><div class="grid"><div><label>CSV Input</label><textarea id="in" placeholder="Col1,Col2\nData1,Data2"></textarea></div><div><label>Markdown Output</label><textarea id="out" readonly></textarea></div><button onclick="c()">Convert to Markdown</button></div></div>
<script>function c(){ Papa.parse(document.getElementById('in').value, {skipEmptyLines:true, complete:function(r){ let d=r.data; if(d.length===0)return; let md="| "+d[0].join(" | ")+" |\n|"+d[0].map(()=>"---").join("|")+"|\n"; for(let i=1;i<d.length;i++) md+="| "+d[i].join(" | ")+" |\n"; document.getElementById('out').value=md; }}); }</script></body></html>

<body>
  <div class="tool-container">
    <h1>Breakout Pro</h1>
<div class="card" style="padding:0;background:#0f172a;cursor:none;border:4px solid var(--border);" onmousemove="mm(event)">
  <canvas id="cvs" width="500" height="400" style="display:block;width:100%;"></canvas>
</div>
<button onclick="st()">Start Level</button>
<script>
const cvs=document.getElementById('cvs'), ctx=cvs.getContext('2d');
let b, pad, br=[], pw=[], run=false;
function st(){ b={x:250,y:300,dx:3,dy:-3,r:6}; pad={x:200,y:380,w:80,h:10}; br=[]; pw=[]; run=true; for(let r=0;r<5;r++)for(let c=0;c<8;c++)br.push({x:c*60+15,y:r*20+20,w:50,h:15,a:true,c:`hsl(${r*40},100%,60%)`}); loop(); }
function mm(e){ if(run){ const r=cvs.getBoundingClientRect(); pad.x=(e.clientX-r.left)*(500/r.width)-pad.w/2; } }
function loop(){
  if(!run)return; ctx.clearRect(0,0,500,400);
  ctx.fillStyle='#3b82f6'; ctx.fillRect(pad.x,pad.y,pad.w,pad.h);
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
  
  b.x+=b.dx; b.y+=b.dy;
  if(b.x<b.r||b.x>500-b.r) b.dx*=-1; if(b.y<b.r) b.dy*=-1;
  if(b.y>400){run=false; alert("Game Over!");}
  if(b.y+b.r>pad.y && b.x>pad.x && b.x<pad.x+pad.w){ b.dy=-Math.abs(b.dy); b.dx=(b.x-(pad.x+pad.w/2))*0.15; }
  
  br.forEach(k=>{ if(k.a){
    ctx.fillStyle=k.c; ctx.fillRect(k.x,k.y,k.w,k.h);
    if(b.x>k.x&&b.x<k.x+k.w&&b.y-b.r<k.y+k.h&&b.y+b.r>k.y){ b.dy*=-1; k.a=false; if(Math.random()<0.2)pw.push({x:k.x+25,y:k.y,vy:2}); }
  }});
  
  ctx.fillStyle='#10b981'; pw.forEach((p,i)=>{
    p.y+=p.vy; ctx.fillRect(p.x-5,p.y-5,10,10);
    if(p.y>pad.y && p.x>pad.x && p.x<pad.x+pad.w){ pw.splice(i,1); pad.w=Math.min(200, pad.w+20); setTimeout(()=>pad.w=80, 5000); }
  });
  if(br.every(k=>!k.a)){run=false; alert("You Win!");} else requestAnimationFrame(loop);
}
</script>

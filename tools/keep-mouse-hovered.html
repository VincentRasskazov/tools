<body>
  <div class="tool-container">
    <h1>Hover Survival</h1>
<div class="row" style="margin-bottom:15px;text-align:center;">
  <div id="tm" style="font-size:1.5rem;font-weight:bold;color:var(--primary);">Time: 0.0s / 5.0s</div>
</div>
<div id="arena" style="width:100%;height:300px;background:var(--bg);border:2px solid var(--border);border-radius:12px;position:relative;overflow:hidden;">
  <div id="tgt" onmouseover="ov()" onmouseout="ot()" style="width:60px;height:60px;background:var(--danger);border-radius:50%;position:absolute;top:120px;left:270px;cursor:crosshair;transition:all 0.3s linear;"></div>
</div>
<script>
let intT, intM, ms=0, run=false, hov=false;
function ov(){ hov=true; if(!run){run=true; intT=setInterval(()=>{if(hov){ms+=10; document.getElementById('tm').innerText=`Time: ${(ms/1000).toFixed(1)}s / 5.0s`; if(ms>=5000){clearInterval(intT);clearInterval(intM);document.getElementById('tgt').style.display='none';alert("YOU SURVIVED!");}}else{ms=0;}},10); intM=setInterval(mv, 600);} document.getElementById('tgt').style.background='var(--success)'; }
function ot(){ hov=false; ms=0; document.getElementById('tm').innerText=`Time: 0.0s / 5.0s`; document.getElementById('tgt').style.background='var(--danger)'; }
function mv(){ const a=document.getElementById('arena'), tgt=document.getElementById('tgt'); tgt.style.top=Math.random()*(a.clientHeight-60)+'px'; tgt.style.left=Math.random()*(a.clientWidth-60)+'px'; }
</script>

<body>
  <div class="tool-container">
    <h1>Artillery Game</h1>
<div class="card" style="padding:0;overflow:hidden;background:#e0f2fe;border:4px solid var(--border);">
  <canvas id="cvs" width="600" height="300" style="width:100%;display:block;"></canvas>
</div>
<div class="row">
  <div class="card"><label>Angle (°)</label><input type="range" id="a" min="0" max="90" value="45" oninput="drw()"></div>
  <div class="card"><label>Power</label><input type="range" id="p" min="5" max="25" value="15" oninput="drw()"></div>
</div>
<button onclick="fire()" id="btn">Fire Cannon!</button>
<script>
const cvs=document.getElementById('cvs'), ctx=cvs.getContext('2d');
let ball=null, tgt={x:400+Math.random()*150, y:280, w:40, h:20}, run=false;
function drw(){
  ctx.clearRect(0,0,600,300); ctx.fillStyle='#166534'; ctx.fillRect(0,280,600,20);
  ctx.fillStyle='#ef4444'; ctx.fillRect(tgt.x, tgt.y-tgt.h, tgt.w, tgt.h); // Target
  const a=(document.getElementById('a').value)*Math.PI/180;
  ctx.fillStyle='#1e293b'; ctx.beginPath(); ctx.arc(30, 280, 20, Math.PI, 0); ctx.fill(); // Base
  ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(30,280); ctx.lineTo(30+Math.cos(a)*30, 280-Math.sin(a)*30); ctx.stroke(); // Barrel
  if(ball){ ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(ball.x, ball.y, 5, 0, Math.PI*2); ctx.fill(); }
}
function fire(){
  if(run)return; run=true; document.getElementById('btn').disabled=true;
  const a=(document.getElementById('a').value)*Math.PI/180, p=document.getElementById('p').value;
  ball={x:30+Math.cos(a)*30, y:280-Math.sin(a)*30, vx:Math.cos(a)*p, vy:-Math.sin(a)*p};
  loop();
}
function loop(){
  if(!run)return; ball.vy+=0.5; ball.x+=ball.vx; ball.y+=ball.vy; drw();
  if(ball.x>tgt.x && ball.x<tgt.x+tgt.w && ball.y>tgt.y-tgt.h){ run=false; setTimeout(()=>alert("TARGET DESTROYED!"), 100); tgt.x=400+Math.random()*150; document.getElementById('btn').disabled=false; ball=null; drw(); }
  else if(ball.y>280 || ball.x>600){ run=false; document.getElementById('btn').disabled=false; ball=null; drw(); }
  else requestAnimationFrame(loop);
} drw();
</script>

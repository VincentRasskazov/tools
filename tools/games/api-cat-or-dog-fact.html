  <style>
    :root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

<body>
  <div class="tool-container">
    <h1>Cat or Dog Fact?</h1>

    <div id="sc" style="text-align:center;font-weight:bold;color:var(--success);margin-bottom:10px;">
      Streak: 0
    </div>

    <div class="card">
      <div id="q" style="font-size:1.2rem;line-height:1.6;font-weight:bold;text-align:center;">
        Loading fact...
      </div>
    </div>

    <div class="row">
      <button onclick="guess('cat')" style="background:var(--primary);font-size:1.5rem;">🐱 CAT</button>
      <button onclick="guess('dog')" style="background:var(--warning);color:#000;font-size:1.5rem;">🐶 DOG</button>
    </div>

    <script>
      let answer = "";
      let streak = 0;

      async function fetchWithTimeout(url, timeout = 5000) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        try {
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(id);
          return res;
        } catch (err) {
          clearTimeout(id);
          throw err;
        }
      }

      async function loadFact() {
        document.getElementById("q").innerText = "Loading...";

        const isCat = Math.random() > 0.5;

        try {
          if (isCat) {
            const r = await fetchWithTimeout("https://catfact.ninja/fact");
            const j = await r.json();
            document.getElementById("q").innerText = j.fact;
            answer = "cat";
          } else {
            const r = await fetchWithTimeout("https://dogapi.dog/api/v2/facts?limit=1");
            const j = await r.json();
            document.getElementById("q").innerText = j.data[0].attributes.body;
            answer = "dog";
          }
        } catch (e) {
          document.getElementById("q").innerText = "API Error! Retrying...";
          setTimeout(loadFact, 1500);
        }
      }

      function guess(g) {
        if (!answer) return;

        if (g === answer) {
          streak++;
          document.getElementById("sc").innerText = "Streak: " + streak;
        } else {
          alert("Wrong! It was a " + answer);
          streak = 0;
          document.getElementById("sc").innerText = "Streak: 0";
        }

        answer = "";
        loadFact();
      }

      loadFact();
    </script>
  </div>

  <style>
.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} #box{width:100%;height:300px;background:#ef4444;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:bold;color:white;cursor:pointer;user-select:none;} .green{background:#22c55e !important;} .blue{background:#3b82f6 !important;}
  </style>
</head>
<body>
<div class="tool-container"><h1 style="color:#2563eb;">Reaction Time Test</h1><div id="box" onclick="interact()">Click to Start</div><div id="res" style="margin-top:20px;font-size:1.5rem;font-weight:bold;"></div></div>
<script>let state='start', t0, timer; const b=document.getElementById('box');
function interact(){
  if(state==='start'){ state='wait'; b.style.background='#ef4444'; b.innerText="Wait for Green..."; const rand = 2000 + Math.random()*3000; timer=setTimeout(()=>{ state='click'; b.classList.add('green'); b.innerText="CLICK!"; t0=Date.now(); }, rand); }
  else if(state==='wait'){ clearTimeout(timer); state='start'; b.innerText="Too Early! Click to retry."; b.style.background='#3b82f6'; }
  else if(state==='click'){ const diff=Date.now()-t0; state='start'; b.classList.remove('green'); b.style.background='#3b82f6'; b.innerText="Click to try again"; document.getElementById('res').innerText=`${diff} ms`; }
}
</script>

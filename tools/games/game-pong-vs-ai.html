<body>
  <div class="tool-container">
    <h1>Pong vs AI</h1>
<div class="row" style="margin-bottom:10px;text-align:center;font-size:2rem;font-weight:900;">
  <div style="color:var(--success);">You: <span id="p1">0</span></div>
  <div style="color:var(--danger);">AI: <span id="p2">0</span></div>
</div>
<div class="card" style="padding:0;overflow:hidden;background:#000;cursor:none;" onmousemove="my(event)">
  <canvas id="cvs" width="600" height="300" style="width:100%;display:block;"></canvas>
</div>
<button onclick="st()">Start Match</button>
<script>
const cvs=document.getElementById('cvs'), ctx=cvs.getContext('2d');
let ball, pL, pR, s1=0, s2=0, run=false;
function st(){ ball={x:300, y:150, dx:5, dy:3, r:8}; pL={y:110, h:80}; pR={y:110, h:80}; s1=0; s2=0; uSc(); run=true; loop(); }
function my(e){ const rect=cvs.getBoundingClientRect(); pL.y = (e.clientY-rect.top)*(300/rect.height) - 40; }
function uSc(){ document.getElementById('p1').innerText=s1; document.getElementById('p2').innerText=s2; if(s1>=5||s2>=5){run=false; alert(s1>=5?"You Win!":"AI Wins!");} }
function rst(){ ball.x=300; ball.y=150; ball.dx*=-1; ball.dy=3; }
function loop(){
  if(!run)return; ctx.clearRect(0,0,600,300); ctx.fillStyle='#fff';
  ctx.fillRect(298,0,4,300); ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill(); // Net & Ball
  ctx.fillStyle='var(--success)'; ctx.fillRect(20, pL.y, 10, pL.h); // Player
  ctx.fillStyle='var(--danger)'; ctx.fillRect(570, pR.y, 10, pR.h); // AI
  
  ball.x+=ball.dx; ball.y+=ball.dy; pR.y += (ball.y - (pR.y + 40)) * 0.1; // AI logic
  if(ball.y<ball.r || ball.y>300-ball.r) ball.dy*=-1; // Walls
  if(ball.x<30 && ball.y>pL.y && ball.y<pL.y+pL.h) { ball.dx*=-1; ball.x=30; } // Hit Left
  if(ball.x>570 && ball.y>pR.y && ball.y<pR.y+pR.h) { ball.dx*=-1; ball.x=570; } // Hit Right
  if(ball.x<0){ s2++; uSc(); rst(); } if(ball.x>600){ s1++; uSc(); rst(); }
  requestAnimationFrame(loop);
} ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,600,300); ctx.fillStyle='#fff'; ctx.font='30px sans-serif'; ctx.fillText('Click Start', 230, 150);
</script>

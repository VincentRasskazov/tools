.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} .board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px auto;max-width:300px;} .cell{height:100px;background:#f8fafc;border:2px solid #cbd5e1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:bold;cursor:pointer;color:#2563eb;} button{padding:12px 24px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:20px;} #msg{font-size:1.5rem;font-weight:bold;margin-top:20px;}
  </style>
</head>
<body>
<div class="tool-container"><h1 style="color:#2563eb;">Tic-Tac-Toe</h1><div class="board" id="board"></div><div id="msg">Player X's Turn</div><button onclick="rst()">Restart Game</button></div>
<script>let bd=Array(9).fill(''), turn='X', act=true; const win=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; function init(){document.getElementById('board').innerHTML=bd.map((_,i)=>`<div class="cell" onclick="clk(${i})" id="c${i}"></div>`).join('');} function clk(i){if(!act||bd[i])return; bd[i]=turn; document.getElementById(`c${i}`).innerText=turn; check(); if(act){turn=turn==='X'?'O':'X'; document.getElementById('msg').innerText=`Player ${turn}'s Turn`;}} function check(){let w=false; for(let c of win){if(bd[c[0]]&&bd[c[0]]===bd[c[1]]&&bd[c[0]]===bd[c[2]])w=true;} if(w){document.getElementById('msg').innerText=`Player ${turn} Wins!`; act=false;}else if(!bd.includes('')){document.getElementById('msg').innerText="It's a Draw!"; act=false;}} function rst(){bd=Array(9).fill(''); turn='X'; act=true; document.getElementById('msg').innerText="Player X's Turn"; init();} init();</script>

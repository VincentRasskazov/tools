<body>
  <div class="tool-container">
    <h1>Keyboard Memory</h1>
<div id="sc" style="text-align:center;font-size:2rem;font-weight:bold;color:var(--primary);margin-bottom:10px;">Level: 0</div>
<div class="row" style="height:150px;margin-bottom:20px;gap:10px;">
  <div id="k0" class="card" style="margin:0;background:#ef4444;opacity:0.3;cursor:pointer;transition:0.1s;" onclick="uclk(0)"></div>
  <div id="k1" class="card" style="margin:0;background:#3b82f6;opacity:0.3;cursor:pointer;transition:0.1s;" onclick="uclk(1)"></div>
  <div id="k2" class="card" style="margin:0;background:#10b981;opacity:0.3;cursor:pointer;transition:0.1s;" onclick="uclk(2)"></div>
  <div id="k3" class="card" style="margin:0;background:#f59e0b;opacity:0.3;cursor:pointer;transition:0.1s;" onclick="uclk(3)"></div>
</div>
<button onclick="st()" id="btn">Start Game</button>
<script>
let seq=[], uSeq=[], run=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function st(){ seq=[]; document.getElementById('sc').innerText="Level: 0"; document.getElementById('btn').disabled=true; nxt(); }
async function nxt(){ uSeq=[]; seq.push(Math.floor(Math.random()*4)); document.getElementById('sc').innerText="Level: "+seq.length; run=false; await sleep(1000); for(let i=0;i<seq.length;i++){ flash(seq[i]); await sleep(600); } run=true; }
function flash(i){ const k=document.getElementById('k'+i); k.style.opacity='1'; setTimeout(()=>k.style.opacity='0.3', 300); }
function uclk(i){ if(!run)return; flash(i); uSeq.push(i); if(uSeq[uSeq.length-1]!==seq[uSeq.length-1]){ alert("Wrong! You reached Level "+seq.length); run=false; document.getElementById('btn').disabled=false; } else if(uSeq.length===seq.length){ run=false; nxt(); } }
</script>

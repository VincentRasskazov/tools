.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;padding:15px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;font-family:monospace;word-break:break-all;}
  </style>

<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">UUID v5 Generator</h1><input type="text" id="ns" placeholder="Namespace (UUID)"><input type="text" id="name" placeholder="Name"><button onclick="c()">Generate</button><div id="res"></div></div>
<script>function c(){ try{ const ns=document.getElementById('ns').value || uuid.v4(); const n=document.getElementById('name').value; document.getElementById('res').innerText = uuid.v5(n, ns); }catch(e){document.getElementById('res').innerText="Error: Invalid Namespace";} }</script>
</body>

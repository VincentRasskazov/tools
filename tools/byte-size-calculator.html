  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Byte Size</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} .grid{display:flex;gap:10px;text-align:center;} .box{flex:1;background:#f8fafc;padding:20px;border-radius:6px;border:1px solid #e2e8f0;} .val{font-size:1.5rem;font-weight:bold;color:#2563eb;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Byte Size Calculator</h1>
<textarea id="in" oninput="c()" placeholder="Paste text here..."></textarea>
<div class="grid">
  <div class="box">Bytes<br><span class="val" id="b">0</span></div>
  <div class="box">Kilobytes (KB)<br><span class="val" id="kb">0</span></div>
  <div class="box">Megabytes (MB)<br><span class="val" id="mb">0</span></div>
</div></div>
<script>
function c(){
  const bytes = new Blob([document.getElementById('in').value]).size;
  document.getElementById('b').innerText = bytes;
  document.getElementById('kb').innerText = (bytes/1024).toFixed(2);
  document.getElementById('mb').innerText = (bytes/1048576).toFixed(4);
}
</script></body></html>

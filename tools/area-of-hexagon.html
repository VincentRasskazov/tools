<body>
  <div class="tool-container">
    <h1>Area of a Hexagon</h1>
<label>Side Length (a)</label><input type="number" id="a" value="5" step="0.1">
<button onclick="c()">Calculate Area</button>
<div id="res" class="res"></div>
<script>function c(){ const a=parseFloat(document.getElementById('a').value); if(a>0){ const area = ((3*Math.sqrt(3))/2)*a*a; const per = 6*a; document.getElementById('res').innerHTML=`Area: <strong style="font-size:2.5rem;color:var(--primary)">${area.toFixed(4)}</strong><br><span style="font-size:1rem;color:#64748b;">Perimeter: ${per.toFixed(4)}</span>`; } }</script>

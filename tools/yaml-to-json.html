<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>yaml to json Tool</title>
  <meta name="description" content="yaml to json online tool.">
  <meta name="category" content="Developer Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">yaml to json Tool</h1>
  </div>

  <h1>yaml to json Tool</h1>

  <p>This is a starter tool page for <strong>yaml to json</strong>.</p>


  <textarea id="input" placeholder="Paste YAML here" rows="8" style="width:100%"></textarea>
  <button onclick="run()">Convert</button>

  <pre id="output"></pre>

  <script>
    // Very basic YAML to JSON (no nested objects, only key: value)
    function yamlToJson(yaml) {
      const obj = {};
      yaml.split(/\r?\n/).forEach(line => {
        const m = line.match(/^\s*([^:]+):\s*(.*)$/);
        if (m) obj[m[1].trim()] = m[2].trim();
      });
      return JSON.stringify(obj, null, 2);
    }
    function run() {
      const v = document.getElementById('input').value;
      try {
        document.getElementById('output').innerText = yamlToJson(v);
      } catch (e) {
        document.getElementById('output').innerText = 'Invalid YAML.';
      }
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

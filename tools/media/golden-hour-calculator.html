<body>
<div class="tool-container"><h1 style="color:#f59e0b;">Golden Hour</h1><label>Sunrise Time</label><input type="time" id="sr"><label>Sunset Time</label><input type="time" id="ss"><button onclick="c()">Calculate</button><div id="res"></div></div>
<script>function c(){ const sr=document.getElementById('sr').value, ss=document.getElementById('ss').value; if(sr&&ss) document.getElementById('res').innerHTML=`Morning Golden Hour:<br>${sr} - ${addM(sr,60)}<br><br>Evening Golden Hour:<br>${subM(ss,60)} - ${ss}`; } function addM(t,m){const d=new Date('1/1/2000 '+t); d.setMinutes(d.getMinutes()+m); return d.toTimeString().slice(0,5);} function subM(t,m){const d=new Date('1/1/2000 '+t); d.setMinutes(d.getMinutes()-m); return d.toTimeString().slice(0,5);}</script>

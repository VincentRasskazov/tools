.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input,select{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.5rem;text-align:center;font-weight:bold;color:#16a34a;}

<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">FOV Calculator</h1><label>Focal Length (mm)</label><input type="number" id="fl" value="50"><label>Sensor Size</label><select id="s"><option value="36">Full Frame (35mm)</option><option value="23.6">APS-C (1.5x)</option><option value="17.3">Micro 4/3 (2.0x)</option></select><button onclick="c()">Calculate FOV</button><div id="res"></div></div>
<script>function c(){ const fl=parseFloat(document.getElementById('fl').value), s=parseFloat(document.getElementById('s').value); if(fl){ const fov = 2 * Math.atan(s / (2 * fl)) * (180 / Math.PI); document.getElementById('res').innerText = fov.toFixed(1) + "° Horizontal FOV"; } }</script>

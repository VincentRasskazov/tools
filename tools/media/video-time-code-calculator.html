<body>
<div class="tool-container"><h1 style="color:#2563eb;">Timecode Calculator</h1><div class="row"><input type="text" id="t1" placeholder="01:00:00:00"> + <input type="text" id="t2" placeholder="00:30:00:00"></div><button onclick="c()">Add Timecodes</button><h2 id="res" style="margin-top:20px;">00:00:00:00</h2></div>
<script>function p(t){const a=t.split(':').map(Number); return (a[0]*3600+a[1]*60+a[2])*24+a[3];} function f(fr){const h=Math.floor(fr/(3600*24)); fr%=3600*24; const m=Math.floor(fr/(60*24)); fr%=60*24; const s=Math.floor(fr/24); const f=fr%24; return [h,m,s,f].map(x=>String(x).padStart(2,'0')).join(':');} function c(){ document.getElementById('res').innerText=f(p(document.getElementById('t1').value)+p(document.getElementById('t2').value)); }</script>

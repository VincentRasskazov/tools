<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>data size converter Tool</title>
  <meta name="description" content="data size converter online tool.">
  <meta name="category" content="Converters">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">data size converter Tool</h1>
  </div>

  <h1>data size converter Tool</h1>

  <p>This is a starter tool page for <strong>data size converter</strong>.</p>


  <label for="input">Value:</label>
  <input id="input" type="number" placeholder="Enter value">
  <select id="from">
    <option value="B">Bytes</option>
    <option value="KB">KB</option>
    <option value="MB">MB</option>
    <option value="GB">GB</option>
    <option value="TB">TB</option>
  </select>
  <span>to</span>
  <select id="to">
    <option value="B">Bytes</option>
    <option value="KB">KB</option>
    <option value="MB">MB</option>
    <option value="GB">GB</option>
    <option value="TB">TB</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    const units = { B: 1, KB: 1024, MB: 1024*1024, GB: 1024*1024*1024, TB: 1024*1024*1024*1024 };
    function run() {
      const value = parseFloat(document.getElementById('input').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (isNaN(value) || value < 0) {
        document.getElementById('output').innerText = "Please enter a valid value.";
        return;
      }
      const bytes = value * units[from];
      const result = bytes / units[to];
      document.getElementById('output').innerText = `${value} ${from} = ${result} ${to}`;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

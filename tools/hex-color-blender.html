  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
.tool-container { max-width: 650px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); border: 1px solid var(--border); }

.res { margin-top: 25px; padding: 25px; background: var(--bg); border-radius: 12px; text-align: center; font-size: 1.5rem; font-weight: 800; border: 2px dashed var(--border); color: var(--primary); word-break: break-word; }

<body>
  <div class="tool-container">
    <h1>Hex Color Blender</h1>
<div class="row">
  <div><label>Color 1</label><input type="color" id="c1" value="#3b82f6" oninput="u()" style="height:60px;"></div>
  <div><label>Color 2</label><input type="color" id="c2" value="#ef4444" oninput="u()" style="height:60px;"></div>
</div>
<label>Blend Weight (<span id="vw">50</span>%)</label><input type="range" id="w" min="0" max="100" value="50" oninput="u()">
<div id="box" style="height:150px;border-radius:12px;margin:20px 0;border:2px solid var(--border);"></div>
<div id="res" class="res" style="font-family:monospace;"></div>
<script>function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];} function rgb2hex(r,g,b){return '#'+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('').toUpperCase();} function u(){ const c1=hex2rgb(document.getElementById('c1').value), c2=hex2rgb(document.getElementById('c2').value), w=document.getElementById('w').value/100; document.getElementById('vw').innerText=w*100; const r=c1[0]*(1-w) + c2[0]*w, g=c1[1]*(1-w) + c2[1]*w, b=c1[2]*(1-w) + c2[2]*w; const hex=rgb2hex(r,g,b); document.getElementById('box').style.background=hex; document.getElementById('res').innerText=hex; } u();</script>
  </div>

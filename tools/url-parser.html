  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>URL Parser</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} textarea{width:100%;height:250px;padding:10px;font-family:monospace;border:1px solid #ccc;border-radius:6px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">URL Parser</h1><input type="text" id="in" placeholder="https://example.com:8080/path/page?name=test#hash"><button onclick="c()">Parse URL</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ try{ const u=new URL(document.getElementById('in').value); const obj={ href: u.href, protocol: u.protocol, host: u.host, hostname: u.hostname, port: u.port, pathname: u.pathname, search: u.search, hash: u.hash }; document.getElementById('out').value=JSON.stringify(obj,null,2); }catch(e){document.getElementById('out').value="Invalid URL";} }</script></body></html>

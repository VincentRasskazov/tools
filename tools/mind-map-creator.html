  <meta charset="UTF-8"><title>Mind Map</title><style>.tool-container{max-width:900px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:150px;font-family:monospace;padding:10px;border-radius:6px;} .node{margin-left:20px;border-left:2px solid #2563eb;padding-left:10px;margin-top:5px;}</style></head>
<body><div class="tool-container"><h1>Text to Mind Map</h1>
<textarea id="i" oninput="draw()" placeholder="Main Topic&#10; Subtopic 1&#10; Subtopic 2"></textarea>
<div id="o" style="margin-top:30px;"></div></div>
<script>
function draw(){
  const lines = document.getElementById('i').value.split('\n');
  let html = '';
  lines.forEach(l => {
    const indent = l.search(/\S/);
    if(indent !== -1) html += `<div class="node" style="margin-left:${indent*20}px">${l.trim()}</div>`;
  });
  document.getElementById('o').innerHTML = html;
}
</script></body></html>

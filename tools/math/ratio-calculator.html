<body><div class="tool-container"><h1 style="color:#2563eb;">Ratio Calculator</h1><p>Leave one box empty to solve for it.</p><div class="row"><input type="number" id="a"> : <input type="number" id="b"></div><div class="row" style="margin:10px 0;">=</div><div class="row"><input type="number" id="c"> : <input type="number" id="d"></div><button onclick="calc()">Solve</button></div>
<script>function calc(){ const a=document.getElementById('a'), b=document.getElementById('b'), c=document.getElementById('c'), d=document.getElementById('d'); let av=parseFloat(a.value), bv=parseFloat(b.value), cv=parseFloat(c.value), dv=parseFloat(d.value); if(!a.value) a.value = (cv*bv)/dv; else if(!b.value) b.value = (av*dv)/cv; else if(!c.value) c.value = (av*dv)/bv; else if(!d.value) d.value = (cv*bv)/av; }</script>

<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">ROT47 Cipher</h1><textarea id="in" placeholder="Type secret message here..."></textarea><button onclick="c()">Encrypt / Decrypt</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ const s=document.getElementById('in').value; let r=''; for(let i=0;i<s.length;i++){ let code=s.charCodeAt(i); if(code>=33 && code<=126) r+=String.fromCharCode(33+((code+14)%94)); else r+=s[i]; } document.getElementById('out').value=r; }</script></body></html>

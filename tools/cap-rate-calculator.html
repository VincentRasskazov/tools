  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Cap Rate Calculator</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.5rem;text-align:center;font-weight:bold;color:#16a34a;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Cap Rate Calculator</h1><label>Net Operating Income (NOI) $</label><input type="number" id="noi" placeholder="Annual Income - Expenses"><label>Current Market Value $</label><input type="number" id="v" placeholder="Property Price"><button onclick="c()">Calculate Cap Rate</button><div id="res"></div></div>
<script>function c(){ const n=parseFloat(document.getElementById('noi').value), v=parseFloat(document.getElementById('v').value); if(v) document.getElementById('res').innerText = ((n/v)*100).toFixed(2) + "%"; }</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>force converter Tool</title>
  <meta name="description" content="force converter online tool.">
  <meta name="category" content="Converters">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">force converter Tool</h1>
  </div>

  <h1>force converter Tool</h1>

  <p>This is a starter tool page for <strong>force converter</strong>.</p>


  <label for="input">Value:</label>
  <input id="input" type="number" placeholder="Enter value">
  <select id="from">
    <option value="N">N</option>
    <option value="kN">kN</option>
    <option value="lbf">lbf</option>
    <option value="kgf">kgf</option>
  </select>
  <span>to</span>
  <select id="to">
    <option value="N">N</option>
    <option value="kN">kN</option>
    <option value="lbf">lbf</option>
    <option value="kgf">kgf</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    const factors = { N: 1, kN: 1000, lbf: 4.44822, kgf: 9.80665 };
    function run() {
      const value = parseFloat(document.getElementById('input').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (isNaN(value)) {
        document.getElementById('output').innerText = "Please enter a valid value.";
        return;
      }
      const newtons = value * factors[from];
      const result = newtons / factors[to];
      document.getElementById('output').innerText = `${value} ${from} = ${result} ${to}`;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

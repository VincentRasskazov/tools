<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">JSON Key Extractor</h1><textarea id="in" placeholder='{"id": 1, "user": {"name": "Alice"}}'></textarea><button onclick="c()">Extract Keys</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function getKeys(obj, pre='') { let keys=[]; for(let k in obj){ let p = pre ? pre+'.'+k : k; keys.push(p); if(typeof obj[k]==='object'&&obj[k]!==null&&!Array.isArray(obj[k])) keys=keys.concat(getKeys(obj[k], p)); } return keys; } function c(){ try{ const j=JSON.parse(document.getElementById('in').value); document.getElementById('out').value = getKeys(j).join('\n'); }catch(e){document.getElementById('out').value="Invalid JSON";} }</script>

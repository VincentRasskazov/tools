  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Hex to RGBA</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;} #box{height:100px;border-radius:6px;margin-top:20px;border:1px solid #ccc;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Hex to RGBA</h1>
<label>Hex Code</label><input type="text" id="in" value="#2563eb80" oninput="c()">
<label>RGBA Result</label><input type="text" id="out" readonly>
<div id="box"></div></div>
<script>function c(){ let h=document.getElementById('in').value.replace('#',''); if(h.length!==8)return; const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16), a=(parseInt(h.slice(6,8),16)/255).toFixed(2); const val=`rgba(${r}, ${g}, ${b}, ${a})`; document.getElementById('out').value=val; document.getElementById('box').style.background=val; } window.onload=c;</script></body></html>

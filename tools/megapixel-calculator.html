  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Megapixel Calc</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:2rem;font-weight:bold;color:#16a34a;text-align:center;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Megapixel Calculator</h1><label>Width (px)</label><input type="number" id="w" placeholder="1920"><label>Height (px)</label><input type="number" id="h" placeholder="1080"><button onclick="c()">Calculate</button><div id="res"></div></div>
<script>function c(){ const w=parseFloat(document.getElementById('w').value), h=parseFloat(document.getElementById('h').value); if(w&&h) document.getElementById('res').innerText = ((w*h)/1000000).toFixed(2) + " MP"; }</script></body></html>

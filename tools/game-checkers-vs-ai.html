<body>
  <div class="tool-container">
    <h1>Checkers vs AI</h1>
<div id="brd" style="display:grid;grid-template-columns:repeat(8,40px);width:fit-content;margin:0 auto 20px;border:4px solid #1e293b;"></div>
<button onclick="st()">Restart Game</button>
<script>
let b, turn=1, sel=null; // 1=Red(Pl), 2=Black(AI)
function st(){ b=Array(64).fill(0); for(let i=0;i<24;i++)if((i+Math.floor(i/8))%2!==0)b[i]=2; for(let i=40;i<64;i++)if((i+Math.floor(i/8))%2!==0)b[i]=1; turn=1; sel=null; drw(); }
function drw(){
  const g=document.getElementById('brd'); g.innerHTML='';
  b.forEach((v,i)=>{
    const bg=(i+Math.floor(i/8))%2===0?'#f1f5f9':'#64748b';
    let pc=''; if(v===1)pc='<div style="width:30px;height:30px;border-radius:50%;background:#ef4444;box-shadow:inset 0 0 5px #000;"></div>'; if(v===2)pc='<div style="width:30px;height:30px;border-radius:50%;background:#1e293b;box-shadow:inset 0 0 5px #000;"></div>';
    g.innerHTML+=`<div style="width:40px;height:40px;background:${sel===i?'#fde047':bg};display:flex;align-items:center;justify-content:center;cursor:pointer;" onclick="clk(${i})">${pc}</div>`;
  });
}
function clk(i){
  if(turn!==1)return;
  if(b[i]===1) sel=i;
  else if(sel!==null && b[i]===0){
    const d=i-sel;
    if(d===-7||d===-9) { b[i]=1; b[sel]=0; sel=null; turn=2; drw(); setTimeout(ai,500); } // Move
    else if((d===-14||d===-18) && b[sel+d/2]===2) { b[i]=1; b[sel]=0; b[sel+d/2]=0; sel=null; turn=2; drw(); setTimeout(ai,500); } // Jump
  } drw();
}
function ai(){
  let mvs=[];
  for(let i=0;i<64;i++){
    if(b[i]===2){
      if(b[i+7]===0 && (i+7)%8<i%8) mvs.push({s:i, e:i+7});
      if(b[i+9]===0 && (i+9)%8>i%8) mvs.push({s:i, e:i+9});
      if(b[i+14]===0 && b[i+7]===1 && (i+14)%8<i%8) mvs.push({s:i, e:i+14, j:i+7, w:10}); // Prioritize jumps
      if(b[i+18]===0 && b[i+9]===1 && (i+18)%8>i%8) mvs.push({s:i, e:i+18, j:i+9, w:10});
    }
  }
  if(mvs.length>0){
    mvs.sort((x,y)=>(y.w||0)-(x.w||0)); const m=mvs[0];
    b[m.e]=2; b[m.s]=0; if(m.j)b[m.j]=0;
  } else { alert("You Win!"); }
  turn=1; drw();
} st();
</script>

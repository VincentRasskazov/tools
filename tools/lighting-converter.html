  <h1>lighting converter Tool</h1>

  <p>This is a starter tool page for <strong>lighting converter</strong>.</p>


  <input id="value" type="number" placeholder="Enter value" style="width:120px;">
  <select id="from">
    <option value="lm">Lumens (lm)</option>
    <option value="lx">Lux (lx)</option>
    <option value="cd">Candela (cd)</option>
  </select>
  to
  <select id="to">
    <option value="lm">Lumens (lm)</option>
    <option value="lx">Lux (lx)</option>
    <option value="cd">Candela (cd)</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    // Assumes 1 candela = 12.57 lumens (in all directions), 1 lux = 1 lumen/m^2
    function convertLighting(value, from, to) {
      if (from === to) return value;
      // Convert to lumens first
      let lumens;
      if (from === 'lm') lumens = value;
      else if (from === 'cd') lumens = value * 12.57;
      else if (from === 'lx') lumens = value; // Needs area for real conversion
      // Convert from lumens to target
      if (to === 'lm') return lumens;
      else if (to === 'cd') return lumens / 12.57;
      else if (to === 'lx') return lumens; // Needs area for real conversion
      return null;
    }
    function run() {
      const value = parseFloat(document.getElementById('value').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (isNaN(value)) {
        document.getElementById('output').innerText = 'Enter a valid number.';
        return;
      }
      if ((from === 'lx' || to === 'lx')) {
        document.getElementById('output').innerText = 'Lux conversion requires area (not supported in this simple tool).';
        return;
      }
      const result = convertLighting(value, from, to);
      document.getElementById('output').innerText = value + ' ' + from + ' = ' + result + ' ' + to;
    }
  </script>

<body>
  <div class="tool-container">
    <h1>XML to CSV</h1>
<textarea id="in" rows="6" placeholder="<users>\n  <user>\n    <name>John</name>\n    <age>30</age>\n  </user>\n</users>"></textarea>
<button onclick="c()">Convert to CSV</button>
<textarea id="out" rows="6" readonly style="margin-top:20px;font-family:monospace;"></textarea>
<script>function c(){ try{ const p=new DOMParser(); const doc=p.parseFromString(document.getElementById('in').value, "text/xml"); if(doc.querySelector("parsererror"))throw "Invalid"; const root=doc.documentElement; const items=root.children; if(!items.length)return; let headers=Array.from(items[0].children).map(n=>n.nodeName); let csv=headers.join(',')+'\n'; for(let i=0;i<items.length;i++){ let row=[]; headers.forEach(h=>{ const el=items[i].querySelector(h); row.push(el?`"${el.textContent.replace(/"/g,'""')}"`:""); }); csv+=row.join(',')+'\n'; } document.getElementById('out').value=csv; }catch(e){ document.getElementById('out').value="Invalid XML Format"; } }</script>
  </div>
</body>

<body>
  <div class="tool-container">
    <h1>XML to CSV</h1>
<div class="card"><textarea id="in" rows="6" placeholder="<items>\n  <item><id>1</id><name>A</name></item>\n  <item><id>2</id><name>B</name></item>\n</items>"></textarea></div>
<button onclick="c()">Extract CSV</button>
<div class="card"><textarea id="out" rows="6" readonly style="font-family:monospace;white-space:pre;"></textarea></div>
<script>
function c(){
  try{
    const p=new DOMParser(); const doc=p.parseFromString(document.getElementById('in').value, "text/xml");
    if(doc.querySelector("parsererror"))throw "Err";
    const items = doc.documentElement.children; if(!items.length)return document.getElementById('out').value="No repeating items found.";
    let headers=new Set(); Array.from(items).forEach(node=>Array.from(node.children).forEach(c=>headers.add(c.tagName)));
    const hArr=Array.from(headers); let csv=hArr.join(',')+'\n';
    Array.from(items).forEach(node=>{ const row=hArr.map(h=>{ const el=node.querySelector(h); let t=el?el.textContent.trim().replace(/"/g,'""'):''; return t.includes(',')||t.includes('"')||t.includes('\\n')?`"${t}"`:t; }); csv+=row.join(',')+'\n'; });
    document.getElementById('out').value=csv.trim();
  }catch(e){ document.getElementById('out').value="Invalid XML Format."; }
}
</script>

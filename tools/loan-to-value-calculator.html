.tool-container { max-width: 680px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1), 0 10px 15px -3px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.5); }

<body>
  <div class="tool-container">
    <h1>LTV Ratio Calculator</h1>
<div class="row">
  <div class="card"><label>💰 Loan Amount ($)</label><input type="number" id="l" value="200000"></div>
  <div class="card"><label>🏠 Appraised Property Value ($)</label><input type="number" id="v" value="250000"></div>
</div>
<button onclick="calc()">Calculate LTV</button>
<div id="res" class="res"></div>
<script>function calc(){ const l=parseFloat(document.getElementById('l').value), v=parseFloat(document.getElementById('v').value); if(v>0){ const ltv=(l/v)*100; let st=ltv<=80?'var(--success)':ltv<=95?'var(--warning)':'var(--danger)'; document.getElementById('res').innerHTML=`Loan-to-Value Ratio:<br><span style="font-size:3rem;color:${st}">${ltv.toFixed(2)}%</span>`; } }</script>
  </div>
</body>

:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
.tool-container { max-width: 650px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); border: 1px solid var(--border); }

label { display: block; font-weight: 600; margin-bottom: 8px; color: #475569; font-size: 0.95rem; }
input, select, textarea { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 10px; margin-bottom: 20px; font-size: 1rem; transition: all 0.2s ease; box-sizing: border-box; background: #fcfcfc; color: var(--text); }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); background: #fff; }
button { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.2); margin-bottom: 10px; }

<body>
  <div class="tool-container">
    <h1>HTML Form Builder</h1>
<div style="display:flex;flex-wrap:wrap;gap:15px;margin-bottom:20px;">
  <label><input type="checkbox" id="n" checked style="width:auto;"> Name Field</label>
  <label><input type="checkbox" id="e" checked style="width:auto;"> Email Field</label>
  <label><input type="checkbox" id="p" style="width:auto;"> Password Field</label>
  <label><input type="checkbox" id="t" style="width:auto;"> Textarea (Message)</label>
</div>
<button onclick="c()">Generate Form HTML</button>
<textarea id="out" rows="8" readonly style="margin-top:10px;font-family:monospace;white-space:pre;"></textarea>
<script>function c(){ let h='<form action="/submit" method="POST">\n'; if(document.getElementById('n').checked) h+='  <label for="name">Name:</label>\n  <input type="text" id="name" name="name" required>\n\n'; if(document.getElementById('e').checked) h+='  <label for="email">Email:</label>\n  <input type="email" id="email" name="email" required>\n\n'; if(document.getElementById('p').checked) h+='  <label for="password">Password:</label>\n  <input type="password" id="password" name="password" required>\n\n'; if(document.getElementById('t').checked) h+='  <label for="message">Message:</label>\n  <textarea id="message" name="message" rows="4"></textarea>\n\n'; h+='  <button type="submit">Submit</button>\n</form>'; document.getElementById('out').value=h; } c();</script>
  </div>
</body>

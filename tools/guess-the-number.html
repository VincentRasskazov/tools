  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Guess Number</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} input{width:100%;padding:15px;font-size:1.5rem;text-align:center;border:2px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #msg{font-size:1.5rem;font-weight:bold;margin-top:20px;color:#1e293b;}</style></head>
<body><div class="tool-container"><h1 style="color:#2563eb;">Guess the Number (1-100)</h1><input type="number" id="in" placeholder="Enter guess..."><button onclick="g()">Submit Guess</button><div id="msg">Awaiting your guess...</div><button onclick="rst()" style="background:#ef4444;margin-top:10px;">Reset</button></div>
<script>let sec=Math.floor(Math.random()*100)+1, att=0; function g(){const v=parseInt(document.getElementById('in').value); if(!v)return; att++; const m=document.getElementById('msg'); if(v===sec) m.innerHTML=`<span style="color:#16a34a">Correct! You won in ${att} tries! 🎉</span>`; else if(v>sec) m.innerText="Too High! 📉"; else m.innerText="Too Low! 📈"; document.getElementById('in').value='';} function rst(){sec=Math.floor(Math.random()*100)+1; att=0; document.getElementById('msg').innerText="Awaiting your guess...";}</script></body></html>

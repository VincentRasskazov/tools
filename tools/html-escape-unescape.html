<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Escape & Unescape | Ultimate Tools Hub</title>
  <meta name="description" content="Escape or unescape HTML entities instantly. Free, fast, and beautiful online HTML entity tool.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/landing-polish.css">
  <style>
    .html-container { max-width: 520px; margin: 40px auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px #1976d233; padding: 32px 28px; }
    .html-title { font-size: 2rem; font-weight: 700; color: #1976d2; margin-bottom: 18px; }
    .html-desc { color: #555; margin-bottom: 22px; }
    textarea { width: 100%; min-height: 80px; font-size: 1.1rem; border-radius: 8px; border: 1px solid #d1d5db; padding: 12px; margin-bottom: 18px; }
    .result-label { font-weight: 600; color: #283593; margin-bottom: 6px; }
    .result-box { background: #f6f8fa; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 1.1rem; word-break: break-all; margin-bottom: 8px; }
    button { background: #1976d2; color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
    button:hover { background: #0d47a1; }
  </style>
</head>
<body>
  <div class="html-container">
    <div class="html-title">HTML Escape & Unescape</div>
    <div class="html-desc">Paste text below to escape or unescape HTML entities.</div>
    <textarea id="htmlInput" placeholder="Paste or type text..."></textarea>
    <button onclick="escapeHTML()">Escape HTML</button>
    <button onclick="unescapeHTML()">Unescape HTML</button>
    <div class="result-label" style="margin-top:18px;">Result:</div>
    <div class="result-box" id="htmlResult"></div>
  </div>
  <script>
    function escapeHTML() {
      const text = document.getElementById('htmlInput').value;
      document.getElementById('htmlResult').textContent = text.replace(/[&<>"']/g, function(c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c];
      });
    }
    function unescapeHTML() {
      const text = document.getElementById('htmlInput').value;
      document.getElementById('htmlResult').textContent = text.replace(/&(amp|lt|gt|quot|#39);/g, function(m) {
        return {'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&#39;':'\''}[m];
      });
    }
  </script>
</body>
</html>

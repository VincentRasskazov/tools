  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Diff Checker</title><style>.tool-container{max-width:900px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;} textarea{width:100%;height:200px;padding:10px;border:1px solid #ccc;border-radius:6px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:20px;grid-column:1/-1;} .res{margin-top:20px;font-family:monospace;white-space:pre-wrap;} .del{background:#fee2e2;text-decoration:line-through;color:#991b1b;} .add{background:#dcfce7;color:#166534;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Text Diff Checker</h1><div class="grid"><textarea id="a" placeholder="Original Text"></textarea><textarea id="b" placeholder="Changed Text"></textarea><button onclick="c()">Compare</button></div><div id="res" class="res"></div></div>
<script>function c(){ const a=document.getElementById('a').value.split('\n'), b=document.getElementById('b').value.split('\n'); let h=''; const len=Math.max(a.length,b.length); for(let i=0;i<len;i++){ if(a[i]===b[i]){ h+=`<div>${a[i]||''}</div>`; } else { if(a[i]) h+=`<div class="del">${a[i]}</div>`; if(b[i]) h+=`<div class="add">${b[i]}</div>`; } } document.getElementById('res').innerHTML=h; }</script></body></html>

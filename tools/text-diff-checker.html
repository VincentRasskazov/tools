:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

.tool-container { max-width: 800px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1), 0 10px 15px -3px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.5); }

<body>
  <div class="tool-container">
    <h1>Text Diff Checker</h1>
<div class="row">
  <div class="card"><label>🔴 Original Text</label><textarea id="t1" rows="6" placeholder="The quick brown fox jumps over the lazy dog."></textarea></div>
  <div class="card"><label>🟢 Modified Text</label><textarea id="t2" rows="6" placeholder="The quick red fox leaps over the lazy dog."></textarea></div>
</div>
<button onclick="c()">Compare Text</button>
<div class="card" id="res" style="font-family:monospace;white-space:pre-wrap;text-align:left;line-height:1.6;font-size:1.1rem;display:none;"></div>
<script>
function c(){
  const t1=document.getElementById('t1').value.split(/\s+/), t2=document.getElementById('t2').value.split(/\s+/);
  let h=''; const max=Math.max(t1.length, t2.length);
  for(let i=0;i<max;i++){
    const w1=t1[i]||'', w2=t2[i]||'';
    if(w1===w2) h+=`<span>${w1} </span>`;
    else {
      if(w1) h+=`<del style="background:#fecaca;color:#991b1b;text-decoration:none;padding:2px 4px;border-radius:4px;">${w1}</del> `;
      if(w2) h+=`<ins style="background:#bbf7d0;color:#166534;text-decoration:none;padding:2px 4px;border-radius:4px;">${w2}</ins> `;
    }
  }
  const r=document.getElementById('res'); r.style.display='block'; r.innerHTML=h.trim();
}
</script>

<body>
  <h1>Text to Tiny</h1>
  <p>Convert your normal text into tiny Unicode text. Copy and paste it anywhere!</p>
  <textarea id="input" placeholder="Enter your text here..."></textarea>
  <br>
  <button onclick="toTiny()">Convert to Tiny</button>
  <button onclick="copyOutput()">Copy Output</button>
  <div id="output" aria-live="polite"></div>
  <script>
    function toTiny() {
      const map = {
        'A':'ᴀ','B':'ʙ','C':'ᴄ','D':'ᴅ','E':'ᴇ','F':'ғ','G':'ɢ','H':'ʜ','I':'ɪ','J':'ᴊ','K':'ᴋ','L':'ʟ','M':'ᴍ','N':'ɴ','O':'ᴏ','P':'ᴘ','Q':'ǫ','R':'ʀ','S':'s','T':'ᴛ','U':'ᴜ','V':'ᴠ','W':'ᴡ','X':'x','Y':'ʏ','Z':'ᴢ',
        'a':'ᴀ','b':'ʙ','c':'ᴄ','d':'ᴅ','e':'ᴇ','f':'ғ','g':'ɢ','h':'ʜ','i':'ɪ','j':'ᴊ','k':'ᴋ','l':'ʟ','m':'ᴍ','n':'ɴ','o':'ᴏ','p':'ᴘ','q':'ǫ','r':'ʀ','s':'s','t':'ᴛ','u':'ᴜ','v':'ᴠ','w':'ᴡ','x':'x','y':'ʏ','z':'ᴢ',
        '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'
      };
      const input = document.getElementById('input').value;
      const tiny = input.split('').map(c => map[c] || c).join('');
      document.getElementById('output').innerText = tiny;
    }
    function copyOutput() {
      const output = document.getElementById('output').innerText;
      if (output) {
        navigator.clipboard.writeText(output);
        alert('Tiny text copied to clipboard!');
      }
    }
  </script>

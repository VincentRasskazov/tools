  <title>Countdown timer</title>
  
  <style>
.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} input{width:80px;padding:10px;font-size:2rem;text-align:center;border:2px solid #ccc;border-radius:6px;margin:0 10px;} #time{font-size:5rem;font-weight:bold;font-family:monospace;color:#2563eb;margin:20px 0;display:none;} button{padding:12px 24px;font-size:1.2rem;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;width:100%;margin-top:10px;}
  </style>
</head>
<body>
<div class="tool-container"><h1 style="color:#2563eb;">Countdown Timer</h1><div id="setup"><input type="number" id="m" value="5" min="0">m <input type="number" id="s" value="0" min="0" max="59">s<br><button onclick="st()">Start Timer</button></div><div id="run" style="display:none;"><div id="time">05:00</div><button onclick="rs()" style="background:#ef4444;">Cancel</button></div></div>
<script>let t=0, tm; function f(s){let m=Math.floor(s/60), sc=s%60; return `${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`;} function st(){const m=parseInt(document.getElementById('m').value||0), s=parseInt(document.getElementById('s').value||0); t=(m*60)+s; if(t<=0)return; document.getElementById('setup').style.display='none'; document.getElementById('run').style.display='block'; document.getElementById('time').style.display='block'; document.getElementById('time').innerText=f(t); tm=setInterval(()=>{t--; document.getElementById('time').innerText=f(t); if(t<=0){clearInterval(tm); alert("Timer Finished!"); rs();}},1000);} function rs(){clearInterval(tm); document.getElementById('setup').style.display='block'; document.getElementById('run').style.display='none'; document.getElementById('time').style.display='none';}</script>
</body>
</html>

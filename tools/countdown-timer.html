<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>countdown timer Tool</title>
  <meta name="description" content="countdown timer online tool.">
  <meta name="category" content="Utility Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">countdown timer Tool</h1>
  </div>

  <h1>countdown timer Tool</h1>

  <p>This is a starter tool page for <strong>countdown timer</strong>.</p>


  <label for="input">Seconds:</label>
  <input id="input" type="number" placeholder="Enter seconds">
  <button onclick="run()">Start Countdown</button>

  <p id="output"></p>

  <script>
    let timer;
    function run() {
      clearInterval(timer);
      let seconds = parseInt(document.getElementById('input').value, 10);
      if (isNaN(seconds) || seconds < 1) {
        document.getElementById('output').innerText = "Please enter a positive number.";
        return;
      }
      document.getElementById('output').innerText = seconds + ' seconds left';
      timer = setInterval(() => {
        seconds--;
        if (seconds > 0) {
          document.getElementById('output').innerText = seconds + ' seconds left';
        } else {
          document.getElementById('output').innerText = 'Time\'s up!';
          clearInterval(timer);
        }
      }, 1000);
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

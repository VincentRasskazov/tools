  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Aspect Ratio</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .row{display:flex;gap:15px;margin-bottom:20px;} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;} </style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Aspect Ratio</h1><label>Ratio (W : H)</label><div class="row"><input type="number" id="rw" value="16"><input type="number" id="rh" value="9"></div><label>Dimensions (W x H)</label><div class="row"><input type="number" id="w" value="1920" oninput="cw()"><input type="number" id="h" value="1080" oninput="ch()"></div></div>
<script>function cw(){ const rw=document.getElementById('rw').value, rh=document.getElementById('rh').value; document.getElementById('h').value=Math.round(document.getElementById('w').value * (rh/rw)); } function ch(){ const rw=document.getElementById('rw').value, rh=document.getElementById('rh').value; document.getElementById('w').value=Math.round(document.getElementById('h').value * (rw/rh)); }</script></body></html>

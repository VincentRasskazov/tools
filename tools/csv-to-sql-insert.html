<body>
  <div class="tool-container">
    <h1>CSV to SQL INSERT</h1>
<label>Table Name</label><input type="text" id="tbl" value="users">
<textarea id="in" rows="5" placeholder="id,name,age\n1,John,30\n2,Jane,25"></textarea>
<button onclick="c()">Generate SQL</button>
<textarea id="out" rows="6" readonly style="margin-top:20px;font-family:monospace;white-space:pre;"></textarea>
<script>function c(){ const t=document.getElementById('tbl').value||'table_name'; const lines=document.getElementById('in').value.trim().split('\n'); if(lines.length<2)return; const headers=lines[0].split(',').map(h=>h.trim()); let sql=''; for(let i=1;i<lines.length;i++){ const vals=lines[i].split(',').map(v=>`'${v.trim().replace(/'/g,"''")}'`); sql+=`INSERT INTO ${t} (${headers.join(', ')}) VALUES (${vals.join(', ')});\n`; } document.getElementById('out').value=sql; }</script>
  </div>

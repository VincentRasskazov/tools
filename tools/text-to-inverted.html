<body>
  <h1>Text to Inverted</h1>
  <p>Convert your normal text into inverted (upside-down) Unicode text. Copy and paste it anywhere!</p>
  <textarea id="input" placeholder="Enter your text here..."></textarea>
  <br>
  <button onclick="toInverted()">Convert to Inverted</button>
  <button onclick="copyOutput()">Copy Output</button>
  <div id="output" aria-live="polite"></div>
  <script>
    function toInverted() {
      const map = {
        'a':'ɐ','b':'q','c':'ɔ','d':'p','e':'ǝ','f':'ɟ','g':'ƃ','h':'ɥ','i':'ᴉ','j':'ɾ','k':'ʞ','l':'ʃ','m':'ɯ','n':'u','o':'o','p':'d','q':'b','r':'ɹ','s':'s','t':'ʇ','u':'n','v':'ʌ','w':'ʍ','x':'x','y':'ʎ','z':'z',
        'A':'∀','B':'𐐒','C':'Ɔ','D':'◖','E':'Ǝ','F':'Ⅎ','G':'פ','H':'H','I':'I','J':'ſ','K':'ʞ','L':'˥','M':'W','N':'N','O':'O','P':'Ԁ','Q':'Ό','R':'ᴚ','S':'S','T':'┴','U':'∩','V':'Λ','W':'M','X':'X','Y':'⅄','Z':'Z',
        '0':'0','1':'Ɩ','2':'ᄅ','3':'Ɛ','4':'ㄣ','5':'ϛ','6':'9','7':'ㄥ','8':'8','9':'6',
        '.':'˙',',':'‘','!':'¡','?':'¿','"':'„','\':'/','/':'\','_':'‾','(':'）',')':'（','[':']',']':'[','{':'}','}':'{','<':'>','>':'<','&':'⅋',';':'؛','`':'‚','
':'
'
      };
      const input = document.getElementById('input').value;
      const inverted = input.split('').map(c => map[c] || c).reverse().join('');
      document.getElementById('output').innerText = inverted;
    }
    function copyOutput() {
      const output = document.getElementById('output').innerText;
      if (output) {
        navigator.clipboard.writeText(output);
        alert('Inverted text copied to clipboard!');
      }
    }
  </script>

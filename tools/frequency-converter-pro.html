<body>
  <div class="tool-container">
    <h1>Frequency Converter</h1>
<div class="row"><div><label>Hertz (Hz)</label><input type="number" id="hz" oninput="u('hz')"></div><div><label>Kilohertz (kHz)</label><input type="number" id="khz" oninput="u('khz')"></div></div>
<div class="row"><div><label>Megahertz (MHz)</label><input type="number" id="mhz" oninput="u('mhz')"></div><div><label>Gigahertz (GHz)</label><input type="number" id="ghz" oninput="u('ghz')"></div></div>
<script>
function u(id){
  const v=parseFloat(document.getElementById(id).value); if(isNaN(v))return;
  const hz = id==='hz'?v : id==='khz'?v*1e3 : id==='mhz'?v*1e6 : v*1e9;
  document.getElementById('hz').value=id==='hz'?v:hz;
  document.getElementById('khz').value=id==='khz'?v:(hz/1e3);
  document.getElementById('mhz').value=id==='mhz'?v:(hz/1e6);
  document.getElementById('ghz').value=id==='ghz'?v:(hz/1e9);
}
</script>

  <style>
.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} #bpm{font-size:6rem;font-weight:bold;color:#2563eb;margin:20px 0;} button{padding:15px 30px;font-size:1.2rem;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin-top:10px;}
  </style>
</head>
<body>
<div class="tool-container"><h1 style="color:#2563eb;">BPM Tapper</h1><div id="bpm">0</div><p>Tap spacebar or click below</p><button onmousedown="tap()">TAP HERE</button><button onclick="reset()" style="background:#ef4444;margin-left:10px;">Reset</button></div>
<script>let taps=[], last=0; function tap(){ const n=Date.now(); if(n-last>2000)taps=[]; last=n; taps.push(n); if(taps.length>1){ const diffs=taps.slice(1).map((t,i)=>t-taps[i]); const avg=diffs.reduce((a,b)=>a+b)/diffs.length; document.getElementById('bpm').innerText=Math.round(60000/avg); } } function reset(){taps=[];document.getElementById('bpm').innerText=0;} window.addEventListener('keydown',e=>{if(e.code==='Space')tap();});</script>
</body>

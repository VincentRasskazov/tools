<body>
  <div class="tool-container">
    <h1>Waist-to-Hip Ratio</h1>
<div class="row"><div><label>Waist Circumference</label><input type="number" id="w" value="32"></div><div><label>Hip Circumference</label><input type="number" id="h" value="38"></div></div>
<label>Biological Sex</label><select id="g"><option value="m">Male</option><option value="f">Female</option></select>
<button onclick="c()">Calculate WHR</button>
<div id="res" class="res"></div>
<script>function c(){ const w=parseFloat(document.getElementById('w').value), h=parseFloat(document.getElementById('h').value), g=document.getElementById('g').value; if(w&&h){ const r=w/h; let risk=''; if(g==='m'){ if(r<=0.95)risk='<span style="color:var(--success)">Low Risk</span>'; else if(r<=1.0)risk='<span style="color:var(--warning)">Moderate Risk</span>'; else risk='<span style="color:var(--danger)">High Risk</span>'; } else { if(r<=0.80)risk='<span style="color:var(--success)">Low Risk</span>'; else if(r<=0.85)risk='<span style="color:var(--warning)">Moderate Risk</span>'; else risk='<span style="color:var(--danger)">High Risk</span>'; } document.getElementById('res').innerHTML=`Your Ratio: <strong style="font-size:2rem;">${r.toFixed(2)}</strong><br>${risk}`; } }</script>

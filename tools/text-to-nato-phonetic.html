<body>
  <div class="tool-container">
    <div class="tool-header">
      <a class="tool-back" href="../index.html">← Back</a>
      <h1 class="tool-title">Text to NATO Phonetic</h1>
    </div>
    <p>Convert any text to the NATO phonetic alphabet for communication, learning, or fun!</p>
    <textarea id="input" placeholder="Type or paste text..."></textarea>
    <button onclick="toNato()">Convert</button>
    <pre id="output"></pre>
    <script>
      const nato = {
        a: 'Alpha', b: 'Bravo', c: 'Charlie', d: 'Delta', e: 'Echo', f: 'Foxtrot', g: 'Golf', h: 'Hotel', i: 'India', j: 'Juliett', k: 'Kilo', l: 'Lima', m: 'Mike', n: 'November', o: 'Oscar', p: 'Papa', q: 'Quebec', r: 'Romeo', s: 'Sierra', t: 'Tango', u: 'Uniform', v: 'Victor', w: 'Whiskey', x: 'X-ray', y: 'Yankee', z: 'Zulu', ' ': ' / '
      };
      function toNato() {
        const input = document.getElementById('input').value.toLowerCase();
        const output = input.split('').map(c => nato[c] || c).join(' ');
        document.getElementById('output').innerText = output;
      }
    </script>

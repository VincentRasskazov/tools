  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>IP Lookup</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} #ip{font-size:2.5rem;font-weight:bold;font-family:monospace;color:#2563eb;background:#f8fafc;padding:20px;border-radius:6px;border:1px solid #cbd5e1;margin-top:20px;word-break:break-all;} button{padding:10px 20px;margin-top:20px;background:#10b981;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="color:#2563eb;">Your IP Address</h1><div id="ip">Loading...</div><button onclick="fetchIP()">Refresh IP</button></div>
<script>function fetchIP(){document.getElementById('ip').innerText="Loading..."; fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>document.getElementById('ip').innerText=d.ip).catch(()=>document.getElementById('ip').innerText="Error fetching IP");} fetchIP();</script></body></html>

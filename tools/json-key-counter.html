  <style>

<body>
  <div class="tool-container">
    <h1>JSON Key Counter</h1>
<textarea id="in" rows="6" placeholder='{"user": {"name": "John", "roles": ["admin"]}}'></textarea>
<button onclick="c()">Count Keys</button>
<div id="res" class="res" style="font-size:1.2rem;line-height:1.8;text-align:left;"></div>
<script>function count(obj){ let keys=0, vals=0, arrs=0; function traverse(o){ if(Array.isArray(o)){ arrs++; o.forEach(traverse); } else if(o!==null && typeof o==='object'){ for(let k in o){ keys++; traverse(o[k]); } } else { vals++; } } traverse(obj); return {keys, vals, arrs}; } function c(){ try{ const o=JSON.parse(document.getElementById('in').value); const st=count(o); document.getElementById('res').innerHTML=`Total Keys: <strong>${st.keys}</strong><br>Total Primitive Values: <strong>${st.vals}</strong><br>Total Arrays: <strong>${st.arrs}</strong>`; }catch(e){ document.getElementById('res').innerHTML="<span style='color:var(--danger)'>Invalid JSON</span>"; } }</script>
  </div>
</body>

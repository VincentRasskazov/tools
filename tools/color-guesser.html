  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Color Guesser</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} #box{width:100%;height:150px;border-radius:12px;margin-bottom:20px;} .opts{display:flex;flex-direction:column;gap:10px;} button{padding:15px;font-size:1.2rem;font-family:monospace;background:#f8fafc;border:2px solid #cbd5e1;border-radius:6px;cursor:pointer;font-weight:bold;} button:hover{background:#e2e8f0;} #msg{margin-top:15px;font-weight:bold;font-size:1.2rem;}</style></head>
<body><div class="tool-container"><h1>Guess the Color</h1><div id="box"></div><div class="opts" id="opts"></div><div id="msg"></div><button onclick="init()" style="margin-top:20px;background:#2563eb;color:white;border:none;">Next Color</button></div>
<script>let ans=""; function rHex(){return '#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0').toUpperCase();} function init(){ ans=rHex(); document.getElementById('box').style.background=ans; let opts=[ans, rHex(), rHex()].sort(()=>0.5-Math.random()); document.getElementById('opts').innerHTML=opts.map(o=>`<button onclick="chk('${o}')">${o}</button>`).join(''); document.getElementById('msg').innerText=""; } function chk(g){ if(g===ans) document.getElementById('msg').innerHTML='<span style="color:#16a34a">Correct! 🎉</span>'; else document.getElementById('msg').innerHTML='<span style="color:#ef4444">Wrong!</span>'; } init();</script></body></html>

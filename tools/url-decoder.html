<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>url decoder Tool</title>
  <meta name="description" content="url decoder online tool.">
  <meta name="category" content="Encoding Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">url decoder Tool</h1>
  </div>

  <h1>url decoder Tool</h1>

  <p>This is a starter tool page for <strong>url decoder</strong>.</p>


  <textarea id="input" placeholder="Paste URL-encoded string here..." rows="4" style="width:100%"></textarea>
  <button onclick="run()">Decode</button>

  <p id="output"></p>

  <script>
    function run() {
      const v = document.getElementById('input').value;
      try {
        document.getElementById('output').innerText = decodeURIComponent(v);
      } catch (e) {
        document.getElementById('output').innerText = 'Invalid input.';
      }
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Force Calc</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Force Calculator</h1><p>Leave one blank.</p><label>Force (N)</label><input type="number" id="f"><label>Mass (kg)</label><input type="number" id="m"><label>Acceleration (m/s²)</label><input type="number" id="a"><button onclick="c()">Calculate</button></div>
<script>function c(){ const f=document.getElementById('f'), m=document.getElementById('m'), a=document.getElementById('a'); const fv=parseFloat(f.value), mv=parseFloat(m.value), av=parseFloat(a.value); if(!fv && mv && av) f.value=(mv*av).toFixed(2); else if(!mv && fv && av) m.value=(fv/av).toFixed(2); else if(!av && fv && mv) a.value=(fv/mv).toFixed(2); }</script></body></html>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Device Info</title><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .row{padding:15px;border-bottom:1px solid #eee;display:flex;flex-direction:column;} .key{font-weight:bold;color:#64748b;margin-bottom:5px;} .val{font-family:monospace;font-size:1.1rem;word-break:break-all;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Your Device Info</h1>
<div id="out"></div></div>
<script>
const out = document.getElementById('out');
const data = [
  ['User Agent', navigator.userAgent], ['Platform', navigator.platform], ['Language', navigator.language], ['Cookies Enabled', navigator.cookieEnabled],
  ['Screen Resolution', screen.width + 'x' + screen.height], ['Color Depth', screen.colorDepth + ' bit']
];
data.forEach(d => out.innerHTML += `<div class="row"><span class="key">${d[0]}</span><span class="val">${d[1]}</span></div>`);
</script></body></html>

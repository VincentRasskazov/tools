  <style>

<body>
  <div class="tool-container">
    <h1>Color Reflex Match</h1>
<div id="wrd" style="font-size:4rem;font-weight:900;text-align:center;margin:30px 0;">BLUE</div>
<div class="row">
    <button onclick="chk(true)" style="background:var(--success)">MATCH</button>
    <button onclick="chk(false)" style="background:var(--danger)">NO MATCH</button>
</div>
<div id="sc" style="text-align:center;font-size:1.5rem;font-weight:bold;margin-top:20px;">Score: 0</div>
<script>const c=[{n:'RED',h:'#ef4444'},{n:'BLUE',h:'#3b82f6'},{n:'GREEN',h:'#10b981'},{n:'YELLOW',h:'#f59e0b'}]; let s=0, isMatch=false; function nx(){const text=c[Math.floor(Math.random()*c.length)]; isMatch=Math.random()>0.5; const col=isMatch?text:c[Math.floor(Math.random()*c.length)]; const el=document.getElementById('wrd'); el.innerText=text.n; el.style.color=col.h;} function chk(g){if(g===isMatch){s++; document.getElementById('sc').innerHTML=`<span style="color:var(--success)">Correct! Score: ${s}</span>`; nx();}else{s=0; document.getElementById('sc').innerHTML=`<span style="color:var(--danger)">Wrong! Score reset to 0</span>`; nx();}} nx();</script>

<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">JSON String Unescape</h1><textarea id="in" placeholder='Text with \"quotes\" and \\slashes'></textarea><button onclick="c()">Unescape String</button><textarea id="out" readonly style="margin-top:20px;"></textarea></div>
<script>function c(){ try{ const val = document.getElementById('in').value; document.getElementById('out').value = JSON.parse('"' + val + '"'); }catch(e){document.getElementById('out').value = "Invalid escaped string.";} }</script></body></html>

  <style>
.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} #arena{width:100%;height:300px;background:#f8fafc;position:relative;border-radius:12px;overflow:hidden;border:2px solid #cbd5e1;} #dot{width:40px;height:40px;background:#ef4444;border-radius:50%;position:absolute;cursor:pointer;transition:0.2s;} #stats{font-size:1.5rem;font-weight:bold;margin-bottom:10px;}
  </style>
</head>
<body>
<div class="tool-container"><h1 style="color:#2563eb;">Catch the Dot</h1><div id="stats">Score: 0 | Time: 15s</div><div id="arena"><div id="dot" onclick="hit()" style="top:130px;left:280px;display:none;"></div></div><button onclick="st()" style="margin-top:20px;padding:10px 20px;background:#16a34a;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;">Start Game</button></div>
<script>let s=0, t=15, tm, mv; function st(){s=0; t=15; document.getElementById('dot').style.display='block'; document.getElementById('stats').innerText=`Score: ${s} | Time: ${t}s`; clearInterval(tm); clearInterval(mv); tm=setInterval(()=>{t--; document.getElementById('stats').innerText=`Score: ${s} | Time: ${t}s`; if(t<=0){clearInterval(tm);clearInterval(mv);document.getElementById('dot').style.display='none';alert(`Game Over! Score: ${s}`);}},1000); mv=setInterval(move,800);} function hit(){s++; move(); document.getElementById('stats').innerText=`Score: ${s} | Time: ${t}s`; clearInterval(mv); mv=setInterval(move, Math.max(200, 800-(s*20)));} function move(){const d=document.getElementById('dot'), a=document.getElementById('arena'); d.style.top=Math.random()*(a.clientHeight-40)+'px'; d.style.left=Math.random()*(a.clientWidth-40)+'px';}</script>
</body>

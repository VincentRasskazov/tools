<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>css minifier Tool</title>
  <meta name="description" content="css minifier online tool.">
  <meta name="category" content="Developer Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">css minifier Tool</h1>
  </div>

  <h1>css minifier Tool</h1>

  <p>This is a starter tool page for <strong>css minifier</strong>.</p>


  <label for="input">CSS:</label>
  <textarea id="input" placeholder="Paste CSS here"></textarea>
  <button onclick="run()">Minify</button>

  <p id="output"></p>

  <script>
    function run() {
      let css = document.getElementById('input').value;
      if (!css) {
        document.getElementById('output').innerText = "Please enter CSS.";
        return;
      }
      // Remove comments
      css = css.replace(/\/\*[^*]*\*+([^/*][^*]*\*+)*\//g, '');
      // Remove whitespace
      css = css.replace(/\s+/g, ' ');
      css = css.replace(/\s*([{}:;,])\s*/g, '$1');
      css = css.replace(/;}/g, '}');
      document.getElementById('output').innerText = css.trim();
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Bitwise Calculator</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} input,select{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;font-family:monospace;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="color:#2563eb;">Bitwise Calculator</h1><input type="text" id="a" placeholder="Binary A (e.g. 1010)"><select id="op"><option value="AND">AND (&)</option><option value="OR">OR (|)</option><option value="XOR">XOR (^)</option></select><input type="text" id="b" placeholder="Binary B (e.g. 1100)"><button onclick="c()">Calculate</button><input type="text" id="out" readonly style="margin-top:20px;background:#f8fafc;"></div>
<script>function c(){ const a=parseInt(document.getElementById('a').value,2), b=parseInt(document.getElementById('b').value,2), op=document.getElementById('op').value; if(isNaN(a)||isNaN(b))return; let r; if(op==='AND')r=a&b; if(op==='OR')r=a|b; if(op==='XOR')r=a^b; document.getElementById('out').value = (r>>>0).toString(2); }</script></body></html>

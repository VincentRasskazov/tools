<body>
  <h1>Text to Fractions</h1>
  <p>Convert numbers to Unicode fractions. Copy and paste it anywhere!</p>
  <textarea id="input" placeholder="Enter a fraction (e.g. 1/2)..."></textarea>
  <br>
  <button onclick="toFraction()">Convert to Fraction</button>
  <button onclick="copyOutput()">Copy Output</button>
  <div id="output" aria-live="polite"></div>
  <script>
    function toFraction() {
      const map = {
        '1/2':'½','1/3':'⅓','2/3':'⅔','1/4':'¼','3/4':'¾','1/5':'⅕','2/5':'⅖','3/5':'⅗','4/5':'⅘','1/6':'⅙','5/6':'⅚','1/7':'⅐','1/8':'⅛','3/8':'⅜','5/8':'⅝','7/8':'⅞','1/9':'⅑','1/10':'⅒'
      };
      const input = document.getElementById('input').value.trim();
      const fraction = map[input] || 'No Unicode fraction for this input';
      document.getElementById('output').innerText = fraction;
    }
    function copyOutput() {
      const output = document.getElementById('output').innerText;
      if (output) {
        navigator.clipboard.writeText(output);
        alert('Fraction text copied to clipboard!');
      }
    }
  </script>

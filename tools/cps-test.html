  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>CPS Test</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} #area{width:100%;height:200px;background:#e2e8f0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:bold;color:#475569;cursor:pointer;user-select:none;transition:0.1s;} #area:active{background:#cbd5e1;transform:scale(0.98);} #stats{font-size:1.5rem;margin-top:20px;font-weight:bold;}</style></head>
<body><div class="tool-container"><h1 style="color:#2563eb;">CPS Test (10s)</h1><div id="area" onmousedown="clickBtn()">Click to Start</div><div id="stats">Score: 0 | Time: 10.00</div><button onclick="reset()" style="margin-top:20px;padding:10px 20px;background:#ef4444;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;">Reset</button></div>
<script>let start=0, clicks=0, timer, active=false; const area=document.getElementById('area');
function clickBtn(){ if(!active && clicks===0){ active=true; start=Date.now(); timer=setInterval(update, 10); } if(active && (Date.now()-start)<10000){ clicks++; } }
function update(){ const t = (10 - (Date.now()-start)/1000).toFixed(2); if(t<=0){ clearInterval(timer); active=false; area.innerText="Game Over!"; document.getElementById('stats').innerText=`Score: ${clicks} | CPS: ${(clicks/10).toFixed(2)}`; } else { document.getElementById('stats').innerText=`Score: ${clicks} | Time: ${t}`; } }
function reset(){ clearInterval(timer); active=false; clicks=0; area.innerText="Click to Start"; document.getElementById('stats').innerText="Score: 0 | Time: 10.00"; }
</script></body></html>

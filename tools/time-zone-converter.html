<div class="tool-container">
    <h1>Global Time Zones</h1>
<button onclick="c()">Update Times 🌍</button>
<div id="res" style="margin-top:20px;display:grid;gap:10px;"></div>
<script>const tz=[{n:'New York',z:'America/New_York'},{n:'London',z:'Europe/London'},{n:'Tokyo',z:'Asia/Tokyo'},{n:'Sydney',z:'Australia/Sydney'},{n:'Dubai',z:'Asia/Dubai'}]; function c(){ let h=''; tz.forEach(t=>{const time=new Date().toLocaleTimeString('en-US',{timeZone:t.z, hour:'2-digit', minute:'2-digit'}); h+=`<div style="display:flex;justify-content:space-between;padding:15px;background:var(--bg);border-radius:8px;border:1px solid var(--border);font-weight:bold;font-size:1.2rem;"><span>${t.n}</span><span style="color:var(--primary)">${time}</span></div>`;}); document.getElementById('res').innerHTML=h; } c();</script>

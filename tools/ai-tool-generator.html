---
layout: default
title: AI Custom Tool Builder
description: Select an AI model, describe your tool, and generate the code instantly.
category: Developer
---

<div class="tool-container" style="max-width: 1200px; margin: auto; padding: 20px; font-family: 'Plus Jakarta Sans', sans-serif;">
    
    <div style="display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;">
        <select id="ai-model" style="padding: 14px; border-radius: 12px; border: 2px solid #e2e8f0; font-size: 15px; background: #ffffff; color: #0f172a; outline: none;">
            <optgroup label="Recommended (Stable)">
                <option value="copilot">Microsoft Copilot</option>
                <option value="deepai-deepseek">DeepAI - DeepSeek V3.2</option>
            </optgroup>
            <optgroup label="Experimental (May fail or timeout)">
                <option value="venice">Venice AI (GLM 4.6)</option>
                <option value="overchat">Overchat (GPT-5 Nano)</option>
                <option value="talkai">Talk AI (GPT-4.1)</option>
                <option value="notegpt">NoteGPT (GPT-4 Mini)</option>
                <option value="useai">Use AI (GPT-5)</option>
                <option value="chatplus">Chatplus (GPT-4o)</option>
                <option value="horde">AI Horde</option>
                <option value="g4f">G4F</option>
                <option value="deepai-llama">DeepAI - Llama 3.3 70B</option>
                <option value="deepai-qwen">DeepAI - Qwen3 30B</option>
                <option value="deepai-4omini">DeepAI - GPT-4o mini</option>
                <option value="deepai-gemma3">DeepAI - Gemma 3 12B</option>
                <option value="deepai-gemma2">DeepAI - Gemma2 9B</option>
                <option value="deepai-4nano">DeepAI - GPT-4.1 Nano</option>
            </optgroup>
        </select>

        <input type="text" id="ai-prompt" placeholder="Describe the tool you want to build..." style="flex-grow: 1; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none;">
        <button onclick="generateTool()" id="generate-btn" style="padding: 14px 28px; background: #2563eb; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s;">Generate</button>
    </div>
    
    <p id="status-msg" style="color: #64748b; font-weight: 600; min-height: 24px; margin-top: 0;"></p>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px;">
        <div style="display: flex; flex-direction: column;">
            <h3 style="margin-top: 0; color: #0f172a;">Code Output</h3>
            <textarea id="ai-code" oninput="updatePreview()" style="width: 100%; height: 500px; font-family: monospace; padding: 16px; border: 2px solid #e2e8f0; border-radius: 12px; background: #f8fafc; color: #0f172a; resize: vertical; box-sizing: border-box;"></textarea>
            
            <button onclick="submitToEmail()" style="margin-top: 16px; padding: 14px; background: #0f172a; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s;">
                Submit for Approval
            </button>
        </div>
        <div style="display: flex; flex-direction: column;">
            <h3 style="margin-top: 0; color: #0f172a;">Live Preview</h3>
            <iframe id="ai-preview" style="width: 100%; height: 500px; border: 2px solid #e2e8f0; border-radius: 12px; background: white; box-sizing: border-box;"></iframe>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const passedPrompt = urlParams.get('prompt');
        if (passedPrompt) {
            document.getElementById('ai-prompt').value = passedPrompt;
        }
    });

    let conversationHistory = "System: You are an expert web developer. Output ONLY complete, valid HTML code containing embedded CSS and JS for a single-file web tool based on the user's request. Do not include markdown formatting like ```html. Do not include any conversational text. Just return the raw code.\n\n";
    
    let lastRequestTime = 0;
    const COOLDOWN_MS = 10000;

    async function generateTool() {
        const promptInput = document.getElementById('ai-prompt').value;
        const selectedModel = document.getElementById('ai-model').value;
        const codeOutput = document.getElementById('ai-code');
        const statusText = document.getElementById('status-msg');
        const btn = document.getElementById('generate-btn');

        if (!promptInput.trim()) {
            statusText.innerText = "Please enter a description first.";
            statusText.style.color = "#dc2626";
            return;
        }

        const now = Date.now();
        if (now - lastRequestTime < COOLDOWN_MS) {
            const timeLeft = Math.ceil((COOLDOWN_MS - (now - lastRequestTime)) / 1000);
            statusText.innerText = `Rate limit active. Please wait ${timeLeft} seconds before generating again.`;
            statusText.style.color = "#ea580c";
            return;
        }

        btn.disabled = true;
        btn.innerText = "Working...";
        btn.style.opacity = "0.7";
        statusText.style.color = "#2563eb";
        statusText.innerText = `Model is writing your code... (This may take a moment)`;
        codeOutput.value = "";

        conversationHistory += `User: ${promptInput}\nAI:`;

        const payload = {
            id: crypto.randomUUID(),
            message: conversationHistory,
            model: selectedModel
        };

        const apiUrl = '[https://backendai-ablv.onrender.com/chat](https://backendai-ablv.onrender.com/chat)';

        try {
            lastRequestTime = Date.now();
            
            const response = await fetch(apiUrl, {
                method: 'POST',
                mode: 'cors', // Crucial fix for 405 error
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'text/plain'
                },
                body: JSON.stringify(payload)
            });

            if (response.status === 429) {
                throw new Error("Rate limit exceeded on the server. Please wait a bit.");
            }
            if (!response.ok) {
                throw new Error(`Server Error: ${response.status}`);
            }

            let rawText = await response.text();
            
            rawText = rawText.replace(/^```html\s*/i, '').replace(/```\s*$/i, '').trim();

            conversationHistory += ` ${rawText}\n`;
            codeOutput.value = rawText;
            updatePreview();
            
            statusText.style.color = "#16a34a";
            statusText.innerText = "Success! Tweak the code below or submit it.";

        } catch (error) {
            console.error("API Error:", error);
            statusText.style.color = "#dc2626";
            statusText.innerText = `Error: ${error.message || "Failed to connect to AI backend."}`;
        } finally {
            btn.disabled = false;
            btn.innerText = "Generate";
            btn.style.opacity = "1";
        }
    }

    function updatePreview() {
        const code = document.getElementById('ai-code').value;
        const previewFrame = document.getElementById('ai-preview');
        const doc = previewFrame.contentWindow.document;
        doc.open();
        doc.write(code);
        doc.close();
    }

    function submitToEmail() {
        const code = document.getElementById('ai-code').value;
        const prompt = document.getElementById('ai-prompt').value || "Custom Tool";
        
        if (!code.trim()) {
            alert("Generate a tool first before submitting!");
            return;
        }

        const subject = encodeURIComponent(`New Tool Submission: ${prompt}`);
        const body = encodeURIComponent(`Idea: ${prompt}\n\nHere is the generated code:\n\n${code}`);
        window.location.href = `mailto:vincentr111222@Gmail.com?subject=${subject}&body=${body}`;
    }
</script>

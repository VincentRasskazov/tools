---
layout: default
title: AI Custom Tool Builder
description: Select an AI model, describe your tool, and generate the code instantly.
category: Developer
---

<div class="tool-container" style="max-width: 1200px; margin: auto; padding: 20px;">
    
    <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
        <select id="ai-model" style="padding: 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; background: white;">
            <optgroup label="🌟 Recommended (Stable)">
                <option value="copilot">Microsoft Copilot</option>
                <option value="deepai-deepseek">DeepAI - DeepSeek V3.2</option>
            </optgroup>
            <optgroup label="🧪 Experimental (May fail or timeout)">
                <option value="venice">Venice AI (GLM 4.6)</option>
                <option value="overchat">Overchat (GPT-5 Nano)</option>
                <option value="talkai">Talk AI (GPT-4.1)</option>
                <option value="notegpt">NoteGPT (GPT-4 Mini)</option>
                <option value="useai">Use AI (GPT-5)</option>
                <option value="chatplus">Chatplus (GPT-4o)</option>
                <option value="horde">AI Horde</option>
                <option value="g4f">G4F</option>
                <option value="deepai-llama">DeepAI - Llama 3.3 70B</option>
                <option value="deepai-qwen">DeepAI - Qwen3 30B</option>
                <option value="deepai-4omini">DeepAI - GPT-4o mini</option>
                <option value="deepai-gemma3">DeepAI - Gemma 3 12B</option>
                <option value="deepai-gemma2">DeepAI - Gemma2 9B</option>
                <option value="deepai-4nano">DeepAI - GPT-4.1 Nano</option>
            </optgroup>
        </select>

        <input type="text" id="ai-prompt" placeholder="Describe the tool you want to build..." style="flex-grow: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px;">
        <button onclick="generateTool()" id="generate-btn" style="padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Generate</button>
    </div>
    
    <p id="status-msg" style="color: #666; font-weight: bold; min-height: 24px; margin-top: 0;"></p>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
        <div style="display: flex; flex-direction: column;">
            <h3 style="margin-top: 0;">Code Output</h3>
            <textarea id="ai-code" oninput="updatePreview()" style="width: 100%; height: 400px; font-family: monospace; padding: 10px; border: 1px solid #ccc; border-radius: 6px; background: #f8f9fa;"></textarea>
            <button onclick="submitToEmail()" style="margin-top: 15px; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
                ✉️ Submit code to Vincent for approval
            </button>
        </div>
        <div style="display: flex; flex-direction: column;">
            <h3 style="margin-top: 0;">Live Preview</h3>
            <iframe id="ai-preview" style="width: 100%; height: 400px; border: 1px solid #ccc; border-radius: 6px; background: white;"></iframe>
        </div>
    </div>
</div>

<script>
    // Auto-fill prompt if coming from index.html
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const passedPrompt = urlParams.get('prompt');
        if (passedPrompt) {
            document.getElementById('ai-prompt').value = passedPrompt;
        }
    });

    let conversationHistory = "System: You are an expert web developer. Output ONLY complete, valid HTML code containing embedded CSS and JS for a single-file web tool based on the user's request. Do not include markdown formatting like ```html. Do not include any conversational text. Just return the raw code.\n\n";
    
    // Rate Limiting Setup
    let lastRequestTime = 0;
    const COOLDOWN_MS = 10000; // 10 second cooldown between requests

    async function generateTool() {
        const promptInput = document.getElementById('ai-prompt').value;
        const selectedModel = document.getElementById('ai-model').value;
        const codeOutput = document.getElementById('ai-code');
        const statusText = document.getElementById('status-msg');
        const btn = document.getElementById('generate-btn');

        if (!promptInput.trim()) {
            statusText.innerText = "⚠️ Please enter a description first.";
            statusText.style.color = "#dc2626";
            return;
        }

        // Client-side Rate Limit Check
        const now = Date.now();
        if (now - lastRequestTime < COOLDOWN_MS) {
            const timeLeft = Math.ceil((COOLDOWN_MS - (now - lastRequestTime)) / 1000);
            statusText.innerText = `⏳ Please wait ${timeLeft} seconds before generating again.`;
            statusText.style.color = "#ea580c";
            return;
        }

        // UI Loading State
        btn.disabled = true;
        btn.innerText = "Working...";
        statusText.style.color = "#2563eb";
        statusText.innerText = `🤖 ${selectedModel} is writing your code... (This may take a moment)`;
        codeOutput.value = "";

        conversationHistory += `User: ${promptInput}\nAI:`;

        const payload = {
            id: crypto.randomUUID(),
            message: conversationHistory,
            model: selectedModel
        };

        try {
            lastRequestTime = Date.now(); // Record request time
            
            const response = await fetch('[https://backendai-ablv.onrender.com/chat](https://backendai-ablv.onrender.com/chat)', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            // Handle Server-Side Rate Limit
            if (response.status === 429) {
                throw new Error("429: Rate limit exceeded on the server. Please wait a bit.");
            }
            if (!response.ok) {
                throw new Error(`Server Error: ${response.status}`);
            }

            let rawText = await response.text();
            
            // Strip markdown block formatting if the AI disobeys the system prompt
            rawText = rawText.replace(/^```html\s*/i, '').replace(/```\s*$/i, '').trim();

            conversationHistory += ` ${rawText}\n`;
            codeOutput.value = rawText;
            updatePreview();
            
            statusText.style.color = "#16a34a";
            statusText.innerText = "✨ Success! Tweak the code or submit it.";

        } catch (error) {
            console.error("API Error:", error);
            statusText.style.color = "#dc2626";
            statusText.innerText = `❌ ${error.message || "Failed to connect to AI backend."}`;
        } finally {
            btn.disabled = false;
            btn.innerText = "Generate";
        }
    }

    function updatePreview() {
        const code = document.getElementById('ai-code').value;
        const previewFrame = document.getElementById('ai-preview');
        const doc = previewFrame.contentWindow.document;
        doc.open();
        doc.write(code);
        doc.close();
    }

    function submitToEmail() {
        const code = document.getElementById('ai-code').value;
        const prompt = document.getElementById('ai-prompt').value || "Custom Tool";
        
        if (!code.trim()) return alert("Generate a tool first before submitting!");

        const subject = encodeURIComponent(`New Tool Submission: ${prompt}`);
        const body = encodeURIComponent(`Idea: ${prompt}\n\nHere is the generated code:\n\n${code}`);
        window.location.href = `mailto:vincentr111222@Gmail.com?subject=${subject}&body=${body}`;
    }
</script>

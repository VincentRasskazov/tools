  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Simple Interest</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.2rem;background:#f8fafc;padding:15px;border-radius:6px;border:1px solid #cbd5e1;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Simple Interest</h1><label>Principal ($)</label><input type="number" id="p"><label>Annual Rate (%)</label><input type="number" id="r"><label>Time (Years)</label><input type="number" id="t"><button onclick="c()">Calculate</button><div id="res"></div></div>
<script>function c(){ const p=parseFloat(document.getElementById('p').value), r=parseFloat(document.getElementById('r').value)/100, t=parseFloat(document.getElementById('t').value); if(p&&r&&t){ const i=p*r*t; document.getElementById('res').innerHTML=`Interest: <strong>$${i.toFixed(2)}</strong><br>Total Amount: <strong>$${(p+i).toFixed(2)}</strong>`; } }</script></body></html>

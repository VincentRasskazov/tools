  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Glassmorphism Generator</title><style>.tool-container{max-width:800px;margin:40px auto;background:#333;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);color:white;} .preview-container{background:url('https://placehold.co/800x400/2563eb/white?text=Background') center/cover;padding:50px;border-radius:12px;margin-bottom:20px;} .glass-box{width:100%;height:150px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:bold;color:white;} .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;} input[type=range]{width:100%;} textarea{width:100%;padding:10px;font-family:monospace;border-radius:6px;border:none;margin-top:20px;color:black;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;">Glassmorphism Generator</h1>
<div class="preview-container"><div id="glass" class="glass-box">Glass Effect</div></div>
<div class="grid">
<div><label>Blur (<span id="vb">10</span>px)</label><input type="range" id="b" min="0" max="20" value="10" oninput="u()"></div>
<div><label>Transparency (<span id="vt">0.25</span>)</label><input type="range" id="t" min="0" max="1" step="0.01" value="0.25" oninput="u()"></div>
<div><label>Saturation (<span id="vs">180</span>%)</label><input type="range" id="s" min="0" max="200" value="180" oninput="u()"></div>
<div><label>Border Radius (<span id="vr">12</span>px)</label><input type="range" id="r" min="0" max="50" value="12" oninput="u()"></div>
</div>
<textarea id="out" readonly></textarea></div>
<script>function u(){ const b=document.getElementById('b').value, t=document.getElementById('t').value, s=document.getElementById('s').value, r=document.getElementById('r').value; document.getElementById('vb').innerText=b; document.getElementById('vt').innerText=t; document.getElementById('vs').innerText=s; document.getElementById('vr').innerText=r; const css=`background: rgba(255, 255, 255, ${t});\nbackdrop-filter: blur(${b}px) saturate(${s}%);\n-webkit-backdrop-filter: blur(${b}px) saturate(${s}%);\nborder-radius: ${r}px;\nborder: 1px solid rgba(255, 255, 255, 0.125);`; document.getElementById('glass').style.cssText=css; document.getElementById('out').value=css; } window.onload=u;</script></body></html>

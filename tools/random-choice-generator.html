  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Random Choice</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:15px;background:#16a34a;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:1.1rem;} #res{margin-top:20px;font-size:2rem;text-align:center;color:#2563eb;font-weight:bold;padding:20px;background:#f0f9ff;border-radius:6px;border:1px solid #bae6fd;display:none;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Pick a Random Item</h1>
<label>Enter items (one per line)</label>
<textarea id="in" placeholder="Alice&#10;Bob&#10;Charlie"></textarea>
<button onclick="pick()">Spin the Wheel!</button>
<div id="res"></div></div>
<script>
function pick(){
  const arr = document.getElementById('in').value.split('\n').filter(l=>l.trim()!=='');
  if(arr.length === 0) return;
  const res = document.getElementById('res');
  res.style.display = 'block'; res.innerText = "Choosing...";
  setTimeout(()=>{ res.innerText = "🎉 " + arr[Math.floor(Math.random()*arr.length)]; }, 500);
}
</script></body></html>

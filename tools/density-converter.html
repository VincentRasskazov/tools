  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Density Converter</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Density Converter</h1>
<label>kg/m³</label><input type="number" id="kg" oninput="c('kg')">
<label>g/cm³</label><input type="number" id="g" oninput="c('g')">
<label>lb/ft³</label><input type="number" id="lb" oninput="c('lb')"></div>
<script>function c(id){ const v=parseFloat(document.getElementById(id).value); if(isNaN(v))return; const kg=id==='kg'?v:id==='g'?v*1000:v*16.0185; if(id!=='kg')document.getElementById('kg').value=kg.toFixed(4); if(id!=='g')document.getElementById('g').value=(kg/1000).toFixed(4); if(id!=='lb')document.getElementById('lb').value=(kg/16.0185).toFixed(4); }</script></body></html>

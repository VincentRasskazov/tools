<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>jwt decoder Tool</title>
  <meta name="description" content="jwt decoder online tool.">
  <meta name="category" content="Developer Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">jwt decoder Tool</h1>
  </div>

  <h1>jwt decoder Tool</h1>

  <p>This is a starter tool page for <strong>jwt decoder</strong>.</p>


  <input id="input" placeholder="Paste JWT here" style="width:100%">
  <button onclick="run()">Decode</button>

  <pre id="output"></pre>

  <script>
    function decodeBase64Url(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      try {
        return decodeURIComponent(escape(atob(str)));
      } catch (e) {
        return null;
      }
    }
    function run() {
      const v = document.getElementById('input').value.trim();
      const parts = v.split('.');
      if (parts.length !== 3) {
        document.getElementById('output').innerText = 'Invalid JWT format.';
        return;
      }
      const [header, payload, signature] = parts;
      let decoded = '';
      try {
        decoded += 'Header:\n' + JSON.stringify(JSON.parse(decodeBase64Url(header)), null, 2) + '\n\n';
        decoded += 'Payload:\n' + JSON.stringify(JSON.parse(decodeBase64Url(payload)), null, 2) + '\n\n';
        decoded += 'Signature:\n' + signature;
      } catch (e) {
        decoded = 'Error decoding JWT.';
      }
      document.getElementById('output').innerText = decoded;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

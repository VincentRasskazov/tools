  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

.tool-container { max-width: 650px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); border: 1px solid var(--border); }

.res { margin-top: 25px; padding: 25px; background: var(--bg); border-radius: 12px; text-align: center; font-size: 1.5rem; font-weight: 800; border: 2px dashed var(--border); color: var(--primary); word-break: break-word; }

<body>
  <div class="tool-container">
    <h1>Audio Reaction Test</h1>
<div id="box" style="height:250px;background:var(--primary);border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-size:2rem;font-weight:bold;cursor:pointer;user-select:none;margin-bottom:20px;" onmousedown="clk()">Click to Start</div>
<div id="res" class="res" style="display:none;"></div>
<script>
let state=0, t0, tm; const actx=new (window.AudioContext||window.webkitAudioContext)(); const b=document.getElementById('box');
function beep(){ const osc=actx.createOscillator(), g=actx.createGain(); osc.connect(g); g.connect(actx.destination); osc.frequency.value=800; g.gain.setValueAtTime(1, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+0.5); osc.start(); osc.stop(actx.currentTime+0.5); }
function clk(){
  if(state===0){ state=1; b.style.background='var(--danger)'; b.innerText="Wait for the BEEP..."; const r=2000+Math.random()*4000; tm=setTimeout(()=>{state=2;b.style.background='var(--success)';b.innerText="CLICK!";beep();t0=Date.now();},r); }
  else if(state===1){ clearTimeout(tm); state=0; b.style.background='var(--primary)'; b.innerText="Too early! Click to try again."; }
  else if(state===2){ const diff=Date.now()-t0; state=0; b.style.background='var(--primary)'; b.innerText="Click to try again"; document.getElementById('res').style.display='block'; document.getElementById('res').innerHTML=`Reaction Time:<br><span style="font-size:3rem;">${diff} ms</span>`; }
}
</script>

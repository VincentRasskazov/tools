  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>TSV to JSON</title><script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script><style>.tool-container{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;} textarea{width:100%;height:200px;padding:10px;border:1px solid #ccc;border-radius:6px;font-family:monospace;margin-bottom:15px;} button{grid-column:1/-1;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">TSV to JSON</h1><div class="grid"><div><label>TSV Input</label><textarea id="in" placeholder="id	name\n1	Alice"></textarea></div><div><label>JSON Output</label><textarea id="out" readonly></textarea></div><button onclick="c()">Convert to JSON</button></div></div>
<script>function c(){ Papa.parse(document.getElementById('in').value, {delimiter:"\t", header:true, skipEmptyLines:true, complete:function(r){document.getElementById('out').value=JSON.stringify(r.data,null,2);}}); }</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>number to words Tool</title>
  <meta name="description" content="number to words online tool.">
  <meta name="category" content="Math Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">number to words Tool</h1>
  </div>

  <h1>number to words Tool</h1>

  <p>This is a starter tool page for <strong>number to words</strong>.</p>


  <input id="input" type="number" placeholder="Enter number" style="width:200px;">
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    // Simple number to words (0-9999)
    const ones = ["zero","one","two","three","four","five","six","seven","eight","nine"];
    const teens = ["ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
    const tens = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
    function numToWords(n) {
      if (n < 10) return ones[n];
      if (n < 20) return teens[n-10];
      if (n < 100) return tens[Math.floor(n/10)] + (n%10?'-'+ones[n%10]:'');
      if (n < 1000) return ones[Math.floor(n/100)] + ' hundred' + (n%100?' '+numToWords(n%100):'');
      if (n < 10000) return ones[Math.floor(n/1000)] + ' thousand' + (n%1000?' '+numToWords(n%1000):'');
      return n;
    }
    function run() {
      const v = parseInt(document.getElementById('input').value, 10);
      if (isNaN(v) || v < 0 || v > 9999) {
        document.getElementById('output').innerText = 'Enter a number from 0 to 9999.';
        return;
      }
      document.getElementById('output').innerText = numToWords(v);
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

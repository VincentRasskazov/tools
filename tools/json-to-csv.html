<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>json to csv Tool</title>
  <meta name="description" content="json to csv online tool.">
  <meta name="category" content="Developer Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">json to csv Tool</h1>
  </div>

  <h1>json to csv Tool</h1>

  <p>This is a starter tool page for <strong>json to csv</strong>.</p>


  <textarea id="input" placeholder="Paste JSON array here" rows="8" style="width:100%"></textarea>
  <button onclick="run()">Convert</button>

  <pre id="output"></pre>

  <script>
    function jsonToCsv(json) {
      if (!Array.isArray(json) || json.length === 0) return '';
      const keys = Object.keys(json[0]);
      const csv = [keys.join(',')];
      for (const row of json) {
        csv.push(keys.map(k => {
          let val = row[k] == null ? '' : row[k];
          if (typeof val === 'string' && (val.includes(',') || val.includes('"') || val.includes('\n')))
            val = '"' + val.replace(/"/g, '""') + '"';
          return val;
        }).join(','));
      }
      return csv.join('\n');
    }
    function run() {
      const v = document.getElementById('input').value;
      try {
        const arr = JSON.parse(v);
        document.getElementById('output').innerText = jsonToCsv(arr);
      } catch (e) {
        document.getElementById('output').innerText = 'Invalid JSON array.';
      }
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

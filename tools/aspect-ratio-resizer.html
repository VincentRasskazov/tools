  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Aspect Ratio Resizer</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .row{display:flex;gap:15px;margin-bottom:20px;} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:1.1rem;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Aspect Ratio Resizer</h1>
<p style="font-weight:bold;">Original Image Size</p>
<div class="row"><div><label>Width</label><input type="number" id="w1" value="1920" oninput="cw()"></div><div><label>Height</label><input type="number" id="h1" value="1080" oninput="cw()"></div></div>
<p style="font-weight:bold;">Resize To</p>
<div class="row"><div><label>New Width</label><input type="number" id="w2" oninput="cw()"></div><div><label>New Height</label><input type="number" id="h2" oninput="ch()"></div></div></div>
<script>function cw(){ const w1=document.getElementById('w1').value, h1=document.getElementById('h1').value, w2=document.getElementById('w2').value; document.getElementById('h2').value = Math.round((h1/w1)*w2); } function ch(){ const w1=document.getElementById('w1').value, h1=document.getElementById('h1').value, h2=document.getElementById('h2').value; document.getElementById('w2').value = Math.round((w1/h1)*h2); }</script></body></html>

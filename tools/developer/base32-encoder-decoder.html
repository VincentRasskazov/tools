<body>
  <div class="tool-container">
    <h1>Base32 Encode/Decode</h1>
<textarea id="in" rows="4" placeholder="Enter text or Base32..."></textarea>
<div class="row">
<button onclick="enc()">Encode</button>
<button onclick="dec()" style="background:#475569;">Decode</button>
</div>
<textarea id="out" rows="4" readonly placeholder="Result..."></textarea>
<script>
const b32="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
function enc(){
    const s=document.getElementById('in').value; let r="", bits=0, v=0;
    for(let i=0;i<s.length;i++){ v=(v<<8)|s.charCodeAt(i); bits+=8; while(bits>=5){ r+=b32[(v>>>(bits-5))&31]; bits-=5; } }
    if(bits>0) r+=b32[(v<<(5-bits))&31];
    while(r.length%8!==0) r+="="; document.getElementById('out').value=r;
}
function dec(){
    const s=document.getElementById('in').value.toUpperCase().replace(/=/g,''); let r="", bits=0, v=0;
    for(let i=0;i<s.length;i++){ const idx=b32.indexOf(s[i]); if(idx===-1)continue; v=(v<<5)|idx; bits+=5; if(bits>=8){ r+=String.fromCharCode((v>>>(bits-8))&255); bits-=8; } }
    document.getElementById('out').value=r;
}
</script>

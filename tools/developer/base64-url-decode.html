<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Base64 URL Decode</h1><textarea id="in" placeholder="Paste Base64 URL..." oninput="c()"></textarea><textarea id="out" readonly></textarea></div>
<script>function c(){ try{ let s=document.getElementById('in').value.replace(/-/g, '+').replace(/_/g, '/'); while(s.length%4)s+='='; document.getElementById('out').value = atob(s); }catch(e){document.getElementById('out').value='Invalid Input';} }</script>

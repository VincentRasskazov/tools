<body>
  <div class="tool-container">
    <h1>Square Pyramid Volume</h1>
<div class="row">
  <div class="card"><label>Base Edge (a)</label><input type="number" id="a" value="5"></div>
  <div class="card"><label>Height (h)</label><input type="number" id="h" value="10"></div>
</div>
<button onclick="c()">Calculate Volume</button>
<div id="res" class="res"></div>
<script>
function c(){
  const a=parseFloat(document.getElementById('a').value), h=parseFloat(document.getElementById('h').value);
  if(a>0 && h>0){
    const v = (a * a * h) / 3;
    document.getElementById('res').innerHTML = `Pyramid Volume:<br><span style="font-size:3rem;color:var(--primary)">${v.toFixed(4)}</span>`;
  }
}
</script>
  </div>
</body>

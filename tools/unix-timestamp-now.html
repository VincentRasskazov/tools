<body>
  <div class="tool-container">
    <h1>Unix Now</h1>
<div id="u" class="res" style="font-size:3rem; font-family:monospace;"></div>
<div id="d" style="text-align:center; font-weight:bold; color:#64748b;"></div>
<script>
setInterval(() => {
  const now = new Date();
  document.getElementById('u').innerText = Math.floor(now.getTime()/1000);
  document.getElementById('d').innerText = now.toLocaleString();
}, 1000);
</script>

<!DOCTYPE html>
<html lang="en"><head>
  <meta name="description" content="Keep track of your daily food intake and calories.">
  <meta property="og:title" content="Daily Calorie Tracker">
  <meta property="og:description" content="Keep track of your daily food intake and calories.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Daily Calorie Tracker">
  <meta name="twitter:description" content="Keep track of your daily food intake and calories.">
  <meta charset="UTF-8"><title>Calorie Tracker</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{padding:8px;border:1px solid #ccc;border-radius:4px;margin-right:10px;} button{padding:8px 15px;background:#2563eb;color:white;border:none;border-radius:4px;cursor:pointer;} ul{list-style:none;padding:0;margin-top:20px;} li{padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;}</style></head>
<body><div class="tool-container"><h1>Daily Calorie Tracker</h1>
<input type="text" id="f" placeholder="Food item">
<input type="number" id="c" placeholder="Calories">
<button onclick="add()">Add</button>
<h2 id="total" style="margin-top:20px;">Total: 0 kcal</h2><ul id="list"></ul></div>
<script>
let total = 0;
function add(){
  const f=document.getElementById('f').value, c=parseInt(document.getElementById('c').value);
  if(f && c){
    total += c; document.getElementById('total').innerText = `Total: ${total} kcal`;
    const li = document.createElement('li'); li.innerHTML = `<span>${f}</span><span>${c} kcal</span>`;
    document.getElementById('list').appendChild(li);
    document.getElementById('f').value=''; document.getElementById('c').value='';
  }
}
</script></body></html>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Parallel Resistors</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.5rem;font-weight:bold;color:#16a34a;text-align:center;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Parallel Resistors</h1><label>Resistor Values (Ω) (comma separated)</label><input type="text" id="in" placeholder="100, 200, 300"><button onclick="c()">Calculate Equivalent</button><div id="res"></div></div>
<script>function c(){ const vals = document.getElementById('in').value.split(',').map(Number).filter(n=>n>0); if(vals.length<2)return; let sum=0; vals.forEach(r=>sum+=(1/r)); const eq = 1/sum; document.getElementById('res').innerText = eq.toFixed(2) + " Ω"; }</script></body></html>

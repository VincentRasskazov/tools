  <style>
:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #f4f7f9 0%, #e2e8f0 100%); min-height: 100vh; color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
.tool-container { max-width: 800px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1), 0 10px 15px -3px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.5); }
h1 { text-align: center; color: var(--primary); margin: 0 0 30px 0; font-size: 2.4rem; font-weight: 800; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(59,130,246,0.1); }
label { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 8px; color: #334155; font-size: 0.95rem; }
input[type="text"], input[type="number"], input[type="url"], input[type="email"], select, textarea { width: 100%; padding: 16px; border: 2px solid var(--border); border-radius: 12px; margin-bottom: 20px; font-size: 1rem; transition: all 0.2s ease; box-sizing: border-box; background: #fcfcfc; color: var(--text); box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), inset 0 2px 4px rgba(0,0,0,0.02); background: #fff; }
button { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); margin-bottom: 10px; letter-spacing: 0.5px; }
button:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 8px 15px -3px rgba(59, 130, 246, 0.4); }
button:active { transform: translateY(0); box-shadow: 0 2px 4px -1px rgba(59, 130, 246, 0.3); }
.res { margin-top: 25px; padding: 30px; background: linear-gradient(to right, #f8fafc, #f1f5f9); border-radius: 16px; text-align: center; font-size: 1.5rem; font-weight: 800; border: 2px dashed #cbd5e1; color: var(--primary); word-break: break-word; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
.row { display: flex; gap: 20px; } .row > div { flex: 1; }
.card { background: #fff; padding: 25px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; transition: 0.2s; }
.card:hover { border-color: #cbd5e1; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
</style>

<body>
  <div class="tool-container">
    <h1>Text Reveal Animation</h1>
<div style="background:var(--bg);padding:50px;border-radius:16px;margin-bottom:20px;display:flex;justify-content:center;overflow:hidden;">
  <div style="position:relative;display:inline-block;overflow:hidden;">
    <div id="txt" style="font-size:3rem;font-weight:900;color:var(--text);opacity:0;animation:revT 1.5s forwards 0.5s;">REVEAL</div>
    <div id="blk" style="position:absolute;top:0;left:0;width:100%;height:100%;background:var(--primary);transform:translateX(-101%);animation:revB 1.5s forwards;"></div>
  </div>
</div>
<button onclick="r()" style="margin-bottom:20px;">Replay Animation</button>
<textarea id="out" rows="6" readonly style="font-family:monospace;font-size:0.85rem;"></textarea>
<style>@keyframes revB{0%{transform:translateX(-101%)}50%{transform:translateX(0)}100%{transform:translateX(101%)}} @keyframes revT{0%{opacity:0}49%{opacity:0}50%{opacity:1}100%{opacity:1}}</style>
<script>
function r(){
  const t=document.getElementById('txt'), b=document.getElementById('blk');
  t.style.animation='none'; b.style.animation='none';
  setTimeout(()=>{t.style.animation='revT 1.5s forwards 0.5s'; b.style.animation='revB 1.5s forwards';}, 50);
}
document.getElementById('out').value=`.reveal-wrapper { position: relative; display: inline-block; overflow: hidden; }\n.reveal-text { opacity: 0; animation: text 1.5s forwards 0.5s; }\n.reveal-block { position: absolute; top:0; left:0; width:100%; height:100%; background: #3b82f6; transform: translateX(-101%); animation: block 1.5s forwards; }\n@keyframes block { 0%{transform:translateX(-101%)} 50%{transform:translateX(0)} 100%{transform:translateX(101%)} }\n@keyframes text { 0%,49%{opacity:0} 50%,100%{opacity:1} }`;
</script>
  </div>
</body>

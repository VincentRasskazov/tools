<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>unit price calculator Tool</title>
  <meta name="description" content="unit price calculator online tool.">
  <meta name="category" content="Shopping Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">unit price calculator Tool</h1>
  </div>

  <h1>unit price calculator Tool</h1>

  <p>This is a starter tool page for <strong>unit price calculator</strong>.</p>


  <input id="price" type="number" placeholder="Total Price" style="width:120px;">
  <input id="qty" type="number" placeholder="Quantity" style="width:80px;">
  <button onclick="run()">Calculate</button>

  <p id="output"></p>

  <script>
    function run() {
      const price = parseFloat(document.getElementById('price').value);
      const qty = parseFloat(document.getElementById('qty').value);
      if (isNaN(price) || isNaN(qty) || price <= 0 || qty <= 0) {
        document.getElementById('output').innerText = 'Enter valid price and quantity.';
        return;
      }
      const unit = price / qty;
      document.getElementById('output').innerText = 'Unit Price: $' + unit.toFixed(2);
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

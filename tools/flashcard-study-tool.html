<!DOCTYPE html>
<html lang="en"><head>
  <meta name="description" content="Create and study simple flashcards to help you memorize anything.">
  <meta property="og:title" content="Flashcard Study Tool">
  <meta property="og:description" content="Create and study simple flashcards to help you memorize anything.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Flashcard Study Tool">
  <meta name="twitter:description" content="Create and study simple flashcards to help you memorize anything.">
  <meta charset="UTF-8"><title>Flashcards</title><style>.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} .card{height:200px;border:2px solid #2563eb;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;margin:20px 0;transition:0.3s;padding:20px;} .card:hover{background:#f0f9ff;}</style></head>
<body><div class="tool-container"><h1>Flashcards</h1>
<div id="card" class="card" onclick="flip()">Click to Add First Card</div>
<div id="controls" style="display:none;"><button onclick="prev()">Prev</button> <button onclick="next()">Next</button></div>
<hr><input id="q" placeholder="Question"><input id="a" placeholder="Answer"><button onclick="add()">Add Card</button></div>
<script>
let cards = [], cur = 0, side = 0;
function add(){
  const q=document.getElementById('q').value, a=document.getElementById('a').value;
  if(q&&a){ cards.push({q,a}); document.getElementById('controls').style.display='block'; show(); }
}
function flip(){ if(cards.length) { side = 1-side; show(); } }
function next(){ cur = (cur+1)%cards.length; side=0; show(); }
function prev(){ cur = (cur-1+cards.length)%cards.length; side=0; show(); }
function show(){ document.getElementById('card').innerText = side === 0 ? cards[cur].q : cards[cur].a; }
</script></body></html>

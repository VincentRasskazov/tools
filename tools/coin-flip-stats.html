  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Coin Flip Stats</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} button{width:100%;padding:15px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:1.2rem;} .res{font-size:1.5rem;font-weight:bold;margin:20px 0;} .bar-wrap{width:100%;height:30px;background:#e2e8f0;border-radius:15px;overflow:hidden;display:flex;} .h-bar{background:#3b82f6;height:100%;} .t-bar{background:#f59e0b;height:100%;}</style></head>
<body><div class="tool-container"><h1 style="color:#2563eb;">Flip 100 Coins</h1><button onclick="c()">Simulate Flips</button><div class="res" id="txt">Heads: 0 | Tails: 0</div><div class="bar-wrap"><div id="hb" class="h-bar" style="width:50%"></div><div id="tb" class="t-bar" style="width:50%"></div></div></div>

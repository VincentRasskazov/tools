<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Base Converter</h1>
<label>Decimal (10)</label><input type="number" id="dec" oninput="c('dec')">
<label>Binary (2)</label><input type="text" id="bin" oninput="c('bin')">
<label>Octal (8)</label><input type="text" id="oct" oninput="c('oct')">
<label>Hex (16)</label><input type="text" id="hex" oninput="c('hex')"></div>
<script>function c(id){ let val=document.getElementById(id).value; let d; if(id==='dec')d=parseInt(val,10); else if(id==='bin')d=parseInt(val,2); else if(id==='oct')d=parseInt(val,8); else if(id==='hex')d=parseInt(val,16); 
if(!isNaN(d)){ if(id!=='dec')document.getElementById('dec').value=d; if(id!=='bin')document.getElementById('bin').value=d.toString(2); if(id!=='oct')document.getElementById('oct').value=d.toString(8); if(id!=='hex')document.getElementById('hex').value=d.toString(16).toUpperCase(); } }</script>
</body>

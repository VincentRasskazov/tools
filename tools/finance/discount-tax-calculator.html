:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

<body>
  <div class="tool-container">
    <h1>Discount & Tax</h1>
<label>Original Price ($)</label><input type="number" id="p" value="100">
<div class="row">
  <div><label>Discount (%)</label><input type="number" id="d" value="20"></div>
  <div><label>Sales Tax (%)</label><input type="number" id="t" value="8"></div>
</div>
<button onclick="c()">Calculate Final Price</button>
<div id="res" class="res" style="font-size:1.2rem;line-height:1.6;"></div>
<script>function c(){ const p=parseFloat(document.getElementById('p').value), d=parseFloat(document.getElementById('d').value)||0, t=parseFloat(document.getElementById('t').value)||0; if(p>0){ const disAmt = p*(d/100); const sub = p-disAmt; const taxAmt = sub*(t/100); const final = sub+taxAmt; document.getElementById('res').innerHTML=`Subtotal (after discount): $${sub.toFixed(2)}<br>Tax Added: $${taxAmt.toFixed(2)}<br><br>Final Price:<br><span style="font-size:3rem;color:var(--primary)">$${final.toFixed(2)}</span>`; } }</script>
  </div>

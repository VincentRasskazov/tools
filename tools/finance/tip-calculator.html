<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Tip Calculator</h1><label>Bill Amount ($)</label><input type="number" id="b"><label>Tip (%)</label><input type="number" id="t" value="15"><label>Split Between (People)</label><input type="number" id="p" value="1"><button onclick="c()">Calculate</button><div id="res"></div></div>
<script>function c(){ const b=parseFloat(document.getElementById('b').value), t=parseFloat(document.getElementById('t').value), p=parseFloat(document.getElementById('p').value); if(b){ const tip=(b*t)/100; const tot=b+tip; const per=tot/p; document.getElementById('res').innerHTML=`Tip Amount: <strong>$${tip.toFixed(2)}</strong><br>Total Bill: <strong>$${tot.toFixed(2)}</strong><br>Per Person: <strong>$${per.toFixed(2)}</strong>`; } }</script>

.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.2rem;background:#f8fafc;padding:15px;border-radius:6px;border:1px solid #cbd5e1;}

<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Break-Even Calculator</h1><label>Fixed Costs ($)</label><input type="number" id="fc" placeholder="10000"><label>Variable Cost per Unit ($)</label><input type="number" id="vc" placeholder="5"><label>Sale Price per Unit ($)</label><input type="number" id="p" placeholder="15"><button onclick="c()">Calculate</button><div id="res"></div></div>
<script>function c(){ const fc=parseFloat(document.getElementById('fc').value), vc=parseFloat(document.getElementById('vc').value), p=parseFloat(document.getElementById('p').value); if(p>vc){ const units=fc/(p-vc); const rev=units*p; document.getElementById('res').innerHTML=`Units to Sell: <strong>${Math.ceil(units)}</strong><br>Revenue needed: <strong>$${rev.toFixed(2)}</strong>`; }else{ document.getElementById('res').innerText="Price must be higher than variable cost."; } }</script>
</body>

<body>
  <div class="tool-container">
    <h1>Words to Numbers</h1>
<textarea id="in" rows="4" placeholder="One hundred twenty five" oninput="c()"></textarea>
<div id="res" class="res" style="font-size:3rem;font-family:monospace;">125</div>
<script>
const Small = {'zero':0,'one':1,'two':2,'three':3,'four':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,'ten':10,'eleven':11,'twelve':12,'thirteen':13,'fourteen':14,'fifteen':15,'sixteen':16,'seventeen':17,'eighteen':18,'nineteen':19,'twenty':20,'thirty':30,'forty':40,'fifty':50,'sixty':60,'seventy':70,'eighty':80,'ninety':90};
const Magnitude = {'hundred':100,'thousand':1000,'million':1000000,'billion':1000000000};
function textToNum(s){
  let a = s.toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/); let n=0, g=0;
  for(let w of a){
    if(Small[w]!=null) g+=Small[w];
    else if(Magnitude[w]!=null){ g=g===0?Magnitude[w]:g*Magnitude[w]; if(Magnitude[w]>=1000){ n+=g; g=0; } }
  } return n+g;
}
function c(){ const t=document.getElementById('in').value; document.getElementById('res').innerText=t?textToNum(t):'0'; }
</script>

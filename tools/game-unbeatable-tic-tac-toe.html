<body>
  <div class="tool-container">
    <h1>Unbeatable Tic-Tac-Toe</h1>
<div id="msg" style="text-align:center;font-weight:bold;font-size:1.5rem;color:var(--primary);margin-bottom:15px;">You are X. Your Turn!</div>
<div id="brd" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:300px;margin:0 auto 20px;"></div>
<button onclick="st()">Restart Game</button>
<script>
let b=Array(9).fill(null), act=true;
const win=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function st(){ b=Array(9).fill(null); act=true; document.getElementById('msg').innerText="You are X. Your Turn!"; drw(); }
function drw(){ const d=document.getElementById('brd'); d.innerHTML=''; b.forEach((v,i)=>{ d.innerHTML+=`<div style="height:90px;background:var(--bg);border:2px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:bold;color:${v==='X'?'var(--primary)':'var(--danger)'};cursor:pointer;" onclick="clk(${i})">${v||''}</div>`; }); }
function cWin(bd,p){ return win.some(c=>bd[c[0]]===p&&bd[c[1]]===p&&bd[c[2]]===p); }
function clk(i){ if(!act||b[i])return; b[i]='X'; drw(); if(cWin(b,'X')){end("You Win! (Wait, how?)");return;} if(!b.includes(null)){end("It's a Draw!");return;} act=false; setTimeout(ai, 300); }
function ai(){ let best=-Infinity, m; for(let i=0;i<9;i++){ if(!b[i]){ b[i]='O'; let sc=mm(b,0,false); b[i]=null; if(sc>best){best=sc;m=i;} } } b[m]='O'; drw(); if(cWin(b,'O')){end("AI Wins!");return;} if(!b.includes(null)){end("It's a Draw!");return;} act=true; }
function mm(bd,d,isMax){ if(cWin(bd,'O'))return 10-d; if(cWin(bd,'X'))return d-10; if(!bd.includes(null))return 0; if(isMax){ let best=-Infinity; for(let i=0;i<9;i++){ if(!bd[i]){ bd[i]='O'; best=Math.max(best,mm(bd,d+1,!isMax)); bd[i]=null; } } return best; } else { let best=Infinity; for(let i=0;i<9;i++){ if(!bd[i]){ bd[i]='X'; best=Math.min(best,mm(bd,d+1,!isMax)); bd[i]=null; } } return best; } }
function end(t){ act=false; document.getElementById('msg').innerText=t; } st();
</script>

  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Crop Factor</title><style>.tool-container{max-width:500px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} input,select{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} #res{margin-top:20px;font-size:1.5rem;text-align:center;font-weight:bold;color:#16a34a;}</style></head>
<body><div class="tool-container"><h1 style="text-align:center;color:#2563eb;">Crop Factor</h1><label>Lens Focal Length (mm)</label><input type="number" id="fl" value="50"><label>Sensor Type</label><select id="cf"><option value="1.5">APS-C (1.5x)</option><option value="1.6">Canon APS-C (1.6x)</option><option value="2.0">Micro 4/3 (2.0x)</option></select><button onclick="c()">Calculate Equivalent</button><div id="res"></div></div>
<script>function c(){ const fl=parseFloat(document.getElementById('fl').value), cf=parseFloat(document.getElementById('cf').value); if(fl) document.getElementById('res').innerText = (fl*cf).toFixed(0) + "mm Equivalent"; }</script></body></html>

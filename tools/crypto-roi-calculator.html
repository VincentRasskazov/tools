:root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }

<body>
<div class="tool-container">
    <h1>Crypto ROI Calculator</h1>
<div class="row"><div><label>Amount Invested ($)</label><input type="number" id="inv" value="1000"></div><div><label>Buy Price ($)</label><input type="number" id="bp" value="50000"></div></div>
<div class="row"><div><label>Current/Sell Price ($)</label><input type="number" id="sp" value="65000"></div></div>
<button onclick="c()">Calculate ROI</button>
<div id="res" class="res"></div>
<script>function c(){ const inv=parseFloat(document.getElementById('inv').value), bp=parseFloat(document.getElementById('bp').value), sp=parseFloat(document.getElementById('sp').value); if(inv&&bp&&sp){ const coins = inv/bp; const cur = coins*sp; const prof = cur-inv; const roi = (prof/inv)*100; document.getElementById('res').innerHTML=`Total Value: <strong>$${cur.toFixed(2)}</strong><br>Profit/Loss: <strong style="color:${prof>=0?'var(--success)':'var(--danger)'}">$${prof.toFixed(2)}</strong><br>ROI: <strong>${roi.toFixed(2)}%</strong>`; } }</script>

  <div class="tool-container">
    <h1>Number to Roman Numeral</h1>
<div class="card"><label>🔢 Enter Number (1-3999)</label><input type="number" id="in" value="2024" min="1" max="3999" oninput="c()"></div>
<div id="res" class="res" style="font-size:4rem;letter-spacing:5px;">MMXXIV</div>
<script>
function c(){
  let num=parseInt(document.getElementById('in').value); if(num<1||num>3999)return document.getElementById('res').innerText="1 to 3999 only";
  const m={M:1000,CM:900,D:500,CD:400,C:100,XC:90,L:50,XL:40,X:10,IX:9,V:5,IV:4,I:1}; let res='';
  for(let i in m){ while(num>=m[i]){res+=i; num-=m[i];} }
  document.getElementById('res').innerText=res;
}
</script>

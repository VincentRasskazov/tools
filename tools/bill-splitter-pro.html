.tool-container { max-width: 650px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); border: 1px solid var(--border); }

button { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.2); margin-bottom: 10px; }

<body>
  <div class="tool-container">
    <h1>Bill Splitter Pro</h1>
<div class="row"><div><label>Total Bill ($)</label><input type="number" id="b" value="100"></div><div><label>Tip (%)</label><input type="number" id="t" value="15"></div></div>
<label>Number of People</label><input type="number" id="p" value="4">
<button onclick="c()">Calculate Share</button>
<div id="res" class="res"></div>
<script>function c(){ const b=parseFloat(document.getElementById('b').value), t=parseFloat(document.getElementById('t').value)/100, p=parseInt(document.getElementById('p').value); if(b&&p){ const tip=b*t, tot=b+tip, pp=tot/p; document.getElementById('res').innerHTML=`Total with Tip: <strong>$${tot.toFixed(2)}</strong><br>Each Person Pays: <span style="font-size:2.5rem;display:block;color:var(--success);">$${pp.toFixed(2)}</span>`; } }</script>

.tool-container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;} #cnt{font-size:6rem;font-weight:bold;color:#2563eb;margin:20px 0;} #last{font-size:1.5rem;color:#64748b;}
  </style>

<body>
<div class="tool-container"><h1 style="color:#2563eb;">Key Press Counter</h1><div id="cnt">0</div><div id="last">Press any key...</div><button onclick="c=0;u()" style="margin-top:20px;padding:10px 20px;">Reset</button></div>
<script>let c=0; function u(){document.getElementById('cnt').innerText=c;} window.addEventListener('keydown', e=>{c++; document.getElementById('last').innerText=`Last Key: ${e.key}`; u();});</script>
</body>

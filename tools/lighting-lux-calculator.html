<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">

  <meta name="description" content="lighting lux calculator online tool.">

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">lighting lux calculator Tool</h1>
  </div>

  <h1>lighting lux calculator Tool</h1>

  <p>This is a starter tool page for <strong>lighting lux calculator</strong>.</p>


  <input id="lumens" type="number" placeholder="Lumens (lm)" style="width:120px;">
  <input id="area" type="number" placeholder="Area (m²)" style="width:120px;">
  <button onclick="run()">Calculate Lux</button>

  <p id="output"></p>

  <script>
    function run() {
      const lumens = parseFloat(document.getElementById('lumens').value);
      const area = parseFloat(document.getElementById('area').value);
      if (isNaN(lumens) || isNaN(area) || area <= 0) {
        document.getElementById('output').innerText = 'Enter valid lumens and area.';
        return;
      }
      const lux = lumens / area;
      document.getElementById('output').innerText = lumens + ' lm over ' + area + ' m² = ' + lux + ' lux';
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

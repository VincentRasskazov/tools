<body>
  <div class="tool-container">
    <h1>Math True or False</h1>
<div id="sc" style="text-align:center;font-weight:bold;color:#64748b;">Score: 0</div>
<div id="eq" style="font-size:4rem;font-weight:bold;color:var(--primary);text-align:center;margin:20px 0;">Press Start</div>
<div class="row">
  <button onclick="ans(true)" style="background:var(--success)">TRUE</button>
  <button onclick="ans(false)" style="background:var(--danger)">FALSE</button>
</div>
<button onclick="st()" style="margin-top:20px;background:#64748b;" id="btn">Start Game</button>
<script>
let s=0, isT=true;
function st(){ s=0; document.getElementById('sc').innerText="Score: "+s; document.getElementById('btn').style.display='none'; nx(); }
function nx(){
  const a=Math.floor(Math.random()*20)+1, b=Math.floor(Math.random()*20)+1;
  const realAns = a+b; isT=Math.random()>0.5;
  const fakeAns = isT ? realAns : realAns + (Math.floor(Math.random()*5)+1)*(Math.random()>0.5?1:-1);
  document.getElementById('eq').innerText=`${a} + ${b} = ${fakeAns}`;
}
function ans(g){
  if(document.getElementById('btn').style.display!=='none')return;
  if(g===isT){ s++; document.getElementById('sc').innerText="Score: "+s; nx(); }
  else { document.getElementById('eq').innerText=`Game Over!`; document.getElementById('btn').style.display='block'; }
}
</script>

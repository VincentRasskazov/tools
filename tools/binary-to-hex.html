<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>binary to hex Tool</title>
  <meta name="description" content="binary to hex online tool.">
  <meta name="category" content="Math Tools">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">binary to hex Tool</h1>
  </div>

  <h1>binary to hex Tool</h1>

  <p>This is a starter tool page for <strong>binary to hex</strong>.</p>


  <label for="input">Binary:</label>
  <input id="input" placeholder="Enter binary number">
  <button onclick="run()">Convert to Hex</button>

  <p id="output"></p>

  <script>
    function run() {
      const v = document.getElementById('input').value.trim();
      if (!/^[01]+$/.test(v)) {
        document.getElementById('output').innerText = "Please enter a valid binary number.";
        return;
      }
      document.getElementById('output').innerText = parseInt(v, 2).toString(16).toUpperCase();
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>

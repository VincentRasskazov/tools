<textarea id="in" rows="4" placeholder="Hello World" oninput="c()"></textarea>
<textarea id="out" rows="4" readonly placeholder="e o"></textarea>
<script>function c(){ document.getElementById('out').value = document.getElementById('in').value.replace(/[bcdfghjklmnpqrstvwxyzBCDFGHJKLMNPQRSTVWXYZ]/g, ''); }</script>

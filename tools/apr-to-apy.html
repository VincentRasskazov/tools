<body>
<div class="tool-container"><h1 style="text-align:center;color:#2563eb;">APR to APY</h1><label>APR (%)</label><input type="number" id="r" placeholder="5.0"><label>Compounding Frequency</label><select id="n"><option value="1">Annually</option><option value="2">Semi-Annually</option><option value="4">Quarterly</option><option value="12" selected>Monthly</option><option value="365">Daily</option></select><button onclick="c()">Convert</button><div id="res"></div></div>
<script>function c(){ const r=parseFloat(document.getElementById('r').value)/100, n=parseFloat(document.getElementById('n').value); if(r){ const apy = (Math.pow(1 + r/n, n) - 1) * 100; document.getElementById('res').innerText = apy.toFixed(3) + "% APY"; } }</script>

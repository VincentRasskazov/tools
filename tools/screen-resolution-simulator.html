  <meta name="twitter:image" content="https://placehold.co/1200x630/2563eb/white?text=Vincent%27s+Tools+Hub"><meta charset="UTF-8"><title>Resolution Sim</title><style>.tool-container{max-width:100%;margin:20px auto;text-align:center;} iframe{border:10px solid #333;border-radius:4px;background:white;margin-top:20px;transition:0.3s;} button{padding:10px 20px;margin:5px;cursor:pointer;}</style></head>
<body><div class="tool-container"><h1 style="color:#2563eb;">Screen Resolution Sim</h1>
<button onclick="r(375,667)">Mobile (375x667)</button><button onclick="r(768,1024)">Tablet (768x1024)</button><button onclick="r(1366,768)">Laptop (1366x768)</button><button onclick="r(1920,1080)">Desktop (1920x1080)</button>
<br><input type="text" id="url" placeholder="https://example.com" value="https://example.com" style="width:300px;padding:10px;margin-top:20px;"><button onclick="l()">Load URL</button>
<br><iframe id="f" src="" width="375" height="667"></iframe></div>
<script>function r(w,h){ const f=document.getElementById('f'); f.width=w; f.height=h; } function l(){ document.getElementById('f').src=document.getElementById('url').value; }</script></body></html>

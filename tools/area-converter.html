<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/css/tool-style.css">
  <meta charset="UTF-8">
  <title>area converter Tool</title>
  <meta name="description" content="area converter online tool.">
  <meta name="category" content="Converters">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="tool-container">
  <div class="tool-header">
    <a class="tool-back" href="../index.html">← Back</a>
    <h1 class="tool-title">area converter Tool</h1>
  </div>

  <h1>area converter Tool</h1>

  <p>This is a starter tool page for <strong>area converter</strong>.</p>


  <label for="area">Area:</label>
  <input id="area" type="number" placeholder="Enter value">
  <select id="direction">
    <option value="m2ft">Square Meters to Square Feet</option>
    <option value="ft2m">Square Feet to Square Meters</option>
  </select>
  <button onclick="run()">Convert</button>

  <p id="output"></p>

  <script>
    function run() {
      const area = parseFloat(document.getElementById('area').value);
      const dir = document.getElementById('direction').value;
      if (isNaN(area)) {
        document.getElementById('output').innerText = "Please enter a valid area.";
        return;
      }
      let result;
      if (dir === 'm2ft') {
        result = (area * 10.7639).toFixed(4) + ' ft²';
      } else {
        result = (area / 10.7639).toFixed(4) + ' m²';
      }
      document.getElementById('output').innerText = result;
    }
  </script>

  <div class="tool-footer">&copy; 2026 Ultimate Tools Hub</div>

  </div>
</body>
</html>
